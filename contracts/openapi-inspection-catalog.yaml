openapi: 3.1.0
info:
  title: Inspection Catalog API
  version: 1.0.0
  description: >
    巡检目录 I1 的逻辑契约。若宿主项目已有统一响应信封、分页或错误格式，
    实现时映射到宿主规范，但不得改变字段语义。
paths:
  /api/v1/inspection/portal:
    get:
      operationId: getInspectionPortal
      summary: 获取“我要巡检”入口配置
      parameters:
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: 入口配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPortal"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"
  /api/v1/inspection/filters:
    get:
      operationId: getInspectionFilterOptions
      summary: 获取当前城市支持的筛选项
      parameters:
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: 筛选项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionFilterOptions"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
  /api/v1/inspection/services:
    get:
      operationId: searchInspectionServices
      summary: 搜索巡检服务
      parameters:
        - $ref: "#/components/parameters/CityCode"
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: serviceMethods
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: availability
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: priceModes
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "#/components/schemas/PriceMode"
        - name: includesReport
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogSort"
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 服务分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionServicePage"
        "400":
          description: 查询参数无效或距离排序缺少位置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
components:
  parameters:
    CityCode:
      name: cityCode
      in: query
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 16
      description: 国家统计区划或平台统一城市稳定编码
  responses:
    CityNotEnabled:
      description: 当前城市未开通巡检目录
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: INS_CATALOG_CITY_NOT_ENABLED
                message: 当前城市暂未开通巡检服务
                traceId: 01JEXAMPLETRACE
    ConfigUnavailable:
      description: 入口配置暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type:
            - object
            - "null"
          additionalProperties: true
    CitySummary:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        provinceCode:
          type:
            - string
            - "null"
    MediaAsset:
      type: object
      additionalProperties: false
      required:
        - url
        - alt
      properties:
        url:
          type: string
          format: uri
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
        alt:
          type: string
          maxLength: 160
    PortalActionType:
      type: string
      enum:
        - OPEN_CATALOG
        - OPEN_FILTER
        - HOST_ACTION
        - NONE
    PortalAction:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/PortalActionType"
        categoryCode:
          type:
            - string
            - "null"
        keyword:
          type:
            - string
            - "null"
        serviceId:
          type:
            - string
            - "null"
          format: uuid
        hostAction:
          type:
            - string
            - "null"
    InspectionCategory:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - sortOrder
        - action
      properties:
        code:
          type: string
        name:
          type: string
        subtitle:
          type:
            - string
            - "null"
        icon:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        sortOrder:
          type: integer
        action:
          $ref: "#/components/schemas/PortalAction"
    HeroContent:
      type: object
      additionalProperties: false
      required:
        - title
        - subtitle
        - sellingPoints
        - action
      properties:
        title:
          type: string
        highlightedText:
          type:
            - string
            - "null"
        subtitle:
          type: string
        sellingPoints:
          type: array
          maxItems: 5
          items:
            type: string
        image:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        actionLabel:
          type:
            - string
            - "null"
        action:
          $ref: "#/components/schemas/PortalAction"
    PortalInfoItem:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - sortOrder
      properties:
        code:
          type: string
        title:
          type: string
        subtitle:
          type:
            - string
            - "null"
        icon:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        sortOrder:
          type: integer
    FeatureTag:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    PriceMode:
      type: string
      enum:
        - STARTING_PRICE
        - PER_DISTANCE
        - PER_VISIT
        - PROJECT_QUOTE
    ServicePrice:
      type: object
      additionalProperties: false
      required:
        - mode
        - currency
      properties:
        mode:
          $ref: "#/components/schemas/PriceMode"
        startingAmountMinor:
          type:
            - integer
            - "null"
          minimum: 0
        currency:
          type: string
          enum:
            - CNY
        unitCode:
          type:
            - string
            - "null"
        unitLabel:
          type:
            - string
            - "null"
    ServiceRating:
      type: object
      additionalProperties: false
      required:
        - average
        - count
      properties:
        average:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 5
        count:
          type:
            - integer
            - "null"
          minimum: 0
    ServiceAction:
      type: string
      enum:
        - CONSULT
        - RESERVE
        - REQUEST_QUOTE
        - NONE
    InspectionServiceCard:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - serviceNo
        - category
        - name
        - summary
        - features
        - price
        - availability
        - primaryAction
      properties:
        serviceId:
          type: string
          format: uuid
        serviceNo:
          type: string
        category:
          type: object
          additionalProperties: false
          required:
            - code
            - name
          properties:
            code:
              type: string
            name:
              type: string
        name:
          type: string
        summary:
          type: string
        coverImage:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        features:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/FeatureTag"
        price:
          $ref: "#/components/schemas/ServicePrice"
        rating:
          anyOf:
            - $ref: "#/components/schemas/ServiceRating"
            - type: "null"
        completedCount:
          type:
            - integer
            - "null"
          minimum: 0
        distanceMeters:
          type:
            - integer
            - "null"
          minimum: 0
        availability:
          type: string
          enum:
            - AVAILABLE
            - RESERVABLE
            - UNAVAILABLE
        primaryAction:
          $ref: "#/components/schemas/ServiceAction"
    InspectionPortal:
      type: object
      additionalProperties: false
      required:
        - city
        - configVersion
        - updatedAt
        - hero
        - categories
        - guarantees
        - hotServices
        - processSteps
      properties:
        city:
          $ref: "#/components/schemas/CitySummary"
        configVersion:
          type: string
        updatedAt:
          type: string
          format: date-time
        hero:
          $ref: "#/components/schemas/HeroContent"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InspectionCategory"
        guarantees:
          type: array
          items:
            $ref: "#/components/schemas/PortalInfoItem"
        hotServices:
          type: array
          items:
            $ref: "#/components/schemas/InspectionServiceCard"
        processSteps:
          type: array
          items:
            $ref: "#/components/schemas/PortalInfoItem"
    FilterOption:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    CatalogSort:
      type: string
      enum:
        - COMPREHENSIVE
        - DISTANCE_ASC
        - PRICE_ASC
        - PRICE_DESC
      default: COMPREHENSIVE
    InspectionFilterOptions:
      type: object
      additionalProperties: false
      required:
        - city
        - configVersion
        - categories
        - serviceMethods
        - availability
        - priceModes
        - sorts
      properties:
        city:
          $ref: "#/components/schemas/CitySummary"
        configVersion:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InspectionCategory"
        serviceMethods:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        availability:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        priceModes:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        sorts:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSort"
        supportsReportFilter:
          type: boolean
          default: false
    InspectionServicePage:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - total
        - hasMore
        - items
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/InspectionServiceCard"

