openapi: 3.1.0
info:
  title: Inspection Catalog API
  version: 1.3.0
  description: >
    巡检目录 I1 的逻辑契约。若宿主项目已有统一响应信封、分页或错误格式，
    实现时映射到宿主规范，但不得改变字段语义。
    1.3.0（R6-4）：服务详情的服务商加 qualificationReviewed（平台审核过它的资质），页面据此显示“资质已审核”。
paths:
  /api/v1/inspection/portal:
    get:
      operationId: getInspectionPortal
      summary: 获取“我要巡检”入口配置
      parameters:
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: 入口配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionPortal"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"
  /api/v1/inspection/filters:
    get:
      operationId: getInspectionFilterOptions
      summary: 获取当前城市支持的筛选项
      parameters:
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: 筛选项
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionFilterOptions"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
  /api/v1/inspection/services:
    get:
      operationId: searchInspectionServices
      summary: 搜索巡检服务
      parameters:
        - $ref: "#/components/parameters/CityCode"
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: serviceMethods
          in: query
          required: false
          style: form
          explode: true
          description: 巡检方式编码，取值见 /filters 的 serviceMethods（UAV 无人机 / ROBOT 智能设备）；多个值之间是“或”
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: availability
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: priceModes
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items:
              $ref: "#/components/schemas/PriceMode"
        - name: includesReport
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogSort"
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 服务分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionServicePage"
        "400":
          description: 查询参数无效或距离排序缺少位置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/CityNotEnabled"
  /api/v1/inspection/services/{serviceId}:
    get:
      operationId: getInspectionServiceDetail
      summary: Get the complete inspection service detail
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: Inspection service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionServiceDetail"
        "400":
          description: Invalid service or city parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service is unavailable in the requested city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    CityCode:
      name: cityCode
      in: query
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 16
      description: 国家统计区划或平台统一城市稳定编码
  responses:
    CityNotEnabled:
      description: 当前城市未开通巡检目录
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: INS_CATALOG_CITY_NOT_ENABLED
                message: 当前城市暂未开通巡检服务
                traceId: 01JEXAMPLETRACE
    ConfigUnavailable:
      description: 入口配置暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type:
            - object
            - "null"
          additionalProperties: true
    CitySummary:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        provinceCode:
          type:
            - string
            - "null"
    MediaAsset:
      type: object
      additionalProperties: false
      required:
        - url
        - alt
      properties:
        url:
          type: string
          format: uri
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
        alt:
          type: string
          maxLength: 160
    PortalActionType:
      type: string
      enum:
        - OPEN_CATALOG
        - OPEN_FILTER
        - HOST_ACTION
        - NONE
    PortalAction:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/PortalActionType"
        categoryCode:
          type:
            - string
            - "null"
        keyword:
          type:
            - string
            - "null"
        serviceId:
          type:
            - string
            - "null"
          format: uuid
        hostAction:
          type:
            - string
            - "null"
    InspectionCategory:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - sortOrder
        - action
      properties:
        code:
          type: string
        name:
          type: string
        subtitle:
          type:
            - string
            - "null"
        icon:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        sortOrder:
          type: integer
        action:
          $ref: "#/components/schemas/PortalAction"
    HeroContent:
      type: object
      additionalProperties: false
      required:
        - title
        - subtitle
        - sellingPoints
        - action
      properties:
        title:
          type: string
        highlightedText:
          type:
            - string
            - "null"
        subtitle:
          type: string
        sellingPoints:
          type: array
          maxItems: 5
          items:
            type: string
        image:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        actionLabel:
          type:
            - string
            - "null"
        action:
          $ref: "#/components/schemas/PortalAction"
    PortalInfoItem:
      type: object
      additionalProperties: false
      required:
        - code
        - title
        - sortOrder
      properties:
        code:
          type: string
        title:
          type: string
        subtitle:
          type:
            - string
            - "null"
        icon:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        sortOrder:
          type: integer
    FeatureTag:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    PriceMode:
      type: string
      enum:
        - STARTING_PRICE
        - PER_DISTANCE
        - PER_VISIT
        - PROJECT_QUOTE
    ServicePrice:
      type: object
      additionalProperties: false
      required:
        - mode
        - currency
      properties:
        mode:
          $ref: "#/components/schemas/PriceMode"
        startingAmountMinor:
          type:
            - integer
            - "null"
          minimum: 0
        currency:
          type: string
          enum:
            - CNY
        unitCode:
          type:
            - string
            - "null"
        unitLabel:
          type:
            - string
            - "null"
    ServiceRating:
      type: object
      additionalProperties: false
      required:
        - average
        - count
      properties:
        average:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 5
        count:
          type:
            - integer
            - "null"
          minimum: 0
    ServiceAction:
      type: string
      enum:
        - CONSULT
        - RESERVE
        - REQUEST_QUOTE
        - NONE
    InspectionServiceCard:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - serviceNo
        - category
        - name
        - summary
        - features
        - price
        - availability
        - primaryAction
      properties:
        serviceId:
          type: string
          format: uuid
        serviceNo:
          type: string
        category:
          type: object
          additionalProperties: false
          required:
            - code
            - name
          properties:
            code:
              type: string
            name:
              type: string
        name:
          type: string
        summary:
          type: string
        coverImage:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        features:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/FeatureTag"
        price:
          $ref: "#/components/schemas/ServicePrice"
        priceNote:
          type:
            - string
            - "null"
          maxLength: 240
          description: >
            列表卡价格说明。起步价类模式（STARTING_PRICE/PER_DISTANCE/PER_VISIT）说明起步价包含的内容，
            如“含现场巡检和报告”；PROJECT_QUOTE 由服务端返回“方案确认后定价”一类文案。
            服务端无配置时返回 null，客户端隐藏该行；旧数据全部为 null。
        rating:
          anyOf:
            - $ref: "#/components/schemas/ServiceRating"
            - type: "null"
        completedCount:
          type:
            - integer
            - "null"
          minimum: 0
        distanceMeters:
          type:
            - integer
            - "null"
          minimum: 0
          description: >
            用户位置到服务中心点的距离（米），由 PostGIS 计算。请求带了 latitude、longitude
            且服务在该城市有中心点时才有值，其余为 null。
        availability:
          type: string
          enum:
            - AVAILABLE
            - RESERVABLE
            - UNAVAILABLE
        primaryAction:
          $ref: "#/components/schemas/ServiceAction"
    DetailItem:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        iconKey:
          type:
            - string
            - "null"
        image:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        imageAssetCode:
          type:
            - string
            - "null"
    ServiceProvider:
      type: object
      additionalProperties: false
      required:
        - providerId
        - name
        - qualificationReviewed
      properties:
        providerId:
          type: string
          format: uuid
        name:
          type: string
        logo:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        logoAssetCode:
          type:
            - string
            - "null"
        certificationLabel:
          type:
            - string
            - "null"
          description: 服务商资料里的资质说明，如“企业认证”；qualificationReviewed 为 true 时页面在这个位置显示“资质已审核”
        qualificationReviewed:
          type: boolean
          description: 平台已审核过这家服务商的资质（机构有资质审核通过时间）；只来自数据库，不按文字推断
        teamDescription:
          type:
            - string
            - "null"
    ReviewTag:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - count
      properties:
        code:
          type: string
        name:
          type: string
        count:
          type: integer
          minimum: 0
    ReviewImage:
      type: object
      additionalProperties: false
      properties:
        image:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        assetCode:
          type:
            - string
            - "null"
    ServiceReview:
      type: object
      additionalProperties: false
      required:
        - id
        - maskedUserName
        - rating
        - date
        - content
        - imageAssets
      properties:
        id:
          type: string
          format: uuid
        maskedUserName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        date:
          type: string
          format: date
        content:
          type: string
        imageAssets:
          type: array
          items:
            $ref: "#/components/schemas/ReviewImage"
    ReviewSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - tags
        - items
      properties:
        average:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 5
        total:
          type: integer
          minimum: 0
        positiveRate:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 100
        tags:
          type: array
          items:
            $ref: "#/components/schemas/ReviewTag"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceReview"
    InspectionServiceDetail:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - serviceNo
        - category
        - name
        - summary
        - price
        - availability
        - primaryAction
        - completedCount
        - capabilities
        - inspectionItems
        - processSteps
        - deliverables
        - guarantees
        - reviews
      properties:
        serviceId:
          type: string
          format: uuid
        serviceNo:
          type: string
        category:
          type: object
          additionalProperties: false
          required:
            - code
            - name
          properties:
            code:
              type: string
            name:
              type: string
        name:
          type: string
        summary:
          type: string
        coverImage:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        price:
          $ref: "#/components/schemas/ServicePrice"
        priceNote:
          type:
            - string
            - "null"
          maxLength: 240
          description: >
            计价方式文案，说明价格如何计算、起步价包含什么或按项目报价时何时定价，
            来自 inspection_service.price_note；无配置时为 null。
        priceFactors:
          type:
            - array
            - "null"
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: >
            影响价格的因素，按后台排序展示，如“线路长度”“杆塔数量”“现场条件”。
            来自 inspection_service_detail_item 的 PRICE_FACTOR 类型（T03 迁移）；
            无配置时返回 null 或空数组，客户端均隐藏；旧数据全部为空。
        cancellationNote:
          type:
            - string
            - "null"
          maxLength: 500
          description: >
            取消说明文案，如“方案确认前可取消，不收费；确认后按方案约定”。
            来自 inspection_service.cancellation_note（T03 迁移 V010）；无配置时为 null，客户端隐藏；旧数据全部为 null。
            仅为展示文案，取消是否允许仍以服务流程契约的状态机为准。
        serviceCities:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/CitySummary"
          description: >
            该服务已开通的城市列表，来自 inspection_service_city 中 status=ACTIVE 的记录，
            城市名称由平台城市目录解析；当前请求的 cityCode 必在其中。
            服务端未实现或无数据时返回 null，客户端隐藏。
        availability:
          type: string
        primaryAction:
          $ref: "#/components/schemas/ServiceAction"
        completedCount:
          type: integer
          minimum: 0
        provider:
          anyOf:
            - $ref: "#/components/schemas/ServiceProvider"
            - type: "null"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
        inspectionItems:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
        processSteps:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
        deliverables:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
        guarantees:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
        reviews:
          $ref: "#/components/schemas/ReviewSummary"
    InspectionPortal:
      type: object
      additionalProperties: false
      required:
        - city
        - configVersion
        - updatedAt
        - hero
        - categories
        - guarantees
        - hotServices
        - processSteps
      properties:
        city:
          $ref: "#/components/schemas/CitySummary"
        configVersion:
          type: string
        updatedAt:
          type: string
          format: date-time
        hero:
          $ref: "#/components/schemas/HeroContent"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InspectionCategory"
        guarantees:
          type: array
          items:
            $ref: "#/components/schemas/PortalInfoItem"
        hotServices:
          type: array
          items:
            $ref: "#/components/schemas/InspectionServiceCard"
        processSteps:
          type: array
          items:
            $ref: "#/components/schemas/PortalInfoItem"
    FilterOption:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    CatalogSort:
      type: string
      enum:
        - COMPREHENSIVE
        - SALES_DESC
        - PRICE_ASC
        - PRICE_DESC
        - DISTANCE_ASC
      default: COMPREHENSIVE
      description: >
        DISTANCE_ASC（1.2.0 新增）按用户位置到服务在该城市的服务中心点的距离从近到远，
        必须同时带 latitude 和 longitude，否则 400；没有中心点的服务排最后。
        SALES_DESC 接口接受，但 /filters 的 sorts 不提供。
    InspectionFilterOptions:
      type: object
      additionalProperties: false
      required:
        - city
        - configVersion
        - categories
        - serviceMethods
        - availability
        - priceModes
        - sorts
      properties:
        city:
          $ref: "#/components/schemas/CitySummary"
        configVersion:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InspectionCategory"
        serviceMethods:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        availability:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        priceModes:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        sorts:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSort"
        supportsReportFilter:
          type: boolean
          default: false
    InspectionServicePage:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - total
        - hasMore
        - items
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/InspectionServiceCard"

