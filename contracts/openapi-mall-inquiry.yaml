      description: "商家看到的询价单：没有客户的身份和联系方式"
    MallMerchantInquiryPage:
      type: "object"
      additionalProperties: false
      required:
        - "page"
        - "size"
        - "total"
        - "hasMore"
        - "items"
      properties:
        page:
          type: "integer"
        size:
          type: "integer"
        total:
          type: "integer"
          format: "int64"
        hasMore:
          type: "boolean"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/MallMerchantInquiry"
    MallInquiryRequest:
      type: "object"
      additionalProperties: false
      required:
        - "productId"
        - "requirement"
        - "quantity"
        - "cityCode"
        - "offerIds"
      properties:
        productId:
          type: "string"
          format: "uuid"
        requirement:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "配置和用途说明，可以换行"
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
        cityCode:
          type: "string"
          pattern: "^[A-Z0-9]{4,16}$"
          description: "交付城市（当前城市）"
        expectedDate:
          type:
            - "string"
            - "null"
          format: "date"
          description: "YYYY-MM-DD（北京时间），可以不填，填了要晚于今天"
        offerIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          minItems: 1
          maxItems: 3
          description: "发给哪些商家：这件商品在这个城市的询价供给（见 listMallInquiryOffers），不同商家，1–3 个"
    MallInquiryChoiceRequest:
      type: "object"
      additionalProperties: false
      required:
        - "quoteId"
        - "quoteVersion"
      properties:
        quoteId:
          type: "string"
          format: "uuid"
        quoteVersion:
          type: "integer"
          minimum: 1
