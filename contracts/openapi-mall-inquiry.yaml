        unitAmountMinor:
          type: "integer"
          format: "int64"
          minimum: 1
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
        totalMinor:
          type: "integer"
          format: "int64"
        model:
          type: "string"
          maxLength: 60
        leadDays:
          type: "integer"
          minimum: 1
          maximum: 365
        includes:
          type:
            - "string"
            - "null"
          maxLength: 120
        validUntil:
          type: "string"
          format: "date-time"
        quotedAt:
          type: "string"
          format: "date-time"
      description: "商家自己最新的一版报价"
    MallMerchantInquiry:
      type: "object"
      additionalProperties: false
      required:
        - "inquiryId"
        - "status"
        - "product"
        - "offerId"
        - "requirement"
        - "quantity"
        - "cityCode"
        - "expectedDate"
        - "submittedAt"
        - "quoteDeadline"
        - "quotingOpen"
        - "invitationStatus"
        - "declineReason"
        - "myQuote"
      properties:
        inquiryId:
          type: "string"
          format: "uuid"
        status:
          $ref: "#/components/schemas/MallInquiryStatus"
        product:
          $ref: "#/components/schemas/MallInquiryProduct"
        offerId:
          type: "string"
          format: "uuid"
          description: "发给本机构的那个供给"
        requirement:
          type: "string"
        quantity:
          type: "integer"
        cityCode:
          type: "string"
        expectedDate:
          type:
            - "string"
            - "null"
          format: "date"
        submittedAt:
          type: "string"
          format: "date-time"
        quoteDeadline:
          type: "string"
          format: "date-time"
        quotingOpen:
          type: "boolean"
          description: "本机构现在还可以报价、改价"
        invitationStatus:
          $ref: "#/components/schemas/MallInquiryInvitationStatus"
        declineReason:
          type:
            - "string"
            - "null"
