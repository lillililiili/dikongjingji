        - "model"
        - "leadDays"
        - "validUntil"
      properties:
        unitAmountMinor:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 10000000000
        model:
          type: "string"
          minLength: 1
          maxLength: 60
        leadDays:
          type: "integer"
          minimum: 1
          maximum: 365
        includes:
          type:
            - "string"
            - "null"
          maxLength: 120
        validUntil:
          type: "string"
          format: "date-time"
          description: "晚于现在，不超过 7 天"
    MallInquiryDeclineRequest:
      type: "object"
      additionalProperties: false
      required:
        - "reason"
      properties:
        reason:
          type: "string"
          minLength: 1
          maxLength: 80
