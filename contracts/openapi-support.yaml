        unreadCount:
          type: "integer"
          minimum: 0
          description: "这一边还没读的客户消息条数"
        createdAt:
          type: "string"
          format: "date-time"
      description: "回复方（商家、服务商的操作员，平台客服）看到的会话"
    SupportDeskConversationPage:
      type: "object"
      additionalProperties: false
      required:
        - "page"
        - "size"
        - "total"
        - "hasMore"
        - "unreadCount"
        - "items"
      properties:
        page:
          type: "integer"
        size:
          type: "integer"
        total:
          type: "integer"
          format: "int64"
        hasMore:
          type: "boolean"
        unreadCount:
          type: "integer"
          format: "int64"
          minimum: 0
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/SupportDeskConversation"
    SupportCard:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "refId"
        - "title"
        - "subtitle"
      properties:
        type:
          $ref: "#/components/schemas/SupportCardType"
        refId:
