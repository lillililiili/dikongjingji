openapi: 3.1.0
info:
  title: Home Recommend API
  version: 1.2.2
  description: >-
    1.2.2 adds guest reads for operator images used in published records and streaming for published discovery videos in local development.
    1.2.1 adds the inspection image directory to the local development media route.
    1.2.0 adds the published city carousel, independent of the four recommendation blocks.
    The four blocks under the entries of the home "推荐" channel
    (docs/redesign/03-App实现任务计划.md §15.3), in one read-only request. It only joins lists
    that are already public: each item has the shape of its own list endpoint. A block whose
    module cannot be read is returned empty; the other blocks are still returned.
    Bodies are returned bare, errors use the shared ApiError, like the other contracts.
    1.1.0 (2026-11-23, S4-4): no change of its own; venues and today.venue use VenueCard of
    openapi-experience.yaml 1.5.0, which gains projectSummary (the first line of the venue card on board HomeFull).
servers:
  - url: /
paths:
  /api/v1/dev-media/ops/videos/{fileName}:
    parameters:
      - name: fileName
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}[.]mp4$'}
    get:
      operationId: getDevelopmentPublishedDiscoveryVideo
      description: >-
        Local storage in the dev profile only. Requires an exact reference from the playback URL of a
        discovery video with a city that has reached its publication time and remains published.
        Rechecks publication for full and partial requests. A course recording cannot authorize access.
      security: []
      parameters:
        - {name: Range, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Original MP4 with Cache-Control no-store.
          content: {video/mp4: {schema: {type: string, format: binary}}}
        '206':
          description: Requested video bytes with Content-Range.
          content: {video/mp4: {schema: {type: string, format: binary}}}
        '404': {description: No currently published discovery video uses this local upload.}
        '416': {description: Range cannot be satisfied for this video.}
    head:
      operationId: headDevelopmentPublishedDiscoveryVideo
      security: []
      responses:
        '200': {description: Headers for this published video.}
        '404': {description: No currently published discovery video uses this local upload.}
  /api/v1/dev-media/ops/covers/{fileName}:
    parameters:
      - name: fileName
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}[.](jpg|png|webp)$'}
    get:
      operationId: getDevelopmentPublishedOpsImage
      description: >-
        Local storage in the dev profile only. Returns a locally uploaded operator image while it is referenced
        by a public display field. Every request checks the current publication state. Scheduled articles
        become eligible at their publication time. Course lesson recordings and other private resources
        cannot authorize a read. Documents, audio and video are outside this route.
      security: []
      responses:
        '200':
          description: Original display image with Cache-Control no-store.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {description: Image unavailable or no public record displays it.}
    head:
      operationId: headDevelopmentPublishedOpsImage
      security: []
      responses:
        '200': {description: Headers for a currently displayed image.}
        '404': {description: Image unavailable or no public record displays it.}
  /api/v1/dev-media/{kind}/{group}/{name}:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [images, videos]}}
      - {name: group, in: path, required: true, schema: {type: string, enum: [preview, home, inspection]}}
      - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]+[.](jpg|png|webp|mp4)$"}}
    get:
      operationId: readDevelopmentMedia
      summary: Read a local development fixture image or MP4; registered only with the dev profile
      security: []
      parameters:
        - {name: Range, in: header, required: false, schema: {type: string}}
      responses:
        "200": {description: Media file}
        "206": {description: Requested byte range}
        "404": {description: Asset unavailable}
        "416": {description: Byte range unsatisfiable}
    head:
      operationId: inspectDevelopmentMedia
      summary: Inspect a local fixture file without downloading its contents (dev profile only)
      security: []
      responses:
        "200": {description: Media metadata}
        "404": {description: Asset unavailable}
  /api/v1/home/carousel:
    get:
      operationId: getHomeCarousel
      summary: Published slides configured for the selected city, in display order
      security: []
      parameters:
        - name: cityCode
          in: query
          required: true
          schema: {type: string, pattern: "^[A-Z0-9]{4,16}$"}
      responses:
        "200":
          description: An empty city returns an empty array.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 12
                    items: {$ref: "#/components/schemas/HomeSlide"}
        "400":
          description: Missing or malformed city code
          content:
            application/json:
              schema: {$ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"}
        "503":
          description: Configured operations media is unavailable (OPS_MEDIA_STORE_UNAVAILABLE).
          content:
            application/json:
              schema: {$ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"}
  /api/v1/home/recommend:
    get:
      operationId: getHomeRecommend
      summary: Today's bookable sessions, the next activities, products on sale and venues of a city
      security: []
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9]{4,16}$"
      responses:
        "200":
          description: The four blocks; a block with nothing to show is empty or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRecommend"
        "400":
          description: cityCode is missing or malformed
          content:
            application/json:
              schema:
                $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
components:
  schemas:
    HomeSlide:
      type: object
      additionalProperties: false
      required: [id, tag, titleLines, descriptionLines, actionLabel, imageUrl, imageAlt, tone, target]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$"}
        tag: {type: string}
        titleLines: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
        descriptionLines: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
        actionLabel: {type: string}
        imageUrl:
          type: string
          format: uri-reference
          description: Controlled operations-media HTTPS URL or a same-origin development image.
        imageAlt: {type: string}
        tone: {type: string, enum: [SKY, SUN, VIOLET, MINT]}
        target: {type: string, enum: [ACTIVITY, PLAY_GAMES, EXPERIENCE]}
    HomeRecommend:
      type: object
      additionalProperties: false
      required: [today, activities, products, venues]
      properties:
        today:
          description: >-
            The first venue of the list that still has bookable sessions today (Beijing date),
            with the earliest bookable session of each of its first three projects. Null when
            there is no such venue or session.
          oneOf:
            - $ref: "#/components/schemas/HomeToday"
            - type: "null"
        activities:
          description: At most 3, in the order of the first page of GET /api/v1/activities.
          type: array
          maxItems: 3
          items:
            $ref: "./openapi-activity.yaml#/components/schemas/ActivityCard"
        products:
          description: At most 4, in the default order of GET /api/v1/mall/products.
          type: array
          maxItems: 4
          items:
            $ref: "./openapi-mall-catalog.yaml#/components/schemas/MallProductCard"
        venues:
          description: At most 2, in the order of GET /api/v1/venues.
          type: array
          maxItems: 2
          items:
            $ref: "./openapi-experience.yaml#/components/schemas/VenueCard"
    HomeToday:
      type: object
      additionalProperties: false
      required: [venue, slots]
      properties:
        venue:
          $ref: "./openapi-experience.yaml#/components/schemas/VenueCard"
        slots:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/HomeTodaySlot"
    HomeTodaySlot:
      type: object
      additionalProperties: false
      required: [projectId, projectName, startsAt, seatsLeft]
      properties:
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        startsAt:
          type: string
          format: date-time
        seatsLeft:
          type: integer
          minimum: 1
