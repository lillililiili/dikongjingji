openapi: "3.1.0"
info:
  title: "Ops Media API"
  version: "1.0.0"
  description: |-
    1.0.0（S3-1 第三部分，docs/redesign/08-后续开发计划.md §2、§5 D11）：运营端素材上传（活动封面与图集、场馆和设备图片、
    图文封面与正文配图、视频封面与视频文件、专题封面）。

    Every route needs a login (bearer JWT) with the PLATFORM_OPERATOR role; other roles get 403 COMMON_FORBIDDEN.

    规则：
    - 图片 JPEG、PNG、WebP，≤5 MB；视频 MP4，≤50 MB。类型按文件头判断，不认浏览器给的类型和文件名。
    - 存进对象存储端口，返回受控 HTTPS 地址（url）；运营把地址填进各块的表单（活动、场馆、内容等只收 https 地址）。
      上传本身不改业务数据，不写改动记录；同一个文件传两次得到两个地址。
    - 开发环境用本机目录模拟对象存储，默认 HTTPS 地址标识本机素材。运营端用 GET /api/v1/ops/media/{fileName}
      带登录取回预览。App 读取当前已发布记录实际展示的图片时，将默认地址映射到 openapi-home.yaml 的
      GET /api/v1/dev-media/ops/covers/{fileName}。发现页的已发布视频通过同一契约的 /api/v1/dev-media/ops/videos/{fileName}
      播放，支持分段和进度跳转。没有配置存储的环境上传和运营预览都是 503 OPS_MEDIA_STORE_UNAVAILABLE。

    Bodies are returned bare, errors use the shared ApiError, like the other contracts.
servers:
  - url: "/"
paths:
  /api/v1/ops/media:
    post:
      operationId: "uploadOpsMedia"
      summary: "上传一张图片或一个视频，返回受控 HTTPS 地址"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              additionalProperties: false
              required: ["file"]
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "JPEG、PNG、WebP 图片（≤5 MB）或 MP4 视频（≤50 MB）"
      responses:
        "201":
          description: "存好的素材"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsMedia"
        "400":
          description: "没有文件、空文件、超过 50 MB（COMMON_INVALID_ARGUMENT）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "OPS_MEDIA_TYPE_UNSUPPORTED：不是 JPEG、PNG、WebP、MP4；OPS_MEDIA_TOO_LARGE：图片超过 5 MB 或视频超过 50 MB。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /api/v1/ops/media/{fileName}:
    get:
      operationId: "previewOpsMedia"
      summary: "按上传时给的文件名取回内容（运营端预览；不缓存）"
      security:
        - bearerAuth: []
      parameters:
        - name: "fileName"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[0-9a-f-]{36}\\.(jpg|png|webp|mp4)$"
      responses:
        "200":
          description: "文件内容"
          content:
            image/jpeg:
              schema:
                type: "string"
                format: "binary"
            image/png:
              schema:
                type: "string"
                format: "binary"
            image/webp:
              schema:
                type: "string"
                format: "binary"
            video/mp4:
              schema:
                type: "string"
                format: "binary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "文件名不对或没有这个文件（COMMON_NOT_FOUND）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  responses:
    Unauthorized:
      description: "没登录或登录已失效（COMMON_UNAUTHORIZED）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: "不是平台运营（COMMON_FORBIDDEN）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    StoreUnavailable:
      description: "OPS_MEDIA_STORE_UNAVAILABLE：素材存储没配置或暂不可用"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: "object"
      additionalProperties: false
      required: ["code", "message", "traceId"]
      properties:
        code:
          type: "string"
          description: "COMMON_* 或下面 OpsMediaErrorCode 里的"
        message:
          type: "string"
        traceId:
          type: "string"
        details:
          type: ["object", "null"]
          additionalProperties: true
    OpsMediaErrorCode:
      type: "string"
      enum: [OPS_MEDIA_TYPE_UNSUPPORTED, OPS_MEDIA_TOO_LARGE, OPS_MEDIA_STORE_UNAVAILABLE]
    OpsMediaKind:
      type: "string"
      description: "IMAGE 图片；VIDEO 视频"
      enum: [IMAGE, VIDEO]
    OpsMedia:
      type: "object"
      additionalProperties: false
      required: [url, fileName, kind, contentType, sizeBytes]
      properties:
        url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "受控 HTTPS 地址，填进各块表单的封面、图集、配图、视频地址"
        fileName:
          type: "string"
          description: "预览用的文件名（GET /api/v1/ops/media/{fileName}）"
        kind:
          $ref: "#/components/schemas/OpsMediaKind"
        contentType:
          type: "string"
          enum: ["image/jpeg", "image/png", "image/webp", "video/mp4"]
        sizeBytes:
          type: "integer"
          format: "int64"
          minimum: 1
