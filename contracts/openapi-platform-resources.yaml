openapi: 3.0.3
info:
  title: Platform places and published agreements
  version: 1.0.0
paths:
  /api/v1/experience/play-games:
    get:
      operationId: listPublishedPlayGames
      summary: 按目录顺序读取已发布的小游戏和关卡
      responses:
        '200':
          description: 目录没有已发布关卡时返回空数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, title, subtitle, skillLabel, tone, avatar, board]
                  properties:
                    id: { type: string }
                    title: { type: string }
                    subtitle: { type: string }
                    skillLabel: { type: string }
                    tone: { type: string, enum: [VIOLET, SKY] }
                    avatar: { type: string, enum: [ROBOT, DRONE] }
                    board: { type: string, pattern: '^[.][.WSG]{24}$', description: 从左到右逐行排列的 25 个格子。点为空地，W 为障碍，S 为星星，G 为终点。 }
  /api/v1/platform/map-places:
    get:
      operationId: listPlatformMapPlaces
      summary: 本城已发布地点，提供经纬度时按与该位置的距离排序
      parameters:
        - { in: query, name: cityCode, required: true, schema: { type: string, pattern: '^[0-9]{6}$' } }
        - { in: query, name: keyword, schema: { type: string, maxLength: 40 } }
        - { in: query, name: latitude, description: 与 longitude 一起提供, schema: { type: number, minimum: -90, maximum: 90 } }
        - { in: query, name: longitude, description: 与 latitude 一起提供, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: 最多 30 个地点。城市没有可见记录或无匹配项时返回空数组。
          content:
            application/json:
              schema:
                type: array
                maxItems: 30
                items:
                  type: object
                  required: [placeId, name, address, latitude, longitude, sample]
                  properties:
                    placeId: { type: string }
                    name: { type: string }
                    address: { type: string }
                    latitude: { type: number }
                    longitude: { type: number }
                    sample: { type: boolean }
        '400': { description: 参数无效 }
  /api/v1/platform/agreements/{doc}:
    get:
      operationId: getPublishedAgreement
      summary: 获取截至当日已发布的最新协议和按顺序排列的纯文本章节
      parameters:
        - in: path
          name: doc
          required: true
          schema: { type: string, enum: [PRIVACY_POLICY, USER_AGREEMENT, CHILD_PRIVACY_RULES, TRADE_AGREEMENT, ENROLLMENT_NOTICE] }
      responses:
        '200':
          description: 已发布的协议正文
          content:
            application/json:
              schema:
                type: object
                required: [title, version, publishedOn, sections]
                properties:
                  title: { type: string }
                  version: { type: string }
                  publishedOn: { type: string, format: date }
                  sections:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required: [title, body]
                      properties:
                        title: { type: string }
                        body: { type: string }
        '404': { description: 尚无已发布正文 }
