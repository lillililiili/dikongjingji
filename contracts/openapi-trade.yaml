    post:
      operationId: refundOrder
      summary: 商家退款（已付款的订单，可部分退款）
      description: |-
        订单要是 PAID、SHIPPED、COMPLETED 或 REFUND_FAILED。金额不超过实付减已退减在路上的退款（否则 TRADE_REFUND_EXCEEDS_PAID）；
        同一订单最多 50 次、付款后一年内（否则 TRADE_REFUND_LIMIT_REACHED）。退的是剩下的全部时订单进入 REFUNDING，部分退款不改订单状态。
        同一个 Idempotency-Key、同样的金额和原因重放返回同一笔退款，换了内容回 TRADE_IDEMPOTENCY_KEY_REUSED。
        返回时退款可能是 PROCESSING（微信已受理）或 REQUESTED（微信暂时不通，服务端稍后用同一个退款单号重试）。
      security:
