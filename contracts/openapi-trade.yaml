  /api/v1/platform/trade/reconciliation:
    get:
      operationId: exportReconciliation
      summary: 某一天的对账结果（平台运营），可导出 CSV
      description: |-
        微信的 T 日账单 T+1 日 10 点后才有。按子商户逐个下载后与平台的支付单、退款单逐笔核对：支付按付款成功时间、
        退款按微信受理时间，都按北京时间分天。这一天要对账的子商户（登记了收款账户的，和那天有付款或退款受理的）
        已结束且没有应对账商户或历史账单的日期返回空结果，CSV 仅含表头。有应对账商户的日期须全部导入成功，否则 409 TRADE_RECONCILIATION_NOT_READY。
        CSV 是 UTF-8（带 BOM），列为：日期、类型、说明、子商户号、商户订单号、商户退款单号、平台金额（元）、微信金额（元）；
        以 = + - @ 开头的格前面加单引号。差异只记录、不自动改订单。
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          description: 只认大写；不给时是 JSON
          schema:
            type: string
            enum: [JSON, CSV]
            default: JSON
      responses:
        "200":
          description: 汇总和差异
          headers:
            Content-Disposition:
              description: CSV 时为 attachment; filename="reconciliation-<date>.csv"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 账单还没全部导入（当天 10 点前，或导入失败），TRADE_RECONCILIATION_NOT_READY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/platform/trade/reconciliation/runs:
    post:
      operationId: runReconciliation
      summary: 立刻对某一天跑一次对账（平台运营）
      description: |-
        导入失败后重试，或差异处理后重新核对。只能对今天以前的日期（北京时间）。redo=false 时已导入成功的子商户跳过；
        redo=true 时全部重新下载、覆盖。账单还在生成、渠道不通、文件校验不过的子商户记为失败。
        不带 Idempotency-Key：重复调用靠 redo 和导入状态保证，结果一样。
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: redo
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 这次跑的结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ChannelUnavailable"
  /api/v1/platform/trade/channel-checks:
    post:
      operationId: checkPaymentChannel
      summary: 支付通道自检（平台运营）
      description: |-
        配置逐项检查，再向渠道发两个没有副作用的请求（按自检单号查单、查退款，单号以 CHK 开头，平台的单号不会这样开头）。
        不给 subMchid 时跳过这两个请求（QUERY_PAYMENT、QUERY_REFUND 为 SKIPPED）。
        结果有 FAIL 也回 200：自检本身做完了，由 passed 和各项 status 说明；消息里不带密钥、文件内容和服务器路径。
        不带 Idempotency-Key：只读，重复调用没有副作用。
      security:
        - bearerAuth: []
      parameters:
        - name: subMchid
          in: query
          required: false
          description: 用来查单的二级商户号（已在微信服务商后台和服务商号绑定），8–32 位数字
          schema:
            type: string
            pattern: "^[0-9]{8,32}$"
      responses:
        "200":
          description: 自检结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 订单详情返回的 ETag（订单版本）
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  headers:
    OrderETag:
      description: 订单版本（带引号），改订单状态时放进 If-Match
      schema:
        type: string
  responses:
    BadRequest:
      description: 参数无效（COMMON_INVALID_ARGUMENT）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 没登录或令牌无效（COMMON_UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 角色不对（COMMON_FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 订单不存在或不是自己的（COMMON_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 业务规则拒绝，code 见 TradeErrorCode
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    VersionConflict:
      description: 订单已变化，刷新后再试（TRADE_VERSION_CONFLICT）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ChannelUnavailable:
      description: 微信支付暂不可用或没有配置（TRADE_CHANNEL_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true
    TradeErrorCode:
      type: string
      description: 交易模块的业务错误码（409，除注明外）
      enum:
        - TRADE_IDEMPOTENCY_KEY_REUSED
        - TRADE_AMOUNT_CHANGED
        - TRADE_ADDRESS_REQUIRED
        - TRADE_DELIVERY_UNAVAILABLE
        - TRADE_MERCHANT_PAYMENT_UNAVAILABLE
        - TRADE_ORDER_STATE_INVALID
        - TRADE_ORDER_EXPIRED
        - TRADE_REFUND_EXCEEDS_PAID
        - TRADE_REFUND_LIMIT_REACHED
        - TRADE_PICKUP_CODE_INVALID
        - TRADE_VERSION_CONFLICT
        - TRADE_CHANNEL_UNAVAILABLE
        - TRADE_RECONCILIATION_NOT_READY
        - TRADE_INQUIRY_QUOTE_ORDERED
        - TRADE_ACCOUNT_CLOSING
        - MALL_CHECKOUT_MULTIPLE_MERCHANTS
        - MALL_CHECKOUT_ITEM_UNAVAILABLE
        - MALL_CART_NOT_PURCHASABLE
        - MALL_INQUIRY_QUOTE_NOT_CHOSEN
        - MALL_INQUIRY_QUOTE_EXPIRED
    TradeOrderStatus:
      type: string
      description: |-
        PENDING_PAYMENT 待付款；PAID 已付款待发货（快递）或待自提（自提）；SHIPPED 已发货；COMPLETED 已完成；
        CLOSED 未付款关闭（超时或买家取消）；REFUNDING 全额退款中；REFUNDED 已全额退款；REFUND_FAILED 退款异常，人工处理。
        部分退款不改订单状态，看 amounts.refundedMinor。
      enum: [PENDING_PAYMENT, PAID, SHIPPED, COMPLETED, CLOSED, REFUNDING, REFUNDED, REFUND_FAILED]
    TradeOrderTab:
      type: string
      description: 我的订单的页签：ALL 全部；TO_PAY 待付款；TO_SHIP 待发货 / 待自提；TO_RECEIVE 待收货；DONE 已完成；REFUND 退款
      enum: [ALL, TO_PAY, TO_SHIP, TO_RECEIVE, DONE, REFUND]
    TradeOrderSource:
      type: string
      description: MALL 商城；ACTIVITY 收费活动报名（0.2.0）；VENUE 到馆预约（0.2.0，E10）；RENTAL 设备租赁（0.2.0，F3）；INSPECTION 巡检付款节点（0.6.0，S4-1）；PRO_SERVICE 通用服务订单（0.8.0，S4-3）；COURSE 线上录播课（0.9.0，S5-5）。以后接入的业务在这里加
      enum: [MALL, ACTIVITY, VENUE, RENTAL, INSPECTION, PRO_SERVICE, COURSE]
    DeliveryMode:
      type: string
      enum: [EXPRESS, PICKUP]
    MerchantKind:
      type: string
      enum: [FACTORY_DIRECT, AUTHORIZED_DEALER, LOCAL_STORE]
    PaymentChannel:
      type: string
      description: 一期只有微信 App 支付；以后小程序用 WECHAT_JSAPI
      enum: [WECHAT_APP]
    PaymentStatus:
      type: string
      description: CREATED 已建未下单；PREPAID 已拿到预支付；SUCCEEDED 已付款；CLOSED 已关闭；MISMATCH 渠道金额或商户与订单不符（告警，人工处理）
      enum: [CREATED, PREPAID, SUCCEEDED, CLOSED, MISMATCH]
    RefundStatus:
      type: string
      description: REQUESTED 已建未提交；PROCESSING 微信处理中；SUCCEEDED 已到账；CLOSED 已关闭；ABNORMAL 退款异常（如银行卡作废），人工处理
      enum: [REQUESTED, PROCESSING, SUCCEEDED, CLOSED, ABNORMAL]
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [cityCode, deliveryMode, expectedPayableMinor, agreementAccepted]
      properties:
        cityCode:
          type: string
          pattern: "^[A-Z0-9]{4,16}$"
        cartItemIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
          description: 来自购物车时给；和 offerId、inquiryQuoteId 三选一
        offerId:
          type: string
          format: uuid
          description: 立即购买时给，和 quantity 一起
        inquiryQuoteId:
          type: [string, "null"]
          format: uuid
          description: 按选定的询价报价下单时给（0.3.0）；数量、单价按报价，quantity 不用
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        deliveryMode:
          $ref: "#/components/schemas/DeliveryMode"
        addressId:
          type: string
          format: uuid
          description: 快递时用；不给用默认地址
        buyerNote:
          type: string
          maxLength: 50
        expectedPayableMinor:
          type: integer
          format: int64
          minimum: 1
          description: 页面上显示的应付；和服务端重新算出来的不一致时拒绝
        agreementAccepted:
          type: boolean
          const: true
    LaunchPaymentRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          $ref: "#/components/schemas/PaymentChannel"
    ShipOrderRequest:
      type: object
      additionalProperties: false
      required: [carrierName, trackingNo]
      properties:
        carrierName:
          type: string
          minLength: 1
          maxLength: 40
        trackingNo:
          type: string
          minLength: 1
          maxLength: 40
    PickupRequest:
      type: object
      additionalProperties: false
      required: [pickupCode]
      properties:
        pickupCode:
          type: string
          pattern: "^[0-9]{6}$"
          description: 首尾空白会被去掉
    RefundRequest:
      type: object
      additionalProperties: false
      required: [amountMinor, reason]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 80
    MerchantAccountRequest:
      type: object
      additionalProperties: false
      required: [subMchid, active]
      properties:
        subMchid:
          type: string
          pattern: "^[0-9]{8,32}$"
        active:
          type: boolean
    MerchantAccount:
      type: object
      additionalProperties: false
      required: [organizationId, subMchid, active]
      properties:
        organizationId:
          type: string
          format: uuid
        subMchid:
          type: string
        active:
          type: boolean
    TradeMerchant:
      type: object
      additionalProperties: false
      required: [organizationId, name, kind]
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          description: 下单时的商家（收费报名时是主办机构）名称快照
        kind:
          type: [string, "null"]
          enum: [FACTORY_DIRECT, AUTHORIZED_DEALER, LOCAL_STORE, null]
          description: 商城的商家类型（取值同 MerchantKind）；业务来源的订单（0.2.0 起，收费报名）为 null
    MediaAsset:
      type: object
      additionalProperties: false
      required: [url, alt]
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
    TradeOrderLine:
      type: object
      additionalProperties: false
      required: [lineId, productId, offerId, productName, skuName, coverImage, unitAmountMinor, quantity, subtotalMinor]
      properties:
        lineId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        productName:
          type: string
        skuName:
          type: string
        coverImage:
          oneOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        unitAmountMinor:
          type: integer
          format: int64
        quantity:
          type: integer
        subtotalMinor:
          type: integer
          format: int64
    TradeDelivery:
      type: object
      additionalProperties: false
      required: [mode, recipientName, phoneMasked, recipientPhone, addressLine, pickupPoint, pickupCode, carrierName, trackingNo, shippedAt]
      properties:
        mode:
          $ref: "#/components/schemas/DeliveryMode"
        recipientName:
          type: [string, "null"]
          description: 快递时下单那一刻的收货人快照
        phoneMasked:
          type: [string, "null"]
          description: 打码的手机号
        recipientPhone:
          type: [string, "null"]
          description: 完整手机号，只在商家接口、并且订单已付款之后返回（PAID、SHIPPED、COMPLETED、REFUNDING、REFUNDED、
            REFUND_FAILED，发货要用）；商家接口在待付款、已关闭时为 null；买家接口总是 null
        addressLine:
          type: [string, "null"]
          description: 快递时的收货地址（省市 + 详细地址）。买家接口总是返回；商家接口只在订单已付款之后返回，
            待付款、已关闭时为 null（收货人和打码手机号照常返回）。自提单为 null
        pickupPoint:
          type: [string, "null"]
        pickupCode:
          type: [string, "null"]
          description: 自提订单付款后生成的 6 位取货码，只给买家
        carrierName:
          type: [string, "null"]
        trackingNo:
          type: [string, "null"]
        shippedAt:
          type: [string, "null"]
          format: date-time
    TradeAmounts:
      type: object
      additionalProperties: false
      required: [goodsMinor, shippingMinor, payableMinor, paidMinor, refundedMinor, currency]
      properties:
        goodsMinor:
          type: integer
          format: int64
        shippingMinor:
          type: integer
          format: int64
        payableMinor:
          type: integer
          format: int64
        paidMinor:
          type: integer
          format: int64
        refundedMinor:
          type: integer
          format: int64
        currency:
          type: string
          const: CNY
    TradeRefund:
      type: object
      additionalProperties: false
      required: [refundId, amountMinor, reason, status, requestedAt, succeededAt]
      properties:
        refundId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        reason:
          type: string
        status:
          $ref: "#/components/schemas/RefundStatus"
        requestedAt:
          type: string
          format: date-time
        succeededAt:
          type: [string, "null"]
          format: date-time
    TradeOrder:
      type: object
      additionalProperties: false
      required:
        - orderId
        - orderNo
        - source
        - sourceRef
        - status
        - merchant
        - lines
        - delivery
        - amounts
        - buyerNote
        - createdAt
        - payBefore
        - paidAt
        - completedAt
        - closedAt
        - closeReason
        - refunds
        - cancellable
        - version
        - parties
        - channelTransactionId
        - participantNames
        - aftersale
        - payer
      properties:
        orderId:
          type: string
          format: uuid
        orderNo:
          type: string
          description: 给人看的订单编号
        source:
          $ref: "#/components/schemas/TradeOrderSource"
        sourceRef:
          type: [string, "null"]
          format: uuid
          description: 0.2.0：业务单 ID（收费报名时是报名单 ID）；商城订单为 null
        status:
          $ref: "#/components/schemas/TradeOrderStatus"
        merchant:
          $ref: "#/components/schemas/TradeMerchant"
        lines:
          type: array
          description: 商城订单是商品；业务来源的订单是业务项目（收费报名：productId 活动、offerId 场次、quantity 人数）
          items:
            $ref: "#/components/schemas/TradeOrderLine"
        delivery:
          oneOf:
            - $ref: "#/components/schemas/TradeDelivery"
            - type: "null"
          description: 0.2.0：业务来源的订单不发货，为 null
        amounts:
          $ref: "#/components/schemas/TradeAmounts"
        buyerNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        payBefore:
          type: [string, "null"]
          format: date-time
          description: 待付款时的截止时间（商城 30 分钟；收费报名 15 分钟且不晚于报名截止）
        paidAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        closedAt:
          type: [string, "null"]
          format: date-time
        closeReason:
          type: [string, "null"]
          enum: [BUYER_CANCEL, TIMEOUT, null]
          description: CLOSED 时是买家取消（BUYER_CANCEL）还是超时关闭（TIMEOUT），其他状态为 null
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/TradeRefund"
        cancellable:
          type: boolean
          description: 买家现在能不能取消（待付款，或已付款未发货 / 未自提的商城订单；已付款的收费报名订单为 false）
        version:
          type: integer
        parties:
          $ref: "#/components/schemas/TradeOrderParties"
        channelTransactionId:
          type: [string, "null"]
          description: 0.7.0：付款成功的支付单在微信的交易号（transaction_id），验签后的回调或查单记下才有；没付款时为 null。只用来显示
        participantNames:
          type: [string, "null"]
          description: 0.7.0：收费报名订单的参与人姓名（报名顺序，顿号连接），只用来显示；别的订单为 null
        aftersale:
          $ref: "#/components/schemas/TradeOrderAftersale"
        payer:
          $ref: "#/components/schemas/TradePayer"
    TradeOrderParties:
      type: object
      additionalProperties: false
      required: [fulfilledFrom, invoiceIssuer, aftersaleParty]
      description: 0.7.0：下单时的交易主体快照（画板 OrderGoods）。没有时为 null，页面不显示那一行
      properties:
        fulfilledFrom:
          type: [string, "null"]
          maxLength: 250
          description: 从哪里发货（商城供给的发货仓）
        invoiceIssuer:
          type: [string, "null"]
          maxLength: 250
          description: 开票方
        aftersaleParty:
          type: [string, "null"]
          maxLength: 250
          description: 售后责任方
    TradeOrderAftersale:
      type: object
      additionalProperties: false
      required: [latestAftersaleId, latestStatus, applicable]
      description: 0.7.0：订单上的售后入口。售后单的状态取值见 contracts/openapi-trade-aftersale.yaml 的 AftersaleStatus
      properties:
        latestAftersaleId:
          type: [string, "null"]
          format: uuid
          description: 最近一张售后单；没有时为 null
        latestStatus:
          type: [string, "null"]
          description: 最近一张售后单的状态
        applicable:
          type: boolean
          description: 现在能不能申请售后（只有商城订单可能为 true；具体能选哪类、哪个原因看 getAftersaleEligibility）
    TradePayer:
      type: object
      additionalProperties: false
      required: [type, name]
      description: 0.10.0 付款主体（下单时的身份快照）
      properties:
        type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
        name:
          type: [string, "null"]
          description: 企业名称；个人时为 null
    EnterpriseOrderSummary:
      type: object
      additionalProperties: false
      required: [orderId, orderNo, source, title, status, payableMinor, operatorName, createdAt]
      properties:
        orderId:
          type: string
          format: uuid
        orderNo:
          type: string
        source:
          $ref: "#/components/schemas/TradeOrderSource"
        title:
          type: string
          description: 第一行的商品或业务项目名；多行时加“等 N 件”
        status:
          $ref: "#/components/schemas/TradeOrderStatus"
        payableMinor:
          type: integer
          format: int64
        operatorName:
          type: string
          description: 经办人（下单账号的显示名）
        createdAt:
          type: string
          format: date-time
    EnterpriseOrderCounts:
      type: object
      additionalProperties: false
      required: [pendingPayment, inProgress, completed]
      properties:
        pendingPayment:
          type: integer
          format: int64
        inProgress:
          type: integer
          format: int64
          description: 已付款还没完成（待发货、已发货、退款中）
        completed:
          type: integer
          format: int64
    EnterpriseOrderPage:
      type: object
      additionalProperties: false
      required: [page, size, total, hasMore, counts, items]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        hasMore:
          type: boolean
        counts:
          $ref: "#/components/schemas/EnterpriseOrderCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EnterpriseOrderSummary"
    TradeOrderPage:
      type: object
      additionalProperties: false
      required: [page, size, total, hasMore, items]
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/TradeOrder"
    PaymentLaunch:
      type: object
      additionalProperties: false
      required: [paymentId, channel, expiresAt, appCall]
      properties:
        paymentId:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        expiresAt:
          type: string
          format: date-time
          description: 预支付 ID 的有效期（2 小时）和订单付款截止时间里较早的那个
        appCall:
          $ref: "#/components/schemas/WechatAppCall"
    WechatAppCall:
      type: object
      additionalProperties: false
      description: |-
        交给微信 OpenSDK 的参数（pay.weixin.qq.com/doc/v3/partner/4012090168）。sign 是对
        “appId\ntimeStamp\nnonceStr\nprepayId\n”做 SHA256withRSA（平台 API 证书私钥）后的 Base64（4012365868）。
      required: [appId, partnerId, prepayId, packageValue, nonceStr, timeStamp, sign]
      properties:
        appId:
          type: string
        partnerId:
          type: string
        prepayId:
          type: string
        packageValue:
          type: string
          const: Sign=WXPay
        nonceStr:
          type: string
        timeStamp:
          type: string
        sign:
          type: string
    WechatNotification:
      type: object
      description: 微信回调的外层，resource 解密后才是支付或退款的内容
      required: [id, create_time, event_type, resource_type, resource]
      properties:
        id:
          type: string
        create_time:
          type: string
        event_type:
          type: string
        resource_type:
          type: string
        summary:
          type: string
        resource:
          type: object
          required: [algorithm, ciphertext, nonce]
          properties:
            algorithm:
              type: string
            original_type:
              type: string
            ciphertext:
              type: string
            associated_data:
              type: string
            nonce:
              type: string
    WechatFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          const: FAIL
        message:
          type: string
    Reconciliation:
      type: object
      additionalProperties: false
      required: [date, importedAt, matchedCount, differences]
      properties:
        date:
          type: string
          format: date
        importedAt:
          type: [string, "null"]
          format: date-time
          description: 已导入账单的最近时间。该历史日期没有需要对账的商户或交易时为 null。
        matchedCount:
          type: integer
        differences:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationDifference"
    ReconciliationRun:
      type: object
      additionalProperties: false
      required: [date, merchants, imported, failed, skipped, differences]
      properties:
        date:
          type: string
          format: date
        merchants:
          type: integer
          description: 这一天要对账的子商户数
        imported:
          type: integer
          description: 这次导入成功的
        failed:
          type: integer
          description: 这次导入失败的（账单还在生成、渠道不通、文件校验不过）
        skipped:
          type: integer
          description: 之前已导入成功、这次跳过的
        differences:
          type: integer
          description: 这次发现的差异条数
    ChannelCheck:
      type: object
      additionalProperties: false
      required: [mode, passed, checkedAt, items]
      properties:
        mode:
          type: string
          enum: [WECHAT, SIMULATED, DISABLED]
          description: WECHAT 指向真实微信；SIMULATED 指向本机模拟微信（接口域名是回环上的 http，只用于开发机）；DISABLED 没有开启
        passed:
          type: boolean
          description: 没有 FAIL 项（WARN、SKIPPED 不算失败）
        checkedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChannelCheckItem"
    ChannelCheckItem:
      type: object
      additionalProperties: false
      required: [code, status, message]
      properties:
        code:
          type: string
          description: |-
            检查项代号：ENABLED、API_BASE、SP_MCHID、SP_APPID、MERCHANT_SERIAL_NO、MERCHANT_PRIVATE_KEY、MERCHANT_PRIVATE_KEY_FILE、
            API_V3_KEY、PLATFORM_PUBLIC_KEY_ID、PLATFORM_PUBLIC_KEY、KEYS_DISTINCT、PAYMENT_NOTIFY_URL、REFUND_NOTIFY_URL、
            CHANNEL、QUERY_PAYMENT、QUERY_REFUND（以后可能增加，客户端不要只认这几个）
        status:
          type: string
          enum: [PASS, WARN, FAIL, SKIPPED]
        message:
          type: string
          description: 给运维看的中文说明；不带密钥、文件内容和服务器路径
    ReconciliationDifference:
      type: object
      additionalProperties: false
      required: [kind, subMchid, outTradeNo, outRefundNo, platformAmountMinor, channelAmountMinor]
      properties:
        kind:
          type: string
          description: ONLY_IN_CHANNEL 微信有平台没有；ONLY_IN_PLATFORM 平台记为成功微信没有；AMOUNT_MISMATCH 金额不一致；STATUS_MISMATCH 状态不一致
          enum: [ONLY_IN_CHANNEL, ONLY_IN_PLATFORM, AMOUNT_MISMATCH, STATUS_MISMATCH]
        subMchid:
          type: string
        outTradeNo:
          type: [string, "null"]
        outRefundNo:
          type: [string, "null"]
        platformAmountMinor:
          type: [integer, "null"]
          format: int64
        channelAmountMinor:
          type: [integer, "null"]
          format: int64
