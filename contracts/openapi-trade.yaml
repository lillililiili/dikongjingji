              schema:
                $ref: "#/components/schemas/TradeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
  /api/v1/trade/channels/wechat/notifications:
    post:
      operationId: receiveWechatNotification
      summary: 微信支付的支付和退款回调（公开，验签）
      description: |-
        不要登录；用请求头 Wechatpay-Serial / Wechatpay-Signature / Wechatpay-Timestamp / Wechatpay-Nonce 和原始请求体验签，
        再用 APIv3 密钥（AEAD_AES_256_GCM）解密 resource。只处理 TRANSACTION.SUCCESS、REFUND.SUCCESS、REFUND.ABNORMAL、REFUND.CLOSED。
        核对服务商号、子商户号、商户单号和金额后才推进订单；同一通知重复到达只处理一次，仍然返回 204。
        验签失败（包括缺少任何一个 Wechatpay-* 头）返回 401，处理失败返回 500，微信会按 15s、15s、30s、3m … 6h 的间隔重发，最多 15 次。
        金额或商户对不上的付款通知也回 204（重发没有用），支付单记为 MISMATCH 等人工处理。请求体超过 64KB 返回 413。
      security: []
      parameters:
        - name: Wechatpay-Serial
          in: header
          required: true
          schema:
            type: string
        - name: Wechatpay-Signature
          in: header
          required: true
          schema:
            type: string
        - name: Wechatpay-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: Wechatpay-Nonce
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatNotification"
      responses:
        "204":
          description: 收到并已处理（含重复的通知）
        "401":
          description: 验签失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatFailure"
        "413":
          description: 请求体超过 64KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatFailure"
        "500":
          description: 处理失败，等微信重发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatFailure"
