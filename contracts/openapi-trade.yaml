  /api/v1/trade/orders/{orderId}/payments:
    post:
      operationId: launchPayment
      summary: 发起微信支付，返回 App 调起支付要的参数
      description: |-
        订单必须是 PENDING_PAYMENT 且没过付款截止时间（否则 409 TRADE_ORDER_EXPIRED）。已有进行中的支付单时沿用它，
        每次都重新签一组调起参数；上次没拿到预支付的，用同一个商户单号、同样的内容再向微信下一次单。
        预支付 ID 有效 2 小时，比 30 分钟的付款期长，所以付款期内不会过期（万一过期回 409 TRADE_ORDER_EXPIRED）。
        App 每次点“去支付”用一个新的 Idempotency-Key；一个键对应的支付单已经关闭时再用它回 409 TRADE_ORDER_STATE_INVALID。
        微信那边失败或结果不确定时回 503，支付单保留，稍后重试。服务端用服务商 API 证书私钥给调起参数签名。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchPaymentRequest"
      responses:
        "200":
          description: 调起参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLaunch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ChannelUnavailable"
  /api/v1/trade/orders/{orderId}/payment-check:
    post:
      operationId: checkPayment
      summary: App 从微信回来后，让服务端向微信查一次单
      description: 只读渠道结果并按结果推进订单，不信任 App 传来的任何支付状态。没有进行中的支付单时直接返回订单。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: 查单后的订单
          headers:
            ETag:
              $ref: "#/components/headers/OrderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ChannelUnavailable"
  /api/v1/trade/orders/{orderId}/cancel:
    post:
      operationId: cancelMyOrder
      summary: 买家取消：未付款直接关闭；已付款未发货（未自提）全额退款
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      description: |-
        不带请求体。待付款的直接关闭；发起过支付的先向微信查单：已经付了回 409 TRADE_ORDER_STATE_INVALID（刷新后是已付款，
        再取消就是退款）；微信不通时回 503。已付款、未发货（未自提）的把还没退的钱全退，订单进入 REFUNDING，结果以微信为准。
        业务来源（0.2.0 起，收费报名）的订单：待付款的同样关闭，关闭后业务那边释放名额；已付款的回 409 TRADE_ORDER_STATE_INVALID，
        退款由业务单的退改发起。
        重复调用靠状态和幂等键保证：已关闭、退款中、已退款的订单再取消原样返回；同一个 Idempotency-Key 只建一笔退款。
      responses:
        "200":
          description: CLOSED，或 REFUNDING
          headers:
            ETag:
              $ref: "#/components/headers/OrderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "503":
          $ref: "#/components/responses/ChannelUnavailable"
  /api/v1/trade/orders/{orderId}/receipt:
    post:
      operationId: confirmReceipt
      summary: 买家确认收货（SHIPPED → COMPLETED）
      description: 已完成的再确认一次原样返回。发货满 10 天还没确认的由服务端自动确认。Idempotency-Key 只做格式校验。
      security:
