openapi: 3.1.0
info:
  title: Trade API
  version: 0.11.0
  description: |-
    0.11.0：标价实物购买按商家供给预占可售数。立即购买、购物车提交订单在同一事务检查报价和数量，
    有一行数量不足则整单返回 409 MALL_CHECKOUT_ITEM_UNAVAILABLE，购物车保留。
    付款到账将预占记为成交，未付款取消和超时关闭释放原预占。回执重放只处理一次，已释放的订单迟到付款自动全额原路退回。
    询价下单、不限库存的供给、迁移前订单都沿用原办理规则。已付款后的退款由原有售后处理，可售数由商家盘点维护。
    0.1.0（草案，2026-11-18，E01，待用户确认）：统一交易模块。一期只接商城订单；收费报名、到馆预约、巡检付款节点以后按
    source 扩展。方案见 docs/redesign/03-App实现任务计划.md §19。

    已实现（E02，2026-11-18）：submitOrder、listMyOrders、readMyOrder、cancelMyOrder（只限未付款；已付款取消在 E05）、
    registerMerchantAccount，以及服务端每分钟关闭超时未付款订单。其余操作（支付、回调、商家、对账）在 E03–E06 实现，
    未实现前路由不存在。提交时的拒绝顺序：商家没有可用收款账户 → 配送方式不可用 → 快递缺地址 → 应付金额变化。
    E03（2026-11-18）只做了服务端的微信渠道适配（签名、验签、解密、下单、查单、关单、退款），没有新增或改动接口。
    E04（2026-11-18）实现 launchPayment、checkPayment、receiveWechatNotification；cancelMyOrder 遇到发起过支付的单先向微信查单
    （付了就按付款处理、拒绝取消；没付就先在微信关单再关订单）。服务端每分钟对发起支付 1 分钟后仍没有结果的单查单，
    对过了付款截止时间、还有进行中支付单的订单先查单再关。退款回调在 E05 处理，之前只记录。
    E05（2026-11-18）实现 confirmReceipt、listMerchantOrders、shipOrder、completePickup、refundOrder；cancelMyOrder 对已付款、
    未发货（未自提）的订单全额退款；退款回调和查询推进退款单和订单；发货满 10 天自动确认收货。自提订单付款后生成 6 位取货码。
    E06（2026-11-18）实现 exportReconciliation 和 runReconciliation：服务端北京时间每小时 5 分和 35 分补导入：10 点前只补前天，10 点后补前天和昨天，
    按子商户下载交易账单，逐笔核对后记下差异。
    E08（2026-11-18）复查修正：TradeOrder 加必填字段 closeReason（已关闭时是买家取消还是超时关闭）；商家接口的
    delivery.recipientPhone、addressLine 只在订单付款之后给，待付款、已关闭时为 null；提交订单时单价或商品金额为 0 的报价按 400 拒绝；
    checkPayment 同一张订单 2 秒内只真正向微信查一次，其余直接返回订单。
    0.2.0（2026-11-19，E09，docs/redesign/03-App实现任务计划.md §20）：接入第一个业务来源——收费活动报名（source = ACTIVITY，
    报名接口见 contracts/openapi-activity.yaml 1.2.0）。没有新接口：报名接口在服务端建交易订单，App 用这里的收银台接口
    （launchPayment、checkPayment、readMyOrder）付款。变化：
    - TradeOrder 加 sourceRef（业务单 ID，收费报名时是报名单 ID；商城订单为 null）；TradeOrderSource 加 ACTIVITY。
    - 业务来源的订单不发货：delivery 为 null；merchant.kind（商城的商家类型）为 null；收款方是活动的主办机构，
      钱同样直接进它自己的子商户号。订单行记的是业务项目：productId 是活动 ID，offerId 是场次 ID，productName 是活动名，
      skuName 是场次（如“11月28日 09:00 上午场”），quantity 是报名人数。订单编号以 AO 开头（商城是 MO）。
    - 付款截止时间由业务决定（收费报名 15 分钟，且不晚于报名截止），不是商城的 30 分钟。
    - listMyOrders（“商品订单”）只列商城订单；收费报名的订单在“我的报名”里看。readMyOrder 和收银台照常可用。
    - cancelMyOrder：待付款的收费报名订单照常关闭（关闭后报名名额释放）；已付款的回 409 TRADE_ORDER_STATE_INVALID，
      退款只能由报名单的退改发起（按凭证原路退款，退款记录照常出现在 refunds 里）。cancellable 对已付款的收费报名订单为 false。
    - 商家接口（listMerchantOrders、shipOrder、completePickup、refundOrder）只看、只改商城订单，收费报名的订单当作不存在（404）。
    - 关闭之后才到账的付款：业务这边能恢复就恢复；不能时整笔自动原路退款（订单进入 REFUNDING，退款原因“订单已关闭，付款自动原路退回”）。
    - E10（2026-11-19，§21，同在 0.2.0 未发布版本内）：第二个业务来源——到馆预约（source = VENUE，接口见
      contracts/openapi-experience.yaml 1.1.0）。规则和收费报名一样：收款方是场馆运营机构，不发货，订单编号以 VO 开头；
      订单行的 productId 是项目 ID，offerId 是场次 ID，productName 是“场馆名 项目名”，skuName 是场次时间，quantity 是人数；
      付款截止 15 分钟且不晚于场次开始；不在“商品订单”里，商家接口当作不存在；已付款的只能由预约的取消整单退款。
    - F3（2026-11-19，§24，同在 0.2.0 未发布版本内）：第三个业务来源——设备租赁（source = RENTAL，接口见
      contracts/openapi-rental.yaml 1.0.0）。收款方是出租的商家，不发货，订单编号以 RO 开头；订单行的 productId 是商品 ID，
      offerId 是租赁供给 ID（其他费用行是报价费用行的 ID），productName 是商品名，skuName 是租期，quantity 是台数；
      付款截止 30 分钟。不在“商品订单”里，商家接口当作不存在。已付款的不能由买家取消；交接之前出租方可以取消，整单原路退款。
      关闭之后才到账的付款一律自动整笔退款（关闭后报价和档期已经释放，不恢复）。

    0.3.0（2026-11-19，F4，§25）：submitOrder 加第三种来源 inquiryQuoteId——按选定的询价报价下单（报价见 contracts/openapi-mall-inquiry.yaml）。
      下的仍是普通商城订单（source = MALL，订单编号 MO 开头），商品订单、发货、退款、对账都不变；单价和数量按报价，不能改，
      和 cartItemIds、offerId 三选一（quantity 不用）。一份报价同时只能有一张没关闭的订单：上一张还没关闭（待付款、已付款、
      已发货、退款中……）时 409 TRADE_INQUIRY_QUOTE_ORDERED；上一张没付款就关闭了、报价还在有效期内时可以再下。
      报价不是询价单选定的那一份时 409 MALL_INQUIRY_QUOTE_NOT_CHOSEN，过了有效期时 409 MALL_INQUIRY_QUOTE_EXPIRED。

    0.4.0（2026-11-22，S2-1，docs/redesign/08-后续开发计划.md）：加 checkPaymentChannel——平台运营的支付通道自检，
      给真实微信联调前后用（清单见 docs/ops/微信支付联调清单.md）。先逐项检查服务器上的微信支付配置
      （缺哪项、私钥和微信支付公钥能否解析、两者是不是放反了、商户号和公钥 ID 的格式、回调地址是不是外网 https），
      再按一个不存在的商户订单号查一次单、按一个不存在的退款单号查一次退款：微信验过签地回答“没有这一单”就说明
      签名、网络和验签都对。只读：不下单、不关单、不退款、不写数据库。其他操作不变。

    0.5.0（2026-11-23，S3-2，docs/redesign/08-后续开发计划.md §5“工作台”）：商家工作台（Web 运营端 apps/admin）要用的读取，不改写操作：
      listMerchantOrders 加可选查询参数 deliveryMode（EXPRESS / PICKUP），工作台的“待发货”是 status=PAID&deliveryMode=EXPRESS，
      “待自提”是 status=PAID&deliveryMode=PICKUP；加 readMerchantOrder（本机构卖出的一张商城订单，和列表里的一项相同，带 ETag）；
      加 readMyMerchantAccount（本机构登记的收款账户，只读，没登记过 404；登记仍由平台运营调 registerMerchantAccount）。

    0.6.0（2026-11-23，S4-1，docs/redesign/08-后续开发计划.md §5 D9、C3）：第五个业务来源——巡检付款节点（source = INSPECTION，
      接口见 contracts/openapi-inspection-service-flow.yaml 2.5.0）。没有新接口：巡检接口在服务端建交易订单，App 用这里的收银台接口付款。
      收款方是巡检服务商，钱进它自己的子商户号；不发货，订单编号以 IO 开头。每个付款节点（首付、每次巡检的服务费）的每一次付款
      尝试是一张订单：sourceRef 是付款尝试 ID；订单行只有一行，productId 是巡检服务单 ID，offerId 是付款尝试 ID，
      productName 是“服务名 · 方案 vN”，skuName 是节点名（如“首付 30%”“第 2/6 次服务费”“验收后付款 70%”），quantity 是 1。
      付款截止 15 分钟；超时或取消只关这一张订单，节点仍待付，可以再发起。不在“商品订单”里，商家接口当作不存在。
      已付款的不能由买家取消：首付只在服务单取消（第 1 次巡检开始前）时由巡检模块整笔原路退款；按次服务费不在线退。
      关闭之后才到账的付款：节点还没付、服务单没取消时照常记为已付；否则整笔自动原路退款。
    0.9.0（2026-11-23，S5-5，docs/redesign/09-课程实现说明.md）：第六个业务来源——线上录播课（source = COURSE，课程接口见
      contracts/openapi-course.yaml 1.0.0）。收款方是开课机构，钱同样直接进它自己的子商户号；不发货，订单编号以 CO 开头；
      订单行的 productId 是课程 ID，offerId 也是课程 ID（一门课只有“单人账号”一种），productName 是课程名，skuName 是“单人账号”，
      quantity 是 1；付款时限 15 分钟。不在“商品订单”里，商家接口当作不存在。已付款的不能由买家取消，退款只能由课程的退款发起
      （付款后 7 天内、没开始学非试听课时，整单原路退款）。关闭之后才到账的：这门课没有别的开通时恢复，否则整笔自动原路退回。
      另外，商城订单完成（确认收货、自动确认收货、自提核销）时，交易模块在同一个事务里把订单的商品行告诉课程模块，
      附带数字课程的商品随即给买家开通课程（没有新接口，只是服务端之间的端口）。其他操作不变。

    0.7.0（2026-11-23，S4-2、S4-4，docs/redesign/08-后续开发计划.md §5 A1、S4-4）：TradeOrder 加四个只读字段，不改写操作：
      parties（下单时的交易主体快照：发货仓 fulfilledFrom、开票方 invoiceIssuer、售后责任方 aftersaleParty，由商城按
      供给 → 商家资料 → 商家名称给出；几行不同时用“；”连接；业务来源的订单都为 null）；channelTransactionId（付款成功的
      支付单在微信的交易号，只在验签后的回调或查单记下之后才有，只用来显示）；participantNames（收费报名订单的参与人姓名，
      按报名顺序用顿号连接，只用来显示，报名单仍是事实源；别的订单为 null）；aftersale（最近一张售后单和现在能不能申请售后）。
      商品售后的接口在 contracts/openapi-trade-aftersale.yaml 1.0.0：售后退款同样经本模块原路退回，退款记录照常出现在
      refunds 里（仅退款的 reason 以“买家申请仅退款”开头，退货退款以“售后退货退款”开头，超时自动退款以“售后超时自动退款”开头）。

    0.8.0（2026-11-23，S4-3，docs/redesign/08-后续开发计划.md §5“S4-3”）：业务来源加 PRO_SERVICE——通用服务订单
      （航拍、测绘、设备维护、技术支持选定报价后的服务订单，接口见 contracts/openapi-service-order.yaml 1.0.0）。没有新接口：
      服务订单接口在服务端建交易订单，App 用这里的收银台接口付款。收款方是服务商，钱进它自己的子商户号；不发货，订单编号以 PS 开头。
      确认方案后一次付清：每一次付款尝试是一张订单，sourceRef 是付款尝试 ID；订单行只有一行，productId 是服务订单 ID，
      offerId 是付款尝试 ID，productName 是“需求标题 · 服务商名”，skuName 是“方案 vN”，quantity 是 1。
      付款截止 15 分钟；超时或取消只关这一张订单，服务订单仍待付款，可以再发起。不在“商品订单”里，商家接口当作不存在。
      已付款的不能由买家取消：开工之前取消时由服务订单整笔原路退款，开工之后协商终止时由服务商退款（可部分）。
      关闭之后才到账的付款：服务订单还在待付款时照常记为已付；已经取消或已经付过时整笔自动原路退款。
    0.10.0（2026-11-23，S5-7、S5-8，docs/redesign/08-后续开发计划.md §5“企业组织”“账号”）：
      - TradeOrder 加必有字段 payer（付款主体）：下单时买家的当前身份（contracts/openapi-identity-account.yaml 的 switchIdentity），
        PERSONAL 个人（name 为 null）或 ENTERPRISE 企业（企业名称快照）。各来源（商城、报名、到馆、租赁、巡检、通用服务订单、课程）都记，之前的订单是 PERSONAL。
        只记主体，不做企业结算：付款人仍是买家账号本人，钱仍进商家自己的子商户号。
      - 加 listEnterpriseOrders：本人所在企业以企业身份付款的订单（企业成员可看，带经办人显示名），企业组织页用。
      - 注销冷静期内的账号不能提交订单、不能被业务模块建订单、不能发起支付：TRADE_ACCOUNT_CLOSING（409）。

    渠道与资金（用户 2026-11-18 确认）：
    - 唯一的支付渠道是微信支付，产品是“平台收付通”的普通支付：每笔钱直接进卖出商品的商家（二级商户）自己的商户号，
      平台不经手资金。下单不带分账标记，不冻结、不分账、不抽佣。
    - 商家必须先登记好收款账户（微信子商户号）才能下单；没登记的商家提交订单时拒绝（TRADE_MERCHANT_PAYMENT_UNAVAILABLE）。
    - 订单状态只由服务端根据渠道结果改：付款只认验签通过的支付回调，或服务端主动向微信查单的结果。App 说“付好了”只会触发一次查单。
    - 一张订单同时只有一张进行中的支付单（out_trade_no，≤32 位）：重复发起沿用它；它被关掉之后再发起才用新单号。
      关单前一定先查单，付了的不会被关。金额、商户核对不上的支付不改订单，记为 MISMATCH 并告警，人工处理。

    订单规则（用户 2026-11-18 按 §19.7 建议值确认）：
    - 提交订单的内容和确认订单预览（contracts/openapi-mall-cart.yaml 的 checkout-preview）相同：同一个商家、来自购物车几行或立即购买的一个供给、
      配送方式、快递时的收货地址。服务端重新算金额；和页面上看到的 expectedPayableMinor 不一致时拒绝（TRADE_AMOUNT_CHANGED），页面重新预览。
    - 提交时把商品、单价、地址做成快照，之后改价、删地址都不影响这张单。来自购物车的行在提交成功后从购物车删掉。
    - 未付款的订单 30 分钟后关闭（同时关掉微信那边的预支付单）。
    - 已付款、未发货（或未自提）时，买家可以自己取消，全额原路退款。
    - 发货后 10 天未确认收货的自动确认；自提订单由商家核销取货码后完成。
    - 发货后的退款由商家通过受权接口发起，可以部分退款，同一订单最多 50 次，合计不超过实付；买家的售后申请（0.7.0，A1）
      见 contracts/openapi-trade-aftersale.yaml，商家同意并确认收货后同样经本模块原路退回。

    角色：买家接口要 CUSTOMER；商家接口要 PROVIDER_OPERATOR，且只能操作本机构卖出的订单；平台接口要 PLATFORM_OPERATOR。
    账号、机构都只从令牌里取。不是自己的订单一律当作不存在。
    写操作都带 Idempotency-Key；改订单状态的操作带 If-Match（订单版本），版本不对返回 412。
    金额都是最小货币单位（分）。Bodies are returned bare, errors use the shared ApiError, like the other contracts.
servers:
  - url: /
paths:
  /api/v1/trade/orders:
    post:
      operationId: submitOrder
      summary: 提交订单（确认订单页的“提交订单”）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrderRequest"
      responses:
        "201":
          description: 新建的订单，状态 PENDING_PAYMENT
          headers:
            ETag:
              $ref: "#/components/headers/OrderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeOrder"
        "200":
          description: 同一个幂等键重放，返回第一次建的订单
          headers:
            ETag:
              $ref: "#/components/headers/OrderETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listMyOrders
      summary: 我的订单（商品）
      description: 只列商城订单（0.2.0 起）：收费报名等业务来源的订单不在这里。
      security:
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          required: false
          description: 不传为 ALL
          schema:
            $ref: "#/components/schemas/TradeOrderTab"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 按下单时间从新到旧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeOrderPage"
        "400":
