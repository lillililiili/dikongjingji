      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: 已提交微信，结果以退款回调或查询为准
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeRefund"
