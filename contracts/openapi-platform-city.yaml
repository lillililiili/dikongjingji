openapi: 3.1.0
info:
  title: Platform City API
  version: 1.1.0
  description: |-
    1.1.0（S3-1）：城市带开通状态 serviceStatus（OPEN 已开通 / PREPARING 筹备中 / CLOSED 未开通，由运营端维护，
    见 openapi-ops-city.yaml），目录另给 openCities、preparingCities 两组（按城市拼音），App 城市面板照原型 CitySheet
    只显示这两组；hotCities、provinces 仍是全部可选城市，搜索用。
servers:
  - url: /
paths:
  /api/v1/platform/cities:
    get:
      operationId: getPlatformCityDirectory
      summary: Get the nationwide platform city directory
      security: []
      responses:
        '200':
          description: Nationwide city directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDirectory'
  /api/v1/platform/cities/{cityCode}/search-selections:
    post:
      operationId: recordPlatformCitySearchSelection
      summary: Record an active city selected from search
      security: []
      parameters:
        - name: cityCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
      responses:
        '204':
          description: Search selection recorded
        '400':
          description: City code is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: City not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Anonymous client exceeded the fixed-window selection limit
          headers:
            Retry-After:
              description: Whole seconds until the client can retry
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Selection counting is unavailable because rate limiting cannot be enforced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          enum:
            - COMMON_NOT_FOUND
            - COMMON_INVALID_ARGUMENT
            - COMMON_RATE_LIMITED
            - COMMON_SERVICE_UNAVAILABLE
        message:
          type: string
        traceId:
          type: string
        details:
          type:
            - object
            - 'null'
          additionalProperties: true
    CityDirectory:
      type: object
      additionalProperties: false
      required:
        - hotCities
        - provinces
        - openCities
        - preparingCities
      properties:
        hotCities:
          type: array
          description: 按有记录的搜索选择次数降序取前六名；无记录时为空数组。演示库可显式启用示例热度。
          items:
            $ref: '#/components/schemas/City'
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        openCities:
          type: array
          description: 已开通的城市，按城市拼音排
          items:
            $ref: '#/components/schemas/City'
        preparingCities:
          type: array
          description: 筹备中的城市，按城市拼音排
          items:
            $ref: '#/components/schemas/City'
    Province:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - pinyin
        - initials
        - cities
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
        pinyin:
          type: string
        initials:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
    City:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - pinyin
        - initials
        - provinceCode
        - provinceName
        - serviceStatus
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
        pinyin:
          type: string
        initials:
          type: string
        provinceCode:
          type: string
          pattern: '^[0-9]{6}$'
        provinceName:
          type: string
        serviceStatus:
          type: string
          description: OPEN 已开通；PREPARING 筹备中；CLOSED 未开通
          enum:
            - OPEN
            - PREPARING
            - CLOSED
