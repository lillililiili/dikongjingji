openapi: 3.1.0
info:
  title: Platform City API
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/platform/cities:
    get:
      operationId: getPlatformCityDirectory
      summary: Get the nationwide platform city directory
      security: []
      responses:
        '200':
          description: Nationwide city directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDirectory'
  /api/v1/platform/cities/{cityCode}/search-selections:
    post:
      operationId: recordPlatformCitySearchSelection
      summary: Record an active city selected from search
      security: []
      parameters:
        - name: cityCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
      responses:
        '204':
          description: Search selection recorded
        '400':
          description: City code is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: City not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Anonymous client exceeded the fixed-window selection limit
          headers:
            Retry-After:
              description: Whole seconds until the client can retry
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Selection counting is unavailable because rate limiting cannot be enforced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          enum:
            - COMMON_NOT_FOUND
            - COMMON_INVALID_ARGUMENT
            - COMMON_RATE_LIMITED
            - COMMON_SERVICE_UNAVAILABLE
        message:
          type: string
        traceId:
          type: string
        details:
          type:
            - object
            - 'null'
          additionalProperties: true
    CityDirectory:
      type: object
      additionalProperties: false
      required:
        - hotCities
        - provinces
      properties:
        hotCities:
          type: array
          items:
            $ref: '#/components/schemas/City'
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/Province'
    Province:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - pinyin
        - initials
        - cities
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
        pinyin:
          type: string
        initials:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
    City:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - pinyin
        - initials
        - provinceCode
        - provinceName
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
        pinyin:
          type: string
        initials:
          type: string
        provinceCode:
          type: string
          pattern: '^[0-9]{6}$'
        provinceName:
          type: string
