openapi: 3.1.0
info:
  title: Notification API
  version: 1.5.0
  description: >-
    The signed-in account's in-app notifications (docs/redesign/03-App实现任务计划.md §15.4).
    Every route needs a login. The recipient is always the subject of the access token: there is
    no parameter that names another account, and a notification of another account is answered
    as not found. 1.0.0 carries inspection service progress; 1.1.0 (2026-11-19, §22, step F1) adds the
    category DEMAND_QUOTE (需求与报价: a provider quoted on one of the account's demands, or a demand closed
    without any quote) with the target type DEMAND (id is the demand; the page reads its quotes itself).
    Notification text never carries a provider's quote content. 1.2.0 (2026-11-19, §26, step G1) adds the
    category CUSTOMER_SERVICE (客服消息: a merchant, a provider or the platform support replied in one of the
    account's conversations, contracts/openapi-support.yaml) with the target type CONVERSATION (id is the
    conversation; the page reads its messages itself). A conversation has at most one unread CUSTOMER_SERVICE
    notification: further replies refresh its time instead of adding more, and opening the conversation
    (POST /api/v1/conversations/{id}/read) marks it read. The text never copies the message.
    1.3.0 (2026-11-20, docs/redesign/06-原型对齐修正计划.md R6-5) adds two categories. TRADE_LOGISTICS (交易物流):
    a mall goods order was shipped (TRADE_ORDER_SHIPPED), a pickup order was paid and can be collected
    (TRADE_ORDER_READY_FOR_PICKUP), a refund came back to the payer (TRADE_REFUND_SUCCEEDED); the target is
    TRADE_ORDER. ACTIVITY_REMINDER (活动提醒): a sign-up succeeded (ACTIVITY_ENROLLED: a free one on submit, a paid
    one once paid; target ACTIVITY_ENROLLMENT), a paid sign-up's refund came back (ACTIVITY_REFUNDED; target
    ACTIVITY_ORDER), a venue booking succeeded (VENUE_BOOKED; target VENUE_BOOKING), a venue booking moved to
    another session (VENUE_RESCHEDULED; target VENUE_BOOKING). Each is written after the business transaction
    commits, once per event (rental orders send none). The text carries only product, merchant, activity, venue
    and project names, people counts, session times and refund amounts: never an address, a phone number, a
    pickup or check-in code, or a participant's name. 1.4.0 (2026-11-20, docs/redesign/07-视频与直播实现计划.md §3,
    module M20 live, contracts/openapi-live.yaml) adds the category LIVE_REMINDER (直播提醒): a live room the account
    set a reminder on has started (LIVE_STARTED); the target is LIVE_ROOM (id is the live room; the page reads it
    itself). It is written after the go-live transaction commits, at most once per room and account; the text carries
    only the room title and the host organisation's name. 1.5.0 (2026-11-22, docs/redesign/08-后续开发计划.md S5-9) adds the
    category SYSTEM_NOTICE (系统通知: an announcement the platform operators published to everyone or to one city, event
    code SYSTEM_NOTICE_PUBLISHED) with the target SYSTEM_NOTICE (id is the announcement; GET /api/v1/system-notices/{id}
    reads its paragraphs, facts, items and action). An announcement is stored once; listing or counting the inbox with
    systemNotices=true first copies every published, unexpired announcement for everyone (and, when the optional
    cityCode is given, for that city) into the account's inbox, once per announcement and account, dated at its
    publication; a build that does not show 系统通知 leaves systemNotices out and gets none. A withdrawn
    announcement is no longer copied and leaves the inboxes it reached. 1.5.0 also adds the account's notification
    switches (GET/PUT /api/v1/notifications/preferences, all on until changed) and the device push ids the App
    reports (PUT /api/v1/notifications/push-devices, POST .../unregister). Switches only govern pushes: every
    notification is still written to the inbox. orderServicePush covers SERVICE_PROGRESS, DEMAND_QUOTE,
    CUSTOMER_SERVICE and TRADE_LOGISTICS; activityPush covers ACTIVITY_REMINDER and LIVE_REMINDER; SYSTEM_NOTICE is
    always pushed; discoverDot only tells the App whether to show the Discover tab's dot. The push vendor is not chosen:
    pushes go through a server-side port, a local fake in development and nothing elsewhere, so the push id is any
    opaque string. Platform operators publish, list and withdraw announcements under /api/v1/ops/notifications/...
    (role PLATFORM_OPERATOR). Clients should show a category or a target type they do
    not know as a plain row that opens nothing, since later versions may add more.
    Bodies are returned bare, errors use the shared ApiError, like the other contracts.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/notifications:
    get:
      operationId: listMyNotifications
      summary: One page of the account's notifications, newest first
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: systemNotices
          in: query
          required: false
          description: >-
            1.5.0: true when the App shows 系统通知; announcements are then copied into the inbox first. Builds
            without 系统通知 leave it out and neither see nor count them.
          schema:
            type: boolean
            default: false
        - name: cityCode
          in: query
          required: false
          description: The App's current city (1.5.0); with systemNotices, announcements for this city are copied too
          schema:
            type: string
            pattern: "^[A-Z0-9]{4,16}$"
      responses:
        "200":
          description: The page, with the account's unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/unread-count:
    get:
      operationId: countMyUnreadNotifications
      summary: How many of the account's notifications are unread
      parameters:
        - name: systemNotices
          in: query
          required: false
          description: >-
            1.5.0: true when the App shows 系统通知; announcements are then copied into the inbox first. Builds
            without 系统通知 leave it out and neither see nor count them.
          schema:
            type: boolean
            default: false
        - name: cityCode
          in: query
          required: false
          description: The App's current city (1.5.0); with systemNotices, announcements for this city are copied too
          schema:
            type: string
            pattern: "^[A-Z0-9]{4,16}$"
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllMyNotificationsRead
      summary: Mark every unread notification of the account as read
      responses:
        "200":
          description: How many were marked; 0 when there was nothing unread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkedRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markMyNotificationRead
      summary: Mark one notification as read; repeating it changes nothing
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Read
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such notification for this account
          content:
            application/json:
              schema:
                $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
  /api/v1/notifications/preferences:
    get:
      operationId: readMyNotificationPreferences
      summary: The account's notification switches (1.5.0); all on until changed
      responses:
        "200":
          description: The switches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMyNotificationPreferences
      summary: Change some of the account's notification switches (1.5.0)
      description: >-
        Only the switches present are changed; a body with none of them is a bad request. PUT rather than PATCH
        because uni.request and mini programs have no PATCH. Switches only govern pushes, the inbox keeps every
        notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesPatch"
      responses:
        "200":
          description: The switches after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/push-devices:
    put:
      operationId: registerMyPushDevice
      summary: Report this device's push id after launch or sign-in (1.5.0)
      description: >-
        The same device (platform and push id) is one row: signing in with another account moves it to that account,
        and reporting again refreshes its time and city. The push vendor is not chosen, so any opaque id is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/push-devices/unregister:
    post:
      operationId: unregisterMyPushDevice
      summary: Stop pushing this account's notifications to this device, before signing out (1.5.0)
      description: Only a device of this account is revoked; another account's device or one already revoked is left as is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceRequest"
      responses:
        "204":
          description: Revoked, or nothing to revoke
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/system-notices/{noticeId}:
    get:
      operationId: readSystemNotice
      summary: One published announcement (1.5.0); public
      security: []
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such announcement, or it was withdrawn
          content:
            application/json:
              schema:
                $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
  /api/v1/system-notices/agreement-updates:
    get:
      operationId: readLatestAgreementUpdate
      summary: The latest announcement about an agreement, for 协议与规则's 有更新 (1.5.0); public
      security: []
      parameters:
        - name: agreement
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AgreementCode"
      responses:
        "200":
          description: The latest published, unexpired announcement for everyone about it, or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [latest]
                properties:
                  latest:
                    oneOf:
                      - $ref: "#/components/schemas/AgreementUpdate"
                      - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/ops/notifications/system-notices:
    post:
      operationId: publishSystemNotice
      summary: Publish an announcement (1.5.0); platform operators only
      description: >-
        The same Idempotency-Key returns the announcement it first published and pushes nothing again. After the
        transaction commits, the announcement is pushed to the devices in its audience (for a city, the devices whose
        last report was in that city); inboxes receive it when they are next read.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemNoticeDraft"
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listSystemNotices
      summary: Every announcement, newest first, withdrawn ones included (1.5.0); platform operators only
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemNoticePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/ops/notifications/system-notices/{noticeId}/withdraw:
    post:
      operationId: withdrawSystemNotice
      summary: Withdraw an announcement; repeating it changes nothing (1.5.0); platform operators only
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such announcement
          content:
            application/json:
              schema:
                $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: A parameter is missing or malformed
      content:
        application/json:
          schema:
            $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
    Unauthorized:
      description: Not signed in, or the login has expired
      content:
        application/json:
          schema:
            $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
    Forbidden:
      description: The account is not a platform operator
      content:
        application/json:
          schema:
            $ref: "./openapi-mall-catalog.yaml#/components/schemas/ApiError"
  schemas:
    NotificationCategory:
      type: string
      enum: [SERVICE_PROGRESS, DEMAND_QUOTE, CUSTOMER_SERVICE, TRADE_LOGISTICS, ACTIVITY_REMINDER, LIVE_REMINDER,
             SYSTEM_NOTICE]
      description: 服务进度 / 需求与报价（1.1.0）/ 客服消息（1.2.0）/ 交易物流、活动提醒（1.3.0）/ 直播提醒（1.4.0）/ 系统通知（1.5.0）
    NotificationTargetType:
      type: string
      enum: [INSPECTION_PLAN, INSPECTION_FULFILLMENT, INSPECTION_DELIVERY, DEMAND, CONVERSATION, TRADE_ORDER,
             ACTIVITY_ENROLLMENT, ACTIVITY_ORDER, VENUE_BOOKING, LIVE_ROOM, SYSTEM_NOTICE]
      description: >-
        Where tapping the notification leads. INSPECTION_PLAN: id is the plan. INSPECTION_FULFILLMENT
        and INSPECTION_DELIVERY: id is the service order, subId the visit when the notification is
        about one visit. DEMAND (1.1.0): id is the demand, subId is null. CONVERSATION (1.2.0): id is the
        support conversation, subId is null. 1.3.0, subId always null: TRADE_ORDER, id is the goods order
        (contracts/openapi-trade.yaml); ACTIVITY_ENROLLMENT, id is the enrollment and the page shows its tickets;
        ACTIVITY_ORDER, id is the enrollment and the page shows its payment and refunds; VENUE_BOOKING, id is the
        venue booking. 1.4.0: LIVE_ROOM, id is the live room, subId is null. 1.5.0: SYSTEM_NOTICE, id is the
        announcement (GET /api/v1/system-notices/{id}), subId is null.
    NotificationTarget:
      type: object
      additionalProperties: false
      required: [type, id, subId]
      properties:
        type:
          $ref: "#/components/schemas/NotificationTargetType"
        id:
          type: string
          format: uuid
        subId:
          type: [string, "null"]
          format: uuid
    Notification:
      type: object
      additionalProperties: false
      required: [id, category, eventCode, title, body, target, occurredAt, read]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/NotificationCategory"
        eventCode:
          type: string
          description: >-
            Stable code of what happened, for example INSPECTION_DELIVERY_PUBLISHED; for DEMAND_QUOTE it is
            DEMAND_QUOTE_RECEIVED or DEMAND_CLOSED_NO_QUOTES; for CUSTOMER_SERVICE it is SUPPORT_REPLIED; for
            TRADE_LOGISTICS it is TRADE_ORDER_SHIPPED, TRADE_ORDER_READY_FOR_PICKUP or TRADE_REFUND_SUCCEEDED; for
            ACTIVITY_REMINDER it is ACTIVITY_ENROLLED, ACTIVITY_REFUNDED, VENUE_BOOKED or VENUE_RESCHEDULED; for
            LIVE_REMINDER it is LIVE_STARTED; for SYSTEM_NOTICE it is SYSTEM_NOTICE_PUBLISHED
        title:
          type: string
          maxLength: 80
        body:
          type: string
          maxLength: 300
        target:
          $ref: "#/components/schemas/NotificationTarget"
        occurredAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationPage:
      type: object
      additionalProperties: false
      required: [page, size, total, hasMore, unreadCount, items]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    UnreadCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    MarkedRead:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [orderServicePush, activityPush, discoverDot]
      description: >-
        Switches only govern pushes; the inbox keeps every notification. orderServicePush: SERVICE_PROGRESS,
        DEMAND_QUOTE, CUSTOMER_SERVICE, TRADE_LOGISTICS. activityPush: ACTIVITY_REMINDER, LIVE_REMINDER. SYSTEM_NOTICE has
        no switch and is always pushed. discoverDot: whether the App shows the Discover tab's update dot.
      properties:
        orderServicePush:
          type: boolean
        activityPush:
          type: boolean
        discoverDot:
          type: boolean
    NotificationPreferencesPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        orderServicePush:
          type: boolean
        activityPush:
          type: boolean
        discoverDot:
          type: boolean
    PushPlatform:
      type: string
      enum: [ANDROID, IOS]
    PushDeviceRequest:
      type: object
      additionalProperties: false
      required: [platform, pushClientId]
      properties:
        platform:
          $ref: "#/components/schemas/PushPlatform"
        pushClientId:
          type: string
          description: The id the push service gave this device (uni.getPushClientId and the like); printable ASCII
          pattern: "^[\\x21-\\x7E]{1,200}$"
        cityCode:
          type: [string, "null"]
          description: The App's current city; only used to pick devices for a city's announcements
          pattern: "^[A-Z0-9]{4,16}$"
    PushDevice:
      type: object
      additionalProperties: false
      required: [deviceId, platform, registeredAt]
      properties:
        deviceId:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/PushPlatform"
        registeredAt:
          type: string
          format: date-time
    AgreementCode:
      type: string
      enum: [PRIVACY_POLICY, USER_AGREEMENT, CHILD_PRIVACY_RULES, TRADE_AGREEMENT, ENROLLMENT_NOTICE]
      description: The documents of 协议与规则
    SystemNoticeLink:
      type: object
      additionalProperties: false
      required: [type, agreement]
      description: >-
        Where an item or the action leads, as a stable code the App turns into a page. AGREEMENT names the agreement;
        the others carry agreement null. A page the App does not have yet is shown as not yet available.
      properties:
        type:
          type: string
          enum: [AGREEMENT, ACTIVITY_PARTICIPANTS, PRIVACY_PERMISSIONS, PERSONAL_DATA_EXPORT, NOTIFICATION_SETTINGS,
                 PLATFORM_SUPPORT]
        agreement:
          oneOf:
            - $ref: "#/components/schemas/AgreementCode"
            - type: "null"
    SystemNoticeFact:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
          maxLength: 8
        value:
          type: string
          maxLength: 16
    SystemNoticeItem:
      type: object
      additionalProperties: false
      required: [title, description, link]
      properties:
        title:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 60
        link:
          oneOf:
            - $ref: "#/components/schemas/SystemNoticeLink"
            - type: "null"
    SystemNoticeAction:
      type: object
      additionalProperties: false
      required: [label, link]
      properties:
        label:
          type: string
          maxLength: 12
        link:
          $ref: "#/components/schemas/SystemNoticeLink"
    SystemNoticeAudience:
      type: object
      additionalProperties: false
      required: [scope, cityCode]
      description: ALL carries cityCode null; CITY names the city
      properties:
        scope:
          type: string
          enum: [ALL, CITY]
        cityCode:
          type: [string, "null"]
          pattern: "^[A-Z0-9]{4,16}$"
    SystemNoticeDraft:
      type: object
      additionalProperties: false
      required: [title, summary, paragraphs, audience]
      properties:
        title:
          type: string
          maxLength: 40
        summary:
          type: string
          maxLength: 120
          description: The inbox row's body and the detail's lead
        paragraphs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 500
        facts:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/SystemNoticeFact"
        items:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/SystemNoticeItem"
        footnote:
          type: [string, "null"]
          maxLength: 200
        action:
          oneOf:
            - $ref: "#/components/schemas/SystemNoticeAction"
            - type: "null"
        aboutAgreement:
          oneOf:
            - $ref: "#/components/schemas/AgreementCode"
            - type: "null"
        audience:
          $ref: "#/components/schemas/SystemNoticeAudience"
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: After this, accounts that have not received it no longer do; null keeps it open
    SystemNotice:
      type: object
      additionalProperties: false
      required: [id, title, summary, paragraphs, facts, items, footnote, action, aboutAgreement, audience, publishedAt,
                 expiresAt, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 40
        summary:
          type: string
          maxLength: 120
        paragraphs:
          type: array
          items:
            type: string
        facts:
          type: array
          items:
            $ref: "#/components/schemas/SystemNoticeFact"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SystemNoticeItem"
        footnote:
          type: [string, "null"]
        action:
          oneOf:
            - $ref: "#/components/schemas/SystemNoticeAction"
            - type: "null"
        aboutAgreement:
          oneOf:
            - $ref: "#/components/schemas/AgreementCode"
            - type: "null"
        audience:
          $ref: "#/components/schemas/SystemNoticeAudience"
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [PUBLISHED, WITHDRAWN]
          description: The public read only returns PUBLISHED ones
