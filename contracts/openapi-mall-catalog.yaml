openapi: 3.1.0
info:
  title: Mall Catalog API
  version: 1.4.1
  description: >-
    1.4.1 exposes database-backed development media at /api/v1/dev-media/; production media uses HTTPS.

    Read-only catalog for the home "商城" channel (docs/redesign/03-App实现任务计划.md §9):
    products of a category that have an active offer in the city, and one product with its offers.
    1.1.0 adds keyword search and filters to the list. 1.2.0 (2026-11-19) adds onlinePayment to each
    offer of the product detail: whether that offer's merchant has an active online payment account
    (registered with the unified trade module), so the page does not preselect a merchant that cannot
    take an order, a rental or an inquiry it would have to pay online. Cart, orders, payment and
    after-sale rules are not part of this contract.
    1.3.0 (2026-11-23, S3-1 商品与供给 / S4-4) adds to the product detail what the web ops console records:
    sellingPoints (the short tags under the name), skus (every active spec of the product, so the 规格与数量
    sheet can list the specs a merchant does not supply as unavailable), gallery and introBlocks (图文介绍),
    and stockQuantity on each offer (that merchant's stock in the city; null means not tracked, 0 means sold
    out: the spec cannot be chosen, and the cart refuses it, mall cart 1.2.0). Older clients ignore them.
    1.4.0 (2026-11-23, S4-4 / S5-2, docs/redesign/08-后续开发计划.md §5 A1, S4-4) adds the trade terms the product page
    and the order carry: invoiceIssuer (开票方) and aftersaleParty (售后责任方) on each offer — taken from the offer, else
    from the merchant's approved profile (contracts/openapi-mall-merchant.yaml), else the merchant itself — and
    noReasonReturn on the product (false when the product is marked as not taking 7-day no-reason returns). The list
    takes an optional merchantId: only that merchant's offers in the city count (price, seller count, matching), for
    the merchant page's 在售 tab. Older clients ignore them.
    Bodies are returned bare, errors use the shared ApiError, like the other contracts.
servers:
  - url: /
paths:
  /api/v1/mall/products:
    get:
      operationId: searchMallProducts
      summary: Published products that have at least one active offer in the city
      security: []
      parameters:
        - $ref: "#/components/parameters/CityCode"
        - name: category
          in: query
          required: false
          description: Omit for all categories
          schema:
            $ref: "#/components/schemas/MallCategory"
        - name: keyword
          in: query
          required: false
          description: >-
            Matched against the product name and summary, case-insensitively. Trimmed; blank means
            no keyword. % and _ are matched literally.
          schema:
            type: string
            maxLength: 50
        - name: saleModes
          in: query
          required: false
          description: Repeatable. Products sold in any of these ways. Omit for all.
          schema:
            type: array
            maxItems: 8
            items:
              $ref: "#/components/schemas/MallSaleMode"
        - name: experienceBadges
          in: query
          required: false
          description: Repeatable. Products carrying any of these badges. Omit for all.
          schema:
            type: array
            maxItems: 8
            items:
              $ref: "#/components/schemas/MallExperienceBadge"
        - name: merchantKinds
          in: query
          required: false
          description: >-
            Repeatable. Products with an active offer in the city from a merchant of any of these
            kinds. Omit for all.
          schema:
            type: array
            maxItems: 8
            items:
              $ref: "#/components/schemas/MallMerchantKind"
        - name: merchantId
          in: query
          required: false
          description: >-
            (1.4.0) Only this merchant's active offers in the city count: products it sells there, priced and counted by
            its offers alone. For the merchant page (contracts/openapi-mall-merchant.yaml). Omit for all merchants.
          schema:
            type: string
            format: uuid
        - name: minPriceMinor
          in: query
          required: false
          description: >-
            Lower bound, in minor units, of the lowest listed price in the city. With either bound
            set, products without a listed price (inquiry) are left out.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPriceMinor
          in: query
          required: false
          description: Upper bound, in minor units; must not be below minPriceMinor.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MallProductSort"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: >-
            One page. DEFAULT follows the operator's display order; the price sorts use the lowest
            listed price in the city and always put products without a listed price last.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MallProductPage"
        "400":
          description: Invalid city, category, sort, page or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/mall/products/{productId}:
    get:
      operationId: getMallProductDetail
      summary: One published product with the offers that are active in the city
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CityCode"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MallProductDetail"
        "400":
          description: Invalid product id or city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product is not published or has no active offer in that city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    CityCode:
      name: cityCode
      in: query
      required: true
      schema:
        type: string
        minLength: 4
        maxLength: 16
      description: 国家统计区划或平台统一城市稳定编码
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type:
            - object
            - "null"
          additionalProperties: true
    MediaAsset:
      type: object
      additionalProperties: false
      required:
        - url
        - alt
      properties:
        url:
          type: string
          format: uri-reference
          description: Controlled HTTPS URL or, for development fixtures, a same-origin /api/v1/dev-media/ reference.
        alt:
          type: string
    MallCategory:
      type: string
      enum:
        - DRONE
        - ROBOT
        - PARTS
        - RENTAL
        - COURSE
      description: 无人机 / 机器人 / 配件 / 租赁 / 课程
    MallProductSort:
      type: string
      enum:
        - DEFAULT
        - PRICE_ASC
        - PRICE_DESC
      default: DEFAULT
    MallSaleMode:
      type: string
      enum:
        - BUY
        - RENT
        - INQUIRY
      description: 购买 / 租赁 / 询价, set per product
    MallExperienceBadge:
      type: string
      enum:
        - ONLINE_EXPERIENCE
        - VENUE_DISPLAY
      description: 可线上体验 / 体验馆可看
    MallPriceUnit:
      type: string
      enum:
        - ITEM
        - DAY
        - HALF_DAY
      description: 按件 / 按天 / 按半天
    MallMerchantKind:
      type: string
      enum:
        - FACTORY_DIRECT
        - AUTHORIZED_DEALER
        - LOCAL_STORE
      description: 厂家直营 / 授权经销 / 本地商家
    MallListPrice:
      type: object
      additionalProperties: false
      required:
        - fromAmountMinor
        - unit
        - multiplePrices
      properties:
        fromAmountMinor:
          type:
            - integer
            - "null"
          minimum: 0
          description: Lowest listed price in the city in the minor unit; null when every offer is by inquiry
        unit:
          $ref: "#/components/schemas/MallPriceUnit"
        multiplePrices:
          type: boolean
          description: True when the city has more than one distinct listed price, so the card says 起
    MallProductCard:
      type: object
      additionalProperties: false
      required:
        - productId
        - category
        - name
        - coverImage
        - saleMode
        - experienceBadge
        - price
        - sellerCount
      properties:
        productId:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/MallCategory"
        name:
          type: string
        coverImage:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        saleMode:
          $ref: "#/components/schemas/MallSaleMode"
        experienceBadge:
          anyOf:
            - $ref: "#/components/schemas/MallExperienceBadge"
            - type: "null"
        price:
          $ref: "#/components/schemas/MallListPrice"
        sellerCount:
          type: integer
          minimum: 1
          description: Merchants with an active offer in the city
    MallProductPage:
      type: object
      additionalProperties: false
      required:
        - page
        - size
        - total
        - hasMore
        - items
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/MallProductCard"
    MallMerchant:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - name
        - kind
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/MallMerchantKind"
    MallOffer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - skuId
        - skuName
        - merchant
        - amountMinor
        - currency
        - unit
        - deliveryNote
        - shippingNote
        - fulfilledFrom
        - onlinePayment
        - stockQuantity
        - invoiceIssuer
        - aftersaleParty
      properties:
        offerId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        skuName:
          type: string
        merchant:
          $ref: "#/components/schemas/MallMerchant"
        amountMinor:
          type:
            - integer
            - "null"
          minimum: 0
          description: Listed price in the minor unit; null when this merchant sells by inquiry
        currency:
          type: string
          enum:
            - CNY
        unit:
          $ref: "#/components/schemas/MallPriceUnit"
        deliveryNote:
          type:
            - string
            - "null"
          description: Merchant's short line, e.g. 东营现货 · 48 小时发货 · 一年保修
        shippingNote:
          type:
            - string
            - "null"
          description: e.g. 东营可买 · 包邮 · 48 小时内发货
        fulfilledFrom:
          type:
            - string
            - "null"
          description: Who ships or hands over, e.g. 示例机器人商家 东营仓
        onlinePayment:
          type: boolean
          description: >-
            (1.2.0) true when this offer's merchant can take payment online (an active payment account in
            the trade module). Buying, renting and ordering by quote all pay this merchant online, so a
            false offer cannot be ordered, rented or asked for a quote; show it but do not preselect it.
            Same meaning as price.onlinePayment for activities.
        stockQuantity:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            (1.3.0) Pieces this merchant has for this spec in the city (规格面板“现货 N 件”). null means stock is not
            tracked (do not show a count); 0 means sold out: the spec cannot be chosen and the cart refuses it.
        invoiceIssuer:
          type:
            - string
            - "null"
          maxLength: 160
          description: >-
            (1.4.0) 开票方: the offer's own entry, else the merchant profile's, else the merchant's name. null only when
            none of them is known.
        aftersaleParty:
          type:
            - string
            - "null"
          maxLength: 160
          description: >-
            (1.4.0) 售后责任方, e.g. 示例机器人商家 · 厂家保修: the offer's own entry, else the merchant profile's, else the
            merchant's name.
    MallSku:
      type: object
      additionalProperties: false
      required:
        - skuId
        - name
      properties:
        skuId:
          type: string
          format: uuid
        name:
          type: string
    MallIntroBlock:
      type: object
      additionalProperties: false
      required:
        - type
        - text
        - image
      properties:
        type:
          type: string
          enum:
            - TEXT
            - IMAGE
        text:
          type:
            - string
            - "null"
          description: The paragraph for TEXT; an optional caption for IMAGE
        image:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
          description: The picture for IMAGE (https only); null for TEXT, or when the address is not https
    MallSpec:
      type: object
      additionalProperties: false
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: string
    MallPackItem:
      type: object
      additionalProperties: false
      required:
        - name
        - quantity
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
    MallProductDetail:
      type: object
      additionalProperties: false
      required:
        - productId
        - category
        - name
        - summary
        - coverImage
        - saleMode
        - experienceBadge
        - offers
        - specs
        - packItems
        - sellingPoints
        - skus
        - gallery
        - introBlocks
        - noReasonReturn
      properties:
        productId:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/MallCategory"
        name:
          type: string
        summary:
          type:
            - string
            - "null"
        coverImage:
          anyOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        saleMode:
          $ref: "#/components/schemas/MallSaleMode"
        experienceBadge:
          anyOf:
            - $ref: "#/components/schemas/MallExperienceBadge"
            - type: "null"
        offers:
          type: array
          minItems: 1
          description: Active offers in the city, listed prices first from low to high, inquiries last
          items:
            $ref: "#/components/schemas/MallOffer"
        specs:
          type: array
          items:
            $ref: "#/components/schemas/MallSpec"
        packItems:
          type: array
          items:
            $ref: "#/components/schemas/MallPackItem"
        sellingPoints:
          type: array
          maxItems: 5
          description: (1.3.0) Short selling-point tags shown under the name, in order
          items:
            type: string
            maxLength: 12
        skus:
          type: array
          description: >-
            (1.3.0) Every active spec of the product in display order, whether or not an offer in this city sells
            it. A spec no offer of the chosen merchant sells is shown as 本商家暂不供应.
          items:
            $ref: "#/components/schemas/MallSku"
        gallery:
          type: array
          maxItems: 9
          description: (1.3.0) Product pictures after the cover, https only
          items:
            $ref: "#/components/schemas/MediaAsset"
        introBlocks:
          type: array
          maxItems: 30
          description: (1.3.0) 图文介绍, in order; empty when the merchant has not provided one
          items:
            $ref: "#/components/schemas/MallIntroBlock"
        noReasonReturn:
          type: boolean
          description: >-
            (1.4.0) true when the product takes 7-day no-reason returns (unopened), the platform default; false when the
            operator marked it 不支持七天无理由. Quality-problem returns are not affected
            (contracts/openapi-trade-aftersale.yaml).
