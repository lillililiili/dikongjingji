openapi: 3.1.0
info:
  title: Inspection Service Flow API
  version: 2.3.0
  description: >-
    巡检预约、方案确认、多次巡检履约、按次交付和验收的正式契约。
    2.2.0（R6-4）：方案和服务单里的服务商（ProviderSummary）加 qualificationReviewed，页面据此显示“资质已审核”。
    2.3.0（2026-11-22 登录续期）：登录响应加 refreshToken、refreshExpiresInSeconds；新增 POST /api/v1/auth/refresh
    （凭刷新令牌换新的访问令牌和新的刷新令牌，旧的作废；已换掉的令牌再用视为被盗用，这次登录全部撤销）
    和 POST /api/v1/auth/logout（撤销这次登录）。访问令牌仍是 900 秒。
servers:
  - url: https://api.example.com
    description: Production placeholder
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: CustomerInspectionFlow
  - name: ProviderInspectionFlow
  - name: InspectionFiles
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: 用户名密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 已签发访问令牌和刷新令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshLogin
      summary: 用刷新令牌续期登录
      description: >-
        凭刷新令牌换一个新的访问令牌和一个新的刷新令牌（轮换），交上来的刷新令牌随即作废。请求不带 Authorization
        头（访问令牌此时通常已过期，带了过期令牌会被拒绝）。刷新令牌单个 30 天有效，同一次登录最长 90 天。
        已经换掉的刷新令牌再被交上来，视为被盗用：这次登录的全部刷新令牌撤销，要重新登录。账号停用、离开默认组织
        或令牌版本变化后不能续期。所有失败都返回同一个 401，不区分原因。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 已续期；客户端用新的两个令牌替换旧的
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 刷新令牌不存在、已过期、已撤销、已被使用过或账号不能再登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                default:
                  value:
                    code: COMMON_UNAUTHORIZED
                    message: 登录已过期，请重新登录
                    traceId: 01JEXAMPLETRACE
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 退出登录
      description: >-
        撤销这个刷新令牌所属的这次登录（其他设备上的登录不受影响）。不论令牌是否存在都返回 204。
        已签发的访问令牌不会被收回，最多 900 秒后自然过期；客户端退出时同时删掉本地的两个令牌。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: 已退出
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: 读取当前登录账号可以展示的资料
      description: 账号由访问令牌确定，不接受任何指定账号的参数。不返回登录名、手机号和口令。
      responses:
        "200":
          description: 当前账号的展示资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/inspection/services/{serviceId}/available-time-slots:
    get:
      tags: [CustomerInspectionFlow]
      operationId: getInspectionServiceAvailableTimeSlots
      summary: 查询巡检服务可预约时段
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 16
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 4
      responses:
        "200":
          description: 每个日期的固定时段与剩余名额
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableServiceDate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/inspection/reservations:
    get:
      tags: [CustomerInspectionFlow]
      operationId: listMyInspectionReservations
      summary: 分页查询当前客户自己的巡检订单
      x-required-permission: inspection.reservation.read.own
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/CustomerReservationFilter"
      responses:
        "200":
          description: 当前客户的巡检订单分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerReservationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [CustomerInspectionFlow]
      operationId: createInspectionReservation
      summary: 提交巡检预约
      x-required-permission: inspection.reservation.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: 预约已创建
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/inspection/reservations/{reservationId}:
    get:
      tags: [CustomerInspectionFlow]
      operationId: getInspectionReservation
      summary: 查询本人预约或服务商已分配预约
      x-required-permissions:
        - inspection.reservation.read.own
        - inspection.reservation.read.assigned
        - inspection.reservation.read.all
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 预约详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inspection/reservations/{reservationId}/cancel:
    post:
      tags: [CustomerInspectionFlow]
      operationId: cancelInspectionReservation
      summary: 取消方案确认前的本人巡检订单
      x-required-permission: inspection.reservation.cancel.own
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 已取消或幂等返回同一已取消预约
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 当前订单状态或取消幂等键冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                notCancellable:
                  value:
                    code: INS_RESERVATION_NOT_CANCELLABLE
                    message: 当前订单状态不允许取消
                    traceId: cancel-state-conflict-example
                idempotencyKeyReused:
                  value:
                    code: INS_IDEMPOTENCY_KEY_REUSED
                    message: 幂等键已用于不同请求
                    traceId: cancel-idempotency-conflict-example
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/inspection/reservations/{reservationId}/plans:
    get:
      tags: [CustomerInspectionFlow]
      operationId: listInspectionPlanVersions
      summary: 查询本人预约的方案各版本摘要
      x-required-permissions:
        - inspection.plan.read.own
        - inspection.plan.read.all
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 方案版本摘要，按版本号升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanVersionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inspection/file-objects/upload-intents:
    post:
      tags: [InspectionFiles]
      operationId: createInspectionUploadIntent
      summary: 创建私有文件上传意图
      description: 服务端根据 purpose、ownerId、资源归属和调用者角色决定是否允许上传。交付文件的 ownerId 是巡检次 ID。
      x-required-permissions:
        - inspection.reservation.create
        - inspection.delivery.publish.assigned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadIntentRequest"
      responses:
        "201":
          description: 短时效预签名 PUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/inspection/file-objects/{fileId}/complete:
    post:
      tags: [InspectionFiles]
      operationId: completeInspectionUpload
      summary: 确认对象已上传并进入扫描
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: 文件状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/inspection/plans/{planId}:
    get:
      tags: [CustomerInspectionFlow]
      operationId: getInspectionPlan
      summary: 查询本人有效方案
      x-required-permissions:
        - inspection.plan.read.own
        - inspection.plan.read.all
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: 方案详情
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inspection/plans/{planId}/confirm:
    post:
      tags: [CustomerInspectionFlow]
      operationId: confirmInspectionPlan
      summary: 确认方案并创建服务单
      x-required-permission: inspection.plan.confirm.own
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPlanRequest"
      responses:
        "200":
          description: 已创建或返回同一服务单
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/inspection/service-orders/{serviceOrderId}:
    get:
      tags: [CustomerInspectionFlow]
      operationId: getInspectionServiceOrder
      summary: 查询本人或服务商已分配的服务单
      x-required-permissions:
        - inspection.order.read.own
        - inspection.order.read.assigned
        - inspection.order.read.all
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
      responses:
        "200":
          description: 服务单、安排和进度
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inspection/service-orders/{serviceOrderId}/visits/{visitId}/delivery:
    get:
      tags: [CustomerInspectionFlow]
      operationId: getInspectionDelivery
      summary: 查询某次巡检已发布的报告交付
      x-required-permissions:
        - inspection.order.read.own
        - inspection.order.read.all
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: 交付摘要与文件元数据
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/inspection/service-orders/{serviceOrderId}/visits/{visitId}/delivery-files/{fileId}/download-intent:
    post:
      tags: [InspectionFiles]
      operationId: createInspectionDeliveryDownloadIntent
      summary: 获取单个交付文件的短时效下载地址
      x-required-permissions:
        - inspection.delivery.download.own
        - inspection.delivery.download.all
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 短时效预签名 GET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/inspection/service-orders/{serviceOrderId}/visits/{visitId}/delivery-files/download-all-intent:
    post:
      tags: [InspectionFiles]
      operationId: createInspectionDeliveryBundleDownloadIntent
      summary: 获取某次巡检全部交付物 ZIP 的短时效下载地址
      x-required-permissions:
        - inspection.delivery.download.own
        - inspection.delivery.download.all
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: ZIP 汇总下载意图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/inspection/service-orders/{serviceOrderId}/visits/{visitId}/acceptance:
    post:
      tags: [CustomerInspectionFlow]
      operationId: acceptInspectionDelivery
      summary: 确认验收某次巡检
      x-required-permission: inspection.acceptance.create.own
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDeliveryRequest"
      responses:
        "200":
          description: 已验收或返回同一验收结果；ETag 是巡检次版本
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acceptance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/provider/inspection/reservations/{reservationId}/plans:
    post:
      tags: [ProviderInspectionFlow]
      operationId: publishInspectionPlan
      summary: 为已分配预约发布方案
      x-required-permission: inspection.plan.publish.assigned
      parameters:
        - $ref: "#/components/parameters/ReservationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPlanRequest"
      responses:
        "201":
          description: 已发布方案
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/provider/inspection/service-orders/{serviceOrderId}/arrangement:
    put:
      tags: [ProviderInspectionFlow]
      operationId: putInspectionArrangement
      summary: 保存服务团队和设备安排，服务单未结束时都可更新
      x-required-permission: inspection.order.arrange.assigned
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutArrangementRequest"
      responses:
        "200":
          description: 更新后的服务单
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/provider/inspection/service-orders/{serviceOrderId}/visits/{visitId}/schedule:
    put:
      tags: [ProviderInspectionFlow]
      operationId: putInspectionVisitSchedule
      summary: 确认或调整某次巡检的开始时间
      x-required-permission: inspection.order.arrange.assigned
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutVisitScheduleRequest"
      responses:
        "200":
          description: 更新后的巡检次；ETag 是巡检次版本
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceVisit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/provider/inspection/service-orders/{serviceOrderId}/visits/{visitId}/progress-events:
    post:
      tags: [ProviderInspectionFlow]
      operationId: appendInspectionProgressEvent
      summary: 追加某次巡检的履约进度并按规则推进状态
      x-required-permission: inspection.order.progress.assigned
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendProgressRequest"
      responses:
        "201":
          description: 更新后的巡检次；ETag 是巡检次版本
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceVisit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/provider/inspection/service-orders/{serviceOrderId}/visits/{visitId}/delivery:
    post:
      tags: [ProviderInspectionFlow]
      operationId: publishInspectionDelivery
      summary: 发布某次巡检的报告交付并进入待验收
      x-required-permission: inspection.delivery.publish.assigned
      parameters:
        - $ref: "#/components/parameters/ServiceOrderId"
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishDeliveryRequest"
      responses:
        "201":
          description: 已发布交付
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    ETag:
      description: 当前资源版本，例如 `"7"`
      schema:
        type: string
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceOrderId:
      name: serviceOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 调用者生成的 UUID；同一键只能对应同一请求摘要。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 上次读取的带双引号强数字 ETag，用于乐观并发控制。
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        example: '"7"'
  responses:
    BadRequest:
      description: 请求格式或字段校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: COMMON_UNAUTHORIZED
                message: 请先登录
                traceId: 01JEXAMPLETRACE
    Forbidden:
      description: 无权限或资源不属于当前主体
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 资源不存在或对当前主体不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 幂等键、状态或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PreconditionFailed:
      description: ETag 已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: 当前业务状态不允许执行
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: 文件超过用途限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: 文件类型不受支持
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: ZIP 汇总或对象存储暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 256
    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSeconds, refreshToken, refreshExpiresInSeconds]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          const: Bearer
        expiresInSeconds:
          type: integer
          minimum: 1
        refreshToken:
          description: >-
            不透明的随机串（Base64url，43 位），服务端只存哈希。App 存在本机存储；H5 只放 sessionStorage 或内存。
            每次续期都会换新，旧的不能再用。
          type: string
          minLength: 1
          maxLength: 128
        refreshExpiresInSeconds:
          description: 这个刷新令牌还有多少秒过期（不超过 30 天，也不超过这次登录满 90 天的时刻）。
          type: integer
          minimum: 1
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [displayName, organizationName, organizationType, roles]
      properties:
        displayName:
          type: string
        organizationName:
          description: 账号默认所属组织的名称；没有有效组织时为 null。
          type: [string, "null"]
        organizationType:
          oneOf:
            - type: string
              enum: [CUSTOMER, PROVIDER, PLATFORM]
            - type: "null"
        roles:
          description: 当前令牌里的角色编码，按字母序。
          type: array
          items:
            type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        traceId:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - COMMON_INVALID_ARGUMENT
        - COMMON_UNAUTHORIZED
        - COMMON_FORBIDDEN
        - COMMON_NOT_FOUND
        - COMMON_INTERNAL_ERROR
        - INS_IDEMPOTENCY_KEY_REUSED
        - INS_VERSION_CONFLICT
        - INS_RESERVATION_STATE_INVALID
        - INS_ATTACHMENT_NOT_READY
        - INS_PLAN_NOT_PUBLISHED
        - INS_PLAN_EXPIRED
        - INS_PLAN_ALREADY_CONFIRMED
        - INS_ORDER_STATE_INVALID
        - INS_VISIT_STATE_INVALID
        - INS_VISIT_OUT_OF_ORDER
        - INS_DELIVERY_NOT_PUBLISHED
        - INS_DELIVERY_STATE_INVALID
        - INS_DELIVERY_FILES_INVALID
        - INS_DELIVERY_FILE_NOT_READY
        - INS_DELIVERY_ALREADY_ACCEPTED
        - INS_FILE_TYPE_UNSUPPORTED
        - INS_FILE_TOO_LARGE
        - INS_FILE_COUNT_EXCEEDED
        - INS_FILE_SCAN_FAILED
        - INS_STORAGE_UNAVAILABLE
        - INS_TIME_SLOT_FULL
        - INS_TIME_SLOT_TOO_SOON
        - INS_RESERVATION_NOT_CANCELLABLE
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - serviceId
        - cityCode
        - location
        - preferredServiceDate
        - preferredTimeSlotCode
        - inspectionItemCodes
        - contact
        - agreementVersion
        - agreementAccepted
      properties:
        serviceId:
          type: string
          format: uuid
        cityCode:
          type: string
          minLength: 4
          maxLength: 16
        location:
          $ref: "#/components/schemas/InspectionLocation"
        lineLengthMeters:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        preferredServiceDate:
          type: string
          format: date
        preferredTimeSlotCode:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
        inspectionItemCodes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        attachmentFileIds:
          type: array
          maxItems: 9
          uniqueItems: true
          items:
            type: string
            format: uuid
        note:
          type: [string, "null"]
          maxLength: 1000
        contact:
          $ref: "#/components/schemas/Contact"
        agreementVersion:
          type: string
          maxLength: 32
        agreementAccepted:
          const: true
    InspectionLocation:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          minLength: 2
          maxLength: 240
        longitude:
          type: [number, "null"]
          minimum: -180
          maximum: 180
        latitude:
          type: [number, "null"]
          minimum: -90
          maximum: 90
    Contact:
      type: object
      additionalProperties: false
      required: [name, mobile]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        mobile:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
    Reservation:
      type: object
      additionalProperties: false
      required:
        - id
        - reservationNo
        - customerId
        - serviceId
        - cityCode
        - status
        - location
        - preferredServiceDate
        - preferredTimeSlotCode
        - inspectionItems
        - contact
        - attachments
        - submittedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        reservationNo:
          type: string
        customerId:
          type: string
          format: uuid
        providerId:
          type: [string, "null"]
          format: uuid
        serviceId:
          type: string
          format: uuid
        serviceTitle:
          type: string
        serviceCoverUrl:
          type: [string, "null"]
          format: uri
        cityCode:
          type: string
        status:
          $ref: "#/components/schemas/ReservationStatus"
        location:
          $ref: "#/components/schemas/InspectionLocation"
        lineLengthMeters:
          type: [integer, "null"]
        preferredServiceDate:
          type: string
          format: date
        preferredTimeSlotCode:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
        inspectionItems:
          type: array
          items:
            $ref: "#/components/schemas/CodeLabel"
        note:
          type: [string, "null"]
        contact:
          $ref: "#/components/schemas/Contact"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/FileObject"
        submittedAt:
          type: string
          format: date-time
        currentPlanId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          minimum: 0
    AvailableServiceDate:
      type: object
      additionalProperties: false
      required: [serviceDate, slots]
      properties:
        serviceDate:
          type: string
          format: date
        slots:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/AvailableTimeSlot"
    AvailableTimeSlot:
      type: object
      additionalProperties: false
      required:
        - slotCode
        - startTime
        - endTime
        - remainingCount
        - availability
      properties:
        slotCode:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        remainingCount:
          type: integer
          minimum: 0
          maximum: 9
        availability:
          type: string
          enum: [AVAILABLE, FULL, TOO_SOON]
    ReservationStatus:
      type: string
      enum: [SUBMITTED, PLAN_PUBLISHED, CANCELLED]
    CustomerReservationFilter:
      type: string
      default: ALL
      enum: [ALL, AWAITING_PLAN, AWAITING_CONFIRMATION, IN_PROGRESS, AWAITING_ACCEPTANCE, COMPLETED]
    CustomerReservationStage:
      type: string
      enum: [AWAITING_PLAN, AWAITING_CONFIRMATION, IN_PROGRESS, AWAITING_ACCEPTANCE, COMPLETED, CANCELLED]
    CustomerReservationSummary:
      type: object
      additionalProperties: false
      required:
        - reservationId
        - reservationNo
        - serviceId
        - serviceTitle
        - cityCode
        - locationSummary
        - preferredServiceDate
        - submittedAt
        - stage
        - reservationStatus
        - currency
      properties:
        reservationId:
          type: string
          format: uuid
        reservationNo:
          type: string
        serviceId:
          type: string
          format: uuid
        serviceTitle:
          type: string
        serviceCoverUrl:
          type: string
          format: uri
        cityCode:
          type: string
        locationSummary:
          type: string
        preferredServiceDate:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        stage:
          $ref: "#/components/schemas/CustomerReservationStage"
        reservationStatus:
          $ref: "#/components/schemas/ReservationStatus"
        currentPlanId:
          type: string
          format: uuid
        serviceOrderId:
          type: string
          format: uuid
        serviceOrderStatus:
          $ref: "#/components/schemas/ServiceOrderStatus"
        quoteAmountMinor:
          type: integer
          minimum: 0
        currency:
          const: CNY
        visitCount:
          type: integer
          minimum: 0
        acceptedVisitCount:
          type: integer
          minimum: 0
        nextVisitDate:
          type: string
          format: date
        pendingAcceptanceVisitId:
          type: string
          format: uuid
        pendingAcceptanceVisitNo:
          type: integer
          minimum: 1
    CustomerReservationStageCounts:
      type: object
      additionalProperties: false
      required: [AWAITING_PLAN, AWAITING_CONFIRMATION, IN_PROGRESS, AWAITING_ACCEPTANCE, COMPLETED]
      properties:
        AWAITING_PLAN:
          type: integer
          minimum: 0
        AWAITING_CONFIRMATION:
          type: integer
          minimum: 0
        IN_PROGRESS:
          type: integer
          minimum: 0
        AWAITING_ACCEPTANCE:
          type: integer
          minimum: 0
        COMPLETED:
          type: integer
          minimum: 0
    CustomerReservationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasMore, stageCounts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerReservationSummary"
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        stageCounts:
          $ref: "#/components/schemas/CustomerReservationStageCounts"
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required: [purpose, ownerId, originalName, contentType, sizeBytes, sha256]
      properties:
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        ownerId:
          type: string
          format: uuid
        deliveryFileType:
          oneOf:
            - $ref: "#/components/schemas/DeliveryFileType"
            - type: "null"
        originalName:
          type: string
          minLength: 1
          maxLength: 180
        contentType:
          type: string
          minLength: 3
          maxLength: 120
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 1073741824
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [etag, sizeBytes, sha256]
      properties:
        etag:
          type: string
          minLength: 1
          maxLength: 160
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadIntent:
      type: object
      additionalProperties: false
      required: [fileId, method, uploadUrl, requiredHeaders, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        method:
          const: PUT
        uploadUrl:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    FileObject:
      type: object
      additionalProperties: false
      required: [id, originalName, contentType, sizeBytes, status]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/FileStatus"
        scanFailureReason:
          type: [string, "null"]
    FilePurpose:
      type: string
      enum: [RESERVATION_ATTACHMENT, DELIVERY_ARTIFACT]
    FileStatus:
      type: string
      enum: [PENDING_UPLOAD, UPLOADED, SCANNING, READY, REJECTED, DELETED]
    PublishPlanRequest:
      type: object
      additionalProperties: false
      required:
        - providerId
        - validUntil
        - visits
        - planItems
        - deliverables
        - currency
      properties:
        providerId:
          type: string
          format: uuid
        validUntil:
          type: string
          format: date-time
        visits:
          type: array
          minItems: 1
          maxItems: 52
          description: 计划巡检日期，严格升序。第 1 项是方案的 serviceDate。
          items:
            $ref: "#/components/schemas/PlanVisitInput"
        summary:
          type: [string, "null"]
          maxLength: 1000
        scopeSummary:
          type: [string, "null"]
          maxLength: 120
        serviceMethods:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CodeLabel"
        deliveryTerms:
          oneOf:
            - $ref: "#/components/schemas/DeliveryTerms"
            - type: "null"
        changeNote:
          type: [string, "null"]
          maxLength: 200
        planItems:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlanItemInput"
        deliverables:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/DeliverableInput"
        currency:
          const: CNY
    PlanVisitInput:
      type: object
      additionalProperties: false
      required: [plannedDate]
      properties:
        plannedDate:
          type: string
          format: date
    DeliveryTerms:
      type: object
      additionalProperties: false
      properties:
        reportDueHours:
          type: [integer, "null"]
          minimum: 1
          maximum: 8760
        mediaRetentionDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
    ConfirmPlanRequest:
      type: object
      additionalProperties: false
      required: [agreementVersion, agreementAccepted]
      properties:
        agreementVersion:
          type: string
          maxLength: 32
        agreementAccepted:
          const: true
    PlanItemInput:
      type: object
      additionalProperties: false
      required: [code, name, quantity, unit, unitPriceMinor]
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
          maxLength: 24
        unitPriceMinor:
          type: integer
          minimum: 0
    DeliverableInput:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 120
        fileType:
          description: 这项交付物对应的文件类型；方案所有交付物都没有写时，每次交付要四类文件各一份。
          oneOf:
            - $ref: "#/components/schemas/DeliveryFileType"
            - type: "null"
    ServicePlan:
      type: object
      additionalProperties: false
      required:
        - id
        - planNo
        - reservationId
        - providerId
        - status
        - planVersion
        - validUntil
        - serviceDate
        - visits
        - planItems
        - deliverables
        - totalAmountMinor
        - currency
        - publishedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        planNo:
          type: string
        reservationId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PlanStatus"
        planVersion:
          type: integer
          minimum: 1
        validUntil:
          type: string
          format: date-time
        serviceDate:
          type: string
          format: date
          description: 首次巡检日期，等于 visits 第 1 项。
        visits:
          type: array
          items:
            $ref: "#/components/schemas/PlanVisit"
        provider:
          oneOf:
            - $ref: "#/components/schemas/ProviderSummary"
            - type: "null"
        customerParty:
          oneOf:
            - $ref: "#/components/schemas/CustomerParty"
            - type: "null"
        summary:
          type: [string, "null"]
        scopeSummary:
          type: [string, "null"]
        serviceMethods:
          type: array
          items:
            $ref: "#/components/schemas/CodeLabel"
        deliveryTerms:
          oneOf:
            - $ref: "#/components/schemas/DeliveryTerms"
            - type: "null"
        changeNote:
          type: [string, "null"]
        planItems:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        deliverables:
          type: array
          items:
            $ref: "#/components/schemas/PlanDeliverable"
        totalAmountMinor:
          type: integer
          minimum: 0
        currency:
          const: CNY
        paymentNodes:
          description: 付款节点的金额快照；付款开关关闭时为空。
          type: array
          items:
            $ref: "#/components/schemas/PlanPaymentNode"
        publishedAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, "null"]
          format: date-time
        confirmedBy:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        serviceOrderId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          minimum: 0
    PlanVisit:
      type: object
      additionalProperties: false
      required: [visitNo, plannedDate]
      properties:
        visitNo:
          type: integer
          minimum: 1
        plannedDate:
          type: string
          format: date
    PlanDeliverable:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
        fileType:
          oneOf:
            - $ref: "#/components/schemas/DeliveryFileType"
            - type: "null"
    PlanVersionSummary:
      type: object
      additionalProperties: false
      required: [id, planNo, planVersion, status, totalAmountMinor, planItems, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        planNo:
          type: string
        planVersion:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/PlanStatus"
        totalAmountMinor:
          type: integer
          minimum: 0
        planItems:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        changeNote:
          type: [string, "null"]
        publishedAt:
          type: string
          format: date-time
    ProviderSummary:
      type: object
      additionalProperties: false
      required: [providerId, name, qualificationReviewed]
      properties:
        providerId:
          type: string
          format: uuid
        name:
          type: string
        certificationLabel:
          type: [string, "null"]
          description: 服务商资料里的资质说明，如“企业认证”；qualificationReviewed 为 true 时页面在这个位置显示“资质已审核”
        qualificationReviewed:
          type: boolean
          description: 平台已审核过这家服务商的资质（机构有资质审核通过时间）；只来自数据库，不按文字推断
    CustomerParty:
      type: object
      additionalProperties: false
      required: [operatorName]
      properties:
        organizationName:
          type: [string, "null"]
        operatorName:
          type: string
    PersonRef:
      type: object
      additionalProperties: false
      required: [subjectId, displayName]
      properties:
        subjectId:
          type: string
          format: uuid
        displayName:
          type: string
    PaymentMode:
      type: string
      description: NONE 表示这张服务单没有付款节点；NODES 表示按节点付款，已付结果只由统一交易模块回写。
      enum: [NONE, NODES]
    PaymentNodeType:
      type: string
      enum: [DOWN_PAYMENT, PER_VISIT]
    PlanPaymentNode:
      type: object
      additionalProperties: false
      required: [nodeNo, nodeType, amountMinor]
      properties:
        nodeNo:
          type: integer
          minimum: 1
        nodeType:
          $ref: "#/components/schemas/PaymentNodeType"
        visitNo:
          type: [integer, "null"]
          minimum: 1
        amountMinor:
          type: integer
          minimum: 0
    OrderPaymentNode:
      type: object
      additionalProperties: false
      required: [nodeNo, nodeType, amountMinor, payable]
      properties:
        nodeNo:
          type: integer
          minimum: 1
        nodeType:
          $ref: "#/components/schemas/PaymentNodeType"
        visitNo:
          type: [integer, "null"]
          minimum: 1
        amountMinor:
          type: integer
          minimum: 0
        payable:
          type: boolean
          description: 首付在确认后可付，按次款在该次验收后可付，已付的节点不再可付。
        paidAt:
          type: [string, "null"]
          format: date-time
    PlanItem:
      type: object
      additionalProperties: false
      required: [code, name, quantity, unit, unitPriceMinor, lineAmountMinor]
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
          maxLength: 24
        unitPriceMinor:
          type: integer
          minimum: 0
        lineAmountMinor:
          type: integer
          minimum: 0
    PlanStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CONFIRMED, EXPIRED, WITHDRAWN]
    PutArrangementRequest:
      type: object
      additionalProperties: false
      required: [assignments]
      properties:
        assignments:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/AssignmentInput"
    PutVisitScheduleRequest:
      type: object
      additionalProperties: false
      required: [plannedStartAt]
      properties:
        plannedStartAt:
          type: string
          format: date-time
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [type, resourceId, displayName]
      properties:
        type:
          $ref: "#/components/schemas/AssignmentType"
        resourceId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        roleLabel:
          type: [string, "null"]
          maxLength: 80
        contactMobile:
          description: 服务端加密保存，响应里只返回打码值。
          type: [string, "null"]
          pattern: "^1[3-9][0-9]{9}$"
    OrderAssignment:
      type: object
      additionalProperties: false
      required: [type, resourceId, displayName]
      properties:
        type:
          $ref: "#/components/schemas/AssignmentType"
        resourceId:
          type: string
          format: uuid
        displayName:
          type: string
        roleLabel:
          type: [string, "null"]
        contactMobileMasked:
          type: [string, "null"]
    AssignmentType:
      type: string
      enum: [TEAM_MEMBER, DEVICE]
    AppendProgressRequest:
      type: object
      additionalProperties: false
      required: [eventCode, occurredAt, message]
      properties:
        eventCode:
          type: string
          enum: [SERVICE_STARTED, SERVICE_PROGRESS, SERVICE_COMPLETED]
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
          minLength: 1
          maxLength: 500
    ServiceOrder:
      type: object
      additionalProperties: false
      required:
        - id
        - serviceOrderNo
        - reservationId
        - planId
        - customerId
        - providerId
        - status
        - paymentMode
        - serviceSnapshot
        - assignments
        - progress
        - visits
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        serviceOrderNo:
          type: string
        reservationId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ServiceOrderStatus"
        paymentMode:
          $ref: "#/components/schemas/PaymentMode"
        paymentNodes:
          type: array
          items:
            $ref: "#/components/schemas/OrderPaymentNode"
        provider:
          oneOf:
            - $ref: "#/components/schemas/ProviderSummary"
            - type: "null"
        customerParty:
          oneOf:
            - $ref: "#/components/schemas/CustomerParty"
            - type: "null"
        serviceSnapshot:
          $ref: "#/components/schemas/ServiceSnapshot"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/OrderAssignment"
        progress:
          description: 服务单级事件，目前只有 ARRANGEMENT_READY；每次巡检的进度在 visits 里。
          type: array
          items:
            $ref: "#/components/schemas/ProgressEvent"
        visits:
          type: array
          items:
            $ref: "#/components/schemas/ServiceVisit"
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 0
    ServiceSnapshot:
      type: object
      additionalProperties: false
      required: [serviceId, serviceTitle, cityCode, location, serviceDate, inspectionItems]
      properties:
        serviceId:
          type: string
          format: uuid
        serviceTitle:
          type: string
        serviceCoverUrl:
          type: [string, "null"]
          format: uri
        cityCode:
          type: string
        location:
          $ref: "#/components/schemas/InspectionLocation"
        lineLengthMeters:
          type: [integer, "null"]
        serviceDate:
          type: string
          format: date
        inspectionItems:
          type: array
          items:
            $ref: "#/components/schemas/CodeLabel"
    ProgressEvent:
      type: object
      additionalProperties: false
      required: [id, eventCode, occurredAt, message]
      properties:
        id:
          type: string
          format: uuid
        eventCode:
          type: string
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
    ServiceOrderStatus:
      type: string
      description: >-
        由巡检次推导。ARRANGING 第 1 次开工前；IN_PROGRESS 开工后、全部交付前；
        DELIVERED 全部已交付、还有未验收的；ACCEPTED 全部已验收。
      enum: [ARRANGING, IN_PROGRESS, DELIVERED, ACCEPTED]
    ServiceVisitStatus:
      type: string
      enum: [PENDING_SCHEDULE, SCHEDULED, IN_PROGRESS, DELIVERED, ACCEPTED]
    ServiceVisit:
      type: object
      additionalProperties: false
      required: [id, serviceOrderId, visitNo, plannedDate, status, progress, version]
      properties:
        id:
          type: string
          format: uuid
        serviceOrderId:
          type: string
          format: uuid
        visitNo:
          type: integer
          minimum: 1
        plannedDate:
          type: string
          format: date
        plannedStartAt:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/ServiceVisitStatus"
        progress:
          type: array
          items:
            $ref: "#/components/schemas/ProgressEvent"
        startedAt:
          type: [string, "null"]
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 0
    PublishDeliveryRequest:
      type: object
      additionalProperties: false
      required: [issueCount, issueSummary, files]
      properties:
        towerCount:
          type: [integer, "null"]
          minimum: 0
        inspectedLengthMeters:
          type: [integer, "null"]
          minimum: 0
        metrics:
          description: 结果指标。metrics、towerCount、inspectedLengthMeters 至少有一项。
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/DeliveryMetric"
        issueCount:
          type: integer
          minimum: 0
        issueGroupBy:
          $ref: "#/components/schemas/IssueGroupBy"
        issueSummary:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/IssueSummary"
        files:
          description: 方案约定的文件类型各一份。
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/DeliveryFileInput"
    DeliveryMetric:
      type: object
      additionalProperties: false
      required: [code, label, value, unit]
      properties:
        code:
          type: string
          maxLength: 32
        label:
          type: string
          maxLength: 40
        value:
          description: 最多 6 位小数。
          type: number
          minimum: 0
          maximum: 999999999999999
        unit:
          type: string
          maxLength: 16
    IssueGroupBy:
      type: string
      default: SEVERITY
      enum: [SEVERITY, CATEGORY]
    IssueSummary:
      type: object
      additionalProperties: false
      required: [groupCode, groupName, count]
      properties:
        groupCode:
          type: string
          maxLength: 32
        groupName:
          type: string
          maxLength: 40
        count:
          type: integer
          minimum: 0
    DeliveryFileInput:
      type: object
      additionalProperties: false
      required: [fileId, type, displayName]
      properties:
        fileId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DeliveryFileType"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        pointCount:
          type: [integer, "null"]
          minimum: 0
        itemCount:
          description: 文件里的条目数，例如影像张数。
          type: [integer, "null"]
          minimum: 0
    Delivery:
      type: object
      additionalProperties: false
      required:
        - id
        - serviceOrderId
        - visitId
        - status
        - metrics
        - issueCount
        - issueGroupBy
        - issueSummary
        - files
        - publishedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        serviceOrderId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PUBLISHED, ACCEPTED]
        towerCount:
          type: [integer, "null"]
        inspectedLengthMeters:
          type: [integer, "null"]
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryMetric"
        issueCount:
          type: integer
        issueGroupBy:
          $ref: "#/components/schemas/IssueGroupBy"
        issueSummary:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
        files:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryFile"
        publishedAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        acceptedByName:
          type: [string, "null"]
        version:
          type: integer
          minimum: 0
    DeliveryFile:
      type: object
      additionalProperties: false
      required: [fileId, type, displayName, contentType, sizeBytes, status]
      properties:
        fileId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/DeliveryFileType"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        pointCount:
          type: [integer, "null"]
          minimum: 0
        itemCount:
          description: 文件里的条目数，例如影像张数。
          type: [integer, "null"]
          minimum: 0
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/FileStatus"
    DeliveryFileType:
      type: string
      enum: [IMAGE_ARCHIVE, DEFECT_LIST, POINT_KML, INSPECTION_REPORT]
    DownloadIntent:
      type: object
      additionalProperties: false
      required: [method, downloadUrl, suggestedFileName, expiresAt]
      properties:
        method:
          const: GET
        downloadUrl:
          type: string
          format: uri
        suggestedFileName:
          type: string
          maxLength: 180
        expiresAt:
          type: string
          format: date-time
    AcceptDeliveryRequest:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          const: true
        note:
          type: [string, "null"]
          maxLength: 500
    Acceptance:
      type: object
      additionalProperties: false
      required:
        - id
        - serviceOrderId
        - visitId
        - deliveryId
        - acceptedBy
        - acceptedAt
        - visitStatus
        - orderStatus
      properties:
        id:
          type: string
          format: uuid
        serviceOrderId:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        acceptedBy:
          type: string
          format: uuid
        acceptedByName:
          type: [string, "null"]
        acceptedAt:
          type: string
          format: date-time
        visitStatus:
          const: ACCEPTED
        orderStatus:
          $ref: "#/components/schemas/ServiceOrderStatus"
    CodeLabel:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string
