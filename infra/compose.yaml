name: inspection-local

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${INSPECTION_DB_NAME:?set INSPECTION_DB_NAME in .env}
      POSTGRES_USER: ${INSPECTION_DB_USERNAME:?set INSPECTION_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${INSPECTION_DB_PASSWORD:?set INSPECTION_DB_PASSWORD in .env}
    ports:
      - "${INSPECTION_APP_BIND_ADDRESS:-127.0.0.1}:${INSPECTION_POSTGRES_PORT:-5432}:5432"
    volumes:
      - inspection-postgres-data:/var/lib/postgresql/data
    networks:
      - inspection-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.2.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${INSPECTION_APP_BIND_ADDRESS:-127.0.0.1}:${INSPECTION_REDIS_PORT:-6379}:6379"
    volumes:
      - inspection-redis-data:/data
    networks:
      - inspection-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${INSPECTION_MINIO_ACCESS_KEY:?set INSPECTION_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${INSPECTION_MINIO_SECRET_KEY:?set INSPECTION_MINIO_SECRET_KEY in .env}
    ports:
      - "${INSPECTION_MINIO_BIND_ADDRESS:-127.0.0.1}:${INSPECTION_MINIO_API_PORT:-9000}:9000"
      - "${INSPECTION_MINIO_BIND_ADDRESS:-127.0.0.1}:${INSPECTION_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - inspection-minio-data:/data
    networks:
      - inspection-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      INSPECTION_ENVIRONMENT: ${INSPECTION_ENVIRONMENT:?set INSPECTION_ENVIRONMENT in .env}
      INSPECTION_MINIO_ENDPOINT: http://minio:9000
      INSPECTION_MINIO_ACCESS_KEY: ${INSPECTION_MINIO_ACCESS_KEY:?set INSPECTION_MINIO_ACCESS_KEY in .env}
      INSPECTION_MINIO_SECRET_KEY: ${INSPECTION_MINIO_SECRET_KEY:?set INSPECTION_MINIO_SECRET_KEY in .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - inspection-internal
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local "$${INSPECTION_MINIO_ENDPOINT}" "$${INSPECTION_MINIO_ACCESS_KEY}" "$${INSPECTION_MINIO_SECRET_KEY}";
        mc mb --ignore-existing "local/$${INSPECTION_ENVIRONMENT}-inspection-quarantine";
        mc anonymous set none "local/$${INSPECTION_ENVIRONMENT}-inspection-quarantine";
        mc mb --ignore-existing "local/$${INSPECTION_ENVIRONMENT}-inspection-private";
        mc anonymous set none "local/$${INSPECTION_ENVIRONMENT}-inspection-private";

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INSPECTION_ENVIRONMENT: ${INSPECTION_ENVIRONMENT:?set INSPECTION_ENVIRONMENT in .env}
      INSPECTION_DB_URL: jdbc:postgresql://postgres:5432/${INSPECTION_DB_NAME:?set INSPECTION_DB_NAME in .env}
      INSPECTION_DB_USERNAME: ${INSPECTION_DB_USERNAME:?set INSPECTION_DB_USERNAME in .env}
      INSPECTION_DB_PASSWORD: ${INSPECTION_DB_PASSWORD:?set INSPECTION_DB_PASSWORD in .env}
      INSPECTION_REDIS_HOST: redis
      INSPECTION_REDIS_PORT: 6379
      INSPECTION_REDIS_PASSWORD: ${INSPECTION_REDIS_PASSWORD:-}
      INSPECTION_MINIO_ENABLED: "true"
      INSPECTION_MINIO_ENDPOINT: http://minio:9000
      INSPECTION_MINIO_PUBLIC_ENDPOINT: ${INSPECTION_MINIO_PUBLIC_ENDPOINT:?set INSPECTION_MINIO_PUBLIC_ENDPOINT in .env}
      INSPECTION_MINIO_ACCESS_KEY: ${INSPECTION_MINIO_ACCESS_KEY:?set INSPECTION_MINIO_ACCESS_KEY in .env}
      INSPECTION_MINIO_SECRET_KEY: ${INSPECTION_MINIO_SECRET_KEY:?set INSPECTION_MINIO_SECRET_KEY in .env}
      INSPECTION_JWT_HMAC_BASE64_SECRET: ${INSPECTION_JWT_HMAC_BASE64_SECRET:?set INSPECTION_JWT_HMAC_BASE64_SECRET in .env}
      INSPECTION_DATA_ENCRYPTION_BASE64_KEY: ${INSPECTION_DATA_ENCRYPTION_BASE64_KEY:?set INSPECTION_DATA_ENCRYPTION_BASE64_KEY in .env}
      INSPECTION_RESERVATION_ALLOWED_MIME_TYPES: ${INSPECTION_RESERVATION_ALLOWED_MIME_TYPES:?set INSPECTION_RESERVATION_ALLOWED_MIME_TYPES in .env}
      INSPECTION_CORS_ALLOWED_ORIGINS: ${INSPECTION_CORS_ALLOWED_ORIGINS:?set INSPECTION_CORS_ALLOWED_ORIGINS in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${INSPECTION_BACKEND_BIND_ADDRESS:-127.0.0.1}:${INSPECTION_APP_PORT:-8080}:8080"
    networks:
      - inspection-internal

networks:
  inspection-internal:
    driver: bridge

volumes:
  inspection-postgres-data:
  inspection-redis-data:
  inspection-minio-data:
