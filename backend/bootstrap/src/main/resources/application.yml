spring:
  datasource:
    url: ${INSPECTION_DB_URL}
    username: ${INSPECTION_DB_USERNAME}
    password: ${INSPECTION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  # 运营端资质附件（S3-1）单个不超过 10 MB（身份模块自己再查）；运营端素材上传（/api/v1/ops/media）图片 ≤5 MB、
  # 视频 ≤50 MB（OpsMediaService 自己再查）；其余接口都不收文件。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  data:
    redis:
      host: ${INSPECTION_REDIS_HOST}
      port: ${INSPECTION_REDIS_PORT:6379}
      username: ${INSPECTION_REDIS_USERNAME:}
      password: ${INSPECTION_REDIS_PASSWORD:}
      ssl:
        enabled: ${INSPECTION_REDIS_SSL:false}
      timeout: ${INSPECTION_REDIS_TIMEOUT:2s}

security:
  jwt:
    hmac-base64-secret: ${INSPECTION_JWT_HMAC_BASE64_SECRET}
  cors:
    allowed-origins: ${INSPECTION_CORS_ALLOWED_ORIGINS:}

mybatis-plus:
  type-handlers-package: com.lowaltitude.inspection.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true

inspection:
  payment:
    nodes-enabled: ${INSPECTION_PAYMENT_NODES_ENABLED:false}
  infrastructure:
    redis:
      application-namespace: ${INSPECTION_REDIS_APPLICATION_NAMESPACE:low-altitude}
      business-namespace: ${INSPECTION_REDIS_BUSINESS_NAMESPACE:inspection}
      idempotency-ttl: ${INSPECTION_IDEMPOTENCY_TTL:24h}
      city-search-selection-rate-limit:
        limit: ${INSPECTION_CITY_SEARCH_SELECTION_RATE_LIMIT:20}
        window: ${INSPECTION_CITY_SEARCH_SELECTION_RATE_WINDOW:60s}
    storage:
      enabled: ${INSPECTION_MINIO_ENABLED:false}
      environment: ${INSPECTION_ENVIRONMENT}
      endpoint: ${INSPECTION_MINIO_ENDPOINT:}
      public-endpoint: ${INSPECTION_MINIO_PUBLIC_ENDPOINT:}
      region: ${INSPECTION_MINIO_REGION:us-east-1}
      access-key: ${INSPECTION_MINIO_ACCESS_KEY:}
      secret-key: ${INSPECTION_MINIO_SECRET_KEY:}
      upload-ttl: ${INSPECTION_MINIO_UPLOAD_TTL:5m}
      download-ttl: ${INSPECTION_MINIO_DOWNLOAD_TTL:10m}
      reservation-allowed-mime-types: ${INSPECTION_RESERVATION_ALLOWED_MIME_TYPES:}

management:
  endpoint:
    health:
      show-details: never

platform:
  weather:
    enabled: ${PLATFORM_WEATHER_ENABLED:false}
    api-key: ${PLATFORM_WEATHER_API_KEY:}
    cache-key-prefix: ${PLATFORM_WEATHER_CACHE_KEY_PREFIX:low-altitude:platform:weather}
    last-success-ttl: ${PLATFORM_WEATHER_LAST_SUCCESS_TTL:24h}
  # 平台文件存储（S6）：运营端素材、商品图片、批量导入文件、机构资质附件、服务订单交付文件、售后凭证六类共用。
  # local（默认）= 只有 application-dev.yml 配的本机目录可用，其他环境上传下载返回 503；s3 = S3 兼容对象存储（MinIO 可用），
  # 启动前自检配置（PlatformStoragePreflight），缺项不启动。地址、账号默认沿用巡检的 MinIO 配置；密钥只走环境变量。
  # 巡检预约附件和交付文件仍走上面的 inspection.infrastructure.storage。
  storage:
    provider: ${PLATFORM_STORAGE_PROVIDER:local}
    s3:
      endpoint: ${PLATFORM_STORAGE_S3_ENDPOINT:${INSPECTION_MINIO_ENDPOINT:}}
      region: ${PLATFORM_STORAGE_S3_REGION:${INSPECTION_MINIO_REGION:us-east-1}}
      access-key: ${PLATFORM_STORAGE_S3_ACCESS_KEY:${INSPECTION_MINIO_ACCESS_KEY:}}
      secret-key: ${PLATFORM_STORAGE_S3_SECRET_KEY:${INSPECTION_MINIO_SECRET_KEY:}}
      private-bucket: ${PLATFORM_STORAGE_S3_PRIVATE_BUCKET:}
      public-bucket: ${PLATFORM_STORAGE_S3_PUBLIC_BUCKET:}
      public-base-url: ${PLATFORM_STORAGE_S3_PUBLIC_BASE_URL:}
      path-style: ${PLATFORM_STORAGE_S3_PATH_STYLE:true}
      connect-timeout: ${PLATFORM_STORAGE_S3_CONNECT_TIMEOUT:3s}
      request-timeout: ${PLATFORM_STORAGE_S3_REQUEST_TIMEOUT:30s}
  # 首个平台运营账号的一次性引导（S6，docs/ops/部署与回滚.md §3.1）：login 为空时什么都不做；账号已存在时不改任何东西。
  # 口令用 password-file（推荐）或 password，二选一；建好后把这几个环境变量和口令文件删掉。
  bootstrap:
    operator:
      login: ${PLATFORM_BOOTSTRAP_OPERATOR_LOGIN:}
      password: ${PLATFORM_BOOTSTRAP_OPERATOR_PASSWORD:}
      password-file: ${PLATFORM_BOOTSTRAP_OPERATOR_PASSWORD_FILE:}
      display-name: ${PLATFORM_BOOTSTRAP_OPERATOR_DISPLAY_NAME:}

# 微信支付（平台收付通）。默认关闭；关闭时没有支付渠道，发起支付回“渠道不可用”。
# 两个 PEM 文件只给服务器上的路径；APIv3 密钥只走环境变量。都不要写进仓库。
trade:
  wechat:
    enabled: ${TRADE_WECHAT_ENABLED:false}
    sp-mchid: ${TRADE_WECHAT_SP_MCHID:}
    sp-appid: ${TRADE_WECHAT_SP_APPID:}
    merchant-serial-no: ${TRADE_WECHAT_MERCHANT_SERIAL_NO:}
    merchant-private-key-path: ${TRADE_WECHAT_MERCHANT_PRIVATE_KEY_PATH:}
    api-v3-key: ${TRADE_WECHAT_API_V3_KEY:}
    platform-public-key-id: ${TRADE_WECHAT_PLATFORM_PUBLIC_KEY_ID:}
    platform-public-key-path: ${TRADE_WECHAT_PLATFORM_PUBLIC_KEY_PATH:}
    api-base: ${TRADE_WECHAT_API_BASE:https://api.mch.weixin.qq.com}
    payment-notify-url: ${TRADE_WECHAT_PAYMENT_NOTIFY_URL:}
    refund-notify-url: ${TRADE_WECHAT_REFUND_NOTIFY_URL:}
    signature-tolerance: ${TRADE_WECHAT_SIGNATURE_TOLERANCE:5m}
    connect-timeout: ${TRADE_WECHAT_CONNECT_TIMEOUT:3s}
    read-timeout: ${TRADE_WECHAT_READ_TIMEOUT:10s}

# 直播（M20）。直播服务商未定：provider 只有 dev profile 下的 fake（本机模拟）可用，其他值一律“不可用”
# （建不了直播间、回调全部拒绝）。弹幕词表是开发用的小词表，逗号分隔；生产换内容审核服务。
live:
  stream:
    provider: ${LIVE_STREAM_PROVIDER:none}
  comments:
    blocked-words: ${LIVE_COMMENT_BLOCKED_WORDS:加微信,加vx,加v信,私下交易,私下转账,代开发票,刷单,赌博,博彩}

# 推送（S5-9）。推送服务商未定：provider 只有 dev profile 下的 fake（本机模拟，记日志和开发表）可用，
# 其他值一律不推送（站内信照记）。
notification:
  push:
    provider: ${NOTIFICATION_PUSH_PROVIDER:none}
