# Development profile intentionally supplies no infrastructure secrets or environment fallback.
# Compose and other deployment environments must provide INSPECTION_ENVIRONMENT explicitly.

# 直播（M20）：开发环境用本机模拟直播服务（FakeLiveStreamProvider）；它的签名密钥每次启动随机生成，不是基础设施密钥。
# 开播、断流、结束用开发控制接口模拟：node infra/scripts/dev-live-host.cjs start|interrupt|end <直播间 ID>。
live:
  stream:
    provider: fake

# 推送（S5-9）：开发环境用本机模拟推送（FakePushGateway），每条推送记日志和 notification_push_fake_delivery；
# 登录后 GET /api/v1/dev/notifications/push-deliveries 看自己收到的。
notification:
  push:
    provider: fake
