<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ME-03 加入组织邀请确认</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="inviteState"><option selected>待确认</option><option>已过期</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 900px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Messages.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">加入组织邀请</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 14px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px; background: #e6f0ff; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8l6-4v16M10 20h10V10l-10-2M14 13h2M14 16h2"></path></svg></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 18px; font-weight: 700; line-height: 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">东营港务物流</span>
          <span style="display: flex; gap: 6px;">
            <span style="padding: 1px 6px; border-radius: 6px; background: #e2f6ed; color: #11804a; font-size: 12px; line-height: 18px; white-space: nowrap;">资料已认证</span>
            <span style="padding: 1px 6px; border-radius: 6px; background: #e6f0ff; color: #1d63c4; font-size: 12px; line-height: 18px; white-space: nowrap;">企业</span>
          </span>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #536178;">王女士邀请你加入这个组织，加入后你可以用组织身份发布需求、确认合同订单和验收。</p>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px 10px; padding: 12px; border-radius: 10px; background: #f5f7fc; font-size: 13px; line-height: 19px;">
        <sc-for list="{{info}}" as="r" hint-placeholder-count="5">
          <span style="color: #627187; white-space: nowrap;">{{r.k}}</span><span style="min-width: 0; color: {{r.c}};">{{r.v}}</span>
        </sc-for>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap;">加入后的角色</h2>
        <span style="flex-shrink: 0; padding: 1px 6px; border-radius: 6px; background: #fff0e3; color: #ba470b; font-size: 12px; line-height: 18px; white-space: nowrap;">经办人</span>
      </div>
      <sc-for list="{{powers}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px; font-size: 13px; line-height: 19px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#159a70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          <span style="min-width: 0; color: #536178;">{{p.t}}</span>
        </div>
      </sc-for>
      <div style="display: flex; gap: 8px; font-size: 13px; line-height: 19px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <span style="min-width: 0; color: #738096;">管理成员、调整角色和组织资料由负责人操作</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0 0 2px; font-size: 16px; font-weight: 700; line-height: 22px;">加入须知</h2>
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px; font-size: 13px; line-height: 19px;">
          <span style="flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; background: #eef2f8; color: #627187; font-size: 11px; line-height: 18px; text-align: center;">{{n.n}}</span>
          <span style="min-width: 0; color: #536178;">{{n.t}}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 6px; padding: 0 4px; font-size: 12px; line-height: 18px; color: #627187;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#738096" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>
      <span style="min-width: 0;">不认识邀请人或没有申请过加入，请直接拒绝。拒绝后邀请人可以重新发送邀请。</span>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-if value="{{declined}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: #eef2f8;">
        <span style="font-size: 14px; font-weight: 700; line-height: 20px;">已拒绝加入 东营港务物流</span>
        <span style="font-size: 12px; line-height: 17px; color: #536178;">11/03 10:36 · 如需加入，请让邀请人重新发送邀请</span>
      </div>
    </sc-if>
    <sc-if value="{{expired}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #fff0e3;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ba470b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 14px; font-weight: 700; line-height: 20px; color: #ba470b;">邀请已过期</span>
          <span style="font-size: 12px; line-height: 17px; color: #536178;">邀请只在 [协议约定时间] 内有效，请让邀请人重新发送</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 10px;">
        <button type="button" aria-haspopup="dialog" onClick="{{openDecline}}" style="flex-shrink: 0; width: 108px; height: 46px; box-sizing: border-box; margin: 0; padding: 0; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; white-space: nowrap; cursor: pointer;">拒绝</button>
        <a href="OrgDetail.dc.html" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">同意加入</a>
      </div>
    </sc-if>
    <sc-if value="{{settled}}" hint-placeholder-val="{{false}}">
      <a href="Messages.dc.html" style="height: 46px; box-sizing: border-box; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; color: #202c42; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">返回消息</a>
    </sc-if>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeSheet}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="拒绝邀请" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <span style="font-size: 18px; font-weight: 700; line-height: 25px;">拒绝加入 东营港务物流？</span>
      <span style="font-size: 14px; line-height: 20px; color: #536178;">拒绝后这条邀请失效，邀请人会收到通知，需要时可以重新邀请你。</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{closeSheet}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">再想想</button>
        <button type="button" onClick="{{confirmDecline}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; background: #ff6a00; font: inherit; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer;">确认拒绝</button>
      </div>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03。这是被邀请人一侧：王女士（经办人）在 OrgMembers 发出邀请后，对方在“消息”里打开这页确认
    // 被邀请人是另一个登录账号（示例 136****0921），不是王女士；同意加入直接进 OrgDetail，拒绝留在本页
    // sheet：拒绝确认面板是否打开；declined：是否已拒绝；已过期态在 Tweaks 的 inviteState 切换
    this.state = { sheet: false, declined: false };
  }
  renderVals() {
    const { sheet, declined } = this.state;
    const expired = (this.props.inviteState ?? '待确认') === '已过期' && !declined;
    const pending = !expired && !declined;
    const c = '#202c42';
    const info = [
      { k: '邀请人', v: '王女士（经办人）', c },
      { k: '加入角色', v: '经办人', c },
      { k: '发出时间', v: '11/03 10:30', c },
      { k: '有效期', v: '[协议约定时间] 内', c },
      { k: '加入账号', v: '136****0921（当前登录）', c: '#627187' }
    ];
    // 经办人权限与 OrgMembers 的角色说明一致
    const powers = [
      { t: '发布需求、比较报价、确认合同订单' },
      { t: '以组织身份支付和验收' },
      { t: '查看组织的需求、合同和订单' }
    ];
    // 退出组织的入口是设计假设，放在“我的 → 企业组织”
    const notes = [
      { n: '1', t: '以组织身份发布的需求、合同和订单归组织所有' },
      { n: '2', t: '负责人可以调整你的角色或把你移出组织' },
      { n: '3', t: '加入后可以在“我的 → 企业组织”退出（设计假设）' }
    ];
    return {
      info, powers, notes,
      pending, expired, declined,
      settled: declined || expired,
      sheetOpen: sheet,
      openDecline: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      // 拒绝只发生在待确认时；拒绝后不能再同意，只能等重新邀请
      confirmDecline: () => this.setState({ sheet: false, declined: true })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"inviteState":"待确认"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
