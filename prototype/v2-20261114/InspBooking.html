    <div role="dialog" aria-modal="true" aria-label="选择服务时间" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; background: #fff;">
      <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; margin-top: 8px; border-radius: 2px; background: #c9d3e1;"></span>
      <div style="position: relative; display: flex; align-items: center; justify-content: center; height: 48px;">
        <span style="font-size: 18px; font-weight: 700; line-height: 25px; white-space: nowrap;">选择服务时间</span>
        <button type="button" onClick="{{closeSheet}}" aria-label="关闭" style="position: absolute; top: 2px; right: 6px; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; padding: 4px 16px 12px;">
        <span style="font-size: 15px; font-weight: 700; line-height: 21px;">选择日期</span>
        <div role="group" aria-label="选择日期" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px;">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; height: 56px; box-sizing: border-box; margin: 0; padding: 0; border-radius: 10px; border: 1px solid {{d.bd}}; background: {{d.bg}}; font: inherit; color: {{d.fg}}; cursor: pointer;">
              <span style="font-size: 14px; font-weight: {{d.w}}; line-height: 20px; white-space: nowrap;">{{d.week}}</span>
              <span style="font-size: 12px; line-height: 17px; white-space: nowrap;">{{d.date}}</span>
            </button>
          </sc-for>
          <a href="CalendarPick.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; height: 56px; box-sizing: border-box; margin: 0; padding: 0; border-radius: 10px; border: 1px solid #e5ebf3; background: #fff; font: inherit; color: #536178; text-decoration: none; cursor: pointer;">
            <span style="font-size: 13px; line-height: 18px; white-space: nowrap;">更多日期</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#738096" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </div>
        <span style="margin-top: 18px; font-size: 15px; font-weight: 700; line-height: 21px;">选择时段</span>
        <div role="group" aria-label="选择时段" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 10px;">
          <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
            <button type="button" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" disabled="{{s.locked}}" onClick="{{s.pick}}" style="display: flex; align-items: center; justify-content: center; min-width: 0; height: 44px; box-sizing: border-box; margin: 0; padding: 0 4px; border-radius: 10px; border: 1px solid {{s.bd}}; background: {{s.bg}}; font: inherit; font-size: {{s.fs}}; font-weight: {{s.w}}; line-height: 20px; color: {{s.fg}}; white-space: nowrap; cursor: {{s.cur}};">{{s.text}}</button>
          </sc-for>
        </div>
        <span style="margin-top: 10px; font-size: 13px; line-height: 18px; color: #627187;">预计服务时长3小时</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px; border-top: 1px solid #e5ebf3;">
        <span style="font-size: 15px; line-height: 21px; white-space: nowrap;">{{summary}}</span>
        <button type="button" disabled="{{confirmOff}}" onClick="{{confirmTime}}" style="width: 100%; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: {{confirmBg}}; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: {{confirmCursor}};">确定</button>
      </div>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03 14:30，王女士（个人账号）从服务详情进来，还没填表。线路长度和联系人带默认值
    // hasPlace：是否已选巡检地点（第一次点地点行回填示例地址，之后地点行是去地图选点页的链接）；
    // time：已确定的 { day, slot }，没选时为 null；picked：已选的巡检项目；
    // files：已加附件 [{ id, failed }]；submitError：上次点“提交预约”被拦下的那条校验文案；
    // filesHint：第三次点上传框时，“更多文件”未绘制的提示；
    // sheet：时段弹层是否打开；day、slot：弹层里的草稿，点“确定”才写入 time
    this.state = {
      hasPlace: false, len: '8', time: null, picked: [], files: [], note: '',
      contact: '王女士', phone: '138****2026', agree: false, submitError: '', filesHint: false,
      sheet: false, day: 'fri', slot: ''
    };
  }
  renderVals() {
    const { hasPlace, len, time, picked, files, note, contact, phone, agree, submitError, filesHint, sheet, day, slot } = this.state;

    // 周四 11/05、周五 11/06。原型“今天”= 11/03（周二）
    const dayList = [
      { id: 'today', week: '今天', date: '11月3日' },
      { id: 'tomorrow', week: '明天', date: '11月4日' },
      { id: 'thu', week: '周四', date: '11月5日' },
      { id: 'fri', week: '周五', date: '11月6日' }
    ];
    const dateOf = (id) => dayList.find((d) => d.id === id).date;
    const slotList = ['09:00–12:00', '14:00–17:00', '18:00–21:00'];
    // 不可用时段写原因，其余都可选
    const locks = {
      today: { '09:00–12:00': '需提前1小时预约', '14:00–17:00': '需提前1小时预约' },
      tomorrow: {},
      thu: { '14:00–17:00': '已约满' },
      fri: { '18:00–21:00': '已约满' }
    };

    const days = dayList.map((d) => {
      const on = d.id === day;
      return {
        week: d.week, date: d.date, pressed: on ? 'true' : 'false',
        bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fff0e3' : '#fff', fg: on ? '#ba470b' : '#202c42', w: on ? 500 : 400,
        // 换日期后清掉已选时段；点当前日期不清
        pick: () => this.setState((s) => (s.day === d.id ? {} : { day: d.id, slot: '' }))
      };
    });
    const slots = slotList.map((t) => {
      const reason = locks[day][t] || '';
      const on = !reason && t === slot;
      return {
        text: reason || t,
        // 格子里只写原因（照代码），读屏仍要知道是哪个时段
        aria: reason ? t + ' ' + reason : t,
        locked: Boolean(reason), pressed: on ? 'true' : 'false',
        bd: reason ? '#eef2f8' : (on ? '#ff6a00' : '#e5ebf3'),
        bg: reason ? '#eef2f8' : (on ? '#fff0e3' : '#fff'),
        fg: reason ? '#738096' : (on ? '#ba470b' : '#202c42'),
        fs: reason ? '13px' : '15px', w: on ? 500 : 400, cur: reason ? 'not-allowed' : 'pointer',
        pick: () => this.setState((s) => (locks[s.day][t] ? {} : { slot: t }))
      };
    });

    const items = ['杆塔本体巡检', '导线地线巡检', '绝缘子及金具巡检', '通道环境巡检'].map((label) => {
      const on = picked.includes(label);
      return {
        label, on, off: !on, pressed: on ? 'true' : 'false',
        bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fff0e3' : '#fff',
        toggle: () => this.setState((s) => ({
          picked: s.picked.includes(label) ? s.picked.filter((x) => x !== label) : s.picked.concat(label)
        }))
      };
    });

    // 上传框第 1 次点加线路图，第 2 次加现场照片（这份固定上传失败，重试后恢复）
    const samples = { route: '线路走向图.jpg', photo: '现场照片.pdf' };
    const fileCards = files.map((f) => ({
      name: samples[f.id], failed: f.failed,
      status: f.failed ? '上传失败' : '已选择，提交时上传',
      sc: f.failed ? '#d64f67' : '#738096',
      retryAria: '重试' + samples[f.id],
      removeAria: '移除' + samples[f.id],
      retry: () => this.setState((s) => ({ files: s.files.map((x) => (x.id === f.id ? { id: x.id, failed: false } : x)) })),
      remove: () => this.setState((s) => ({ files: s.files.filter((x) => x.id !== f.id), filesHint: false }))
    }));

    // 提交校验顺序与 validateBookingDraft 一致，只显示第一条
    const km = Number(len.trim());
    const mobile = phone.trim();
    const rules = [
      [!hasPlace, '请填写巡检地点'],
      [!(Number.isFinite(km) && km > 0), '请填写有效的线路长度'],
      [!time, '请选择期望巡检时间'],
      [picked.length === 0, '请至少选择一个巡检项目'],
      [contact.trim() === '', '请填写联系人'],
      [!(mobile === '138****2026' || /^1\d{10}$/.test(mobile)), '请填写正确的手机号'],
      [!agree, '请阅读并同意服务协议'],
      [files.some((f) => f.failed), '请重试上传失败的附件']
    ];
    const broken = rules.find((r) => r[0]);
    const firstError = broken ? broken[1] : '';
    // 红字只在点过“提交预约”后出现；被拦下的那一项改好后立刻消失，下一条要再点一次才显示
    const shownError = submitError === firstError ? firstError : '';

    return {
      items, days, slots, files: fileCards, hasFiles: files.length > 0,
      hasPlace, noPlace: !hasPlace,
      timeLabel: time ? dateOf(time.day) + ' ' + time.slot : '请选择服务时间',
      timeColor: time ? '#202c42' : '#738096',
      len, note, contact, phone, agree, notAgree: !agree,
      hasError: shownError !== '', shownError,
      canSubmit: firstError === '', blocked: firstError !== '',
      hasHint: filesHint,
      // 提示压在底部绿色提示行上，不挡表单和校验红字。红字显示时绿色提示行上移 24px，提示跟着上移
      hintBottom: shownError ? '134px' : '110px',
      sheet,
      summary: slot ? '已选择：' + dateOf(day) + ' ' + slot : '请选择日期和时段',
      confirmOff: !slot, confirmBg: slot ? '#ff6a00' : '#c9d3e1', confirmCursor: slot ? 'pointer' : 'not-allowed',

      closeHint: () => this.setState({ filesHint: false }),
      // 第一次点代表从地图选点页回填的结果；回填后这一行改成去地图选点页的链接
      pickPlace: () => this.setState({ hasPlace: true }),
      setLen: (e) => { if (e && e.target) this.setState({ len: String(e.target.value || '') }); },
      setNote: (e) => { if (e && e.target) this.setState({ note: String(e.target.value || '') }); },
      setContact: (e) => { if (e && e.target) this.setState({ contact: String(e.target.value || '') }); },
      setPhone: (e) => { if (e && e.target) this.setState({ phone: String(e.target.value || '') }); },
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      addFile: () => this.setState((s) => {
        const has = (id) => s.files.some((f) => f.id === id);
        if (!has('route')) return { files: s.files.concat({ id: 'route', failed: false }), filesHint: false };
        if (!has('photo')) return { files: s.files.concat({ id: 'photo', failed: true }), filesHint: false };
        // 原型只有这两份样例，第三次点提示未绘制
        return { filesHint: true };
      }),
      // 打开弹层时草稿回到已确定的时间；没确定过就停在周五、时段未选
      openPicker: () => this.setState((s) => ({
        sheet: true, filesHint: false,
        day: s.time ? s.time.day : 'fri', slot: s.time ? s.time.slot : ''
      })),
      closeSheet: () => this.setState({ sheet: false }),
      confirmTime: () => this.setState((s) => (s.slot ? { time: { day: s.day, slot: s.slot }, sheet: false } : {})),
      submit: () => this.setState({ submitError: firstError, filesHint: false })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
