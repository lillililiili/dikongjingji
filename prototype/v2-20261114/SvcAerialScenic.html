class Component extends DCLogic {
  constructor(...args) {

  renderVals() {
    const { playing } = this.state;
    const capabilities = ['视频素材', '持证飞手', '可剪短片'];
    // 价格与取消：计价方式和头部价格一致；确认方案后的取消细则没定，只写“按方案约定”
    const priceRows = [
      ['计价方式', '按次计价，真实金额以方案报价为准'], ['影响价格', '取景地数量、拍摄时段、是否剪辑'], ['取消说明', '方案确认前取消不收费，确认后按方案约定']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    // 样片是占位图，正式产品显示服务商上传的作品
    const samples = [
      { img: '_blob/248020917b29731ae2eb5c415d406dd0.webp' },
      { img: '_blob/ee1e30b9b857f7be121fae8b2cad93e7.webp' }
    ];
    const scope = [
      ['城市风光', 'M4 21V10l6-3v14M10 21V4l10 4v13M2 21h20M13.5 11h3M13.5 15h3'],
      ['景区宣传', 'M4 20h16M7 20v-6M12 20V9M17 20V5'],
      ['短片素材', 'M6 21V4M6 5h12l-3 3.5 3 3.5H6'],
      ['延时与航线', 'M4 6h16v13H4zM4 10h16M8 6l2 4M14 6l2 4']
    ].map(([label, d]) => ({ label, d }));
    // 分辨率、时长、张数都由方案约定，这里不写死
    const outputs = [
      { label: '视频素材', sub: '原始素材，分辨率和时长按方案约定', d: 'M4 6h12v12H4zM16 10.5l4-2.5v8l-4-2.5' },
      { label: '照片', sub: '高清原图，张数按方案约定', d: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9.5h.01' }
    ];
    // 流程文案同定稿 12 专业服务频道：提交需求、报价比选、现场履约、报告验收
    const steps = [
      ['提交需求', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4'],
      ['报价比选', 'M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4'],
      ['现场拍摄', 'M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3'],
      ['成果验收', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d], i, arr) => ({ label, d, arrow: i < arr.length - 1 }));
    const guarantees = [
      ['持证飞手', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['合规飞行', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 10.5h6M9 14h6'],
      ['素材保密', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 11.5h5V15h-5zM10.5 11.5V10a1.5 1.5 0 0 1 3 0v1.5']
    ].map(([label, d]) => ({ label, d }));
    return {
      capabilities, priceRows, samples, scope, outputs, steps, guarantees,
      playing, paused: !playing,
      playAria: playing ? '暂停视频样片' : '播放视频样片',
      // 播放态在占位角标上显示进度示例
      sampleLabel: playing ? '00:12 / 01:30' : '视频样片占位',
      togglePlay: () => this.setState((s) => ({ playing: !s.playing }))
    };
  }
}
