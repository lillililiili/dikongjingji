</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // ship：express 快递配送 / pickup 到店自提（自提时隐藏收货地址卡，显示自提点）
    // agree：交易协议勾选，默认不勾（同预约页、登录页）；tip：没勾时点过“提交订单”，按钮上方提示先同意
    // note：给商家的留言（选填）
    this.state = { ship: 'express', agree: false, tip: false, note: '' };
  }
  renderVals() {
    const { ship, agree, tip, note } = this.state;
    const shipOf = (id) => {
      const on = id === ship;
      return {
        on,
        bd: on ? '#ff6a00' : '#e5ebf3',
        bg: on ? '#fffaf5' : '#fff',
        tc: on ? '#ba470b' : '#202c42',
        tw: on ? 500 : 400,
        pick: () => this.setState({ ship: id })
      };
    };
    return {
      shipExpress: shipOf('express'),
      shipPickup: shipOf('pickup'),
      // 两种配送方式运费都是 ¥0，应付金额不随配送方式变化
      isExpress: ship === 'express',
      isPickup: ship === 'pickup',
      note,
      // 输入框 onChange 才带事件对象；没有事件对象时保持原值。留言最多 50 字
      setNote: (e) => { if (e && e.target) this.setState({ note: String(e.target.value || '').slice(0, 50) }); },
      agree,
      notAgree: !agree,
      // 勾选或取消都清掉提示；没勾时“提交订单”仍可点，点了只提示先同意，不进收银台
      agreeTip: tip && !agree,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree, tip: false })),
      tapSubmit: () => this.setState({ tip: true })
    };
  }
}
