<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MALL-05 验收款收银台 · 单次</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">{{title}}</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <sc-if value="{{isPay}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px 16px 20px; border-radius: 14px; background: #fff;">
        <span style="font-size: 13px; line-height: 18px; color: #627187;">应付金额</span>
        <span style="font-size: 36px; line-height: 44px; font-weight: 700; color: #e85400;">¥4,200</span>
        <span style="margin-top: 4px; padding: 4px 10px; border-radius: 999px; background: #fff0e3; font-size: 12px; line-height: 17px; color: #ba470b;">付款节点 2 · 验收后付款 70%（已验收）</span>
      </div>
    </sc-if>

    <sc-if value="{{isPending}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 16px 24px; border-radius: 14px; background: #fff; text-align: center;">
        <span style="width: 56px; height: 56px; border-radius: 50%; background: #fff0e3; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></span>
        <span style="font-size: 18px; line-height: 25px; font-weight: 700;">支付结果确认中</span>
        <span style="font-size: 13px; line-height: 19px; color: #536178;">正在向支付渠道确认结果，请勿重复支付</span>
        <span style="font-size: 13px; line-height: 19px; color: #627187;">应付金额 ¥4,200</span>
      </div>
    </sc-if>

    <sc-if value="{{isPaid}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 16px 24px; border-radius: 14px; background: #fff; text-align: center;">
        <span style="width: 56px; height: 56px; border-radius: 50%; background: #e2f6ed; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#159a70" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
        <span style="font-size: 18px; line-height: 25px; font-weight: 700;">验收款已支付</span>
        <span style="font-size: 28px; line-height: 36px; font-weight: 700; color: #e85400;">¥4,200</span>
        <span style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap;"><span>全部款项已结清，服务单已完成</span><span>支付结果以支付渠道回执为准</span></span>
      </div>
    </sc-if>

    <sc-if value="{{isFail}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 16px 24px; border-radius: 14px; background: #fff; text-align: center;">
        <span style="width: 56px; height: 56px; border-radius: 50%; background: #fdecec; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d64f67" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"></path></svg></span>
        <span style="font-size: 18px; line-height: 25px; font-weight: 700;">支付失败</span>
        <span style="font-size: 13px; line-height: 19px; color: #536178;">支付未成功，如已扣款将原路退回</span>
        <span style="font-size: 13px; line-height: 19px; color: #627187;">验收款仍为待支付</span>
      </div>
    </sc-if>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px; border-radius: 14px; background: #fff;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid {{r.bd}}; font-size: 14px; line-height: 20px;">
          <span style="flex-shrink: 0; width: 70px; color: #627187; white-space: nowrap;">{{r.k}}</span>
          <span style="flex-grow: 1; min-width: 0;">{{r.v}}</span>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{isPay}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px 12px; border-radius: 14px; background: #fff;">
        <h2 style="margin: 0; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 700;">支付方式</h2>
        <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ff6a00; background: #fffaf5;">
          <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; background: #fff0e3; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 7V6a2 2 0 0 1 2-2h10v3M16 13.5h.01"></path></svg></span>
          <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; font-weight: 500;">[主用支付渠道]</span>
          <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
        </div>
        <span style="margin-top: 8px; font-size: 12px; line-height: 17px; color: #738096;">目前只支持这一种支付方式</span>
      </div>
    </sc-if>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 16px 12px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-if value="{{isPay}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{pay}}" style="height: 46px; border-radius: 999px; border: 0; background: #ff6a00; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer;">确认支付 ¥4,200</button>
      <a href="DeliveryOne.dc.html" style="align-self: center; min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; color: #627187; text-decoration: none;">取消支付</a>
    </sc-if>
    <sc-if value="{{isPending}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{showFail}}" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">支付遇到问题</button>
        <button type="button" onClick="{{refresh}}" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 0; background: #ff6a00; color: #fff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">刷新结果</button>
      </div>
    </sc-if>
    <sc-if value="{{isPaid}}" hint-placeholder-val="{{false}}">
      <a href="FulfillOneDone.dc.html" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">查看服务进度</a>
    </sc-if>
    <sc-if value="{{isFail}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 10px;">
        <a href="DeliveryOne.dc.html" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; color: #202c42; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center;">返回交付与验收</a>
        <button type="button" onClick="{{retry}}" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 0; background: #ff6a00; color: #fff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;">重新支付</button>
      </div>
    </sc-if>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 验收款收银台：11/07 15:30 验收（在 DeliveryOne）通过后支付 ¥4,200（服务订单付款节点 2）
    // step：pay 待支付 → pending 确认中 → paid 已支付 / fail 失败；结果只以服务端收到的渠道回执为准
    this.state = { step: 'pay' };
  }
  renderVals() {
    const { step } = this.state;
    const base = [
      ['服务订单', '电力线路巡检 · 方案 v1'],
      ['收款方', '示例电力巡检服务商 · 经平台支付渠道'],
      ['付款主体', '王女士（个人身份）']
    ];
    const extra = step === 'paid'
      ? [['渠道交易号', '[渠道交易号]'], ['支付方式', '[主用支付渠道]']]
      : [['付款节点', '首付已付 · 验收后付 ¥4,200']];
    const rows = base.concat(extra).map((r, i) => ({ k: r[0], v: r[1], bd: i === 0 ? 'transparent' : '#f0f1f3' }));
    const titles = { pay: '收银台', pending: '支付结果', paid: '支付结果', fail: '支付结果' };
    return {
      title: titles[step],
      isPay: step === 'pay',
      isPending: step === 'pending',
      isPaid: step === 'paid',
      isFail: step === 'fail',
      rows,
      // 已支付帧的返回去下一步（服务进度），其余帧回到交付与验收
      backHref: step === 'paid' ? 'FulfillOneDone.dc.html' : 'DeliveryOne.dc.html',
      pay: () => this.setState({ step: 'pending' }),
      refresh: () => this.setState({ step: 'paid' }),
      showFail: () => this.setState({ step: 'fail' }),
      retry: () => this.setState({ step: 'pay' })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
