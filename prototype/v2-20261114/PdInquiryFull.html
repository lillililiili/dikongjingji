        <button type="button" onClick="{{closeExp}}" aria-label="收起" style="flex-shrink: 0; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536178" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{ways}}" as="w" hint-placeholder-count="2">
        <a href="{{w.href}}" style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; border: 1.5px solid #e5ebf3; text-decoration: none; color: #202c42;">
          <div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: {{w.ibg}}; display: flex; align-items: center; justify-content: center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{w.ifg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.d}}"></path></svg>
          </div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 16px; font-weight: 700; white-space: nowrap;">{{w.t}}</span>
              <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: {{w.ibg}}; color: {{w.ifg}}; white-space: nowrap;">{{w.kind}}</span>
            </div>
            <span style="font-size: 13px; color: #536178; line-height: 1.5;">{{w.desc}}</span>

</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // open：参数 / 包装清单 / 图文介绍 哪一块展开（'' 表示都收起）
    this.state = { open: 'spec', expOpen: false };
  }
  renderVals() {
    const { open, expOpen } = this.state;
    // 询价商品：没有明码价，页面先讲清“怎么拿到价格”。商家报价后在“我的 → 需求与报价”比选，选定后转确认订单
    const stepRows = [
      ['填询价单', '不收费'], ['商家报价', '2 个工作日内'], ['比选选定', '看价格和交期'], ['确认下单', '选定后付款']
    ];
    const steps = stepRows.map(([t, d], i) => ({
      n: String(i + 1), t, d,
      lc: i === 0 ? 'transparent' : '#ffd8b8',
      rc: i === stepRows.length - 1 ? 'transparent' : '#ffd8b8'
    }));
    const sellers = [
      { name: '示例无人机厂家', kind: '厂家直营', meta: '东营可售 · 支持定制配置' },
      { name: '示例行业装备代理', kind: '授权经销', meta: '东营可售 · 含飞手培训' },
      { name: '示例测绘服务商', kind: '本地服务商', meta: '东营本地 · 可上门交付' }
    ];
    // 五个主体在选定报价时才落到具体商家，这里只说明归属，不用“平台”代填
    const parties = [
      ['销售方', '你选定报价的商家'],
      ['收款方', '销售方 · 经平台支付渠道'],
      ['开票方', '销售方 · 按报价约定开具'],
      ['发货履约', '销售方或其授权仓'],
      ['售后责任', '销售方 · 厂家保修']
    ].map(([k, v]) => ({ k, v }));
    const after = [
      ['询价不收费', '提交询价和比选报价都不产生费用'],
      ['保修', '范围和期限写在报价里，由厂家负责'],
      ['平台协助', '协商不成时，可联系平台客服协助沟通'],
      ['发票', '由销售方开具，平台不代开']
    ].map(([k, v]) => ({ k, v }));
    const specs = [
      ['机型', '行业多旋翼'], ['定位方式', 'RTK'], ['相机', '五镜头倾斜相机'],
      ['成果类型', '正射影像、三维模型'], ['适用场景', '地形测绘、园区建模'], ['培训', '可含飞手培训']
    ].map(([k, v]) => ({ k, v }));
    const pack = [
      { n: '飞行器', q: '×1' }, { n: '遥控器', q: '×1' }, { n: '智能电池', q: '×2' },
      { n: '充电器', q: '×1' }, { n: '收纳箱', q: '×1' }, { n: '快速上手指南', q: '×1' }
    ];
    // “只显示该商品已配置的体验方式”：行业机型配置了录播演示和到馆体验
    const ways = [
      { t: '录播演示', kind: '厂家录制视频', desc: '实拍作业过程，可拖动查看', price: '免费', pc: '#11804a', href: 'ContentVideo.dc.html', ibg: '#e6f0ff', ifg: '#1d63c4', d: 'M5 5h14v14H5zM10 9l5 3-5 3z' },
      { t: '到馆体验', kind: '工作人员陪同', desc: '东营低空与机器人体验馆，需预约场次', price: '¥39', pc: '#e85400', href: 'VenueDetail.dc.html', ibg: '#fff0e3', ifg: '#ba470b', d: 'M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5' }
    ];
    // 竖向展开区：同一时间只展开一块，默认展开参数；点已展开的标题收起。标题带数量，包装清单按件数合计
    const secOf = (id) => {
      const on = id === open;
      return { on, chev: on ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6', pick: () => this.setState((s) => ({ open: s.open === id ? '' : id })) };
    };
    const pieces = pack.reduce((n, k) => n + Number(k.q.replace('×', '')), 0);
    return {
      steps, sellers, parties, after, specs, pack, ways, expOpen,
      secSpec: secOf('spec'), secPack: secOf('pack'), secIntro: secOf('intro'),
      specCount: specs.length + ' 项', packCount: pieces + ' 件',
      openExp: () => this.setState({ expOpen: true }),
      closeExp: () => this.setState({ expOpen: false })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));

function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
