    // open：参数 / 包装清单 / 图文介绍 哪一块展开（'' 表示都收起）
    this.state = { seller: 'maker', open: 'spec' };
  }
  renderVals() {
    const { seller, open } = this.state;
    // ship：首屏配送行，一行写清 本地区能否购买 · 运费 · 发货时效。没有到货日数据，只写发货时效
    const sellers = [
      { id: 'maker', name: '示例机器人商家', kind: '厂家直营', meta: '东营现货 · 48 小时发货 · 一年保修', price: '¥1,299', depot: '示例机器人商家 东营仓', ship: '东营可买 · 包邮 · 48 小时内发货' },
      { id: 'agent', name: '示例教育装备代理', kind: '授权经销', meta: '交期 7 天 · 含 2 课时教学', price: '¥1,350', depot: '示例教育装备代理 合作仓', ship: '东营可买 · 包邮 · 交期 7 天' },
      { id: 'store', name: '示例科创器材店', kind: '本地商家', meta: '到店自提 · 门店 15 天无理由', price: '¥1,380', depot: '示例科创器材店 东营门店', ship: '东营可买 · 无运费 · 门店自提' }
    ];
    const cur = sellers.find((o) => o.id === seller) || sellers[0];
    const offers = sellers.map((o) => {
      const on = o.id === cur.id;
      return { ...o, on, bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fffaf5' : '#fff', rd: on ? '#ff6a00' : '#c9d3e1', rf: on ? '#ff6a00' : '#fff', tick: on ? '✓' : '', pc: on ? '#e85400' : '#202c42', pick: () => this.setState({ seller: o.id }) };
    });
    // 交易主体随所选商家变化，结构保持 销售方 / 收款方 / 开票方 / 发货履约 / 售后责任
    const parties = [
      ['销售方', cur.name + '（' + cur.kind + '）'],
      ['收款方', cur.name + ' · 经平台支付渠道'],
      ['开票方', cur.name + ' · 可开增值税普通发票'],
      ['发货履约', cur.depot],
      ['售后责任', cur.name + ' · 厂家保修']
    ].map(([k, v]) => ({ k, v }));
    const after = [
      ['7 天无理由退货', '未拆封，按销售方规则执行'],
      ['一年保修', '由厂家负责，非人为损坏免费维修'],
      ['平台协助', '与商家协商不成时，可联系平台客服协助沟通'],
      ['发票', '由销售方开具，平台不代开']
    ].map(([k, v]) => ({ k, v }));
    const specs = [
      ['适用年龄', '8 岁以上'], ['编程方式', '图形化 / Python'], ['传感器', '超声波、循线、陀螺仪'],
      ['续航', '约 90 分钟'], ['连接', '蓝牙 5.0'], ['配套课程', '16 课时（数字版）']
    ].map(([k, v]) => ({ k, v }));
    const pack = [
      { n: '机器人主机', q: '×1' }, { n: '充电线', q: '×1' }, { n: '避障道具', q: '×1' }, { n: '快速上手指南', q: '×1' }
    ];
    // 竖向展开区：同一时间只展开一块，默认展开参数；点已展开的标题收起。标题带数量，包装清单按件数合计
    const secOf = (id) => {
      const on = id === open;
      return { on, chev: on ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6', pick: () => this.setState((s) => ({ open: s.open === id ? '' : id })) };
    };
    const pieces = pack.reduce((n, k) => n + Number(k.q.replace('×', '')), 0);
    return {
      offers, parties, ship: cur.ship, after, specs, pack,
      secSpec: secOf('spec'), secPack: secOf('pack'), secIntro: secOf('intro'),
      specCount: specs.length + ' 项', packCount: pieces + ' 件'
    };
  }
}
