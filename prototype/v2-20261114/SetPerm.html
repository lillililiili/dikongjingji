<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>权限管理</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 704px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">权限管理</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px;">
    <span style="flex-shrink: 0; padding: 0 4px; font-size: 13px; line-height: 19px; color: #627187;">权限由手机系统管理，改完回到 App 自动更新</span>

    <sc-for list="{{perms}}" as="p" hint-placeholder-count="3">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; background: {{p.iconBg}}; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{p.iconFg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap;">{{p.t}}</h2>
            <span style="align-self: flex-start; font-size: 12px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: {{p.tagBg}}; color: {{p.tagFg}}; white-space: nowrap;">{{p.tag}}</span>
          </div>
          <button type="button" aria-label="{{p.aria}}" onClick="{{p.open}}" style="flex-shrink: 0; height: 36px; margin: 0; padding: 0 14px; border-radius: 999px; border: 1px solid {{p.btnBd}}; background: #fff; font: inherit; font-size: 13px; line-height: 18px; color: {{p.btnFg}}; white-space: nowrap; cursor: pointer;">{{p.btn}}</button>
        </div>
        <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 6px 10px; padding-top: 10px; border-top: 1px solid #f0f1f3; font-size: 13px; line-height: 19px;">
          <span style="color: #738096; white-space: nowrap;">用在哪里</span><span style="color: #536178;">{{p.use}}</span>
          <span style="color: #738096; white-space: nowrap;">关闭后</span><span style="color: #536178;">{{p.off}}</span>
        </div>
        <sc-if value="{{p.hintOn}}" hint-placeholder-val="{{false}}">
          <span role="status" style="align-self: flex-start; padding: 4px 8px; border-radius: 6px; background: #fff0e3; font-size: 12px; line-height: 17px; color: #ba470b;">已打开系统设置，回到应用后这里的状态会刷新</span>
        </sc-if>
      </div>
    </sc-for>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; border-radius: 14px; background: #fff;">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="2">
        <a href="{{l.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-bottom: 1px solid {{l.bd}}; text-decoration: none; color: #202c42;">
          <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; white-space: nowrap;">{{l.t}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{sysOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="关闭" onClick="{{sysClose}}" style="position: absolute; inset: 0; z-index: 8; margin: 0; padding: 0; border: 0; background: rgba(0,0,0,0.45);"></button>
    <div role="dialog" aria-label="前往系统设置" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 24px; border-radius: 16px 16px 0 0; background: #fff; font-family: 'PingFang SC','Noto Sans SC',sans-serif;">
      <span style="font-size: 16px; font-weight: 700; line-height: 22px; text-align: center; color: #202c42;">前往系统设置</span>
      <span style="font-size: 12px; line-height: 17px; text-align: center; color: #738096;">将打开手机系统设置 · 飞享 · 权限，修改后回到应用生效</span>
      <sc-for list="{{sysRows}}" as="r" hint-placeholder-count="3">
        <button type="button" onClick="{{r.pick}}" style="height: 48px; margin: 0; padding: 0; border: 0; border-radius: 12px; background: #f5f7fc; font: inherit; font-size: 15px; line-height: 20px; color: #202c42; cursor: pointer;">{{r.label}}</button>
      </sc-for>
      <button type="button" onClick="{{sysClose}}" style="height: 48px; margin: 4px 0 0; padding: 0; border: 0; border-radius: 999px; background: #fff; font: inherit; font-size: 15px; line-height: 20px; color: #536178; cursor: pointer;">取消</button>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // hint：点了“去系统设置”的权限 id；系统设置页属于手机系统，这里只提示
    this.state = { hint: '', sysOpen: '' };
  }
  renderVals() {
    const { hint, sysOpen } = this.state;
    // 状态是示意：定位、通知已开启，相机未开启（用到时才询问）。App 不能替用户改系统权限，只读状态并跳系统设置
    const perms = [
      { id: 'location', t: '定位', on: true, tag: '已开启 · 使用 App 时',
        use: '确定所在城市、按距离排序、到馆导航', off: '要手动选城市，不能按距离排序',
        d: 'M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5a2.5 2.5 0 1 0 0 5z' },
      { id: 'camera', t: '相机', on: false, tag: '未开启 · 用到时询问',
        use: '扫一扫、拍照上传现场图片', off: '不能扫码和拍照，其他功能不受影响',
        d: 'M4 8h4l2-3h4l2 3h4v11H4zM12 16.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7z' },
      { id: 'notify', t: '通知', on: true, tag: '已开启',
        use: '订单、服务进度和活动提醒的推送', off: '收不到推送，“消息”里的站内消息不受影响',
        d: 'M6 16v-5a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0' }
    ].map((p) => ({
      t: p.t, tag: p.tag, use: p.use, off: p.off, d: p.d,
      iconBg: p.on ? '#fff0e3' : '#eef2f8',
      iconFg: p.on ? '#ff6a00' : '#738096',
      tagBg: p.on ? '#e2f6ed' : '#eef2f8',
      tagFg: p.on ? '#11804a' : '#536178',
      btn: p.on ? '去系统设置' : '去开启',
      btnBd: p.on ? '#c9d3e1' : '#ff6a00',
      btnFg: p.on ? '#202c42' : '#ba470b',
      aria: p.t + '：' + (p.on ? '去系统设置' : '去系统设置开启'),
      hintOn: hint === p.id,
      open: () => this.setState({ sysOpen: p.id, hint: '' })
    }));
    const links = [
      { t: '通知内容设置', href: 'Settings.dc.html', bd: '#f0f1f3' },
      { t: '隐私政策', href: 'Agreement.dc.html', bd: 'transparent' }
    ];
    const sysPerm = sysOpen ? (perms.find((p) => p.id === sysOpen) || {}) : {};
    const sysRows = sysOpen ? [{ label: '去系统设置', pick: () => this.setState({ sysOpen: '', hint: sysOpen }) }] : [];
    return {
      sysOpen: !!sysOpen, sysRows, sysClose: () => this.setState({ sysOpen: '' }), sysTitle: (sysPerm.t || '') + '权限', perms, links };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
