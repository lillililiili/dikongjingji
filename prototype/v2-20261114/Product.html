<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>C 商品详情（早期稿，以 PD1 为准）</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 220px; flex-shrink: 0; background: #eef0f3; position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3"></path></svg>
      <span style="font-size: 12px; color: #738096;">商品主图（待授权素材）· 1/5</span>
      <a href="Mall.dc.html" aria-label="返回" style="position: absolute; left: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <button aria-label="分享" style="position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 9l5-5 5 5M5 14v6h14v-6"></path></svg></button>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 24px; font-weight: 700; color: #e85400;">¥2,680</span>
        <span style="font-size: 13px; color: #627187;">起 · 3 家商家报价</span>
      </div>
      <div style="font-size: 18px; font-weight: 700;">教育编程无人机套装</div>
      <div style="font-size: 13px; color: #536178;">图形化编程 · 室内光流定位 · 含 8 课时教案</div>
    </div>

    <div style="margin: 0 12px; background: #fff0e3; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 15px; font-weight: 700;">先体验，再决定</div>
        <div style="font-size: 12px; color: #536178;">模拟起降 · 航线编程 · 避障闯关</div>
        <div style="display: flex; gap: 6px;">
          <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff; color: #536178; border: 1px solid #ffd2b0;">虚拟仿真</span>
          <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff; color: #536178; border: 1px solid #ffd2b0;">线下实物可预约</span>
        </div>
      </div>
      <a href="Experience.dc.html" style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none;">开始体验</a>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700;">选择经营商家</h2>
        <span style="font-size: 12px; color: #627187;">同型号，不同供给</span>
      </div>
      <sc-for list="{{sellers}}" as="s" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1.5px solid {{s.bd}}; background: {{s.bg}};">
          <input type="radio" name="seller" checked="{{s.on}}" style="accent-color: #ff6a00; width: 18px; height: 18px; margin: 0;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 500;">{{s.name}}</span>
            <span style="font-size: 12px; color: #627187;">{{s.meta}}</span>
          </div>
          <span style="font-size: 16px; font-weight: 700; color: #e85400;">{{s.price}}</span>
        </label>
      </sc-for>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12px;">
      <div style="grid-column: 1 / -1; font-size: 14px; font-weight: 700;">交易主体</div>
      <div><span style="color: #627187;">销售 / 收款</span>　东营翼飞科技</div>
      <div><span style="color: #627187;">开票</span>　东营翼飞科技</div>
      <div><span style="color: #627187;">履约</span>　本地发货 3 天内</div>
      <div><span style="color: #627187;">售后</span>　厂家保修 12 个月</div>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #fff; border-top: 1px solid #e5ebf3;">
    <button style="width: 48px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 11px; color: #536178;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#536178" stroke-width="1.8" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0M4 13v4h3v-5H4M20 13v4h-3v-5h3"></path></svg>客服</button>
    <button style="width: 48px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 11px; color: #536178;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#536178" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>收藏</button>
    <button style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff; color: #ba470b; font: inherit; font-size: 15px; font-weight: 500;">预约线下体验</button>
    <button style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; background: #ff6a00; color: #fff; font: inherit; font-size: 15px; font-weight: 500;">立即购买</button>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  renderVals() {
    const sellers = [
      { name: '东营翼飞科技（授权代理）', meta: '现货 · 3 天交付 · 本地售后', price: '¥2,680', on: true },
      { name: '厂家旗舰（总部共享资源）', meta: '交期 7 天 · 厂家直保', price: '¥2,799', on: false },
      { name: '黄河口教育装备', meta: '含 2 次上门培训', price: '¥2,960', on: false }
    ].map((s) => ({ ...s, bd: s.on ? '#ff6a00' : '#e5ebf3', bg: s.on ? '#fffaf5' : '#fff' }));
    return { sellers };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
