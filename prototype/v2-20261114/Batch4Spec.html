<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>09 巡检闭环 · 规格</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>body{margin:0;background:#dfe2e6;padding:16px;font-family:-apple-system,'PingFang SC',sans-serif}.bar{font-size:13px;color:#555;margin:0 0 10px}.bar a{color:#ba470b}#root{width:max-content;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.18)}</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body><div class="bar"><a href="HomeFull.html">← 回到 App</a> &nbsp; 09 巡检闭环 · 规格（设计文档，不是 App 页面）</div><div id="root"></div><template id="tpl">

<div style="position: relative; width: 1100px; height: 9190px; display: flex; flex-direction: column; gap: 26px; padding: 40px 44px; box-sizing: border-box; background: #fff; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <h1 style="margin: 0; font-size: 28px; line-height: 40px; font-weight: 700; white-space: nowrap;">巡检闭环 · 规格（第四批补页）</h1>
      <a href="Batch3Spec.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">内容与增强 · 规格（Batch3Spec）›</a>
    </div>
    <div style="font-size: 14px; line-height: 1.6; color: #536178;">本批补齐 13 张画板：巡检服务目录 M02、服务详情 M03、确认订单与提交结果 M04，单次样例的方案、两张收银台、履约和交付，方案已过期帧、方案已确认帧，以及 6 次样例 12/15 这一帧。原型里巡检原来到“专业服务”频道就断了，现在从首页能一路点到验收付款。导航沿用方案 C：底栏 首页 / 发现 / 消息 / 购物车 / 我的。M02–M04 已有代码，和画板不一致的地方记在第 9 节。阶段 B 已按 v55 的方案、履约、交付画板做完并验收（分支 codex/inspection-visits）；这批新板的状态行、按钮和下载文案已对齐已验收代码，单次样例还有少量文字差异（第 9 节）；新增的是单次样例、12/15 帧和 M02–M04。有效期和已过期态、下载不写死分钟数、全部下载、取消订单这四处回改是 v55 已发布的内容，不是这批做的；这批在 v55 上加了什么见第 8 节。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">1 · 页面清单</h2>
      <span style="font-size: 13px; line-height: 20px; color: #738096;">本批 13 张画板；文件名省略 .dc.html，点文件名跳到对应画板；编号为概要设计 §5.2 的草案编号，确认后生效。</span>
    </div>
    <div style="display: grid; grid-template-columns: 136px 156px 160px minmax(0, 1fr) minmax(0, 1.75fr); border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">文件</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">页面</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">编号</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">入口</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">主要交互</div>
      <sc-for list="{{pageRows}}" as="pr" hint-placeholder-count="13">
        <a href="{{pr.href}}" style="display: block; padding: 9px 12px; border-top: 1px solid #f0f1f3; font-weight: 700; text-decoration: none; overflow-wrap: anywhere;">{{pr.file}}</a>
        <div style="display: flex; flex-direction: column; padding: 9px 12px; border-top: 1px solid #f0f1f3;">
          <span style="white-space: nowrap;">{{pr.page}}</span>
          <span style="font-size: 12px; line-height: 18px; color: #738096; white-space: nowrap;">{{pr.mod}}</span>
        </div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; white-space: nowrap;">{{pr.code}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178;">{{pr.entry}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178;">{{pr.act}}</div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; background: #f5f7fc;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700;">这批改过的 11 张旧画板</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px;">
        <sc-for list="{{retro}}" as="rt" hint-placeholder-count="11">
          <div style="display: flex; align-items: baseline; gap: 10px; font-size: 13px; line-height: 1.55;">
            <a href="{{rt.href}}" style="flex: 0 0 92px; font-weight: 700; text-decoration: none;">{{rt.file}}</a>
            <span style="min-width: 0; color: #536178;">{{rt.what}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">2 · 黄金路径</h2>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ffd8b8; background: #fff0e3;"></span>本批新画板</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px solid #e5ebf3; background: #eef2f8;"></span>已有画板</span>
      <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">点卡片可跳到对应画板；日期是这一帧所在的时刻</span>
    </div>
    <sc-for list="{{flows}}" as="fl" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #e5ebf3; border-radius: 12px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 15px; line-height: 22px; font-weight: 700; white-space: nowrap;">{{fl.name}}</span>
          <span style="min-width: 0; font-size: 12px; line-height: 18px; color: #738096;">{{fl.note}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
          <sc-for list="{{fl.steps}}" as="s" hint-placeholder-count="12">
            <sc-if value="{{s.isNew}}" hint-placeholder-val="{{true}}">
              <a href="{{s.href}}" style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #ffd8b8; background: #fff0e3; color: #202c42; text-decoration: none;">
                <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{s.t}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #ba470b; white-space: nowrap;">{{s.p}}</span>
              </a>
            </sc-if>
            <sc-if value="{{s.isOld}}" hint-placeholder-val="{{false}}">
              <a href="{{s.href}}" style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #e5ebf3; background: #eef2f8; color: #202c42; text-decoration: none;">
                <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{s.t}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap;">{{s.p}}</span>
              </a>
            </sc-if>
            <span style="font-size: 14px; line-height: 20px; color: #91a0b4;">{{s.arrow}}</span>
          </sc-for>
        </div>
        <div style="font-size: 12px; line-height: 1.6; color: #536178;">{{fl.rule}}</div>
      </div>
    </sc-for>
    <div style="font-size: 13px; line-height: 1.6; padding: 10px 14px; border-radius: 10px; background: #f5f7fc;"><span style="font-weight: 700;">金刚位入口</span><span style="color: #536178;">：AGENTS.md §15 要求黄金路径从首页顶部频道“专业服务”真实点击进入，推荐频道金刚位“专业服务”另设一条入口用例。画板上 HomeFull 的顶部频道、金刚位“专业服务”和大卡“找专业服务”都到 HomeSvc，后面的路径相同。</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">3 · 样例与时间线</h2>
      <span style="flex-shrink: 0; display: flex; align-items: center; min-height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px dashed #ba470b; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">今天 = 11/03（周二），约 14:30</span>
      <span style="min-width: 0; font-size: 13px; line-height: 20px; color: #738096;">比今天晚的帧都是分镜：每张画板是不同时刻的样子，各记各的状态，跨页不共享。</span>
    </div>
    <div style="display: grid; grid-template-columns: 148px 196px minmax(0, 1fr) minmax(0, 1.1fr); border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">样例</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">账号身份</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">金额拆分</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">关键日期</div>
      <sc-for list="{{samples}}" as="sp" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; padding: 9px 12px; border-top: 1px solid #f0f1f3;">
          <span style="font-weight: 700;">{{sp.name}}</span>
          <span style="font-size: 12px; line-height: 18px; color: #738096;">{{sp.note}}</span>
        </div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178; white-space: pre-line;">{{sp.who}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178; white-space: pre-line;">{{sp.money}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178; white-space: pre-line;">{{sp.dates}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">4 · 服务目录和详情</h2>
      <span style="min-width: 0; font-size: 13px; line-height: 20px; color: #738096;">目录每页 5 条，东营 6 条服务；原型的筛选、排序都在页内算，正式产品由服务端查询。</span>
      <a href="InspCatalog.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">巡检服务目录 ›</a>
      <a href="InspDetail.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">服务详情 ›</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{catalogRules}}" as="cr" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid #e5ebf3; border-radius: 12px;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 700;">{{cr.c0}}</span>
          <span style="font-size: 13px; line-height: 1.6; color: #536178;">{{cr.c1}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5ebf3; background: #f5f7fc;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap;">M03 区块顺序</span>
        <span style="min-width: 0; font-size: 12px; line-height: 17px; color: #536178;">照代码。用户评价只画空态“暂无评价”“完成服务后可在这里查看真实用户评价”，不写分数和条数；服务内容的四项就是确认订单的四个巡检项目。</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <sc-for list="{{detailOrder}}" as="dt" hint-placeholder-count="8">
          <span style="display: flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #e5ebf3; background: #fff; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{dt.t}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #91a0b4;">{{dt.arrow}}</span>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; line-height: 20px; font-weight: 700;">这些状态代码里已有，原型不用点到</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; flex-direction: column; height: 300px; box-sizing: border-box; border: 1px solid #e5ebf3; border-radius: 12px; overflow: hidden; background: #f5f7fc;">
            <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 36px; background: #fff; border-bottom: 1px solid #f0f1f3; font-size: 13px; line-height: 18px; font-weight: 700;">巡检服务</div>
            <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px;">
              <sc-for list="{{skeletonCards}}" as="sk" hint-placeholder-count="4">
                <div style="flex-shrink: 0; display: flex; gap: 8px; height: 52px; box-sizing: border-box; padding: 6px; border-radius: 8px; background: #fff;">
                  <span style="flex-shrink: 0; width: 56px; border-radius: 6px; background: #eef0f3;"></span>
                  <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0;">
                    <span style="width: {{sk.w1}}; height: 9px; border-radius: 4px; background: #eef0f3;"></span>
                    <span style="width: 100%; height: 7px; border-radius: 4px; background: #eef2f8;"></span>
                    <span style="width: {{sk.w2}}; height: 7px; border-radius: 4px; background: #eef2f8;"></span>
                  </span>
                </div>
              </sc-for>
            </div>
          </div>
          <span style="font-size: 14px; line-height: 20px; font-weight: 500;">加载中（骨架）</span>
          <span style="font-size: 12px; line-height: 18px; color: #536178;">M02 读取目录时显示 4 张骨架卡，代替列表；首次进入、切换排序、切换城市和下拉刷新都走这里。</span>
        </div>
        <sc-for list="{{stateFrames}}" as="sf" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="display: flex; flex-direction: column; height: 300px; box-sizing: border-box; border: 1px solid #e5ebf3; border-radius: 12px; overflow: hidden; background: #f5f7fc;">
              <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 36px; background: #fff; border-bottom: 1px solid #f0f1f3; font-size: 13px; line-height: 18px; font-weight: 700;">{{sf.bar}}</div>
              <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; text-align: center;">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#b8bdc4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sf.icon}}"></path></svg>
                <span style="font-size: 15px; line-height: 21px; font-weight: 700; color: #343840;">{{sf.title}}</span>
                <span style="font-size: 12px; line-height: 18px; color: #738096;">{{sf.desc}}</span>
                <span style="margin-top: 6px; display: flex; align-items: center; height: 36px; padding: 0 18px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{sf.action}}</span>
              </div>
            </div>
            <span style="font-size: 14px; line-height: 20px; font-weight: 500;">{{sf.name}}</span>
            <span style="font-size: 12px; line-height: 18px; color: #536178;">{{sf.note}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">5 · 确认订单和提交结果</h2>
      <span style="flex-shrink: 0; display: flex; align-items: center; min-height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px dashed #ba470b; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">这里不创建支付记录</span>
      <span style="min-width: 0; font-size: 13px; line-height: 20px; color: #738096;">AGENTS.md §9：提交只创建预约，方案确认前不收费。</span>
      <a href="InspBooking.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">确认订单 ›</a>
      <a href="InspBooked.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">提交结果 ›</a>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid #e5ebf3; border-radius: 12px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 15px; line-height: 22px; font-weight: 700; white-space: nowrap;">校验顺序</span>
          <span style="min-width: 0; font-size: 12px; line-height: 18px; color: #738096;">点「提交订单」才校验，只显示第一条</span>
        </div>
        <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.2fr); border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
          <sc-for list="{{checks}}" as="ck" hint-placeholder-count="8">
            <div style="padding: 9px 10px; border-top: 1px solid {{ck.line}}; background: #f5f7fc; color: #536178; white-space: nowrap;">{{ck.n}}</div>
            <div style="padding: 9px 10px; border-top: 1px solid {{ck.line}}; color: #536178;">{{ck.when}}</div>
            <div style="padding: 9px 10px; border-top: 1px solid {{ck.line}}; color: #d64f67;">{{ck.msg}}</div>
