</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // frame：这一单在不同时刻的分镜，0 已排期 / 1 作业中 / 2 现场已完成 / 3 已交付待验收
    this.state = { frame: 0 };
  }
  renderVals() {
    const { frame } = this.state;

    // 本页对客户只读：状态由服务商按实际作业在服务端更新；「刷新进度」只代表重新读取服务端状态，不是客户改状态
    const frames = [
      { text: '待履约', side: '共 1 次 · 未开始', bar: '#e5ebf3', note: '现场巡检 11/06 09:00', chip: '' },
      { text: '履约中', side: '共 1 次 · 作业中', bar: '#ffd8b8', note: '现场巡检 11/06 09:00', chip: '' },
      { text: '履约中', side: '共 1 次 · 现场已完成', bar: '#ffd8b8', note: '现场巡检 11/06 09:00', chip: '' },
      { text: '待验收', side: '共 1 次 · 报告已交付', bar: '#ff6a00', note: '请核对报告后验收', chip: '待验收' }
    ];
    const cur = frames[frame];

    // 作业日志：作业中只有开始作业一行；现场已完成补完成作业；已交付再补报告交付
    const allLogs = [
      { time: '11/06 09:10', text: '开始作业' },
      { time: '11/06 11:40', text: '完成作业' },
      { time: '11/07 10:00', text: '报告已交付（48 小时内）' }
    ];
    const logs = allLogs.slice(0, frame);

    return {
      statusText: cur.text,
      statusSide: cur.side,
      statusNote: cur.note,
      barBg: cur.bar,
      barNow: frame === 3 ? 1 : 0,
      isScheduled: frame === 0,
      // 现场已完成但报告还没交付，这一次还不算完成，节点仍是进行中
      isWorking: frame === 1 || frame === 2,
      workingText: frame === 2 ? '现场已完成 · 报告整理中' : '作业中',
      isDelivered: frame === 3,
      showCard: frame > 0,
      canRefresh: frame < 3,
      chipText: cur.chip,
      chipBg: frame === 3 ? '#ff6a00' : '#e6f0ff',
      chipFg: frame === 3 ? '#fff' : '#1d63c4',
      logs,
      refresh: () => this.setState((s) => ({ frame: Math.min(s.frame + 1, 3) }))
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
