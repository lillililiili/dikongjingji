</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // open：参数 / 随箱清单 / 图文介绍 哪一块展开（'' 表示都收起）
    this.state = { open: 'spec', expOpen: false };
  }
  renderVals() {
    const { open, expOpen } = this.state;
    // 租赁走询价合同订单：¥380/天 是起步参考，真金额在报价和合同里；不做实时档期，保证金不在线收取
    const terms = [
      { k: '租期', tag: '', v: '1 天起租，按天计费；长期租用的价格以报价为准', d: 'M5 5h14v15H5zM5 10h14M9 3v4M15 3v4' },
      { k: '押金', tag: '待定', v: '[押金规则待确认]，当前不在线收取', d: 'M12 3l7 3v5c0 5-3 8-7 10c-4-2-7-5-7-10V6z' },
      { k: '交接', tag: '', v: '商家送达或到店自提，双方按清单核对设备和配件，留下交接记录', d: 'M4 9h14l-3-3M20 15H6l3 3' },
      { k: '损坏处理', tag: '', v: '归还时核对交接记录，人为损坏按合同赔付', d: 'M12 4l9 16H3zM12 10v5M12 18h.01' }
    ];
    const stepRows = ['提交询价', '商家报价', '确认合同', '交接使用', '归还结束'];
    const steps = stepRows.map((t, i) => ({
      n: String(i + 1), t,
      lc: i === 0 ? 'transparent' : '#ffd8b8',
      rc: i === stepRows.length - 1 ? 'transparent' : '#ffd8b8'
    }));
    const parties = [
      ['出租方', '黄河口户外飞行营地（厂家直营）'],
      ['收款方', '黄河口户外飞行营地 · 经平台支付渠道'],
      ['开票方', '黄河口户外飞行营地 · 按合同开具'],
      ['交接履约', '黄河口户外飞行营地 东营仓'],
      ['售后责任', '黄河口户外飞行营地 · 按合同约定']
    ].map(([k, v]) => ({ k, v }));
    const after = [
      ['设备故障', '使用中非人为故障，由商家维修或更换'],
      ['平台协助', '协商不成时，可联系平台客服协助沟通'],
      ['发票', '由出租方开具，平台不代开']
    ].map(([k, v]) => ({ k, v }));
    const specs = [
      ['场地', '约 2 万㎡ 开阔草地'],
      ['时段', '上午 9:00–12:00 / 下午 14:00–17:00'],
      ['人数', '每场 10 人以内'],
      ['教练', '可选，按人数报价'],
      ['设施', '休息区、充电点'],
      ['天气', '雨天或大风顺延']
    ].map(([k, v]) => ({ k, v }));
    const pack = [
      { n: '场地使用', q: '×1' }, { n: '休息区', q: '×1' }, { n: '充电点', q: '×2' }
    ];
    // “只显示该商品已配置的体验方式”：这款配置了录播演示和到馆体验
    const ways = [
      { t: '录播演示', kind: '厂家录制视频', desc: '实拍园区夜巡过程，可拖动查看', price: '免费', pc: '#11804a', href: 'ContentVideo.dc.html', ibg: '#e6f0ff', ifg: '#1d63c4', d: 'M5 5h14v14H5zM10 9l5 3-5 3z' },
      { t: '到馆体验', kind: '工作人员陪同', desc: '东营低空与机器人体验馆，需预约场次', price: '¥39', pc: '#e85400', href: 'VenueDetail.dc.html', ibg: '#fff0e3', ifg: '#ba470b', d: 'M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5' }
    ];
    // 竖向展开区：同一时间只展开一块，默认展开参数；点已展开的标题收起。标题带数量，随箱清单按件数合计
    const secOf = (id) => {
      const on = id === open;
      return { on, chev: on ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6', pick: () => this.setState((s) => ({ open: s.open === id ? '' : id })) };
    };
    const pieces = pack.reduce((n, k) => n + Number(k.q.replace('×', '')), 0);
    return {
      terms, steps, parties, after, specs, pack, ways, expOpen,
      secSpec: secOf('spec'), secPack: secOf('pack'), secIntro: secOf('intro'),
      specCount: specs.length + ' 项', packCount: pieces + ' 件',
      openExp: () => this.setState({ expOpen: true }),
      closeExp: () => this.setState({ expOpen: false })
    };
  }
}
