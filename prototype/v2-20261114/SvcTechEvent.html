  renderVals() {

      ['计价方式', '按项目报价，按活动规模在方案里确认'],
      ['影响价格', '活动时长、设备数量、值守人数'],

      ['设备联调', 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4'],
      ['赛场值守', 'M3 5h18v14H3zM3 9h18M6.5 7h.01M9.5 7h.01'],
      ['应急处理', 'M12 7c-2-1.5-5-2-8-2v13c3 0 6 .5 8 2 2-1.5 5-2 8-2V5c-3 0-6 .5-8 2zM12 7v13'],
      ['活动复盘', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d]) => ({ label, d }));
    const modes = [
      { name: '远程支持', desc: '在线排查和指导，适合软件配置和操作问题', d: 'M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2' },
      { name: '驻场支持', desc: '工程师到现场，适合设备调试和活动保障', d: 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6' }
    ];
    // 响应时限还没定，用占位写法
    const rows = [
      ['受理时间', '[协议约定时间]'],
      ['远程响应', '受理后 [协议约定时间] 内回复'],
      ['驻场到达', '按方案约定的时间到场'],
      ['紧急问题', '联系客服，由客服转接服务商']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    const steps = [
      ['提交需求', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4'],
      ['报价比选', 'M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4'],
      ['支持实施', 'M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2'],
      ['验收确认', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d], i, arr) => ({ label, d, arrow: i < arr.length - 1 }));
    const guarantees = [
      ['资质审核', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['支持留档', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 10.5h6M9 14h6'],
      ['数据保密', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 11.5h5V15h-5zM10.5 11.5V10a1.5 1.5 0 0 1 3 0v1.5']
    ].map(([label, d]) => ({ label, d }));
    return { capabilities, priceRows, scope, modes, rows, steps, guarantees };
  }
}
