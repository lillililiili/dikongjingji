</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // doneIds：已学完的课（按 1–16 编号）；currentId：视频位显示的课；openId：展开的章，0 表示全部收起
    this.state = { doneIds: [1, 2], currentId: 3, openId: 1 };
  }
  renderVals() {
    const { doneIds, currentId, openId } = this.state;

    const outline = [
      ['第 1 章 认识机器人', ['开箱与安全须知', '认识传感器', '连接编程环境', '第一次让它动起来']],
      ['第 2 章 图形化编程', ['顺序与循环', '条件判断', '让机器人避障', '小任务：走出迷宫']],
      ['第 3 章 传感器进阶', ['巡线原理', '巡线实战', '声音与灯光', '小任务：自动巡线']],
      ['第 4 章 综合项目', ['项目构思', '分步实现', '调试与优化', '结课展示']]
    ];
    const lessons = outline.flatMap(([, titles], ci) => titles.map((title, li) => ({
      id: ci * titles.length + li + 1,
      chapterId: ci + 1,
      title,
      first: li === 0,
      last: li === titles.length - 1
    })));
    const total = lessons.length;

    // 从某一课往后找下一节未学的课，到末尾后回到开头；都学完了返回 0
    const nextUndone = (fromId, done) => {
      for (let step = 1; step < total; step += 1) {
        const id = (fromId - 1 + step) % total + 1;
        if (!done.includes(id)) return id;
      }
      return 0;
    };

    // 模拟播放完成事件：已学完的课重看一遍不重复计入进度。正式产品由服务端按播放完成事件记录
    const finishLesson = () => this.setState((s) => {
      const done = s.doneIds.includes(s.currentId) ? s.doneIds : s.doneIds.concat(s.currentId);
      const nextId = nextUndone(s.currentId, done);
      if (!nextId) return { doneIds: done };
      return { doneIds: done, currentId: nextId, openId: lessons[nextId - 1].chapterId };
    });

    const currentDone = doneIds.includes(currentId);
    const allDone = doneIds.length === total;
    const resumeId = currentDone ? nextUndone(currentId, doneIds) : currentId;

    const slot = {
      kicker: `第 ${currentId} 课 · ${currentDone ? '已学完' : '约 12 分钟'}`,
      title: lessons[currentId - 1].title
    };

    // 一格一课时，按课的实际完成情况点亮（跳着学时中间会留空格）
    const segments = lessons.map((l) => ({ bg: doneIds.includes(l.id) ? '#ff6a00' : '#e5ebf3' }));

    // 一次只展开一章：页面高度稳定，跳到下一章时自动展开那一章
    const chapters = outline.map(([title, titles], ci) => {
      const id = ci + 1;
      const open = id === openId;
      const learned = lessons.filter((l) => l.chapterId === id && doneIds.includes(l.id)).length;
      return {
        title, open,
        progress: `已学 ${learned} / ${titles.length}`,
        pc: learned === titles.length ? '#11804a' : '#738096',
        chevron: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        toggle: () => this.setState((s) => ({ openId: s.openId === id ? 0 : id }))
      };
    });

    // 只有展开那一章的课时行；节点样式与“服务履约”的时间线一致
    // 底色跟视频位走（重看已学完的课时底色在那一课），“继续学习”始终标在下一节要学的课上
    const openRows = lessons.filter((l) => l.chapterId === openId).map((l) => {
      const done = doneIds.includes(l.id);
      const cur = l.id === currentId;
      const resume = l.id === resumeId;
      return {
        no: String(l.id).padStart(2, '0'),
        title: l.title,
        done,
        dot: resume,
        aria: cur ? 'true' : 'false',
        status: done ? '已学完' : (resume ? '继续学习' : '未开始'),
        sc: done ? '#11804a' : (resume ? '#ba470b' : '#738096'),
        tc: done || resume ? '#202c42' : '#536178',
        tw: cur ? 700 : 400,
        nc: cur ? '#ba470b' : '#738096',
        bg: cur ? '#fff0e3' : 'transparent',
        bd: done || resume ? '#ff6a00' : '#c9d3e1',
        fill: done ? '#ff6a00' : '#fff',
        // 节点之间的连线：上半段看上一课，下半段看本课；一章的首尾不画
        up: l.first ? 'transparent' : (doneIds.includes(l.id - 1) ? '#ffd8b8' : '#e5ebf3'),
        down: l.last ? 'transparent' : (done ? '#ffd8b8' : '#e5ebf3'),
        pick: () => this.setState({ currentId: l.id })
      };
    });

    return {
      slot, segments, chapters, openRows, allDone, finishLesson,
      doneCount: doneIds.length,
      canFinish: !allDone,
      resumeLabel: allDone ? '' : `继续学习：第 ${resumeId} 课`
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
