<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>个人信息查看与导出</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="frame"><option selected>未申请</option><option>生成中</option><option>可下载</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 904px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">个人信息查看与导出</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">账号信息</h2>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px 10px; font-size: 14px; line-height: 20px;">
        <sc-for list="{{profile}}" as="r" hint-placeholder-count="4">
          <span style="color: #627187; white-space: nowrap;">{{r.k}}</span><span>{{r.v}}</span>
        </sc-for>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 14px 14px 4px; background: #fff; border-radius: 14px;">
      <div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">平台保存的信息</h2>
        <span style="font-size: 13px; line-height: 19px; color: #627187;">点开查看，敏感信息打码显示</span>
      </div>
      <sc-for list="{{stored}}" as="s" hint-placeholder-count="5">
        <a href="{{s.href}}" style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-top: 1px solid #f0f1f3; text-decoration: none; color: #202c42;">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; line-height: 21px; white-space: nowrap;">{{s.t}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">{{s.sub}}</span>
          </span>
          <sc-if value="{{s.v}}" hint-placeholder-val="{{true}}">
            <span style="flex-shrink: 0; font-size: 14px; line-height: 20px; color: #738096; white-space: nowrap;">{{s.v}}</span>
          </sc-if>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">导出记录</h2>
      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: #f5f7fc;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M12 11v6M9.5 14.5L12 17l2.5-2.5"></path></svg>
          <span style="min-width: 0; font-size: 13px; line-height: 19px; color: #627187;">还没有导出记录，申请后在这里看进度和下载</span>
        </div>
      </sc-if>
      <sc-if value="{{hasRecord}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px;">
          <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px; background: #e6f0ff; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"></path></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; line-height: 20px; white-space: nowrap;">个人信息副本</span>
            <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">{{recordSub}}</span>
          </div>
          <sc-if value="{{isMaking}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; font-size: 12px; line-height: 18px; padding: 1px 6px; border-radius: 6px; background: #e6f0ff; color: #1d63c4; white-space: nowrap;">生成中</span>
          </sc-if>
          <sc-if value="{{isReady}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-label="下载个人信息副本" onClick="{{getLink}}" style="flex-shrink: 0; height: 36px; margin: 0; padding: 0 16px; border-radius: 999px; border: 1px solid #ff6a00; background: #fff; font: inherit; font-size: 13px; line-height: 18px; color: #ba470b; white-space: nowrap; cursor: pointer;">下载</button>
          </sc-if>
        </div>
        <span role="status" style="padding: 8px 10px; border-radius: 8px; background: {{recordBg}}; font-size: 12px; line-height: 18px; color: {{recordFg}};">{{recordNote}}</span>
      </sc-if>
    </div>

    <div style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 6px; padding: 0 4px; font-size: 12px; line-height: 18px; color: #627187;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#738096" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"></path></svg>
      <span style="min-width: 0;">文件经受控链接下载，不显示存储地址；导出会留下记录</span>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-if value="{{canApply}}" hint-placeholder-val="{{true}}">
      <button type="button" aria-haspopup="dialog" onClick="{{openSheet}}" style="width: 100%; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #ff6a00; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer;">{{applyLabel}}</button>
    </sc-if>
    <sc-if value="{{isMaking}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="{{true}}" style="width: 100%; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #c9d3e1; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: not-allowed;">副本生成中</button>
    </sc-if>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeSheet}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="申请导出个人信息" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 18px; font-weight: 700; line-height: 25px;">申请导出个人信息</span>
        <span style="font-size: 13px; line-height: 18px; color: #536178;">选择要导出的内容，并验证手机号 138****2026</span>
      </div>
      <div style="display: flex; flex-direction: column;">
        <sc-for list="{{scope}}" as="s" hint-placeholder-count="5">
          <label style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid #f0f1f3; font-size: 15px; line-height: 21px; cursor: pointer;">
            <input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" aria-label="{{s.t}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;">
            <sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
              <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
            </sc-if>
            <sc-if value="{{s.notOn}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #91a0b4; background: #fff;"></span>
            </sc-if>
            <span style="min-width: 0; white-space: nowrap;">{{s.t}}</span>
          </label>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 4px 0 14px; border-radius: 12px; background: #f5f7fc;">
        <input type="text" aria-label="验证码" placeholder="请输入验证码" value="{{code}}" onChange="{{setCode}}" style="flex-grow: 1; min-width: 0; height: 50px; border: 0; outline: none; padding: 0; background: transparent; font: inherit; font-size: 15px; color: #202c42;">
        <sc-if value="{{codeIdle}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{sendCode}}" style="flex-shrink: 0; min-height: 44px; padding: 0 10px; border: 0; background: none; font: inherit; font-size: 14px; color: #ba470b; white-space: nowrap; cursor: pointer;">获取验证码</button>
        </sc-if>
        <sc-if value="{{codeSent}}" hint-placeholder-val="{{false}}">
          <button type="button" disabled="{{true}}" style="flex-shrink: 0; min-height: 44px; padding: 0 10px; border: 0; background: none; font: inherit; font-size: 14px; color: #91a0b4; white-space: nowrap; cursor: default;">60 秒后重新获取</button>
        </sc-if>
      </div>
      <span style="font-size: 12px; line-height: 17px; color: #738096;">提交后在 [协议约定时间] 内生成，完成后通过“消息”通知你。副本含敏感信息，请妥善保管。</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{closeSheet}}" style="flex: 1 1 0; height: 46px; margin: 0; padding: 0; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 16px; color: #202c42; cursor: pointer;">取消</button>
        <sc-if value="{{canSubmit}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{submit}}" style="flex: 1 1 0; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #ff6a00; font: inherit; font-size: 16px; font-weight: 500; color: #fff; cursor: pointer;">提交申请</button>
        </sc-if>
        <sc-if value="{{cantSubmit}}" hint-placeholder-val="{{true}}">
          <button type="button" disabled="{{true}}" style="flex: 1 1 0; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #c9d3e1; font: inherit; font-size: 16px; font-weight: 500; color: #fff; cursor: not-allowed;">提交申请</button>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // sheet：申请面板；off：取消勾选的导出范围；submitted：本次已提交（覆盖 Tweaks 的 frame）；sentCount：提交时勾选的项数；linked：已点“下载”
    this.state = { sheet: false, off: [], code: '', codeSent: false, submitted: false, sentCount: 5, linked: false };
  }
  renderVals() {
    const { sheet, off, code, codeSent, submitted, sentCount, linked } = this.state;
    const frame = this.props.frame ?? '未申请';
    const status = submitted ? '生成中' : frame;

    // 账号信息与 Mine、Settings 一致，今天 = 11/03
    const profile = [
      { k: '姓名', v: '王女士' },
      { k: '手机号', v: '138****2026' },
      { k: '常用城市', v: '东营' },
      { k: '企业身份', v: '东营港务物流 经办人' }
    ];
    // 数量与 Participants、AddressList、OrderList 一致；每行落到已有页面，不在本页展开明细
    const stored = [
      { t: '参与人', sub: '姓名、年龄、监护关系', v: '3 人', href: 'Participants.dc.html' },
      { t: '收货地址', sub: '收货人、手机号、详细地址', v: '2 个', href: 'AddressList.dc.html' },
      { t: '订单记录', sub: '商品、服务和报名订单', v: '6 笔', href: 'OrderList.dc.html' },
      { t: '体验记录', sub: '体验方式、场次和结果', v: '', href: 'ExpRecords.dc.html' },
      { t: '收藏与对比', sub: '收藏的商品和服务', v: '', href: 'Favorites.dc.html' }
    ];
    const scope = [
      { id: 'account', t: '账号信息' },
      { id: 'people', t: '参与人' },
      { id: 'address', t: '收货地址' },
      { id: 'orders', t: '订单记录' },
      { id: 'exp', t: '体验与收藏记录' }
    ].map((s) => {
      const on = !off.includes(s.id);
      return {
        t: s.t, on, notOn: !on,
        toggle: () => this.setState((st) => ({ off: st.off.includes(s.id) ? st.off.filter((x) => x !== s.id) : st.off.concat(s.id) }))
      };
    });
    const picked = scope.filter((s) => s.on).length;
    const ready = picked > 0 && code.length === 6;
    const isMaking = status === '生成中';
    const isReady = status === '可下载';

    return {
      profile, stored, scope,
      isEmpty: status === '未申请',
      hasRecord: isMaking || isReady,
      isMaking,
      isReady,
      recordSub: isMaking ? '11/03 提交 · ' + sentCount + ' 项内容' : '11/03 已生成 · ' + sentCount + ' 项内容',
      recordNote: isMaking ? '预计 [协议约定时间] 内生成，完成后通过“消息”通知你'
        : linked ? '下载链接已生成，[协议约定时间] 内有效' : '副本保留 [协议约定时间]，过期后需要重新申请',
      recordBg: isReady && linked ? '#eefaf3' : '#f5f7fc',
      recordFg: isReady && linked ? '#11804a' : '#627187',
      getLink: () => this.setState({ linked: true }),
      canApply: !isMaking,
      applyLabel: isReady ? '重新申请导出' : '申请导出',
      sheetOpen: sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      code,
      setCode: (e) => { if (e && e.target) this.setState({ code: String(e.target.value || '').replace(/\D/g, '').slice(0, 6) }); },
      codeIdle: !codeSent,
      codeSent,
      sendCode: () => this.setState({ codeSent: true }),
      canSubmit: ready,
      cantSubmit: !ready,
      submit: () => this.setState({ sheet: false, submitted: true, sentCount: picked || 5, code: '', codeSent: false, linked: false })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"frame":"未申请"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
