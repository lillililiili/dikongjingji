<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EX4 我的体验</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">我的体验</h1>
  </div>
  <div style="flex-shrink: 0; display: flex; gap: 22px; padding: 0 16px; background: #fff; border-bottom: 1px solid #f0f1f3;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="margin: 0; padding: 10px 0; border: 0; border-bottom: 3px solid {{t.bd}}; background: transparent; color: {{t.c}}; font: inherit; font-size: 15px; font-weight: {{t.w}}; display: flex; align-items: flex-start; cursor: pointer;">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <sc-if value="{{showVenue}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 12px; padding: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff0e3; color: #ba470b;">到馆 · 真机</span>
        <span style="font-size: 12px; color: #11804a;">待到馆</span>
        <span style="margin-left: auto; font-size: 12px; color: #627187;">今天 14:00</span>
      </div>
      <span style="font-size: 15px; font-weight: 500;">机器人避障闯关 · 1 人</span>
      <span style="font-size: 12px; color: #627187;">示例低空与机器人体验馆 · ¥39 已支付</span>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <a href="VenueCode.dc.html" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #c9d3e1; font-size: 13px; color: #202c42; text-decoration: none; display: flex; align-items: center;">改期 / 取消</a>
        <a href="VenueCode.dc.html" style="min-height: 32px; padding: 0 12px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 13px; text-decoration: none; display: flex; align-items: center;">出示核销码</a>
      </div>
    </div>
    </sc-if>

    <sc-for list="{{recs}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 12px;">
        <img src="{{r.img}}" alt="{{r.t}}" style="width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: {{r.lbg}}; color: {{r.lfg}};">{{r.label}}</span>
            <span style="margin-left: auto; font-size: 12px; color: #627187;">{{r.when}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 500;">{{r.t}}</span>
          <span style="font-size: 12px; color: #536178;">{{r.res}}</span>
          <div style="display: flex; gap: 14px; margin-top: 2px; font-size: 13px;">
            <sc-if value="{{r.result}}" hint-placeholder-val="{{true}}">
              <a href="{{r.result}}" style="text-decoration: none;">查看结果</a>
            </sc-if>
            <a href="{{r.again}}" style="text-decoration: none;">{{r.act}}</a>
            <a href="PdFull.dc.html" style="text-decoration: none; color: #536178;">看关联商品</a>
          </div>
        </div>
      </div>
    </sc-for>
    <div style="font-size: 12px; color: #738096; text-align: center; line-height: 1.6;">未登录时的体验结果只保存在本机，登录后可归档到账户</div>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const { tab } = this.state;
    const tabs = [['all', '全部'], ['online', '线上体验'], ['venue', '到馆预约']].map(([id, label]) => {
      const on = id === tab;
      return { label, on, c: on ? '#202c42' : '#627187', w: on ? 700 : 400, bd: on ? '#ff6a00' : 'transparent', pick: () => this.setState({ tab: id }) };
    });
    const sim = { label: '虚拟仿真', lbg: '#e2f6ed', lfg: '#11804a', act: '再试一次' };
    // 结果页的样例是机器人避障模拟的挑战完成，只有这一条有“查看结果”；录播演示没有结果
    const recs = [
      { ...sim, t: '机器人避障模拟', when: '11/02', res: '挑战完成 · 用时 2′36″ · 碰撞 1 次', img: '_blob/822c9edc2d0d857c67055194c02161d3.jpg', again: 'ExpSim.dc.html', result: 'ExpResult.dc.html' },
      { ...sim, t: '无人机起降与悬停', when: '10/30', res: '未完成 · 停在第 2 关', img: '_blob/b41e3fb34601d5b9b3c9e40e84d2a489.jpg', again: 'ExpSim.dc.html', result: '' },
      { label: '录播演示', lbg: '#e6f0ff', lfg: '#1d63c4', t: '3 分钟看懂编程机器人', when: '10/28', res: '已看完', img: '_blob/d7f749aa0af5b1d1784040d2a816e2f0.jpg', again: 'ContentVideo.dc.html', act: '再看一次', result: '' }
    ];
    // 到馆预约 = 顶部那张到馆卡片；线上体验 = 虚拟仿真与录播演示记录
    return { tabs, showVenue: tab !== 'online', recs: tab === 'venue' ? [] : recs };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
