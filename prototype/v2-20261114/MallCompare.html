<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B4 商品对比（二期待定）</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mall2.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">商品对比</h1>
    <span style="font-size: 13px; color: #627187; margin-left: 6px;">2 / 3</span>
    <label style="margin-left: auto; margin-right: 8px; min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #536178; cursor: pointer;"><input type="checkbox" checked="{{onlyDiff}}" onChange="{{toggleDiff}}" style="accent-color: #ff6a00; width: 16px; height: 16px; margin: 0;">只看不同</label>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">
    <div style="display: grid; grid-template-columns: 84px 1fr 1fr; background: #fff; border-bottom: 1px solid #e5ebf3;">
      <div></div>
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="2">
        <div style="padding: 12px 8px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid #f0f1f3;">
          <div style="height: 76px; border-radius: 10px; background: #eef0f3; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></div>
          <span style="font-size: 13px; font-weight: 500; line-height: 1.4;">{{c.name}}</span>
          <span style="font-size: 16px; font-weight: 700; color: #e85400;">{{c.price}}</span>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: grid; grid-template-columns: 84px 1fr 1fr; background: {{r.bg}}; border-bottom: 1px solid #f0f1f3;">
        <div style="padding: 10px 8px 10px 16px; font-size: 12px; color: #627187;">{{r.k}}</div>
        <div style="padding: 10px 8px; font-size: 13px; line-height: 1.45; border-left: 1px solid #f0f1f3;">{{r.a}}</div>
        <div style="padding: 10px 8px; font-size: 13px; line-height: 1.45; border-left: 1px solid #f0f1f3;">{{r.b}}</div>
      </div>
    </sc-for>
    <div style="padding: 10px 16px; font-size: 12px; color: #627187; line-height: 1.6;">参数由商家填报并经平台审核，以商品详情页为准。同一商品多家在售时，展示最低报价及商家数。</div>
  </div>

  <div style="flex-shrink: 0; display: grid; grid-template-columns: 84px 1fr 1fr; gap: 0; padding: 10px 0 14px; background: #fff; border-top: 1px solid #e5ebf3;">
    <div></div>
    <div style="padding: 0 6px;"><a href="PdFull.dc.html" style="height: 40px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">选商家购买</a></div>
    <div style="padding: 0 6px;"><a href="PdFull.dc.html" style="height: 40px; border-radius: 999px; background: #fff0e3; color: #ba470b; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">选商家购买</a></div>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // “只看不同”初始不勾选（与静态稿一致）
    this.state = { onlyDiff: false };
  }
  renderVals() {
    const { onlyDiff } = this.state;
    const drone = 'M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3';
    const robot = 'M6 8h12v10H6zM9 12h.01M15 12h.01M12 4v4M10 15h4M4 12h2M18 12h2';
    const cols = [
      { name: '编程机器人探索套装', price: '¥1,299 起', d: robot },
      { name: '桌面六轴机械臂 教学版', price: '¥9,800 起', d: robot }
    ];
    const rows = [
      { k: '在售商家', a: '3 家（厂家 1 · 经销 2）', b: '2 家（厂家 1 · 本地 1）' },
      { k: '体验方式', a: '线上仿真 · 体验馆可看', b: '线上仿真' },
      { k: '适用年龄', a: '8 岁以上', b: '12 岁以上' },
      { k: '编程方式', a: '图形化 / Python', b: '图形化 / Python / ROS' },
      { k: '配套课程', a: '16 课时（标准套装含）', b: '24 课时（含）' },
      { k: '东营现货', a: '有 · 可到店自提', b: '厂家直发 5–7 天' },
      { k: '售后主体', a: '按所选商家', b: '厂家统一售后' },
      { k: '发票', a: '可开 · 由销售方开具', b: '可开 · 由销售方开具' }
    ]
      // 勾选“只看不同”后，隐藏两件商品取值完全相同的行
      .filter((r) => !onlyDiff || r.a !== r.b)
      .map((r, i) => ({ ...r, bg: i % 2 ? '#fff' : '#fcfcfd' }));
    const toggleDiff = () => this.setState((s) => ({ onlyDiff: !s.onlyDiff }));
    return { cols, rows, onlyDiff, toggleDiff };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
