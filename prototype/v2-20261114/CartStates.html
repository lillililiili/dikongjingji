<style>

a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}

.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}

      <label style="position: relative; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; color: #536178; white-space: nowrap;"><input type="checkbox" checked="{{allPicked}}" onChange="{{togglePickAll}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;"><sc-if value="{{allPicked}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if><sc-if value="{{notAllPicked}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c9d3e1; background: #fff;"></span></sc-if>全选</label>
      <span style="margin-left: auto; font-size: 13px; color: #536178; white-space: nowrap;">已选 {{pickedCount}} 件</span>
      <sc-if value="{{canDelete}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-haspopup="dialog" onClick="{{askDelete}}" style="flex-shrink: 0; height: 44px; box-sizing: border-box; padding: 0 20px; border: 1.5px solid #ff6a00; border-radius: 999px; background: #fff; font: inherit; color: #ba470b; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer;">删除({{pickedCount}})</button>
      </sc-if>
      <sc-if value="{{noDelete}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled="{{true}}" style="flex-shrink: 0; height: 44px; box-sizing: border-box; padding: 0 20px; border: 0; border-radius: 999px; background: #c9d3e1; font: inherit; color: #fff; font-size: 15px; font-weight: 500; white-space: nowrap;">删除</button>
      </sc-if>
    </div>
  </sc-if>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.c}}; font-size: 12px; font-weight: {{t.w}};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 4px; left: 50%; margin-left: 5px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #ff5200; color: #fff; font-size: 11px; line-height: 16px; text-align: center;">{{t.badge}}</span>
        </sc-if>
        <sc-if value="{{t.dot}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 7px; left: 50%; margin-left: 9px; width: 8px; height: 8px; border-radius: 50%; background: #ff5200;"></span>
        </sc-if>
      </a>
    </sc-for>
  </nav>

  <sc-if value="{{askOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeAsk}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="{{askTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <span style="font-size: 18px; font-weight: 700; line-height: 25px;">{{askTitle}}</span>
      <span style="font-size: 14px; line-height: 20px; color: #536178;">删除后不能恢复，需要时请重新加入购物车。</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{closeAsk}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">暂不删除</button>
        <button type="button" onClick="{{doDelete}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; background: #ff6a00; font: inherit; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer;">确认删除</button>
      </div>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // manage：null 跟随帧（管理模式帧默认打开），点“管理/完成”后由用户决定
    // picked：管理模式下勾选待删除的商品；gone：已删除的商品；ask：删除确认面板是否打开
    // merchant、checked、qty：普通模式的结算勾选和数量，规则同 Cart
    this.state = { manage: null, picked: {}, gone: {}, ask: false, merchant: 'robot', checked: { kit: true, field: true }, qty: { kit: 1, field: 1, drone: 1 } };
  }
  renderVals() {
    const { picked, gone, ask, merchant, checked, qty } = this.state;
    const frame = this.props.frame ?? '管理模式';
    const isGuest = frame === '未登录';
    const blankFrame = isGuest || frame === '空态';
    const stale = frame === '失效商品';

    const kit = { id: 'kit', name: '编程机器人探索套装', spec: '标准套装', ship: '48 小时内发货 · 可到店自提', unit: 1299, img: '_blob/5d32505e8b9a494f8436e31c3008ef99.jpg', href: 'PdFull.dc.html' };
    const field = { id: 'field', name: '避障训练场地套件', spec: '', ship: '', unit: 460, img: '_blob/822c9edc2d0d857c67055194c02161d3.jpg', href: 'PdField.dc.html' };
    const drone = { id: 'drone', name: '便携航拍无人机', spec: '', ship: '', unit: 1999, img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg', href: 'PdDroneMini.dc.html' };
    const robot = { id: 'robot', name: '示例机器人商家', tag1: '厂家直营', tag2: '东营现货', items: [kit, field] };
    const store = { id: 'store', name: '示例科创器材店', tag1: '本地商家', tag2: '到店自提', items: [drone] };
    const sensor = { id: 'sensor', name: '扩展传感器包', why: '商家已下架', img: '' };

    // 失效商品帧：一件下架、一件无货、一件切城后不可售；不可售的才给“切换城市”
    const shops = (blankFrame ? [] : (stale ? [robot] : [robot, store]))
      .map((s) => ({ ...s, items: s.items.filter((it) => !gone[it.id]) }))
      .filter((s) => s.items.length > 0);
    const invalidAll = stale
      ? [sensor, { id: 'arm', name: '桌面六轴机械臂 教学版', why: '暂时无货', img: '' }, { id: 'drone', name: drone.name, why: '当前城市不可售', img: drone.img, city: true }]
      : [sensor];
    const invalidList = blankFrame ? [] : invalidAll.filter((x) => !gone[x.id]);

    const count = shops.reduce((n, s) => n + s.items.length, 0); // 有效商品件数 = 底栏“购物车”角标（不随数量变化）
    const hasAny = count + invalidList.length > 0;
    const manage = hasAny && (this.state.manage === null ? frame === '管理模式' : this.state.manage);

    const ACTIVE = 3; // 0 首页 1 发现 2 消息 3 购物车 4 我的
    const tabs = [
      ['首页', 'HomeFull.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', '', false],
      ['发现', 'Discover.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z', '', true],
      ['消息', 'Messages.dc.html', 'M4 5h16v11H9l-5 4zM8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01', isGuest ? '' : '3', false],
      ['购物车', 'Cart.dc.html', 'M3 4h2l2 11h11l2-8H6M9 20a1 1 0 1 0 0-.1M17 20a1 1 0 1 0 0-.1', count > 0 ? String(count) : '', false],
      ['我的', 'Mine.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6', '', false]
    ].map((t, i) => ({ label: t[0], href: t[1], d: t[2], badge: t[3], dot: t[4] && i !== ACTIVE, c: i === ACTIVE ? '#ff6a00' : '#738096', w: i === ACTIVE ? 500 : 400 }));

    const MAX_QTY = 99;
    const yuan = (n) => '¥' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const checkAll = (shop, on) => shop.items.reduce((acc, it) => ({ ...acc, [it.id]: on }), {});
    const changeQty = (id, step) => this.setState((s) => ({ qty: { ...s.qty, [id]: Math.min(MAX_QTY, Math.max(1, (s.qty[id] || 1) + step)) } }));
    const togglePick = (id) => this.setState((s) => ({ picked: { ...s.picked, [id]: !s.picked[id] } }));

    // 普通模式：两个商家像单选，同 Cart。管理模式：不结算，可以跨商家勾选删除
    let sum = 0;
    let checkedCount = 0;
    const groups = shops.map((shop) => {
      const active = manage || shop.id === merchant;
      const groupOn = manage ? shop.items.every((it) => picked[it.id]) : active && shop.items.every((it) => checked[it.id]);
      const items = shop.items.map((it) => {
        const q = qty[it.id] || 1;
        const on = manage ? !!picked[it.id] : active && !!checked[it.id];
        if (!manage && on) { sum += it.unit * q; checkedCount += 1; }
        return {
          id: it.id, name: it.name, spec: it.spec, ship: it.ship, img: it.img, href: it.href, price: yuan(it.unit), qty: q,
          selectable: active, on, off: active && !on, na: !active, note: !active, aria: '勾选' + it.name,
          specLabel: '修改规格：' + it.spec,
          stepper: !manage, plainQty: manage,
          toggle: () => (manage ? togglePick(it.id) : this.setState((s) => ({ checked: { ...s.checked, [it.id]: !s.checked[it.id] } }))),
          minus: () => changeQty(it.id, -1), plus: () => changeQty(it.id, 1),
          minusOff: q <= 1, plusOff: q >= MAX_QTY,
          minusC: q <= 1 ? '#c9d3e1' : '#536178', plusC: q >= MAX_QTY ? '#c9d3e1' : '#536178',
          minusLabel: '减少' + it.name + '数量', plusLabel: '增加' + it.name + '数量'
        };
      });
      return {
        id: shop.id, name: shop.name, tag1: shop.tag1, tag2: shop.tag2, items,
        on: groupOn, off: active && !groupOn, na: !active, aria: (manage ? '勾选' : '结算') + shop.name + '的商品',
        pick: () => (manage
          ? this.setState((s) => ({ picked: { ...s.picked, ...checkAll(shop, !groupOn) } }))
          : this.setState({ merchant: shop.id, checked: checkAll(shop, true) }))
      };
    });

    const invalid = invalidList.map((x) => ({
      name: x.name, why: x.why, img: x.img, noImg: !x.img, city: !!x.city,
      selectable: manage, on: !!picked[x.id], off: !picked[x.id], aria: '勾选' + x.name, toggle: () => togglePick(x.id),
      canRemove: !manage, removeLabel: '删除' + x.name, removeMl: x.city ? '0' : 'auto',
      remove: () => this.setState((s) => ({ gone: { ...s.gone, [x.id]: true } }))
    }));

    const current = groups.find((g) => g.id === merchant);
    const allOn = !!current && current.on; // 底部“全选本商家”
    const toggleAll = () => this.setState((s) => {
      const shop = shops.find((x) => x.id === s.merchant);
      return shop ? { checked: { ...s.checked, ...checkAll(shop, !shop.items.every((it) => s.checked[it.id])) } } : {};
    });

    const ids = shops.reduce((acc, s) => acc.concat(s.items.map((it) => it.id)), []).concat(invalidList.map((x) => x.id));
    const pickedCount = ids.filter((id) => picked[id]).length;
    const allPicked = ids.length > 0 && pickedCount === ids.length;

    return {
      tabs, groups, invalid, hasAny, manage,
      notManage: hasAny && !manage,
      showCount: hasAny && !isGuest,
      count,
      manageLabel: manage ? '完成' : '管理',
      manageC: manage ? '#ba470b' : '#202c42',
      manageW: manage ? 500 : 400,
      toggleManage: () => this.setState({ manage: !manage, picked: {} }),
      showInvalid: invalid.length > 0,
      invalidCount: invalid.length,
      clearInvalid: () => this.setState((s) => ({ gone: { ...s.gone, ...invalidList.reduce((acc, x) => ({ ...acc, [x.id]: true }), {}) } })),

      showCheckoutBar: hasAny && !manage,
      allOn, allOff: !allOn, toggleAll,
      total: yuan(sum),
      checkout: checkedCount > 0 ? '结算(' + checkedCount + ')' : '结算',
      canCheckout: checkedCount > 0,
      noCheckout: checkedCount === 0,
      // 两件同商家的默认组合进多件确认订单，其余进单件确认订单
      checkoutHref: checkedCount === 2 ? 'CheckoutStates.dc.html' : 'Checkout.dc.html',

      allPicked, notAllPicked: !allPicked, pickedCount,
      togglePickAll: () => this.setState({ picked: ids.reduce((acc, id) => ({ ...acc, [id]: !allPicked }), {}) }),
      canDelete: pickedCount > 0,
      noDelete: pickedCount === 0,
      askDelete: () => this.setState({ ask: true }),
      askOpen: ask && pickedCount > 0,
      askTitle: '确认删除 ' + pickedCount + ' 件商品？',
      closeAsk: () => this.setState({ ask: false }),
      doDelete: () => this.setState((s) => ({ gone: { ...s.gone, ...s.picked }, picked: {}, ask: false })),

      showBlank: !hasAny,
      blankTitle: isGuest ? '登录后查看购物车' : '购物车还是空的',
      blankText: isGuest ? '登录后可以加入商品、查看购物车并结算' : '看中的设备和配件可以先放这里，再一起结算',
      blankCta: isGuest ? '登录 / 注册' : '去逛逛',
      blankHref: isGuest ? 'Login.dc.html' : 'HomeFull.dc.html',
      cats: [
        { t: '无人机', img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg' },
        { t: '机器人', img: '_blob/85dbe79468bbacd46343cf281dfb4e4b.jpg' },
        { t: '配件', img: '_blob/44b9df29cd316503b6cad0f764a0798b.jpg' },
        { t: '课程', img: '_blob/7dea67aa257759d5c4cffcda675bc107.jpg' }
      ]
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"frame":"管理模式"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
