class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // from：按钮推进时所在的 Tweaks 帧；Tweaks 换帧后以新帧为准
    this.state = { from: '', stage: '', sheet: false };
  }
  renderVals() {
    const base = this.props.frame ?? '使用中';
    const { from, sheet } = this.state;
    const stage = from === base ? this.state.stage : base;
    // 询价合同订单的租赁变体，属“服务及合同”，不是第四种订单。主线：待报价 → 待确认 → 待交接 → 使用中 → 待归还 → 已结束
    // 示例时间线：10/30 确认合同并支付租金，11/01 交接，11/05 归还；默认帧是“今天 11/03”
    const steps = ['待报价', '待确认', '待交接', '使用中', '待归还', '已结束'];
    const CURRENT = steps.indexOf(stage);
    const ended = stage === '已结束';
    const chain = steps.map((label, i) => {
      const done = i < CURRENT || ended;
      const cur = i === CURRENT && !ended;
      const reached = i <= CURRENT;
      const nextReached = i + 1 <= CURRENT;
      return {
        label, done, cur,
        bg: done ? '#ff6a00' : '#fff',
        bd: reached ? '#ff6a00' : '#c9d3e1',
        tc: i === CURRENT ? '#ba470b' : (reached ? '#202c42' : '#738096'),
        tw: i === CURRENT ? 700 : 400,
        lc: i === 0 ? 'transparent' : (reached ? '#ff6a00' : '#e5ebf3'),
        rc: i === steps.length - 1 ? 'transparent' : (nextReached ? '#ff6a00' : '#e5ebf3')
      };
    });
    const heads = {
      '待交接': { t: '待交接 · 请核对交接记录', s: '商家 11/01 09:30 已到场并录入记录，确认后开始计租', c: '#ba470b' },
      '使用中': { t: '使用中 · 还有 2 天到期', s: '11/05 18:00 前归还，超期按合同约定计费', c: '#ba470b' },
      '待归还': { t: '待归还 · 请核对归还记录', s: '商家 11/05 16:40 已取回并录入记录，确认后订单结束', c: '#ba470b' },
      '已结束': { t: '已结束', s: '11/05 16:52 双方确认归还，没有额外费用', c: '#11804a' }
    };
    // 费用约定：租金在合同确认后支付（设计假设）；押金待定，不在线收取；超期和赔付按合同，没有发生就写 ¥0
    const money = { fs: '16px', fw: 700, ac: '#202c42' };
    const quiet = { fs: '13px', fw: 400, ac: '#627187' };
    const fees = [
      { name: '租金', tag: '', state: '5 天 × ¥380 · 已支付 10/30', sc: '#11804a', amount: '¥1,900', ...money },
      { name: '押金', tag: '待定', state: '[押金规则待确认]，当前不在线收取', sc: '#627187', amount: '待定', ...quiet },
      ended
        ? { name: '超期费', tag: '', state: '按时归还，未发生', sc: '#627187', amount: '¥0', ...money }
        : { name: '超期费', tag: '', state: '超过 11/05 18:00 后按天计费', sc: '#627187', amount: '合同约定', ...quiet },
      ended
        ? { name: '损坏赔付', tag: '', state: '无新增损伤，未发生', sc: '#627187', amount: '¥0', ...money }
        : { name: '损坏赔付', tag: '', state: '以交接和归还记录为依据', sc: '#627187', amount: '合同约定', ...quiet }
    ];
    const kv = (rows) => rows.map(([k, v]) => ({ k, v }));
    const tagWait = { tbg: '#fff0e3', tfg: '#ba470b', tag: '待你确认' };
    const tagDone = { tbg: '#e2f6ed', tfg: '#11804a', tag: '双方已确认' };
    const tagIdle = { tbg: '#eef2f8', tfg: '#627187', tag: '未开始' };
    const handoverRows = [
      ['时间', '11/01 09:30'],
      ['地点', '东营港务物流 收货点'],
      ['设备', '巡检机器狗 ×1 · 编号 DOG-0118'],
      ['配件', '遥控手柄、电池 ×2、充电器、运输箱'],
      ['外观', '无损伤，电量 100%']
    ];
    const handover = { ...(stage === '待交接' ? tagWait : tagDone), rows: kv(handoverRows) };
    const returnRows = [
      ['时间', '11/05 16:40'],
      ['方式', '商家上门取回'],
      ['配件', '齐全，与交接记录一致'],
      ['外观', '无新增损伤'],
      ['超期', '未超期，没有额外费用']
    ];
    const planRows = [
      ['应还', '11/05 18:00 前'],
      ['方式', '商家上门取回'],
      ['地点', '东营港务物流 收货点'],
      ['核对', '设备编号、配件数量、外观'],
      ['超期', '按合同约定计费']
    ];
    const recorded = stage === '待归还' || ended;
    const giveBack = {
      ...(ended ? tagDone : (recorded ? tagWait : tagIdle)),
      recorded, pending: !recorded, rows: kv(recorded ? returnRows : planRows)
    };
    const parties = kv([
      ['出租方', '示例机器人商家（厂家直营）'],
      ['收款方', '示例机器人商家 · 经平台支付渠道'],
      ['开票方', '示例机器人商家 · 按合同开具'],
      ['交接履约', '示例机器人商家 东营仓'],
      ['售后责任', '示例机器人商家 · 按合同约定']
    ]);
    // 底部动作和确认面板：交接、归还都是商家录入、用户确认；用户确认后才推进到下一帧
    const actions = {
      '待交接': { label: '确认交接', title: '确认交接', confirm: '确认交接', next: '使用中', note: '确认后开始计租，记录不能再改。有问题先联系商家。', rows: kv(handoverRows.slice(2)) },
      '使用中': { label: '预约归还', title: '预约归还', confirm: '确认归还安排', next: '待归还', note: '按合同由商家上门取回，取回时录入归还记录，你核对后确认。', rows: kv(planRows.slice(0, 3)) },
      '待归还': { label: '确认归还', title: '确认归还记录', confirm: '确认归还', next: '已结束', note: '确认后订单结束。对记录有疑问先联系商家。', rows: kv(returnRows.slice(2)) }
    };
    const action = actions[stage];
    // 交接照片、归还照片各 3 张，点开进公共图片查看器 PhotoViewer
    const cta = action
      ? { ...action, act: true, again: false }
      : { label: '', title: '', confirm: '', next: '', note: '', rows: [], act: false, again: true };
    return {
      head: heads[stage], chain, fees, handover, giveBack, parties, cta,
      sheetOpen: sheet && !!action,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      confirmSheet: () => { if (action) this.setState({ from: base, stage: action.next, sheet: false }); }
    };
  }
}
