class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // view：m06 服务履约 / m07 已验收回看（画板内切屏）
    // links：已生成短时下载链接的文件（all 为全部下载）
    this.state = { view: 'm06', links: {} };
  }
  renderVals() {
    const { view, links } = this.state;
    const isM06 = view === 'm06';

    // 服务已结束：验收和付款都已完成，本页只读，不再出现验收和支付入口
    const logs = [
      { time: '11/06 09:10', text: '开始作业' },
      { time: '11/06 11:40', text: '完成作业' },
      { time: '11/07 10:00', text: '报告已交付（48 小时内）' },
      { time: '11/07 15:30', text: '已验收' }
    ];

    // 回看的结果摘要：按严重等级分组，合计与“发现隐患 3 项”一致
    const issues = [
      { name: '重要问题', count: '1 项', dot: '#d64f67' },
      { name: '一般问题', count: '2 项', dot: '#ff6a00' }
    ];

    // 验收后文件仍可下载：同样只走受控短时链接，页面按接口返回的到期时间显示（这里示意 15:40 前有效），不显示文件地址
    const icons = {
      report: 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6',
      issues: 'M4 5h16v14H4zM4 10h16M4 15h16M10 5v14',
      points: 'M12 21c4.6-4.7 7-8.1 7-11a7 7 0 0 0-14 0c0 2.9 2.4 6.3 7 11zM12 12.5a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5z',
      photos: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9.5h.01'
    };
    const fileList = [
      { id: 'report', name: '巡检报告（PDF）' },
      { id: 'issues', name: '缺陷清单（表格）' },
      { id: 'points', name: '点位标注（KML · 24 个点位）' },
      { id: 'photos', name: '高清巡检影像（128 张）' }
    ];
    const files = fileList.map((f) => ({
      name: f.name,
      d: icons[f.id],
      ready: Boolean(links[f.id]),
      aria: '下载' + f.name,
      get: () => this.setState((s) => ({ links: { ...s.links, [f.id]: true } }))
    }));

    return {
      isM06,
      isM07: !isM06,
      title: isM06 ? '服务履约' : '交付与验收',
      footText: isM06 ? '服务已完成，感谢使用' : '验收款 ¥4,200 已支付 · 11/07',
      logs, issues, files,
      allReady: Boolean(links.all),
      allNotReady: !links.all,
      openDelivery: () => this.setState({ view: 'm07' }),
      backToM06: () => this.setState({ view: 'm06' }),
      getAll: () => this.setState((s) => ({ links: { ...s.links, all: true } }))
    };
  }
}
