</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // sheet：分享面板是否打开；copied：这次打开后是否已复制链接
    this.state = { sheet: false, copied: false };
  }
  renderVals() {
    const { sheet, copied } = this.state;
    const ok = '#11804a', warn = '#ba470b';

    // 本季活动：数据与“活动”频道一致，全部落到活动详情
    const acts = [
      { href: 'ActDetail.dc.html', tag: '赛事', t: '青少年无人机编程挑战赛（东营站）', when: '11/15 09:00 · 东营低空与机器人体验馆', price: '¥120', unit: '/人', status: '余 12/60', sc: ok, img: '_blob/b41e3fb34601d5b9b3c9e40e84d2a489.jpg' },
      { href: 'ActOpenDay.dc.html', tag: '体验日', t: '无人机开放体验日', when: '11/14 10:00 · 东营低空与机器人体验馆', price: '免费', unit: '', status: '报名中', sc: ok, img: '_blob/e42bb39cca5b4f528e6577da8445bced.webp' },
      { href: 'ActCamp.dc.html', tag: '研学', t: '黄河口低空研学一日营', when: '每周六 · 含接送', price: '¥268', unit: '/人', status: '已满 · 可候补', sc: warn, img: '_blob/eada5bcde09c62b71c41868194f30706.jpg' }
    ];

    // 到馆体验：数据与首页“今天去体验”一致，余位紧张时用橙色；全部落到场馆详情
    const sessions = [
      { t: '模拟飞行', when: '14:00 场', left: '余 6 位', c: ok },
      { t: '机器人闯关', when: '15:30 场', left: '余 2 位', c: warn }
    ];

    // 相关内容：封面与发现页一致；只有视频显示时长；视频到视频详情，案例到图文详情
    const contents = [
      { tag: '视频', dur: '3:12', t: '3 分钟看懂编程机器人', img: '_blob/d7f749aa0af5b1d1784040d2a816e2f0.jpg', href: 'ContentVideo.dc.html' },
      { tag: '案例', dur: '', t: '一台机器狗如何完成园区夜间巡逻', img: '_blob/e42bb39cca5b4f528e6577da8445bced.webp', href: 'ContentArticle.dc.html' }
    ];

    return {
      acts, sessions, contents,
      sheetOpen: sheet,
      canCopy: !copied,
      copied,
      openSheet: () => this.setState({ sheet: true }),
      copyLink: () => this.setState({ copied: true }),
      // 关闭时清掉“已复制”，下次打开回到可复制状态
      closeSheet: () => this.setState({ sheet: false, copied: false })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
