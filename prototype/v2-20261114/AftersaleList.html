<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>退款/售后列表与回看</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 780px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 8px;">
      <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700;">退款/售后</h1>
    </div>
    <div role="tablist" aria-label="售后状态" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="position: relative; height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 16px; line-height: 22px; font-weight: {{t.w}}; color: {{t.c}}; white-space: nowrap; cursor: pointer;">{{t.label}}<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; margin-left: -10px; border-radius: 3px; background: #ff6a00;"></span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px;">
    <sc-for list="{{shown}}" as="i" hint-placeholder-count="3">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: #fff;">
        <a href="{{i.href}}" style="display: flex; flex-direction: column; gap: 12px; color: #202c42; text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-shrink: 0; padding: 0 6px; border-radius: 6px; background: {{i.kindBg}}; color: {{i.kindFg}}; font-size: 12px; line-height: 20px; white-space: nowrap;">{{i.kind}}</span>
            <span style="min-width: 0; font-size: 14px; line-height: 21px; color: #536178; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{i.shop}}</span>
            <span style="flex-shrink: 0; margin-left: auto; font-size: 14px; font-weight: 500; line-height: 21px; color: {{i.sc}}; white-space: nowrap;">{{i.status}}</span>
          </span>
          <span style="display: flex; gap: 12px;">
            <sc-if value="{{i.img}}" hint-placeholder-val="{{true}}">
              <img src="{{i.img}}" alt="{{i.title}}" style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; display: block; background: #eef2f8; font-size: 11px;">
            </sc-if>
            <sc-if value="{{i.noImg}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; background: #eef2f8; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"></path></svg></span>
            </sc-if>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="display: flex; align-items: flex-start; gap: 8px;">
                <span style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 700; line-height: 21px;">{{i.title}}<sc-if value="{{i.tail}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; white-space: nowrap;">{{i.tail}}</span></sc-if></span>
                <span style="flex-shrink: 0; font-size: 15px; font-weight: 700; line-height: 21px;">{{i.amount}}</span>
              </span>
              <span style="font-size: 13px; line-height: 18px; color: #738096;">{{i.meta}}</span>
              <span style="font-size: 13px; line-height: 18px; color: {{i.lc}};">{{i.line}}</span>
            </span>
          </span>
        </a>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <sc-for list="{{i.btns}}" as="b" hint-placeholder-count="2">
            <a href="{{b.href}}" style="height: 36px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid {{b.bd}}; background: {{b.bg}}; color: {{b.fg}}; font-size: 14px; font-weight: {{b.w}}; line-height: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{b.t}}</a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 10px; background: #e2f6ed;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#159a70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10c-4-1.6-7-5.4-7-10V6zM8.5 12l2.5 2.5 4.5-5"></path></svg>
      <span style="flex-grow: 1; min-width: 0; font-size: 12px; line-height: 17px; color: #11804a;">售后由售后责任方处理；协商不成时，平台客服协助沟通，不裁决。</span>
      <a href="Chat.dc.html" style="flex-shrink: 0; min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: #11804a; text-decoration: none; white-space: nowrap;">联系客服 ›</a>
    </div>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // tab：售后状态（doing 售后中 / done 已完成 / closed 已关闭）
    this.state = { tab: 'doing' };
  }
  renderVals() {
    const { tab } = this.state;
    const FLOW = 'AftersaleFlow.dc.html';

    // 商品售后都进 AftersaleFlow；报名退改有自己的进度页。按提交时间倒序
    const all = [
      { tab: 'doing', kind: '退货退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥1,299', img: '_blob/5d32505e8b9a494f8436e31c3008ef99.jpg',
        meta: '标准套装（1 台 + 数字课程）× 1', status: '待寄回', line: '商家已同意，请在 [协议约定时间] 内寄回', href: FLOW, urgent: true,
        btns: [['查看进度', FLOW], ['填写运单', FLOW, true]] },
      { tab: 'doing', kind: '报名退改', shop: '东营低空与机器人体验馆', title: '青少年无人机编程挑战赛', tail: '（东营站）', amount: '¥240', img: '_blob/b41e3fb34601d5b9b3c9e40e84d2a489.jpg',
        meta: '11/15 上午场 09:00 · 2 人', status: '待主办方确认', line: '确认时限 [协议约定时间]', href: 'EnrollRefundDetail.dc.html',
        btns: [['查看进度', 'EnrollRefundDetail.dc.html']] },
      { tab: 'doing', kind: '退货退款', shop: '示例科创器材店', title: '便携航拍无人机', amount: '¥1,999', img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg',
        meta: '× 1', status: '退款中', line: '商家已确认收货，¥1,999 正在原路退回', href: FLOW,
        btns: [['查看进度', FLOW]] },
      { tab: 'done', kind: '退货退款', shop: '示例机器人商家', title: '避障训练场地套件', amount: '¥460', img: '_blob/822c9edc2d0d857c67055194c02161d3.jpg',
        meta: '× 1', status: '已退款', line: '11/01 09:30 已原路退回', href: FLOW,
        btns: [['查看详情', FLOW], ['查看订单', 'OrderGoods.dc.html']] },
      { tab: 'done', kind: '仅退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥7,380', img: '_blob/5d32505e8b9a494f8436e31c3008ef99.jpg',
        meta: '教室套装（6 台 + 教师端）× 1', status: '已退款', line: '10/28 16:10 已原路退回', href: FLOW,
        btns: [['查看详情', FLOW], ['查看订单', 'OrderGoods.dc.html']] },
      { tab: 'closed', kind: '退货退款', shop: '示例机器人商家', title: '桌面六轴机械臂 教学版', amount: '¥9,800', img: '',
        meta: '× 1', status: '商家未同意', line: '凭证不足，可补充后重新申请', href: FLOW,
        btns: [['查看详情', FLOW], ['重新申请', 'AftersaleApply.dc.html']] },
      { tab: 'closed', kind: '退货退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥1,299', img: '_blob/5d32505e8b9a494f8436e31c3008ef99.jpg',
        meta: '标准套装（1 台 + 数字课程）× 1', status: '已撤销', line: '你已撤销这次申请', href: FLOW,
        btns: [['查看详情', FLOW], ['重新申请', 'AftersaleApply.dc.html']] }
    ];

    const kinds = {
      退货退款: { kindBg: '#fff0e3', kindFg: '#ba470b' },
      仅退款: { kindBg: '#e6f0ff', kindFg: '#1d63c4' },
      报名退改: { kindBg: '#eee7ff', kindFg: '#6a4fe0' }
    };
    const statusColor = { 待寄回: '#ba470b', 待主办方确认: '#ba470b', 退款中: '#1d63c4', 已退款: '#11804a', 商家未同意: '#d64f67', 已撤销: '#738096' };

    const shown = all.filter((x) => x.tab === tab).map((x) => ({
      ...kinds[x.kind],
      kind: x.kind, shop: x.shop, title: x.title, tail: x.tail || '', amount: x.amount, img: x.img, noImg: !x.img, meta: x.meta,
      status: x.status, line: x.line, href: x.href,
      sc: statusColor[x.status],
      lc: x.urgent ? '#ba470b' : '#536178',
      btns: x.btns.map(([t, href, primary]) => ({
        t, href,
        bd: primary ? '#ff6a00' : '#c9d3e1', bg: primary ? '#ff6a00' : '#fff', fg: primary ? '#fff' : '#202c42', w: primary ? 500 : 400
      }))
    }));

    const tabs = [['doing', '售后中'], ['done', '已完成'], ['closed', '已关闭']].map(([id, name]) => {
      const on = id === tab;
      return {
        on, label: name + ' ' + all.filter((x) => x.tab === id).length,
        c: on ? '#202c42' : '#627187', w: on ? 700 : 400,
        pick: () => this.setState({ tab: id })
      };
    });

    return { tabs, shown };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
