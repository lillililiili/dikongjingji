<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>活动签到、完成与结果记录</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="frame"><option>已签到</option><option selected>已完成</option><option>未到场</option><option>活动延期</option><option>活动取消</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 1362px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
    <div style="flex-shrink: 0; padding: 8px 8px 52px; background: {{heroBg}}; color: #fff;">
      <div style="display: flex; align-items: center;">
        <a href="EnrollList.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
        <h1 style="flex-grow: 1; margin: 0; font-size: 18px; font-weight: 700; line-height: 25px; text-align: center; color: #fff;">订单详情</h1>
        <span style="flex-shrink: 0; width: 44px; height: 44px;"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 0;">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; line-height: 30px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="{{heroIcon}}"></path></svg>{{heroTitle}}</span>
        <span style="font-size: 13px; font-weight: 500; line-height: 19px;">{{heroSub}}</span>
      </div>
    </div>

    <div style="flex-shrink: 0; position: relative; margin-top: -36px; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px;">
      <div style="display: flex; flex-direction: column; padding: 16px 16px 6px; border-radius: 14px; background: #fff;">
        <span style="font-size: 17px; font-weight: 700; line-height: 24px;">青少年无人机编程挑战赛（东营站）</span>
        <sc-if value="{{showMove}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); align-items: center; gap: 4px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fff0e3;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 12px; line-height: 17px; color: #738096;">原时间</span>
              <span style="font-size: 14px; line-height: 20px; color: #738096; text-decoration: line-through; white-space: nowrap;">11/15 上午 09:00</span>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 12px; line-height: 17px; color: #ba470b;">新时间</span>
              <span style="font-size: 14px; font-weight: 700; line-height: 20px; color: #202c42; white-space: nowrap;">11/22 上午 09:00</span>
            </div>
          </div>
        </sc-if>
        <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 10px; margin-top: 12px; font-size: 13px; line-height: 19px;">
          <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
            <span style="color: #738096;">{{f.k}}</span><span style="font-weight: {{f.w}};">{{f.v}}</span>
          </sc-for>
        </div>
        <div style="margin-top: 14px; border-top: 1px dashed #e5ebf3;"></div>
        <div role="list" aria-label="报名进度" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 14px 0 10px;">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
            <div role="listitem" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <span style="position: absolute; left: 0; right: 50%; top: 9px; height: 2px; background: {{s.lineL}};"></span>
              <span style="position: absolute; left: 50%; right: 0; top: 9px; height: 2px; background: {{s.lineR}};"></span>
              <span style="position: relative; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{s.bd}}; background: {{s.bg}}; display: flex; align-items: center; justify-content: center;">
                <sc-if value="{{s.check}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
                <sc-if value="{{s.inner}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ff6a00;"></span></sc-if>
                <sc-if value="{{s.cross}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
              </span>
              <span style="font-size: 12px; line-height: 17px; color: {{s.tc}}; font-weight: {{s.tw}}; white-space: nowrap;">{{s.t}}</span>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{showTicket}}" hint-placeholder-val="{{true}}">
          <div style="border-top: 1px dashed #e5ebf3;"></div>
          <a href="EnrollTicket.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 56px; color: #202c42; text-decoration: none;">
            <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; background: #fff0e3; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2M14 18h2v2M18 18h2v2"></path></svg></span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 500; line-height: 21px;">{{ticketTitle}}</span>
              <span style="font-size: 12px; line-height: 17px; color: #738096;">{{ticketSub}}</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-if>
      </div>

      <sc-if value="{{showChoice}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #fff;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">选择处理方式</h2>
          <sc-for list="{{choices}}" as="c" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="box-sizing: border-box; width: 100%; margin: 0; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; color: #202c42; font: inherit; text-align: left; cursor: pointer;">
              <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{c.dot}}; background: {{c.dotBg}}; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 15px; font-weight: 500; line-height: 21px;">{{c.t}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #627187;">{{c.s}}</span>
              </span>
            </button>
          </sc-for>
          <span style="font-size: 12px; line-height: 17px; color: #738096;">请在 [协议约定时间] 前选择，逾期按保留新场次处理</span>
        </div>
      </sc-if>

      <sc-if value="{{showKept}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #fff;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">处理结果</h2>
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #e2f6ed;">
            <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #159a70; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 500; line-height: 21px; color: #11804a;">已保留 11/22 上午场 09:00</span>
              <span style="font-size: 12px; line-height: 17px; color: #536178;">不用重新付款，原凭证作废，新凭证已发放</span>
            </span>
          </div>
          <span style="font-size: 12px; line-height: 17px; color: #738096;">改变主意了也可以申请退改，活动延期全额退款</span>
        </div>
      </sc-if>

      <sc-if value="{{showRefund}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; padding: 14px 14px 6px; border-radius: 14px; background: #fff;">
          <h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; line-height: 22px;">退款</h2>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #f5f7fc; font-size: 13px; line-height: 20px;">
            <div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 56px; color: #627187;">退款金额</span><span style="font-size: 15px; font-weight: 700; color: #e85400;">¥240</span></div>
            <div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 56px; color: #627187;">退款去向</span><span>[主用支付渠道] 原路退回</span></div>
            <div style="display: flex; align-items: center; gap: 12px;"><span style="flex-shrink: 0; width: 56px; color: #627187;">到账时间</span><span>[协议约定时间] 内</span></div>
          </div>
          <a href="EnrollRefundDetail.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; color: #202c42; text-decoration: none;">
            <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px;">退款中，平台已发起退款</span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #627187; white-space: nowrap;">查看进度</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </div>
      </sc-if>

      <sc-if value="{{showResult}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #fff;">
          <div style="display: flex; align-items: baseline;">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">结果记录</h2>
            <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #627187;">主办方 11/15 16:00 发布</span>
          </div>
          <sc-for list="{{results}}" as="r" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #f5f7fc;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#738096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span>
                <span style="font-size: 15px; line-height: 21px;">{{r.name}}</span>
                <span style="font-size: 13px; line-height: 18px; color: #627187;">{{r.age}}</span>
                <span style="margin-left: auto; padding: 1px 8px; border-radius: 6px; background: #e2f6ed; font-size: 12px; line-height: 18px; color: #11804a; white-space: nowrap;">完赛</span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
                <sc-for list="{{r.stats}}" as="k" hint-placeholder-count="3">
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                    <span style="font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap;">{{k.v}}</span>
                    <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">{{k.k}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px;">
            <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; background: #fff0e3; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"></path></svg></span>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 500; line-height: 21px;">完赛证明</span>
              <sc-if value="{{proofIdle}}" hint-placeholder-val="{{true}}">
                <span style="font-size: 12px; line-height: 17px; color: #738096;">2 份 PDF · 主办方签发</span>
              </sc-if>
              <sc-if value="{{proofReady}}" hint-placeholder-val="{{false}}">
                <span role="status" style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 17px; color: #11804a; white-space: nowrap;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#159a70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>已生成 · 16:30 前有效（示例）</span>
              </sc-if>
            </span>
            <button type="button" aria-label="{{proofAria}}" onClick="{{tapProof}}" style="flex-shrink: 0; height: 36px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff; font: inherit; font-size: 14px; font-weight: 500; color: #ba470b; white-space: nowrap; cursor: pointer;">{{proofLabel}}</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{showSign}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #fff;">
          <div style="display: flex; align-items: baseline;">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">{{peopleTitle}}</h2>
            <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #627187;">{{peopleNote}}</span>
          </div>
          <sc-for list="{{people}}" as="p" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #eef2f8; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#738096" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span>
              <span style="font-size: 15px; line-height: 21px;">{{p.name}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #627187;">{{p.age}}</span>
              <span style="margin-left: auto; font-size: 13px; line-height: 18px; color: {{p.sc}}; white-space: nowrap;">{{p.state}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{showPlan}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #fff;">
          <h2 style="margin: 0 0 2px; font-size: 16px; font-weight: 700; line-height: 22px;">活动安排</h2>
          <sc-for list="{{plan}}" as="a" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 28px; font-size: 14px; line-height: 20px;">
              <span style="flex-shrink: 0; width: 44px; font-weight: 500; color: {{a.c}};">{{a.time}}</span>
              <span style="flex-grow: 1; min-width: 0; color: {{a.c}};">{{a.t}}</span>
              <span style="flex-shrink: 0; font-size: 12px; line-height: 17px; color: {{a.sc}}; white-space: nowrap;">{{a.s}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{showNotice}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #fff;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">{{noticeTitle}}</h2>
          <sc-for list="{{notices}}" as="n" hint-placeholder-count="3">
            <div style="display: flex; gap: 8px; font-size: 13px; line-height: 19px; color: #536178;">
              <span style="flex-shrink: 0; width: 4px; height: 4px; margin: 8px 2px 0; border-radius: 50%; background: #91a0b4;"></span>
              <span style="min-width: 0;">{{n.t}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{showNext}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #fff;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">接下来，由你决定</h2>
            <span style="font-size: 12px; line-height: 17px; color: #738096;">想继续练习，可以看看这些</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <a href="ExpCenter.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px; border-radius: 10px; background: #f5f7fc; color: #202c42; font-size: 14px; line-height: 20px; text-decoration: none; white-space: nowrap;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M4 5h16v11H4zM9 20h6M12 16v4M10 8.5l4 2-4 2z"></path></svg>在线体验</a>
            <a href="PdFull.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px; border-radius: 10px; background: #f5f7fc; color: #202c42; font-size: 14px; line-height: 20px; text-decoration: none; white-space: nowrap;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"></path></svg>相关器材</a>
          </div>
        </div>

</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // choice：延期帧选中的处理方式 keep 保留新场次 / refund 全额退款；kept：已确认保留；proof：完赛证明已生成短时下载链接
    this.state = { choice: 'keep', kept: false, proof: false };
  }
  renderVals() {
    const { choice, kept, proof } = this.state;
    // 活动状态由服务端推进，用 Tweaks 的 frame 切；同一张订单：11/15 上午场，王小禾、王小川，2 人 × ¥120 = ¥240
    const frame = this.props.frame ?? '已完成';
    const ORANGE = 'linear-gradient(180deg, #ff6a00 0%, #ff8a3d 100%)';
    const GRAY = 'linear-gradient(180deg, #7d828a 0%, #91a0b4 100%)';
    const CHECK = 'M5 12l5 5 9-10';
    const CLOCK = 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2';
    const INFO = 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 8h.01';
    const CROSS = 'M6 6l12 12M18 6L6 18';
    const session = { k: '场次', v: '11/15 上午场 09:00', w: 500 };
    const venue = { k: '场馆', v: '东营低空与机器人体验馆', w: 400 };
    const paid = { payState: '已支付 · 渠道回执已核验', payC: '#11804a' };
    const F = {
      已签到: { heroBg: ORANGE, heroIcon: CHECK, heroTitle: '已签到 · 活动进行中', heroSub: '2 人都已签到，活动结束后这里显示结果记录',
        facts: [session, venue, { k: '活动时间', v: '09:00–11:30', w: 400 }],
        steps: ['done', 'done', 'done', 'cur'], showTicket: true, ticketTitle: '查看凭证', ticketSub: '已核销 · 一人一码',
        showSign: true, peopleTitle: '签到记录', peopleNote: '2 / 2 人',
        people: [['王小禾', '11 岁', '08:42 已签到', '#11804a'], ['王小川', '9 岁', '08:43 已签到', '#11804a']],
        showPlan: true,
        showNotice: true, noticeTitle: '现场须知',
        notices: ['活动开始后不再支持退改', '中途离场请告诉现场工作人员，由监护人接走', '结果记录由主办方在活动结束后发布，发布后通过“消息”通知你'],
        ...paid, bar: 'note' },
      已完成: { heroBg: ORANGE, heroIcon: CHECK, heroTitle: '活动已完成', heroSub: '11/15 11:30 结束 · 主办方已发布结果记录',
        facts: [session, venue, { k: '签到', v: '2 人已签到', w: 400 }],
        steps: ['done', 'done', 'done', 'done'], showTicket: true, ticketTitle: '查看凭证', ticketSub: '已使用 · 可回看签到记录',
        showResult: true, showNext: true, ...paid,
        bar: 'links', leftLabel: '联系主办方', leftHref: 'Chat.dc.html', rightLabel: '查看更多活动', rightHref: 'HomeAct.dc.html' },
      未到场: { heroBg: GRAY, heroIcon: INFO, heroTitle: '未到场', heroSub: '活动已在 11/15 11:30 结束，没有你的签到记录',
        facts: [session, venue, { k: '签到', v: '无签到记录', w: 400 }],
        steps: ['done', 'done', 'end', 'todo'], end: '未签到', showTicket: true, ticketTitle: '查看凭证', ticketSub: '已失效 · 活动已结束',
        showSign: true, peopleTitle: '签到记录', peopleNote: '0 / 2 人',
        people: [['王小禾', '11 岁', '未签到', '#738096'], ['王小川', '9 岁', '未签到', '#738096']],
        showNotice: true, noticeTitle: '费用说明',
        notices: ['已过免费取消时间（11/13 09:00），报名费不退', '到场了却没有记录，可在 [协议约定时间] 内联系主办方核实'],
        showNext: true, ...paid,
        bar: 'links', leftLabel: '联系主办方', leftHref: 'Chat.dc.html', rightLabel: '查看更多活动', rightHref: 'HomeAct.dc.html' },
      活动延期: { heroBg: ORANGE, heroIcon: CLOCK, heroTitle: '活动延期 · 待你确认', heroSub: '主办方调整了时间，你可以保留新场次或全额退款',
        facts: [venue, { k: '延期原因', v: '天气原因，无法保证飞行安全', w: 400 }, { k: '签到时间', v: '新场次 08:30 起签到', w: 400 }],
        showMove: true, steps: ['done', 'done', 'todo', 'todo'], showTicket: true, ticketTitle: '查看凭证', ticketSub: '确认保留后更新为新场次',
        showSign: true, peopleTitle: '参与人', peopleNote: '2 人',
        people: [['王小禾', '11 岁', '', '#627187'], ['王小川', '9 岁', '', '#627187']], ...paid },
      活动取消: { heroBg: GRAY, heroIcon: CROSS, heroTitle: '活动已取消', heroSub: '主办方取消了本场活动，报名费全额退回',
        facts: [session, venue, { k: '取消原因', v: '场地临时检修，无法举办', w: 400 }],
        steps: ['done', 'done', 'end', 'todo'], end: '已取消', showTicket: false, ticketTitle: '', ticketSub: '',
        showRefund: true, showSign: true, peopleTitle: '参与人', peopleNote: '2 人',
        people: [['王小禾', '11 岁', '', '#627187'], ['王小川', '9 岁', '', '#627187']],
        showNext: true, payState: '退款中 · 原路退回', payC: '#ba470b',
        bar: 'links', leftLabel: '查看更多活动', leftHref: 'HomeAct.dc.html', rightLabel: '查看退款进度', rightHref: 'EnrollRefundDetail.dc.html' }
    };
    const c = F[frame] || F['已完成'];
    const delayed = frame === '活动延期';
    const isKept = delayed && kept;
    const names = ['已支付', '报名成功', '签到', '完成'];
    const look = {
      done: { bg: '#ff6a00', bd: '#ff6a00', tc: '#202c42', tw: 500 },
      cur: { bg: '#fff', bd: '#ff6a00', tc: '#ba470b', tw: 700 },
      todo: { bg: '#fff', bd: '#c9d3e1', tc: '#738096', tw: 400 },
      end: { bg: '#738096', bd: '#738096', tc: '#536178', tw: 700 }
    };
    // 节点左右各半截连线：通往已完成或进行中的节点为橙色，其余为浅灰，首尾那半截不画
    const reached = (k) => k === 'done' || k === 'cur';
    const steps = c.steps.map((k, i) => ({
      t: k === 'end' ? c.end : names[i],
      check: k === 'done', inner: k === 'cur', cross: k === 'end',
      lineL: i === 0 ? 'transparent' : (reached(k) ? '#ff6a00' : '#e5ebf3'),
      lineR: i === 3 ? 'transparent' : (reached(c.steps[i + 1]) ? '#ff6a00' : '#e5ebf3'),
      ...look[k]
    }));
    const choices = [
      { id: 'keep', t: '保留新场次', s: '改到 11/22 上午场 09:00，不用重新付款' },
      { id: 'refund', t: '全额退款', s: '¥240 原路退回 [主用支付渠道]' }
    ].map((x) => {
      const on = x.id === choice;
      return {
        t: x.t, s: x.s, on,
        bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fffaf5' : '#fff',
        dot: on ? '#ff6a00' : '#c9d3e1', dotBg: on ? '#ff6a00' : '#fff',
        pick: () => this.setState({ choice: x.id })
      };
    });
    const person = (p) => ({ name: p[0], age: p[1], state: p[2], sc: p[3] });
    const stat = (done, time, sign) => [{ k: '完成任务', v: done }, { k: '用时', v: time }, { k: '签到', v: sign }];
    return {
      heroBg: c.heroBg,
      heroIcon: isKept ? CHECK : c.heroIcon,
      heroTitle: isKept ? '已改到 11/22 · 待参加' : c.heroTitle,
      heroSub: isKept ? '新凭证已发放，活动前一天将发送提醒' : c.heroSub,
      facts: c.facts,
      showMove: Boolean(c.showMove),
      steps,
      showTicket: Boolean(c.showTicket),
      ticketTitle: isKept ? '查看新凭证' : c.ticketTitle,
      ticketSub: isKept ? '11/22 上午场 · 一人一码' : c.ticketSub,
      showChoice: delayed && !kept,
      choices,
      showKept: isKept,
      showRefund: Boolean(c.showRefund),
      showResult: Boolean(c.showResult),
      results: [
        { name: '王小禾', age: '11 岁', stats: stat('5 / 5', '18′42″', '08:42') },
        { name: '王小川', age: '9 岁', stats: stat('4 / 5', '21′05″', '08:43') }
      ],
      // 完赛证明照 Delivery 的下载行：点“下载”生成受控短时链接，到期时刻以服务端返回为准（16:30 是示例）；已生成后按钮变“重新生成”，重复点不会再生成新记录
      proofIdle: !proof, proofReady: proof,
      proofLabel: proof ? '重新生成' : '下载',
      proofAria: proof ? '重新生成完赛证明下载链接' : '下载完赛证明',
      tapProof: () => this.setState({ proof: true }),
      showSign: Boolean(c.showSign),
      peopleTitle: c.peopleTitle || '', peopleNote: c.peopleNote || '',
      people: (c.people || []).map(person),
      showPlan: Boolean(c.showPlan),
      plan: [
        { time: '08:30', t: '入场签到', s: '已完成', c: '#738096', sc: '#738096' },
        { time: '09:00', t: '编程挑战', s: '进行中', c: '#202c42', sc: '#ba470b' },
        { time: '11:30', t: '活动结束，监护人接回', s: '待开始', c: '#202c42', sc: '#738096' }
      ],
      showNotice: Boolean(c.showNotice),
      noticeTitle: c.noticeTitle || '',
      notices: (c.notices || []).map((t) => ({ t })),
      showNext: Boolean(c.showNext),
      parties: [
        ['主办', '东营市青少年科技协会'],
        ['承办/交付', '东营低空与机器人体验馆'],
        ['收款方', '东营低空与机器人体验馆 · 经平台支付渠道'],
        ['退改处理', '东营低空与机器人体验馆']
      ].map(([k, v]) => ({ k, v })),
      payState: c.payState, payC: c.payC,
      barNoteOn: c.bar === 'note',
      barLinks: c.bar === 'links' || isKept,
      leftLabel: isKept ? '申请退改' : (c.leftLabel || ''),
      leftHref: isKept ? 'EnrollRefund.dc.html' : (c.leftHref || 'HomeAct.dc.html'),
      rightLabel: isKept ? '查看新凭证' : (c.rightLabel || ''),
      rightHref: isKept ? 'EnrollTicket.dc.html' : (c.rightHref || 'HomeAct.dc.html'),
      barKeep: delayed && !kept && choice === 'keep',
      barRefund: delayed && !kept && choice === 'refund',
      confirmKeep: () => this.setState({ kept: true })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"frame":"已完成"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
