<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COM-03 登录（拦截后回到原操作）</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="frame"><option selected>商品详情拦截</option><option>从我的进入</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fff; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">登录</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 24px;">
    <sc-if value="{{showResume}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #ffd8b8; background: #fff0e3;">
      <img src="_blob/5d32505e8b9a494f8436e31c3008ef99.jpg" alt="编程机器人探索套装" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: block; background: #fff;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; line-height: 18px; font-weight: 500;">登录后继续：立即购买 · 编程机器人探索套装</span>
        <span style="font-size: 12px; line-height: 17px; color: #627187;">登录成功后自动回到原操作</span>
      </div>
    </div>
    </sc-if>

    <sc-if value="{{isQuick}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 48px 0 28px;">
        <span style="font-size: 14px; line-height: 20px; color: #627187;">本机号码</span>
        <span style="font-size: 30px; line-height: 40px; font-weight: 700; letter-spacing: 1px;">138****2026</span>
        <span style="font-size: 12px; line-height: 17px; color: #738096;">认证服务由运营商提供</span>
      </div>
      <sc-if value="{{agree}}" hint-placeholder-val="{{false}}">
        <a href="{{doneHref}}" style="flex-shrink: 0; height: 48px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">本机号码一键登录</a>
      </sc-if>
      <sc-if value="{{notAgree}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled="{{true}}" style="flex-shrink: 0; height: 48px; border: 0; border-radius: 999px; background: #c9d3e1; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: not-allowed;">本机号码一键登录</button>
      </sc-if>
      <button type="button" onClick="{{usePhone}}" style="flex-shrink: 0; align-self: center; min-height: 44px; margin-top: 8px; padding: 0 16px; border: 0; background: none; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">其他手机号登录</button>
    </sc-if>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{false}}">
      <h2 style="flex-shrink: 0; margin: 28px 0 16px; font-size: 22px; line-height: 30px; font-weight: 700;">验证码登录</h2>
      <label style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; background: #f5f7fc;">
        <span style="flex-shrink: 0; font-size: 15px; color: #202c42;">+86</span>
        <span style="flex-shrink: 0; width: 1px; height: 16px; background: #dcdfe3;"></span>
        <input type="tel" aria-label="手机号" placeholder="请输入手机号" value="{{phone}}" onChange="{{setPhone}}" style="flex-grow: 1; min-width: 0; height: 50px; border: 0; outline: none; padding: 0; background: transparent; font: inherit; font-size: 15px; color: #202c42;">
      </label>
      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 50px; margin-top: 12px; padding: 0 4px 0 14px; border-radius: 12px; background: #f5f7fc;">
        <input type="text" aria-label="验证码" placeholder="请输入验证码" value="{{code}}" onChange="{{setCode}}" style="flex-grow: 1; min-width: 0; height: 50px; border: 0; outline: none; padding: 0; background: transparent; font: inherit; font-size: 15px; color: #202c42;">
        <sc-if value="{{codeIdle}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{sendCode}}" style="flex-shrink: 0; min-height: 44px; padding: 0 10px; border: 0; background: none; font: inherit; font-size: 14px; color: #ba470b; white-space: nowrap; cursor: pointer;">获取验证码</button>
        </sc-if>
        <sc-if value="{{codeSent}}" hint-placeholder-val="{{false}}">
          <button type="button" disabled="{{true}}" style="flex-shrink: 0; min-height: 44px; padding: 0 10px; border: 0; background: none; font: inherit; font-size: 14px; color: #91a0b4; white-space: nowrap; cursor: default;">60 秒后重新获取</button>
        </sc-if>
      </div>
      <sc-if value="{{agree}}" hint-placeholder-val="{{false}}">
        <a href="{{doneHref}}" style="flex-shrink: 0; height: 48px; margin-top: 24px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">登录</a>
      </sc-if>
      <sc-if value="{{notAgree}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled="{{true}}" style="flex-shrink: 0; height: 48px; margin-top: 24px; border: 0; border-radius: 999px; background: #c9d3e1; color: #fff; font: inherit; font-size: 16px; font-weight: 500; cursor: not-allowed;">登录</button>
      </sc-if>
      <button type="button" onClick="{{useQuick}}" style="flex-shrink: 0; align-self: center; min-height: 44px; margin-top: 8px; padding: 0 16px; border: 0; background: none; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">使用本机号码一键登录</button>
    </sc-if>

    <label style="flex-shrink: 0; position: relative; display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; padding: 6px 0; font-size: 12px; line-height: 18px; color: #627187; cursor: pointer;">
      <input type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;">
      <sc-if value="{{agree}}" hint-placeholder-val="{{false}}">
        <span style="flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      </sc-if>
      <sc-if value="{{notAgree}}" hint-placeholder-val="{{true}}">
        <span style="flex-shrink: 0; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #91a0b4; background: #fff;"></span>
      </sc-if>
      <span>我已阅读并同意<a href="Agreement.dc.html" style="color: #ba470b; text-decoration: none;">《用户协议》</a><a href="Agreement.dc.html" style="color: #ba470b; text-decoration: none;">《隐私政策》</a><a href="Agreement.dc.html" style="color: #ba470b; text-decoration: none;">《儿童个人信息保护规则》</a></span>
    </label>

    <a href="HomeFull.dc.html" style="flex-shrink: 0; align-self: center; margin-top: auto; min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 14px; color: #627187; text-decoration: none;">先随便看看</a>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // mode：quick 本机号码一键登录 / phone 其他手机号 + 验证码
    // agree：协议勾选，未勾选时两种登录按钮都置灰（协议不默认勾选）
    // codeSent：已点“获取验证码”，按钮变成“60 秒后重新获取”（原型不做倒计时）
    this.state = { mode: 'quick', agree: false, phone: '', code: '', codeSent: false };
  }
  renderVals() {
    const { mode, agree, phone, code, codeSent } = this.state;
    // 跨板链接带不了帧：默认帧是商品详情拦截，用 Tweaks 切“从我的进入”后不显示继续操作条，登录成功回 Mine，返回回 MineGuest
    const fromMine = (this.props.frame ?? '商品详情拦截') === '从我的进入';
    // 输入框 onChange 才带事件对象；没有事件对象时保持原值。只保留数字：手机号最多 11 位，验证码最多 6 位
    const digitsOf = (e, max) => (e && e.target ? String(e.target.value || '').replace(/\D/g, '').slice(0, max) : null);
    return {
      backHref: fromMine ? 'MineGuest.dc.html' : 'PdFull.dc.html',
      doneHref: fromMine ? 'Mine.dc.html' : 'PdSku.dc.html',
      showResume: !fromMine,
      isQuick: mode === 'quick',
      isPhone: mode === 'phone',
      usePhone: () => this.setState({ mode: 'phone' }),
      useQuick: () => this.setState({ mode: 'quick' }),
      agree,
      notAgree: !agree,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      phone,
      code,
      setPhone: (e) => { const v = digitsOf(e, 11); if (v !== null) this.setState({ phone: v }); },
      setCode: (e) => { const v = digitsOf(e, 6); if (v !== null) this.setState({ code: v }); },
      codeIdle: !codeSent,
      codeSent,
      sendCode: () => this.setState({ codeSent: true })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"frame":"商品详情拦截"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
