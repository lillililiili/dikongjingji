class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 页内交互状态，初始值与静态稿一致：子类目“全部”、综合排序、两个已选筛选条件、勾选两件对比
    this.state = { sub: '全部', sort: 'default', filters: [], cmp: { battery: false, prop: false, lidar: false, field: false } };
  }
  renderVals() {
    const { sub, sort, filters, cmp } = this.state;
    const ACTIVE_CHANNEL = '商城';
    const ACTIVE_CAT = '配件';
    const city = '东营';
    const placeholder = '搜索配件名称或适配机型';
    // 频道行已横向滚动，让选中的“配件”完整露出；城市固定在左侧不随频道滚动
    const allChannels = [
      ['推荐', 'HomeFull.dc.html'], ['专业服务', 'HomeSvc.dc.html'], ['赛事研学', 'HomeAct.dc.html'], ['体验', 'ExpCenter.dc.html'],
      ['商城', 'MallHome.dc.html']
    ].map(([label, href]) => {
      const on = label === ACTIVE_CHANNEL;
      return { label, href, on, c: on ? '#ff6a00' : '#202c42', fs: on ? '18px' : '15px', w: on ? 700 : 400 };
    });
    // 频道行不滚动，从当前频道往前数三个开始截，保证当前频道完整露出
    const channels = allChannels;
    // 商城内的类目页签：每个类目一张列表页，当前类目高亮
    const cats = [['全部', 'MallHome.dc.html'], ['无人机', 'MallDrone.dc.html'], ['机器人', 'Mall2.dc.html'], ['配件', 'MallParts.dc.html'], ['租赁', 'MallRental.dc.html'], ['课程', 'MallCourse.dc.html']].map(([label, href]) => {
      const on = label === ACTIVE_CAT;
      return { label, href, cur: on ? 'page' : 'false', bg: on ? '#ff6a00' : '#fff', c: on ? '#fff' : '#202c42', w: on ? 500 : 400 };
    });


    const ACTIVE = 0; // 0 首页 1 发现 2 消息 3 购物车 4 我的
    const tabs = [
      ['首页', 'HomeFull.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', '', false],
      ['发现', 'Discover.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z', '', true],
      ['消息', 'Messages.dc.html', 'M4 5h16v11H9l-5 4zM8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01', '3', false],
      ['购物车', 'Cart.dc.html', 'M3 4h2l2 11h11l2-8H6M9 20a1 1 0 1 0 0-.1M17 20a1 1 0 1 0 0-.1', '3', false],
      ['我的', 'Mine.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6', '', false]
    ].map((t, i) => ({ label: t[0], href: t[1], d: t[2], badge: t[3], dot: t[4] && i !== ACTIVE, c: i === ACTIVE ? '#ff6a00' : '#738096', w: i === ACTIVE ? 500 : 400 }));

    // “配件”频道下的子类目：点选后只显示该子类目的商品
    const subs = ['全部', '电池与充电', '桨叶与机架', '传感器', '训练场地'].map((label) => {
      const on = label === sub;
      return {
        label, pressed: on ? 'true' : 'false',
        bg: on ? '#ff6a00' : '#fff', fg: on ? '#fff' : '#202c42', w: on ? 500 : 400,
        pick: () => this.setState({ sub: label })
      };
    });

    // 价格排序：综合 → 价格从低到高 → 价格从高到低 → 回到综合
    const priceOn = sort !== 'default';
    const sortDefaultC = priceOn ? '#536178' : '#ba470b';
    const sortDefaultW = priceOn ? 400 : 500;
    const priceArrow = sort === 'asc' ? '↑' : sort === 'desc' ? '↓' : '⇅';
    const priceC = priceOn ? '#ba470b' : '#536178';
    const priceW = priceOn ? 500 : 400;
    const priceAria = sort === 'asc' ? '价格排序：从低到高' : sort === 'desc' ? '价格排序：从高到低' : '价格排序';
    const cyclePrice = () => this.setState((s) => ({ sort: s.sort === 'default' ? 'asc' : s.sort === 'asc' ? 'desc' : 'default' }));

    // 已选筛选条件：点 × 移除；全部移除后整行隐藏（“共 18 件”“筛选 2”不随之变化）
    const activeChips = filters.map((label) => ({
      label, text: label + ' ×', aria: '移除筛选条件：' + label,
      remove: () => this.setState((s) => ({ filters: s.filters.filter((x) => x !== label) }))
    }));
    const showChipRow = activeChips.length > 0;

    // 对比：最多 3 件；少于 2 件时不显示对比条
    const cmpCount = Object.keys(cmp).filter((k) => cmp[k]).length;
    const showCompare = cmpCount >= 2;

    // 主按钮按交易方式：明码标价 → 立即购买；租赁/价格不明确 → 联系询价。不显示评分和销量。
    // cat = 所属子类目；amount = 排序用的标价（元）
    // 租赁卡和普通商品卡分开标：图片右上角“租赁”角标，价格带计费单位“/天”（rent、per）
    const products = [
      { id: 'battery', cat: '电池与充电', amount: 329, name: '智能飞行电池 适配教学机', img: '_blob/44b9df29cd316503b6cad0f764a0798b.jpg', badge: '', price: '¥329', per: '', unit: '', sellers: '4 家在售', href: 'PdBattery.dc.html', btn: '立即购买', btnHref: 'PdSkuBattery.dc.html' },
      { id: 'prop', cat: '桨叶与机架', amount: 39, name: '快拆桨叶 4 片装', img: '', badge: '', price: '¥39', per: '', unit: '起', sellers: '5 家在售', href: 'PdProp.dc.html', btn: '立即购买', btnHref: 'PdSkuProp.dc.html' },
      { id: 'lidar', cat: '传感器', amount: 1680, name: '避障激光雷达模块', img: '', badge: '', price: '¥1,680', per: '', unit: '', sellers: '2 家在售', href: 'PdLidar.dc.html', btn: '立即购买', btnHref: 'PdSkuLidar.dc.html' },
      { id: 'field', cat: '训练场地', amount: 460, name: '避障训练场地套件', img: '_blob/822c9edc2d0d857c67055194c02161d3.jpg', badge: '', price: '¥460', per: '', unit: '', sellers: '1 家在售', href: 'PdField.dc.html', btn: '立即购买', btnHref: 'PdSkuField.dc.html' }
    ];
    const inSub = products.filter((p) => sub === '全部' || p.cat === sub);
    // 按价格排序时，询价商品（联系询价）始终排在最后
    const priced = inSub.filter((p) => p.btn !== '联系询价');
    const inquiry = inSub.filter((p) => p.btn === '联系询价');
    const ordered = priceOn
      ? priced.slice().sort((a, b) => (sort === 'asc' ? a.amount - b.amount : b.amount - a.amount)).concat(inquiry)
      : inSub;

    const items = ordered.map((p) => {
      const picked = !!cmp[p.id];
      return {
        ...p,
        cmp: picked,
        cmpOff: !picked && cmpCount >= 3,
        cmpAria: '对比：' + p.name,
        toggleCmp: () => this.setState((s) => {
          const count = Object.keys(s.cmp).filter((k) => s.cmp[k]).length;
          if (!s.cmp[p.id] && count >= 3) return {};
          return { cmp: { ...s.cmp, [p.id]: !s.cmp[p.id] } };
        }),
        ph: !p.img,
        rent: !!p.rent,
        bd: picked ? '#ff6a00' : '#fff',
        bbg: p.badge === '体验馆可看' ? '#2f80ed' : p.badge === '线上' ? '#2f80ed' : '#159a70',
        btnBg: p.btn === '联系询价' ? '#fff0e3' : '#ff6a00',
        btnFg: p.btn === '联系询价' ? '#ba470b' : '#fff'
      };
    });

    return {
      city, placeholder, channels, cats, tabs, subs, items,
      sortDefaultC, sortDefaultW, priceArrow, priceC, priceW, priceAria, cyclePrice,
      activeChips, showChipRow, cmpCount, showCompare
    };
  }
}
