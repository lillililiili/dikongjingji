<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>08 内容与增强 · 规格</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>body{margin:0;background:#dfe2e6;padding:16px;font-family:-apple-system,'PingFang SC',sans-serif}.bar{font-size:13px;color:#555;margin:0 0 10px}.bar a{color:#ba470b}#root{width:max-content;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.18)}</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body><div class="bar"><a href="HomeFull.html">← 回到 App</a> &nbsp; 08 内容与增强 · 规格（设计文档，不是 App 页面）</div><div id="root"></div><template id="tpl">

<div style="position: relative; width: 1100px; height: 4764px; display: flex; flex-direction: column; gap: 26px; padding: 40px 44px; box-sizing: border-box; background: #fff; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <h1 style="margin: 0; font-size: 28px; line-height: 40px; font-weight: 700; white-space: nowrap;">内容与增强 · 规格（第三批补页）</h1>
      <a href="Batch2Spec.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">账户与履约 · 规格（Batch2Spec）›</a>
    </div>
    <div style="font-size: 14px; line-height: 1.6; color: #536178;">本批补齐 5 张画板：专题页、搜索前置页、我的课程、课程学习、收藏与对比。导航沿用方案 C：底栏 首页 / 发现 / 消息 / 购物车 / 我的，商品类目、专业服务、活动、体验是首页顶部频道。课程交付（第 5 节）是设计假设，待确认；收藏（第 6 节）概要设计列二期，是否提前待确认。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">1 · 页面清单</h2>
      <span style="font-size: 13px; line-height: 20px; color: #738096;">本批 5 张画板；文件名省略 .dc.html，点文件名跳到对应画板；编号为概要设计 §5.2 的草案编号，确认后生效。</span>
    </div>
    <div style="display: grid; grid-template-columns: 128px 104px 176px minmax(0, 1fr) minmax(0, 1.9fr); border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">文件</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">页面</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">编号</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">入口</div>
      <div style="padding: 9px 12px; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">主要交互</div>
      <sc-for list="{{pageRows}}" as="pr" hint-placeholder-count="5">
        <a href="{{pr.href}}" style="display: block; padding: 9px 12px; border-top: 1px solid #f0f1f3; font-weight: 700; text-decoration: none; overflow-wrap: anywhere;">{{pr.file}}</a>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3;">{{pr.page}}</div>
        <div style="display: flex; flex-direction: column; padding: 9px 12px; border-top: 1px solid #f0f1f3;">
          <span style="white-space: nowrap;">{{pr.code}}</span>
          <sc-if value="{{pr.codeNote}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; line-height: 18px; color: #738096; white-space: pre-line;">{{pr.codeNote}}</span></sc-if>
        </div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178;">{{pr.entry}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid #f0f1f3; color: #536178;">{{pr.act}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">2 · 页面流</h2>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ffd8b8; background: #fff0e3;"></span>本批新画板</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px solid #e5ebf3; background: #eef2f8;"></span>已有画板</span>
      <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">点卡片可跳到对应画板；“/”表示几个并列的入口或去向</span>
    </div>
    <sc-for list="{{flows}}" as="fl" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #e5ebf3; border-radius: 12px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 15px; line-height: 22px; font-weight: 700; white-space: nowrap;">{{fl.name}}</span>
          <span style="min-width: 0; font-size: 12px; line-height: 18px; color: #738096;">{{fl.note}}</span>
        </div>
        <sc-for list="{{fl.paths}}" as="pa" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="flex: 0 0 60px; font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">{{pa.label}}</span>
            <div style="flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
              <sc-for list="{{pa.steps}}" as="s" hint-placeholder-count="5">
                <sc-if value="{{s.isNew}}" hint-placeholder-val="{{true}}">
                  <a href="{{s.href}}" style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #ffd8b8; background: #fff0e3; color: #202c42; text-decoration: none;">
                    <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{s.t}}</span>
                    <span style="font-size: 12px; line-height: 17px; color: #ba470b; white-space: nowrap;">{{s.p}}</span>
                  </a>
                </sc-if>
                <sc-if value="{{s.isOld}}" hint-placeholder-val="{{false}}">
                  <a href="{{s.href}}" style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #e5ebf3; background: #eef2f8; color: #202c42; text-decoration: none;">
                    <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{s.t}}</span>
                    <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap;">{{s.p}}</span>
                  </a>
                </sc-if>
                <span style="font-size: 14px; line-height: 20px; color: #91a0b4;">{{s.arrow}}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <div style="font-size: 12px; line-height: 1.6; color: #536178;">{{fl.rule}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">3 · 专题规则</h2>
      <span style="min-width: 0; font-size: 13px; line-height: 20px; color: #738096;">示例专题：黄河口低空体验季 · 到馆体验、赛事、研学合集</span>
      <a href="Topic.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">专题页 ›</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{topicRules}}" as="tr" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid #e5ebf3; border-radius: 12px;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 700;">{{tr.c0}}</span>
          <span style="font-size: 13px; line-height: 1.6; color: #536178;">{{tr.c1}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: stretch; gap: 8px;">
      <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid #ffd8b8; background: #fffaf5;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap;">分享链接带</span>
          <span style="font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;">不带个人信息</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <sc-for list="{{linkParams}}" as="lp" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #ffd8b8; background: #fff;">
              <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{lp.k}}</span>
              <span style="font-size: 12px; line-height: 17px; color: #ba470b; white-space: nowrap;">{{lp.v}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <span style="align-self: center; font-size: 16px; line-height: 22px; color: #91a0b4;">→</span>
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5ebf3; background: #f5f7fc;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap;">用于统计来源</span>
          <span style="min-width: 0; font-size: 12px; line-height: 17px; color: #536178;">无来源标记“来源未知”，不强行归因</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <sc-for list="{{attrSteps}}" as="at" hint-placeholder-count="5">
            <span style="display: flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #e5ebf3; background: #fff; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{at.t}}</span>
            <span style="font-size: 14px; line-height: 20px; color: #91a0b4;">{{at.arrow}}</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">4 · 搜索规则</h2>
      <span style="min-width: 0; font-size: 13px; line-height: 20px; color: #738096;">点首页搜索框先到前置页，提交后到结果页。</span>
      <a href="SearchPre.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">搜索前置页 ›</a>
      <a href="MallSearch.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #e5ebf3; background: #eef2f8; color: #536178; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">结果页 ›</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 4px 14px; border-radius: 10px; background: #f5f7fc;">
      <span style="flex-shrink: 0; margin-right: 6px; font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap;">范围 Tab</span>
      <sc-for list="{{scopes}}" as="sc" hint-placeholder-count="6">
        <span style="flex-shrink: 0; padding: 0 10px; border-radius: 6px; border: 1px solid {{sc.bd}}; background: {{sc.bg}}; color: {{sc.c}}; font-size: 13px; line-height: 26px; white-space: nowrap;">{{sc.t}}</span>
      </sc-for>
      <span style="margin-left: auto; flex-shrink: 0; font-size: 12px; line-height: 17px; color: #536178; white-space: nowrap;">Tab 下方一行小字：东营 · 结果按本城可用范围显示</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid #e5ebf3; border-radius: 12px;">
        <span style="font-size: 15px; line-height: 22px; font-weight: 700; white-space: nowrap;">无输入时</span>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 13px; line-height: 1.6;"><span style="font-weight: 700;">最近搜索</span><span style="color: #536178;">：都到 MallSearch（结果页示例就是“测绘”）；「清空」后显示“还没有搜索记录”</span></div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{recents}}" as="rc" hint-placeholder-count="4">
              <a href="MallSearch.dc.html" style="display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: #eef2f8; color: #202c42; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">{{rc}}</a>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 13px; line-height: 1.6;"><span style="font-weight: 700;">按类目找</span><span style="color: #536178;">：运营配置的固定入口，不是热搜</span></div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{catLinks}}" as="cl" hint-placeholder-count="4">
              <a href="{{cl.href}}" style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 44px; box-sizing: border-box; padding: 4px 12px; border-radius: 8px; border: 1px solid #e5ebf3; background: #eef2f8; color: #202c42; text-decoration: none;">
                <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">{{cl.t}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap;">{{cl.p}}</span>
              </a>
            </sc-for>
          </div>
        </div>
        <div style="margin-top: auto; font-size: 13px; line-height: 1.6;"><span style="font-weight: 700;">说明一行</span><span style="color: #536178;">：最近搜索只保存在本机，可随时清空</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid #e5ebf3; border-radius: 12px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 15px; line-height: 22px; font-weight: 700; white-space: nowrap;">有输入时</span>
          <span style="min-width: 0; font-size: 12px; line-height: 18px; color: #738096;">显示联想；按输入文字包含匹配，并受范围 Tab 过滤</span>
        </div>
        <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 124px; border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
          <div style="padding: 8px 10px; background: #fff0e3; color: #ba470b; white-space: nowrap;">首行</div>
          <div style="padding: 8px 10px; background: #fff0e3;">固定一行 搜索“xx”</div>
          <a href="MallSearch.dc.html" style="display: block; padding: 8px 10px; background: #fff0e3; font-weight: 500; text-decoration: none;">MallSearch</a>
          <sc-for list="{{suggests}}" as="sg" hint-placeholder-count="7">
            <div style="padding: 8px 10px; border-top: 1px solid #f0f1f3; color: #536178; white-space: nowrap;">{{sg.c0}}</div>
            <div style="padding: 8px 10px; border-top: 1px solid #f0f1f3;">{{sg.c1}}</div>
            <a href="{{sg.href}}" style="display: block; padding: 8px 10px; border-top: 1px solid #f0f1f3; font-weight: 500; text-decoration: none;">{{sg.c2}}</a>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{searchRules}}" as="sr" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid #e5ebf3; border-radius: 12px;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 700;">{{sr.c0}}</span>
          <span style="font-size: 13px; line-height: 1.6; color: #536178;">{{sr.c1}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 19px; line-height: 28px; font-weight: 700; white-space: nowrap;">5 · 课程交付</h2>
      <span style="display: flex; align-items: center; min-height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px dashed #ba470b; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap;">设计假设，待确认</span>
      <a href="MyCourses.dc.html" style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">我的课程 ›</a>
      <a href="CourseDetail.dc.html" style="flex-shrink: 0; display: flex; align-items: center; min-height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ffd8b8; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;">课程学习 ›</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #ba470b; background: #fffaf5;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 700;">假设</span>
        <span style="font-size: 13px; line-height: 1.6; color: #536178;">一期“课程”只交付线上录播的数字课程。它来自两处：随商品配套，或在“课程”频道单独购买。线下培训走活动报名，凭证在“活动报名”里，不进“我的课程”。</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid #e5ebf3;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 700;">依据（画布已有数据）</span>
        <span style="font-size: 13px; line-height: 1.6; color: #536178;">标准套装“1 台 + 数字课程”；商品详情“配套课程 16 课时（数字版）”；“培训”属于活动类型。</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px minmax(0, 1fr); border: 1px solid #e5ebf3; border-radius: 10px; overflow: hidden; font-size: 13px; line-height: 1.55;">
      <sc-for list="{{courseFacts}}" as="cf" hint-placeholder-count="5">
        <div style="padding: 9px 12px; border-top: 1px solid {{cf.line}}; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">{{cf.c0}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid {{cf.line}};">{{cf.c1}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid {{cf.line}}; background: #f5f7fc; font-weight: 500; color: #536178; white-space: nowrap;">{{cf.c2}}</div>
        <div style="padding: 9px 12px; border-top: 1px solid {{cf.line}};">{{cf.c3}}</div>
