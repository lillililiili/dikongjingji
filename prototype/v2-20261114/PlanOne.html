</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/04 这一帧，方案 v1 于 10:30 发布、待确认，王女士 11:05 确认（正式产品从订单详情进入时直接显示已确认状态）
    // agree：是否勾选“我已核对…”；confirmed：是否已确认 v1（确认后勾选框和确认按钮消失，不能重复确认）
    // cancelSheet：取消确认面板是否打开；cancelled：订单是否已取消（确认方案之前才能取消，取消后不能再确认）
    this.state = { agree: false, confirmed: false, cancelSheet: false, cancelled: false };
  }
  renderVals() {
    const { agree, confirmed, cancelSheet, cancelled } = this.state;
    const pending = !confirmed && !cancelled;
    // 方案 v1 报价明细：合计 ¥6,000（包干项不显示数量）
    const quoteItems = [
      { name: '无人机线路巡检', qty: '8 公里 × ¥699', amount: '¥5,592' },
      { name: '报告与缺陷清单', qty: '', amount: '¥408' }
    ];
    const terms = [
      { t: '巡检后 48 小时内交付巡检报告、缺陷清单、点位标注和高清巡检影像' },
      { t: '影像存档保存 90 天' },
      { t: '交付文件通过受控链接下载' }
    ];
    // 付款节点由统一交易模块单列：确认方案后首付进入待支付；其余款项验收后支付；订单取消后两个节点都不再收款
    const payNodes = cancelled ? [
      { name: '首付 30%', amount: '¥1,800', state: '订单已取消，无需支付', sc: '#738096', ac: '#738096' },
      { name: '验收后付款 70%', amount: '¥4,200', state: '订单已取消，无需支付', sc: '#738096', ac: '#738096' }
    ] : [
      { name: '首付 30%', amount: '¥1,800', state: confirmed ? '待支付' : '确认方案后支付', sc: confirmed ? '#ba470b' : '#738096', ac: confirmed ? '#e85400' : '#202c42' },
      { name: '验收后付款 70%', amount: '¥4,200', state: '验收后支付', sc: '#738096', ac: '#202c42' }
    ];
    return {
      quoteItems, terms, payNodes,
      planChip: cancelled ? '已取消' : (confirmed ? '已确认' : '待确认'),
      planChipBg: cancelled ? '#eef2f8' : (confirmed ? '#e2f6ed' : '#fff0e3'),
      planChipFg: cancelled ? '#536178' : (confirmed ? '#11804a' : '#ba470b'),
      // 有效期和取消入口只在待确认时显示，已确认、已取消后都隐藏
      showValid: pending,
      canCancel: pending,
      agree,
      notAgree: !agree,
      pending,
      confirmed,
      cancelled,
      canConfirm: pending && agree,
      confirmLocked: pending && !agree,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      // 只有勾选后才能确认；已确认后再次调用不改变任何状态（不会重复确认）
      confirm: () => this.setState((s) => (s.agree && !s.confirmed && !s.cancelled ? { confirmed: true } : {})),
      cancelSheetOpen: cancelSheet && pending,
      openCancel: () => this.setState({ cancelSheet: true }),
      closeCancel: () => this.setState({ cancelSheet: false }),
      // 只有待确认时能取消；已确认的方案不能从这里取消，重复确认取消不改变任何状态
      confirmCancel: () => this.setState((s) => (!s.confirmed && !s.cancelled ? { cancelled: true, cancelSheet: false } : {}))
    };
  }
}

(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
