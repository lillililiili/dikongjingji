<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>到馆预约确认</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 1128px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="VenueDetail.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">确认到馆预约</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: #fff;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="_blob/822c9edc2d0d857c67055194c02161d3.jpg" alt="机器人避障闯关" style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #eef0f3;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 16px; font-weight: 700; line-height: 22px;">机器人避障闯关</span>
          <span style="font-size: 13px; line-height: 18px; color: #627187; white-space: nowrap;">30 分钟 · 6 岁以上 · 工作人员陪同</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 10px; background: #fff0e3;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 5h14v15H5zM5 9h14M9 3v4M15 3v4"></path></svg>
        <span style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 500; line-height: 21px; white-space: nowrap;">今天 11/03 周二 14:00–14:30</span>
        <a href="VenueDetail.dc.html" style="flex-shrink: 0; min-height: 44px; margin-right: -4px; padding: 0 4px; display: flex; align-items: center; font-size: 13px; color: #ba470b; text-decoration: none; white-space: nowrap;">修改场次</a>
      </div>
      <div style="display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; line-height: 19px;">
        <span style="color: #627187; white-space: nowrap;">场馆</span><span>东营低空与机器人体验馆</span>
        <span style="color: #627187; white-space: nowrap;">地址</span><span>东营区示例路 66 号 · 距你 2.3km</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #fff;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">参与人</h2>
        <span style="font-size: 12px; line-height: 17px; color: #627187;">由监护人代为预约</span>
        <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #ba470b; white-space: nowrap;">本场余 5 位</span>
      </div>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px; cursor: pointer;">
          <input type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" style="accent-color: #ff6a00; width: 20px; height: 20px; margin: 0;">
          <span style="font-size: 15px; line-height: 21px;">{{p.name}}</span>
          <span style="font-size: 12px; line-height: 17px; color: #627187;">{{p.age}}</span>
          <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #11804a;">符合年龄</span>
        </label>
      </sc-for>
      <a href="Participants.dc.html" style="align-self: flex-start; min-height: 36px; box-sizing: border-box; border: 1px dashed #c9d3e1; background: #fff; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; font-size: 13px; color: #536178; white-space: nowrap; text-decoration: none;">＋ 添加参与人</a>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 6px; border-top: 1px solid #f0f1f3; font-size: 13px; line-height: 19px;">
        <span style="flex-shrink: 0; color: #627187; white-space: nowrap;">联系人</span>
        <span style="flex-grow: 1; min-width: 0; white-space: nowrap;">王女士 138****2026</span>
        <span style="flex-shrink: 0; font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">接收到馆提醒</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #fff; font-size: 13px; line-height: 19px;">
      <h2 style="margin: 0 0 2px; font-size: 16px; font-weight: 700; line-height: 22px;">费用</h2>
      <div style="display: flex;"><span style="color: #627187;">到馆体验费</span><span style="margin-left: auto;">{{feeLine}}</span></div>
      <div style="display: flex; align-items: baseline;"><span style="color: #627187;">合计</span><span style="margin-left: auto; font-size: 18px; font-weight: 700; line-height: 25px; color: #e85400;">{{total}}</span></div>
      <div style="height: 1px; margin: 2px 0; background: #f0f1f3;"></div>
      <div style="display: flex; gap: 10px;"><span style="flex-shrink: 0; color: #627187; white-space: nowrap;">收款方</span><span style="margin-left: auto; text-align: right;">东营低空与机器人体验馆 · 经平台支付渠道</span></div>
      <span style="font-size: 12px; line-height: 17px; color: #738096;">到馆体验单独计费，体验结束不会自动下单</span>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: #fff;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">退改说明</h2>
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: #e2f6ed; color: #11804a; font-size: 14px; font-weight: 500; line-height: 20px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#159a70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg>开场前 [协议约定时间] 可免费改期或取消</div>
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px; font-size: 13px; line-height: 19px; color: #536178;">
          <span style="flex-shrink: 0; width: 4px; height: 4px; margin: 8px 2px 0; border-radius: 50%; background: #91a0b4;"></span>
          <span style="min-width: 0;">{{r.t}}</span>
        </div>
      </sc-for>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 2px; font-size: 13px; line-height: 19px; cursor: pointer;"><input type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}" style="flex-shrink: 0; accent-color: #ff6a00; width: 18px; height: 18px; margin: 0;">我是监护人，已阅读并同意到馆须知与退改说明</label>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
      <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap;">{{countLine}}</span>
      <span style="font-size: 20px; font-weight: 700; line-height: 28px; color: #e85400;">{{total}}</span>
    </div>
    <sc-if value="{{canPay}}" hint-placeholder-val="{{true}}">
      <a href="CashierVenue.dc.html" style="flex-shrink: 0; width: 180px; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">提交并支付</a>
    </sc-if>
    <sc-if value="{{cantPay}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled style="flex-shrink: 0; width: 180px; height: 46px; border-radius: 999px; border: 0; background: #eef0f3; color: #91a0b4; font: inherit; font-size: 16px; font-weight: 500; cursor: not-allowed;">提交并支付</button>
    </sc-if>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // picked：已勾选的参与人，样例订单是 王小禾 1 人（核销工作台、我的体验都是 1 人 ¥39）；agree：是否同意到馆须知
    this.state = { picked: { xh: true }, agree: true };
  }
  renderVals() {
    const { picked, agree } = this.state;
    const PRICE = 39;
    const people = [
      { id: 'xh', name: '王小禾', age: '11 岁' },
      { id: 'xc', name: '王小川', age: '9 岁' },
      { id: 'xm', name: '王小满', age: '6 岁' }
    ].map((p) => ({
      ...p,
      on: Boolean(picked[p.id]),
      toggle: () => this.setState((s) => ({ picked: { ...s.picked, [p.id]: !s.picked[p.id] } }))
    }));
    const count = people.filter((p) => p.on).length;
    // 免费改期和取消的时限待业务确认，这里只写占位
    const rules = [
      { t: '取消后费用原路退回，名额同时释放' },
      { t: '超过时限后不能改期或取消，未到馆的场次会过期' },
      { t: '场馆调整或取消场次时全额退款' }
    ];
    // 至少选一位参与人并勾选同意才能提交；提交后进收银台，场次名额在付款时限内保留
    const ready = agree && count > 0;
    return {
      people, rules, agree,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      feeLine: `¥${PRICE} × ${count} 人`,
      total: `¥${count * PRICE}`,
      countLine: count > 0 ? `共 ${count} 人` : '请选择参与人',
      canPay: ready,
      cantPay: !ready
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
