class Component extends DCLogic {
  renderVals() {
    // 订单枢纽（巡检 M08：按服务端状态导航到方案、履约或交付页面）。本页只读，不在客户端改状态：
    // 验收在交付与验收页（Delivery）按次进行，验收后的按次服务费也从那里进入收银台。
    // 主状态停在“履约中”：第 1 次报告 11/03 10:00 交付、待验收；第 6 次验收并结清后才“已完成”。
    const steps = ['待报价', '待确认', '待履约', '履约中', '待验收', '已完成'];
    const CURRENT = 3;
    const chain = steps.map((label, i) => {
      const done = i < CURRENT;
      const cur = i === CURRENT;
      const reached = i <= CURRENT;
      const nextReached = i + 1 <= CURRENT;
      return {
        label, done, cur,
        bg: done ? '#ff6a00' : '#fff',
        bd: reached ? '#ff6a00' : '#c9d3e1',
        tc: cur ? '#ba470b' : (reached ? '#202c42' : '#738096'),
        tw: cur ? 700 : 400,
        lc: i === 0 ? 'transparent' : (reached ? '#ff6a00' : '#e5ebf3'),
        rc: i === steps.length - 1 ? 'transparent' : (nextReached ? '#ff6a00' : '#e5ebf3')
      };
    });

    // 付款节点由统一交易模块单列，本页只显示：首付已付；按次结算每次验收后支付 ¥2,170，共 6 次
    const payNodes = [
      { name: '首付 30%', tag: '', amount: '¥5,580', state: '已支付 · 11/01', sc: '#11804a', ac: '#202c42' },
      { name: '按次结算 70%', tag: '第 1 次待验收', amount: '¥13,020', state: '每次验收后支付 ¥2,170 · 已付 0/6', sc: '#627187', ac: '#e85400' }
    ];

    return { chain, payNodes };
  }
}
