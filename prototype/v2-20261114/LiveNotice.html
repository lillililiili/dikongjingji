    ][stage];
    // 当前阶段实色，走过的浅橙，没到的灰；连线走到当前阶段为止
    const steps = [['预告', '可设提醒'], ['直播', '合作平台播出'], ['回看', '合作平台提供']].map((s, i) => {
      const on = i === stage;
      const past = i < stage;
      return {
        n: i + 1, t: s[0], d: s[1],
        bg: on ? '#ff6a00' : (past ? '#fff0e3' : '#eef2f8'),
        fg: on ? '#fff' : (past ? '#ba470b' : '#738096'),
        tc: on ? '#ba470b' : '#202c42',
        w: on ? 700 : 500,
        lc: i === 0 ? 'transparent' : (i <= stage ? '#ffd8b8' : '#e5ebf3'),
        rc: i === 2 ? 'transparent' : (i < stage ? '#ffd8b8' : '#e5ebf3')
      };
    });
    const topics = [
      '夜间路线怎么定，重点点位怎么选',
      '机器狗到点位后拍什么、记什么',
      '发现异常后，现场怎么复核和留记录'
    ];
    const soon = stage === 0;
    return {
      ...view, steps, topics,
      remindOff: soon && !reminded,
      remindOn: soon && reminded,
      showRemindHint: soon && reminded,
      toggleRemind: () => this.setState((s) => ({ reminded: !s.reminded })),
      canWatch: !soon,
      extOpen: ext,
      showExtHint: !soon && left && !ext,
      openExt: () => this.setState({ ext: true, left: false }),
      closeExt: () => this.setState({ ext: false }),
      goExt: () => this.setState({ ext: false, left: true }),
      shareOpen: share,
      canCopy: !copied,
      copied,
      openShare: () => this.setState({ share: true }),
      copyLink: () => this.setState({ copied: true }),
      // 关闭时清掉“已复制”，下次打开回到可复制状态
      closeShare: () => this.setState({ share: false, copied: false })
    };
  }
}
