<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COM 整月日历（预约巡检 / 到馆场次）</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="frame"><option selected>预约巡检</option><option>到馆场次</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 812px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">{{title}}</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-radius: 14px;">
      <img src="{{ctxImg}}" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 700; line-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ctxTitle}}</span>
        <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ctxSub}}</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center;">
        <button type="button" aria-label="上个月" disabled="{{true}}" style="width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: not-allowed;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d3e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 700; line-height: 22px; text-align: center; white-space: nowrap;">2026 年 11 月</span>
        <button type="button" aria-label="下个月" onClick="{{nextMonth}}" style="width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <sc-if value="{{monthHint}}" hint-placeholder-val="{{false}}">
        <span role="status" style="padding: 6px 10px; border-radius: 8px; background: #fff0e3; font-size: 12px; line-height: 17px; color: #ba470b;">12 月尚未开放预约，请先在 11 月内选择（示例）</span>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <span style="font-size: 12px; line-height: 20px; color: #738096; text-align: center; white-space: nowrap;">{{w.t}}</span>
        </sc-for>
      </div>
      <div role="grid" aria-label="2026 年 11 月" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
          <button type="button" role="gridcell" aria-label="{{d.aria}}" aria-pressed="{{d.pressed}}" disabled="{{d.off}}" onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; height: 50px; box-sizing: border-box; margin: 0; padding: 0; border-radius: 10px; border: 1.5px solid {{d.bd}}; background: {{d.bg}}; font: inherit; color: {{d.fg}}; cursor: {{d.cur}};">
            <span style="font-size: 15px; font-weight: {{d.w}}; line-height: 20px; white-space: nowrap;">{{d.n}}</span>
            <span style="font-size: 11px; line-height: 14px; color: {{d.sc}}; white-space: nowrap;">{{d.sub}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding-top: 4px; font-size: 12px; line-height: 17px; color: #627187;">
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 3px; border: 1.5px solid #e5ebf3; background: #fff;"></span>可约</span>
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #ff6a00;"></span>已选</span>
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #eef0f3;"></span>已满 / 不可约</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #fff; border-radius: 14px;">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px; font-size: 12px; line-height: 17px; color: #536178;">
          <span style="flex-shrink: 0; width: 4px; height: 4px; margin: 7px 2px 0; border-radius: 50%; background: #91a0b4;"></span>
          <span style="min-width: 0;">{{n.t}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <span style="font-size: 15px; line-height: 21px; white-space: nowrap;">{{summary}}</span>
    <sc-if value="{{picked}}" hint-placeholder-val="{{true}}">
      <a href="{{okHref}}" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">确定</a>
    </sc-if>
    <sc-if value="{{notPicked}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="{{true}}" style="height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #c9d3e1; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: not-allowed;">确定</button>
    </sc-if>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 整月日历，InspBooking 时段弹层的“更多日期”和 VenueDetail 的日期 chip 共用；选日期后回到来源页选时段 / 场次
    // 今天 = 11/03 周二。from：选择发生时所在的 Tweaks 帧，换帧后回到该帧的默认选中；monthHint：点过“下个月”
    this.state = { from: '', day: 0, monthHint: false };
  }
  renderVals() {
    const frame = this.props.frame ?? '预约巡检';
    const TODAY = 3;
    // 不可约 / 已满都是示例日期：巡检按服务商排期，到馆周一闭馆、按场次余位
    const cfg = {
      预约巡检: {
        title: '选择巡检日期', backHref: 'InspBooking.dc.html', okHref: 'InspBooking.dc.html',
        ctxImg: '_blob/d26647dbfc9226eacaf364aaff076d9d.webp', ctxTitle: '电力线路巡检', ctxSub: '预计服务时长 3 小时 · 选日期后回预约页选时段',
        closed: [10, 11], full: [7, 14, 21], closedLabel: '不可约', defaultDay: 6,
        notes: ['当天预约需提前 1 小时，已过的时段不能选', '不可约：服务商当天不接单；已满：当天时段已约满', '确认时段后提交预约，方案确认前不收取费用']
      },
      到馆场次: {
        title: '选择到馆日期', backHref: 'VenueDetail.dc.html', okHref: 'VenueDetail.dc.html',
        ctxImg: '_blob/822c9edc2d0d857c67055194c02161d3.jpg', ctxTitle: '东营低空与机器人体验馆', ctxSub: '09:30–18:00 · 周一闭馆 · 选日期后回场馆选场次',
        closed: [2, 9, 16, 23, 30], full: [14, 28], closedLabel: '闭馆', defaultDay: 7,
        notes: ['周一闭馆，闭馆日不能预约', '已满：当天所有场次余位为 0', '场次按项目分开，选好日期后再选项目和场次']
      }
    };
    const c = cfg[frame] || cfg['预约巡检'];
    const day = this.state.from === frame ? this.state.day : c.defaultDay;
    const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
    // 2026-11-01 是周日，所以 1 号正好落在第一列
    const days = [];
    for (let n = 1; n <= 30; n++) {
      const past = n < TODAY;
      const closed = c.closed.includes(n);
      const full = c.full.includes(n);
      const off = past || closed || full;
      const on = n === day && !off;
      const isToday = n === TODAY;
      const sub = past ? '' : (closed ? c.closedLabel : (full ? '已满' : (isToday ? '今天' : '')));
      const week = weekNames[(n - 1) % 7];
      days.push({
        n: String(n), sub,
        aria: '11 月 ' + n + ' 日 周' + week + (sub ? ' ' + sub : (past ? ' 已过' : '')),
        pressed: on ? 'true' : 'false', off,
        bd: on ? '#ff6a00' : (isToday ? '#ffd8b8' : 'transparent'),
        bg: on ? '#ff6a00' : (off ? (past ? 'transparent' : '#eef0f3') : '#fff'),
        fg: on ? '#fff' : (off ? '#91a0b4' : '#202c42'),
        sc: on ? 'rgba(255,255,255,0.85)' : (off ? '#91a0b4' : '#ba470b'),
        w: on || isToday ? 700 : 400,
        cur: off ? 'not-allowed' : 'pointer',
        pick: () => { if (!off) this.setState({ from: frame, day: n, monthHint: false }); }
      });
    }
    const picked = day > 0 && !days[day - 1].off;
    const label = picked ? '11月' + day + '日 周' + weekNames[(day - 1) % 7] : '';
    return {
      title: c.title, backHref: c.backHref, okHref: c.okHref,
      ctxImg: c.ctxImg, ctxTitle: c.ctxTitle, ctxSub: c.ctxSub,
      weekdays: weekNames.map((t) => ({ t })),
      days,
      notes: c.notes.map((t) => ({ t })),
      monthHint: this.state.monthHint,
      // 原型只画 11 月；12 月尚未开放预约时页内提示，不翻页
      nextMonth: () => this.setState({ monthHint: true }),
      picked, notPicked: !picked,
      summary: picked ? '已选择：' + label : '请选择日期'
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{"frame":"预约巡检"},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
