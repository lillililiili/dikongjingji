<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B2 筛选面板</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; position: relative; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 44px; display: flex; align-items: center; font-size: 22px; font-weight: 700;">东营 · 机器人</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div style="height: 230px; border-radius: 12px; background: #fff;"></div>
      <div style="height: 230px; border-radius: 12px; background: #fff;"></div>
    </div>
  </div>
  <a href="Mall2.dc.html" aria-label="关闭" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45);"></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: #fff; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; padding: 14px 16px 6px;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700;">筛选</h2>
      <a href="Mall2.dc.html" aria-label="关闭" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#536178" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 18px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span style="font-size: 15px; font-weight: 500;">{{g.t}}</span>
            <span style="font-size: 12px; color: #738096;">{{g.hint}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
              <button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.pressed}}" style="min-height: 38px; border-radius: 8px; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 13px; padding: 0 4px; cursor: pointer;">{{o.l}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 15px; font-weight: 500;">价格区间（元）</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <input aria-label="最低价" placeholder="最低价" value="{{minPrice}}" onChange="{{setMinPrice}}" style="flex: 1 1 0; min-width: 0; height: 38px; border-radius: 8px; border: 1px solid #e5ebf3; background: #f5f7fc; padding: 0 12px; font: inherit; font-size: 14px; text-align: center;">
          <span style="color: #738096;">—</span>
          <input aria-label="最高价" placeholder="最高价" value="{{maxPrice}}" onChange="{{setMaxPrice}}" style="flex: 1 1 0; min-width: 0; height: 38px; border-radius: 8px; border: 1px solid #e5ebf3; background: #f5f7fc; padding: 0 12px; font: inherit; font-size: 14px; text-align: center;">
        </div>
        <span style="font-size: 12px; color: #738096;">询价商品无标价，设置价格区间后不显示</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 10px; padding: 10px 16px 24px; border-top: 1px solid #e5ebf3;">
      <button type="button" onClick="{{reset}}" style="width: 112px; height: 46px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">重置</button>
      <a href="Mall2.dc.html" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">查看 18 件</a>
    </div>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 已选项：键为“分组序号-选项序号”，初始与静态稿一致（可线上体验、体验馆可看、东营现货）
    this.state = { sel: { '0-0': true, '0-1': true, '2-0': true }, minPrice: '', maxPrice: '' };
  }
  renderVals() {
    const { sel, minPrice, maxPrice } = this.state;
    const on = { bd: '#ff6a00', bg: '#fffaf5', fg: '#ba470b' }, off = { bd: '#eef2f8', bg: '#eef2f8', fg: '#202c42' };
    // 每个选项可单独选中/取消，同一分组内可多选
    const mk = (gi, labels) => labels.map((l, i) => {
      const key = gi + '-' + i;
      const picked = !!sel[key];
      return {
        l, ...(picked ? on : off), pressed: picked ? 'true' : 'false',
        toggle: () => this.setState((s) => ({ sel: { ...s.sel, [key]: !s.sel[key] } }))
      };
    });
    const groups = [
      { t: '体验方式', hint: '先体验再决定', opts: mk(0, ['可线上体验', '体验馆可看', '可预约试飞']) },
      { t: '交易方式', hint: '', opts: mk(1, ['直接购买', '询价报价', '租赁']) },
      { t: '配送与自提', hint: '按当前城市', opts: mk(2, ['东营现货', '到店自提', '厂家直发']) },
      { t: '经营商家', hint: '均已审核资质', opts: mk(3, ['厂家直营', '授权经销', '本地服务商']) },
      { t: '适用场景', hint: '', opts: mk(4, ['青少年教育', '行业作业', '个人消费']) }
    ];
    // 重置：清空全部选项和已填的价格区间（“查看 18 件”文案不变）
    const reset = () => this.setState({ sel: {}, minPrice: '', maxPrice: '' });
    // 输入框 onChange 才带事件对象；没有事件对象时（例如脚本直接调用）保持原值
    const setMinPrice = (e) => { if (e && e.target) this.setState({ minPrice: e.target.value }); };
    const setMaxPrice = (e) => { if (e && e.target) this.setState({ maxPrice: e.target.value }); };
    return { groups, reset, minPrice, maxPrice, setMinPrice, setMaxPrice };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
