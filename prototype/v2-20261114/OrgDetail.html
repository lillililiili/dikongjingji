<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}

.phone.dark .screen{padding-top:0}

.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}

</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

        <a href="DemandList.dc.html" style="min-height: 44px; margin: -4px 0; padding-left: 8px; display: flex; align-items: center; font-size: 13px; color: #627187; text-decoration: none; white-space: nowrap;">全部 ›</a>

      </div>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>

</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03。定稿 24 的示例企业和人名换成沿用数据：东营港务物流、经办人王女士；数字按已有画板的单据数
    // profile：组织资料面板是否打开
    this.state = { profile: false };
  }
  renderVals() {
    const { profile } = this.state;
    // 进行中需求 = DemandList 里待报价和报价中的 3 份；待验收 = 物流园区季度安防巡检第 1 次；生效合同 = Contract
    const stats = [
      { n: 3, t: '进行中需求', href: 'DemandList.dc.html' },
      { n: 1, t: '待验收', href: 'Delivery.dc.html' },
      { n: 1, t: '生效合同', href: 'Contract.dc.html' }
    ].map((s, i) => ({ ...s, bd: i === 0 ? 'transparent' : '#e5ebf3' }));
    const blue = { tagBg: '#e6f0ff', tagC: '#1d63c4' };
    const orange = { tagBg: '#fff0e3', tagC: '#ba470b' };
    const green = { tagBg: '#e2f6ed', tagC: '#11804a' };
    const deals = [
      { title: '园区综合巡检需求', tag: '待报价', ...orange, sub: '需求单 · 经办：王女士 · 截止 11/05 18:00', href: 'Demand.dc.html' },
      { title: '行业测绘无人机（定制配置）', tag: '报价中 · 2 份', ...blue, sub: '询价单 · 经办：王女士 · 截止 11/05 18:00', href: 'QuoteGoods.dc.html' },
      { title: '物流园区季度安防巡检', tag: '合同生效中', ...green, sub: '合同 ¥18,600 · 鹰眼智能巡检 · 已结 0/6 次', href: 'Contract.dc.html' }
    ].map((d, i) => ({ ...d, bd: i === 0 ? 'transparent' : '#f0f1f3' }));
    const members = [
      { ch: '李', name: '李**', role: '负责人', bg: '#ffe3cc', fg: '#ba470b', tagBg: '#fff0e3', tagC: '#ba470b' },
      { ch: '王', name: '王女士（我）', role: '经办人', bg: '#dbe9fc', fg: '#1d63c4', tagBg: '#eef2f8', tagC: '#536178' },
      { ch: '张', name: '张工', role: '验收人', bg: '#d6f2e2', fg: '#11804a', tagBg: '#eef2f8', tagC: '#536178' }
    ].map((m, i) => ({ ...m, bd: i === 0 ? 'transparent' : '#f0f1f3' }));
    const c = '#202c42';
    const profileRows = [
      { k: '组织名称', v: '东营港务物流', c },
      { k: '认证状态', v: '资料已认证', c: '#11804a' },
      { k: '信用代码', v: '9137************6X', c },
      { k: '所在城市', v: '东营', c },
      { k: '办公地址', v: '山东省东营市东营港经济开发区示例港路 6 号（示例）', c },
      { k: '联系人', v: '王女士 138****2026', c }
    ];
    return {
      stats, deals, members,
      profile: profileRows,
      profileOpen: profile,
      openProfile: () => this.setState({ profile: true }),
      closeProfile: () => this.setState({ profile: false })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
