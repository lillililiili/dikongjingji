</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // received：是否已确认收货；copied：已点过“复制”的号码（waybill 运单号 / txn 渠道交易号 / order 订单号）
    this.state = { received: false, copied: {} };
  }
  renderVals() {
    const { received, copied } = this.state;
    const copy = (key) => () => this.setState((s) => ({ copied: { ...s.copied, [key]: true } }));
    const copyLabel = (key, idle) => (copied[key] ? '已复制' : idle);
    // 交易主体与商品详情 PdFull 选中“示例机器人商家”时一致
    const parties = [
      ['销售方', '示例机器人商家（厂家直营）'],
      ['收款方', '示例机器人商家 · 经平台支付渠道'],
      ['开票方', '示例机器人商家'],
      ['发货履约', '示例机器人商家 东营仓'],
      ['售后责任', '示例机器人商家 · 厂家保修']
    ].map(([k, v]) => ({ k, v }));
    const terms = [
      { t: '未拆封 7 天无理由退货（按销售方规则）' },
      { t: '一年保修由厂家负责' },
      { t: '协商不成可联系平台客服协助沟通（平台不裁决）' }
    ];
    return {
      parties, terms,
      // 确认收货后：状态头变为“已收货”，底部“确认收货”按钮消失
      statusTitle: received ? '已收货' : '已发货',
      statusLine: received ? '你已确认收货，如有问题可申请售后' : '11/13 10:24 将自动确认收货（按平台交易协议约定天数）',
      canConfirm: !received,
      // 物流卡顶部的预计送达：有到货日数据才显示（11/05 为示例），确认收货后不再显示
      showEta: !received,
      confirmReceipt: () => this.setState({ received: true }),
      waybillLabel: copyLabel('waybill', '复制单号去承运商查询'),
      copyWaybill: copy('waybill'),
      txnLabel: copyLabel('txn', '复制'),
      copyTxn: copy('txn'),
      orderNoLabel: copyLabel('order', '复制'),
      copyOrderNo: copy('order')
    };
  }
}
