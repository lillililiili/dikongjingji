<div style="position: relative; width: 390px; height: 684px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">

          <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">系统通知 · 11/01 09:00</span>

      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #555a62;">我们更新了《隐私政策》。下面是这次的主要变化，完整内容以协议正文为准。</p>

      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 14px 14px 4px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0 0 6px; font-size: 16px; font-weight: 700; line-height: 22px;">主要变化</h2>
      <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
        <a href="{{c.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-top: 1px solid #f0f1f3; text-decoration: none; color: #191919;">

          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; line-height: 21px; font-weight: 500; white-space: nowrap;">{{c.t}}</span>
            <span style="font-size: 13px; line-height: 19px; color: #666b73;">{{c.s}}</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 6px; padding: 0 4px; font-size: 12px; line-height: 18px; color: #666b73;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>
      <span style="min-width: 0;">生效前可以阅读全文。有疑问可以联系平台客服；不再使用平台时，可以在设置里申请注销账户。</span>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <a href="Chat.dc.html" style="flex-shrink: 0; width: 56px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; color: #555a62; text-decoration: none; white-space: nowrap;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2"></path></svg>客服</a>
    <a href="Agreement.dc.html" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">查看完整隐私政策</a>
  </div>
</div>
</x-dc>
