<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>城市运营看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <aside style="width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid #ebedf0; display: flex; flex-direction: column; padding: 20px 12px; gap: 4px;">
    <div style="font-size: 17px; font-weight: 700; padding: 0 12px 16px;">城市运营工作台</div>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
      <a href="Ops.dc.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 12px; border-radius: 10px; font-size: 14px; text-decoration: none; background: {{m.bg}}; color: {{m.c}}; font-weight: {{m.w}};">{{m.t}}</a>
    </sc-for>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 32px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700;">东营 · 经营概览</h1>
      <span style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #eef0f3; color: #555a62;">示意数据</span>
      <div style="margin-left: auto; display: flex; gap: 8px;">
        <button style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #ebedf0; background: #fff; font: inherit; font-size: 14px;">近 30 天 ▾</button>
        <button style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #ebedf0; background: #fff; font: inherit; font-size: 14px;">导出复盘</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
        <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; color: #555a62;">{{k.t}}</span>
          <span style="font-size: 26px; font-weight: 700;">{{k.v}}</span>
          <span style="font-size: 11px; color: #666b73; line-height: 1.5;">{{k.def}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 16px; flex-grow: 1; min-height: 0;">
      <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700;">推广转化漏斗</h2>
          <span style="font-size: 12px; color: #666b73;">按渠道链接归因，来源未知单独列示</span>
        </div>
        <sc-for list="{{funnel}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 14px;">
            <span style="width: 96px; font-size: 14px; color: #555a62; flex-shrink: 0;">{{f.t}}</span>
            <div style="flex-grow: 1; height: 28px; background: #f2f3f5; border-radius: 6px; overflow: hidden;">
              <div style="height: 100%; width: {{f.w}}; background: #ff6a00; border-radius: 6px;"></div>
            </div>
            <span style="width: 64px; text-align: right; font-size: 14px; font-weight: 500;">{{f.v}}</span>
          </div>
        </sc-for>
        <div style="margin-top: auto; display: flex; gap: 16px; font-size: 12px; color: #666b73;">
          <span>渠道 Top：赛事专题页 · 体验馆扫码 · 短视频</span>
          <span>来源未知订单：7</span>
        </div>
      </div>

      <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700;">待处理</h2>
        <sc-for list="{{todos}}" as="t" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f1f3;">
            <span style="font-size: 11px; padding: 2px 6px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; flex-shrink: 0;">{{t.tag}}</span>
            <span style="font-size: 14px; flex-grow: 1;">{{t.t}}</span>
            <a href="Ops.dc.html" style="font-size: 13px; text-decoration: none;">处理</a>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const menu = ['经营概览', '资源与授权', '商品与服务', '活动与报名', '场馆与核销', '内容与推广', '订单与对账', '城市设置'].map((t, i) => ({
      t, bg: i === 0 ? '#fff3e8' : 'transparent', c: i === 0 ? '#d94f00' : '#191919', w: i === 0 ? 500 : 400
    }));
    const kpis = [
      { t: '可经营资源数', v: '46', def: '审核通过且具当前授权的独立主体' },
      { t: '注册账户', v: '3,812', def: '按平台身份去重' },
      { t: '活动独立参与人', v: '1,264', def: '与报名人次、到场分列' },
      { t: '净实付交易额', v: '¥86.4万', def: '已支付减成功退款' },
      { t: '有效核销人次', v: '2,031', def: '重复核销已拦截' },
      { t: '准时履约率', v: '94%', def: '服务与发货按约完成' }
    ];
    const funnel = [
      { t: '访问', v: '21,560', w: '100%' },
      { t: '咨询 / 注册', v: '4,920', w: '46%' },
      { t: '报名 / 下单', v: '1,688', w: '24%' },
      { t: '支付', v: '1,402', w: '19%' },
      { t: '履约完成', v: '1,297', w: '16%' }
    ];
    const o = { bg: '#fff3e8', fg: '#d94f00' }, b = { bg: '#eaf2fd', fg: '#1d63c4' }, g = { bg: '#eef0f3', fg: '#555a62' };
    const todos = [
      { tag: '资源审核', t: '黄河口教育装备 · 入驻资料待审', ...o },
      { tag: '授权到期', t: '厂家旗舰共享资源 · 12 月到期', ...b },
      { tag: '退款', t: '研学一日营 · 2 笔取消待退款', ...o },
      { tag: '线下补录', t: '体验馆现场成交 3 笔待核验', ...g },
      { tag: '活动', t: '编程挑战赛下午场 · 候补 9 人', ...b }
    ];
    return { menu, kpis, funnel, todos };
  }
}
</script>
</body>
</html>
