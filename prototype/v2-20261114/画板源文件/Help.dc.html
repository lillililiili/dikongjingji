<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>帮助与反馈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 730px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">帮助与反馈</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px;">
    <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 12px; background: #e8f7ef; font-size: 13px; line-height: 18px; color: #11804a;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#19b866" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        <span style="min-width: 0;">反馈已提交，处理结果会发到“消息”</span>
      </div>
    </sc-if>

    <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button type="button" aria-haspopup="dialog" onClick="{{openSheet}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0; padding: 14px; box-sizing: border-box; border: 0; border-radius: 14px; background: #fff; font: inherit; color: #191919; text-align: left; cursor: pointer;">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #eaf2fd; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap;">提交反馈</span>
          <span style="font-size: 12px; line-height: 17px; color: #666b73;">功能问题、页面错误或建议</span>
        </span>
      </button>
      <a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; box-sizing: border-box; border-radius: 14px; background: #fff; color: #191919; text-decoration: none;">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fff3e8; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9c-4.8-1.2-8-4.5-8-9V6zM12 8v5M12 16h.01"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap;">投诉服务或商家</span>
          <span style="font-size: 12px; line-height: 17px; color: #666b73;">平台客服受理，协助沟通</span>
        </span>
      </a>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; border-radius: 14px; background: #fff;">
      <h2 style="margin: 0; padding: 14px 14px 2px; font-size: 16px; line-height: 22px; font-weight: 700;">常见问题</h2>
      <div role="group" aria-label="问题分类" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 14px 2px;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 44px; margin: 0; padding: 0; border: 0; background: none; font: inherit; display: flex; align-items: center; cursor: pointer;"><span style="width: 100%; height: 32px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-size: 13px; line-height: 18px; font-weight: {{c.w}}; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{c.label}}</span></button>
        </sc-for>
      </div>
      <sc-for list="{{faqs}}" as="q" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; border-bottom: 1px solid {{q.bd}};">
          <button type="button" aria-expanded="{{q.ex}}" onClick="{{q.toggle}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; box-sizing: border-box; margin: 0; padding: 8px 14px; border: 0; background: none; font: inherit; color: #191919; text-align: left; cursor: pointer;">
            <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; font-weight: {{q.w}};">{{q.t}}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="{{q.chev}}"></path></svg>
          </button>
          <sc-if value="{{q.open}}" hint-placeholder-val="{{false}}">
            <div style="margin: 0 14px 12px; padding: 10px 12px; border-radius: 10px; background: #f7f8fa; font-size: 13px; line-height: 20px; color: #555a62;">{{q.a}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <span style="font-size: 12px; line-height: 17px; color: #8a8f97; text-align: center;">没有找到答案？可以直接问平台客服</span>
    <a href="Chat.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; white-space: nowrap;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2"></path></svg>联系平台客服</a>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeSheet}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="提交反馈" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 18px; font-weight: 700; line-height: 25px;">提交反馈</span>
        <span style="font-size: 13px; line-height: 18px; color: #666b73;">处理结果会发到“消息”，订单问题建议直接联系客服</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 500;">反馈类型</span>
        <div role="group" aria-label="反馈类型" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 44px; margin: 0; padding: 0; border: 0; background: none; font: inherit; display: flex; align-items: center; cursor: pointer;"><span style="width: 100%; height: 34px; box-sizing: border-box; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; line-height: 18px; font-weight: {{t.w}}; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{t.label}}</span></button>
          </sc-for>
        </div>
      </div>
      <div style="position: relative;">
        <textarea aria-label="问题描述" placeholder="写下遇到的问题或建议（必填）" value="{{text}}" onChange="{{setText}}" style="display: block; width: 100%; height: 96px; box-sizing: border-box; margin: 0; padding: 10px 12px 26px; border: 1px solid #ebedf0; border-radius: 10px; background: #f7f8fa; font: inherit; font-size: 14px; line-height: 20px; color: #191919; resize: none; outline: none;"></textarea>
        <span style="position: absolute; right: 10px; bottom: 6px; font-size: 12px; line-height: 17px; color: #a3a8b0;">{{count}}/200</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <sc-for list="{{shots}}" as="s" hint-placeholder-count="1">
          <span role="img" aria-label="{{s.label}}" style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 10px; background: #eef0f3; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9h.01"></path></svg></span>
        </sc-for>
        <sc-if value="{{canAddShot}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-label="添加截图" onClick="{{addShot}}" style="flex-shrink: 0; width: 56px; height: 56px; margin: 0; padding: 0; border: 1px dashed #c4c8ce; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </sc-if>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; line-height: 18px; color: #555a62;">截图选填，最多 3 张</span>
          <span style="font-size: 12px; line-height: 17px; color: #8a8f97;">联系手机号 138****2026</span>
        </span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{closeSheet}}" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 1px solid #c4c8ce; background: #fff; font: inherit; font-size: 15px; color: #191919; white-space: nowrap; cursor: pointer;">取消</button>
        <button type="button" onClick="{{submit}}" disabled="{{submitOff}}" style="flex: 1 1 0; height: 46px; border-radius: 999px; border: 0; background: {{submitBg}}; font: inherit; font-size: 15px; font-weight: 500; color: #fff; white-space: nowrap; cursor: {{submitCursor}};">提交</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":730}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // cat：问题分类；openQ：展开的问题（一次只展开一条，再点收起）
    // sheet：提交反馈面板是否打开；type、text、shots：反馈类型、描述、已加截图张数；sent：这次已提交，页面顶部显示结果
    this.state = { cat: 'order', openQ: 'order-0', sheet: false, type: '', text: '', shots: 0, sent: false };
  }
  renderVals() {
    const { cat, openQ, sheet, type, text, shots, sent } = this.state;

    // 问题和答案只写已有画板定下的规则；时限政策没定的写占位
    const CATS = [
      { id: 'order', label: '订单与支付', list: [
        ['不同商家的商品能一起付款吗？', '不能。购物车每次只结算一个商家，不同商家分别下单付款。'],
        ['待付款订单要在多久内支付？', '收银台会显示剩余支付时间。超时未付，订单自动关闭，需要重新下单。'],
        ['付款后订单没有更新怎么办？', '付款要等渠道回执确认。页面显示“确认中”时不要重复付款，点「刷新结果」查看最新状态。'],
        ['怎么申请退款或售后？', '在订单详情点「申请售后」，选择原因后提交。售后由售后责任方处理，协商不成时平台客服协助沟通。']
      ] },
      { id: 'service', label: '专业服务', list: [
        ['服务什么时候付款？', '方案确认后付首付，验收后付款。多次服务每次验收后付本次服务费。'],
        ['为什么有的服务写“按项目报价”？', '价格要看现场范围和工作量。发布需求后由服务商给出方案，真实金额写在方案里。'],
        ['方案过期了怎么办？', '过期的方案不能确认，也不能付款。请联系服务商更新方案。'],
        ['对报告有疑问怎么办？', '在交付页点「对报告有疑问」联系平台客服，平台协助你和服务商沟通。']
      ] },
      { id: 'act', label: '活动与到馆', list: [
        ['报名后能退款或改期吗？', '在报名凭证点「申请退改」，可以只退改其中一位参与人，提交后等主办方确认。'],
        ['活动满员了还能报名吗？', '已满的场次可以候补。有名额后转为待付款，按提示付款即可报名成功。'],
        ['到馆核销码在哪里看？', '在“我的”点「体验预约」打开预约，到馆时出示核销码。'],
        ['到馆预约能改期吗？', '开场前 [协议约定时间] 可免费改期。改期后旧码作废，换成新码。']
      ] },
      { id: 'account', label: '账号与隐私', list: [
        ['怎么更换手机号？', '在“我的”点右上角设置，选“手机号”，验证旧号后绑定新号。'],
        ['怎么管理定位、相机和通知权限？', '在设置里打开“权限管理”，可以看到每项权限的用途，并跳到系统设置修改。'],
        ['怎么查看或导出个人信息？', '在设置里打开“个人信息查看与导出”，提交导出申请。'],
        ['怎么注销账户？', '在设置里点“注销账户”。需要先处理完进行中的订单、售后和报名，企业身份要移交或退出。']
      ] }
    ];

    const cats = CATS.map((c) => {
      const on = c.id === cat;
      return {
        label: c.label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#fff3e8' : '#f2f3f5',
        fg: on ? '#d94f00' : '#555a62',
        w: on ? 500 : 400,
        // 切分类时展开新分类的第 1 条，页面高度保持一致
        pick: () => this.setState({ cat: c.id, openQ: c.id + '-0' })
      };
    });
    const list = CATS.find((c) => c.id === cat).list;
    const faqs = list.map(([t, a], i) => {
      const id = cat + '-' + i;
      const open = openQ === id;
      return {
        t, a, open,
        ex: open ? 'true' : 'false',
        w: open ? 500 : 400,
        chev: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        bd: i === list.length - 1 ? 'transparent' : '#f0f1f3',
        toggle: () => this.setState((s) => ({ openQ: s.openQ === id ? '' : id }))
      };
    });

    const types = ['功能问题', '页面显示', '内容有误', '其他建议'].map((label) => {
      const on = label === type;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bd: on ? '#ff6a00' : '#ebedf0',
        bg: on ? '#fff3e8' : '#fff',
        fg: on ? '#d94f00' : '#191919',
        w: on ? 500 : 400,
        pick: () => this.setState({ type: label })
      };
    });

    // 类型和描述都有了才能提交
    const ready = Boolean(type) && text.trim().length > 0;
    return {
      cats, faqs, types,
      sent,
      sheetOpen: sheet,
      openSheet: () => this.setState({ sheet: true, sent: false }),
      closeSheet: () => this.setState({ sheet: false }),
      text,
      count: text.length,
      // 输入框 onChange 才带事件对象；没有事件对象时保持原值
      setText: (e) => { if (e && e.target) this.setState({ text: String(e.target.value || '').slice(0, 200) }); },
      shots: Array.from({ length: shots }, (_, i) => ({ label: '截图 ' + (i + 1) })),
      canAddShot: shots < 3,
      addShot: () => this.setState((s) => ({ shots: Math.min(3, s.shots + 1) })),
      submitOff: !ready,
      submitBg: ready ? '#ff6a00' : '#c4c8ce',
      submitCursor: ready ? 'pointer' : 'not-allowed',
      // 提交后关面板、清空表单，页面顶部显示结果
      submit: () => { if (ready) this.setState({ sheet: false, sent: true, type: '', text: '', shots: 0 }); }
    };
  }
}
</script>
</body>
</html>
