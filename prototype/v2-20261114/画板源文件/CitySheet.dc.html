<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>切换城市</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="height: 44px; display: flex; align-items: center; font-size: 20px; font-weight: 700;">东营 ▾</div>
    <div style="height: 164px; border-radius: 16px; background: #eef0f3;"></div>
    <div style="height: 180px; border-radius: 14px; background: #fff;"></div>
  </div>
  <a href="HomeFull.dc.html" aria-label="关闭" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45);"></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #fff; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; padding: 14px 16px 8px;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700;">选择城市</h2>
      <a href="HomeFull.dc.html" aria-label="关闭" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
      <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: #f2f3f5;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666b73" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input aria-label="搜索城市" placeholder="输入城市名" style="border: 0; outline: none; font: inherit; font-size: 14px; width: 100%; background: transparent;">
      </label>

      <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: #fffaf5; border: 1px solid #ffd8b8;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #666b73;">当前定位</span>
          <span style="font-size: 15px; font-weight: 500;">东营市 · 已开通</span>
        </div>
        <span style="margin-left: auto; font-size: 13px; color: #d94f00;">当前使用</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; color: #555a62;">已开通城市</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <a href="HomeFull.dc.html" style="box-sizing: border-box; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1.5px solid #ff6a00; background: #fffaf5; color: #d94f00; font: inherit; font-size: 14px; font-weight: 500; text-decoration: none;">东营 ✓</a>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; color: #555a62;">筹备中（可先浏览全国商品与线上体验）</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{soon}}" as="c" hint-placeholder-count="3">
            <a href="CityClosed.dc.html" style="height: 40px; border-radius: 10px; background: #f2f3f5; color: #555a62; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none;">{{c}}<span style="font-size: 11px; color: #8a8f97;">筹备</span></a>
          </sc-for>
        </div>
      </div>

      <div style="margin-top: auto; margin-bottom: 24px; padding: 12px; border-radius: 12px; background: #f7f8fa; font-size: 12px; color: #555a62; line-height: 1.7;">
        切换城市后，活动、场馆、本地现货和城市资讯随之变化；<br>账号、订单、参与人和收藏不变，跨城通用。
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { soon: ['济南', '青岛', '潍坊'] };
  }
}
</script>
</body>
</html>
