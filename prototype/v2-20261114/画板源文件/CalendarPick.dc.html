<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择日期</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 812px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">{{title}}</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border-radius: 14px;">
      <img src="{{ctxImg}}" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 700; line-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ctxTitle}}</span>
        <span style="font-size: 12px; line-height: 17px; color: #666b73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ctxSub}}</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center;">
        <button type="button" aria-label="上个月" disabled="{{true}}" style="width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: not-allowed;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4c8ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 700; line-height: 22px; text-align: center; white-space: nowrap;">2026 年 11 月</span>
        <button type="button" aria-label="下个月" onClick="{{nextMonth}}" style="width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <sc-if value="{{monthHint}}" hint-placeholder-val="{{false}}">
        <span role="status" style="padding: 6px 10px; border-radius: 8px; background: #fff3e8; font-size: 12px; line-height: 17px; color: #d94f00;">12 月尚未开放预约，请先在 11 月内选择（示例）</span>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <span style="font-size: 12px; line-height: 20px; color: #8a8f97; text-align: center; white-space: nowrap;">{{w.t}}</span>
        </sc-for>
      </div>
      <div role="grid" aria-label="2026 年 11 月" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
          <button type="button" role="gridcell" aria-label="{{d.aria}}" aria-pressed="{{d.pressed}}" disabled="{{d.off}}" onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; height: 50px; box-sizing: border-box; margin: 0; padding: 0; border-radius: 10px; border: 1.5px solid {{d.bd}}; background: {{d.bg}}; font: inherit; color: {{d.fg}}; cursor: {{d.cur}};">
            <span style="font-size: 15px; font-weight: {{d.w}}; line-height: 20px; white-space: nowrap;">{{d.n}}</span>
            <span style="font-size: 11px; line-height: 14px; color: {{d.sc}}; white-space: nowrap;">{{d.sub}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding-top: 4px; font-size: 12px; line-height: 17px; color: #666b73;">
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 3px; border: 1.5px solid #ebedf0; background: #fff;"></span>可约</span>
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #ff6a00;"></span>已选</span>
        <span style="display: flex; align-items: center; gap: 4px; white-space: nowrap;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #eef0f3;"></span>已满 / 不可约</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #fff; border-radius: 14px;">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; gap: 8px; font-size: 12px; line-height: 17px; color: #555a62;">
          <span style="flex-shrink: 0; width: 4px; height: 4px; margin: 7px 2px 0; border-radius: 50%; background: #a3a8b0;"></span>
          <span style="min-width: 0;">{{n.t}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <span style="font-size: 15px; line-height: 21px; white-space: nowrap;">{{summary}}</span>
    <sc-if value="{{picked}}" hint-placeholder-val="{{true}}">
      <a href="{{okHref}}" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">确定</a>
    </sc-if>
    <sc-if value="{{notPicked}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="{{true}}" style="height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #c4c8ce; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: not-allowed;">确定</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"enum","options":["预约巡检","到馆场次"],"default":"预约巡检"},"$preview":{"width":390,"height":812}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 整月日历，InspBooking 时段弹层的“更多日期”和 VenueDetail 的日期 chip 共用；选日期后回到来源页选时段 / 场次
    // 今天 = 11/03 周二。from：选择发生时所在的 Tweaks 帧，换帧后回到该帧的默认选中；monthHint：点过“下个月”
    this.state = { from: '', day: 0, monthHint: false };
  }
  renderVals() {
    const frame = this.props.frame ?? '预约巡检';
    const TODAY = 3;
    // 不可约 / 已满都是示例日期：巡检按服务商排期，到馆周一闭馆、按场次余位
    const cfg = {
      预约巡检: {
        title: '选择巡检日期', backHref: 'InspBooking.dc.html', okHref: 'InspBooking.dc.html',
        ctxImg: '/_blob/d26647dbfc9226eacaf364aaff076d9d', ctxTitle: '电力线路巡检', ctxSub: '预计服务时长 3 小时 · 选日期后回预约页选时段',
        closed: [10, 11], full: [7, 14, 21], closedLabel: '不可约', defaultDay: 6,
        notes: ['当天预约需提前 1 小时，已过的时段不能选', '不可约：服务商当天不接单；已满：当天时段已约满', '确认时段后提交预约，方案确认前不收取费用']
      },
      到馆场次: {
        title: '选择到馆日期', backHref: 'VenueDetail.dc.html', okHref: 'VenueDetail.dc.html',
        ctxImg: '/_blob/822c9edc2d0d857c67055194c02161d3', ctxTitle: '东营低空与机器人体验馆', ctxSub: '09:30–18:00 · 周一闭馆 · 选日期后回场馆选场次',
        closed: [2, 9, 16, 23, 30], full: [14, 28], closedLabel: '闭馆', defaultDay: 7,
        notes: ['周一闭馆，闭馆日不能预约', '已满：当天所有场次余位为 0', '场次按项目分开，选好日期后再选项目和场次']
      }
    };
    const c = cfg[frame] || cfg['预约巡检'];
    const day = this.state.from === frame ? this.state.day : c.defaultDay;
    const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
    // 2026-11-01 是周日，所以 1 号正好落在第一列
    const days = [];
    for (let n = 1; n <= 30; n++) {
      const past = n < TODAY;
      const closed = c.closed.includes(n);
      const full = c.full.includes(n);
      const off = past || closed || full;
      const on = n === day && !off;
      const isToday = n === TODAY;
      const sub = past ? '' : (closed ? c.closedLabel : (full ? '已满' : (isToday ? '今天' : '')));
      const week = weekNames[(n - 1) % 7];
      days.push({
        n: String(n), sub,
        aria: '11 月 ' + n + ' 日 周' + week + (sub ? ' ' + sub : (past ? ' 已过' : '')),
        pressed: on ? 'true' : 'false', off,
        bd: on ? '#ff6a00' : (isToday ? '#ffd8b8' : 'transparent'),
        bg: on ? '#ff6a00' : (off ? (past ? 'transparent' : '#eef0f3') : '#fff'),
        fg: on ? '#fff' : (off ? '#a3a8b0' : '#191919'),
        sc: on ? 'rgba(255,255,255,0.85)' : (off ? '#a3a8b0' : '#d94f00'),
        w: on || isToday ? 700 : 400,
        cur: off ? 'not-allowed' : 'pointer',
        pick: () => { if (!off) this.setState({ from: frame, day: n, monthHint: false }); }
      });
    }
    const picked = day > 0 && !days[day - 1].off;
    const label = picked ? '11月' + day + '日 周' + weekNames[(day - 1) % 7] : '';
    return {
      title: c.title, backHref: c.backHref, okHref: c.okHref,
      ctxImg: c.ctxImg, ctxTitle: c.ctxTitle, ctxSub: c.ctxSub,
      weekdays: weekNames.map((t) => ({ t })),
      days,
      notes: c.notes.map((t) => ({ t })),
      monthHint: this.state.monthHint,
      // 原型只画 11 月；12 月尚未开放预约时页内提示，不翻页
      nextMonth: () => this.setState({ monthHint: true }),
      picked, notPicked: !picked,
      summary: picked ? '已选择：' + label : '请选择日期'
    };
  }
}
</script>
</body>
</html>
