<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>航拍服务详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1545px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="SvcCatalog.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">服务详情</h1>
    <a href="ShareSheet.dc.html" aria-label="分享" style="flex-shrink: 0; margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v7h14v-7"></path></svg></a>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;">
    <div style="position: relative; flex-shrink: 0; height: 200px; background: #f2f3f5;">
      <img src="/_blob/277bff54e5d7d5be019694787d4e648d" alt="无人机航拍" style="width: 390px; height: 200px; object-fit: cover; display: block;">
      <span style="position: absolute; left: 16px; top: 12px; padding: 3px 10px; border-radius: 6px; background: #1d63c4; color: #fff; font-size: 13px; font-weight: 500; line-height: 18px; white-space: nowrap;">航拍服务</span>
    </div>

    <div style="position: relative; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; margin-top: -24px; padding: 0 16px 12px;">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 14px 14px 4px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px;">园区与工程航拍</h2>
        <span style="margin-top: 2px; font-size: 13px; line-height: 18px; color: #666b73;">园区全景 · 工程进度 · 宣传素材</span>
        <div style="display: flex; align-items: baseline; gap: 2px; margin-top: 8px; white-space: nowrap;">
          <span style="font-size: 28px; font-weight: 700; line-height: 36px; color: #e85400;">¥1,280</span>
          <span style="font-size: 14px; line-height: 20px; color: #e85400;">/次起</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; margin-top: 10px;">
          <sc-for list="{{capabilities}}" as="c" hint-placeholder-count="3">
            <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 18px; color: #555a62; white-space: nowrap;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#19b866" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{c}}</span>
          </sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 60px; margin-top: 12px; border-top: 1px solid #f0f1f3;">
          <span aria-hidden="true" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #fff3e8; font-size: 15px; font-weight: 700; line-height: 36px; color: #d94f00; text-align: center;">鹰</span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
            <span style="font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap;">鹰眼智能巡检</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="flex-shrink: 0; padding: 1px 6px; border-radius: 6px; background: #e8f7ef; color: #11804a; font-size: 12px; line-height: 16px; white-space: nowrap;">资质已审核</span>
              <span style="font-size: 12px; line-height: 16px; color: #8a8f97; white-space: nowrap;">可服务城市 东营</span>
            </div>
          </div>
          <a href="ProviderPage.dc.html" style="flex-shrink: 0; height: 44px; padding-left: 4px; display: flex; align-items: center; font-size: 13px; line-height: 18px; color: #666b73; text-decoration: none; white-space: nowrap;">查看服务商 ›</a>
        </div>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 14px 14px 4px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">价格与取消</h2>
        <div style="display: flex; flex-direction: column; margin-top: 4px;">
          <sc-for list="{{priceRows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid {{r.line}};">
              <span style="flex-shrink: 0; width: 56px; font-size: 13px; line-height: 19px; color: #666b73; white-space: nowrap;">{{r.k}}</span>
              <span style="flex-grow: 1; min-width: 0; font-size: 13px; line-height: 19px;">{{r.v}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">成果样片</h2>
          <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">作品由服务商上传</span>
        </div>
        <div style="position: relative; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: 64px 64px; gap: 6px;">
          <button type="button" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="position: relative; grid-row: span 2; margin: 0; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: #eef0f3; font: inherit; cursor: pointer;">
            <img src="/_blob/e42bb39cca5b4f528e6577da8445bced" alt="视频样片占位" style="width: 100%; height: 134px; object-fit: cover; display: block;">
            <span style="position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
              <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
              <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></sc-if>
            </span>
            <span style="position: absolute; left: 8px; bottom: 8px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; line-height: 16px; white-space: nowrap;">{{sampleLabel}}</span>
          </button>
          <sc-for list="{{samples}}" as="p" hint-placeholder-count="2">
            <div style="position: relative; border-radius: 10px; overflow: hidden; background: #eef0f3;">
              <img src="{{p.img}}" alt="照片样片占位" style="width: 100%; height: 64px; object-fit: cover; display: block;">
              <span style="position: absolute; left: 6px; bottom: 6px; padding: 0 5px; border-radius: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; line-height: 16px; white-space: nowrap;">照片占位</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">拍摄内容</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{scope}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 10px; background: #f7f8fa;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="{{s.d}}"></path></svg>
              <span style="min-width: 0; font-size: 13px; font-weight: 500; line-height: 18px; white-space: nowrap;">{{s.label}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">成果格式</h2>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{outputs}}" as="f" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 10px 0 8px; border-radius: 10px; background: #f7f8fa;">
              <span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 8px; background: #eaf2fd; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.d}}"></path></svg></span>
              <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
                <span style="font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap;">{{f.label}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #666b73;">{{f.sub}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">服务流程</h2>
        <div style="display: flex;">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
            <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;">
              <span style="width: 28px; height: 28px; border-radius: 50%; background: #eaf2fd; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{st.d}}"></path></svg></span>
              <span style="font-size: 12px; line-height: 17px; color: #555a62; white-space: nowrap;">{{st.label}}</span>
            </div>
            <sc-if value="{{st.arrow}}" hint-placeholder-val="{{true}}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin: 8px -6px 0;" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </sc-if>
          </sc-for>
        </div>
        <span style="display: flex; align-items: center; gap: 4px; padding-top: 10px; border-top: 1px solid #f0f1f3; font-size: 12px; line-height: 17px; color: #666b73;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>方案确认后付首付，验收通过后付尾款</span>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">服务保障</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{guarantees}}" as="g" hint-placeholder-count="3">
            <span style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; border-radius: 10px; background: #eefaf3; font-size: 13px; line-height: 18px; color: #11804a; white-space: nowrap;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#19b866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="{{g.d}}"></path></svg>{{g.label}}</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <a href="Chat.dc.html" style="flex-shrink: 0; width: 56px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; color: #555a62; white-space: nowrap; text-decoration: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2"></path></svg>客服</a>
    <a href="Demand.dc.html" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">发布需求</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1545}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // playing：视频样片是否处于页内“播放”态（原型只切换按钮和进度示例，不加载真实视频）
    this.state = { playing: false };
  }
  renderVals() {
    const { playing } = this.state;
    const capabilities = ['视频素材', '照片', '持证飞手'];
    // 价格与取消：计价方式和头部价格一致；确认方案后的取消细则没定，只写“按方案约定”
    const priceRows = [
      ['计价方式', '按次计价，真实金额以方案报价为准'],
      ['影响价格', '拍摄范围、拍摄时长、成果数量'],
      ['取消说明', '方案确认前取消不收费，确认后按方案约定']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    // 样片是占位图，正式产品显示服务商上传的作品
    const samples = [
      { img: '/_blob/248020917b29731ae2eb5c415d406dd0' },
      { img: '/_blob/ee1e30b9b857f7be121fae8b2cad93e7' }
    ];
    const scope = [
      ['园区全景', 'M4 21V10l6-3v14M10 21V4l10 4v13M2 21h20M13.5 11h3M13.5 15h3'],
      ['工程进度', 'M4 20h16M7 20v-6M12 20V9M17 20V5'],
      ['活动现场', 'M6 21V4M6 5h12l-3 3.5 3 3.5H6'],
      ['宣传素材', 'M4 6h16v13H4zM4 10h16M8 6l2 4M14 6l2 4']
    ].map(([label, d]) => ({ label, d }));
    // 分辨率、时长、张数都由方案约定，这里不写死
    const outputs = [
      { label: '视频素材', sub: '原始素材，分辨率和时长按方案约定', d: 'M4 6h12v12H4zM16 10.5l4-2.5v8l-4-2.5' },
      { label: '照片', sub: '高清原图，张数按方案约定', d: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9.5h.01' }
    ];
    // 流程文案同定稿 12 专业服务频道：提交需求、报价比选、现场履约、报告验收
    const steps = [
      ['提交需求', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4'],
      ['报价比选', 'M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4'],
      ['现场拍摄', 'M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3'],
      ['成果验收', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d], i, arr) => ({ label, d, arrow: i < arr.length - 1 }));
    const guarantees = [
      ['持证飞手', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['合规飞行', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 10.5h6M9 14h6'],
      ['素材保密', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 11.5h5V15h-5zM10.5 11.5V10a1.5 1.5 0 0 1 3 0v1.5']
    ].map(([label, d]) => ({ label, d }));
    return {
      capabilities, priceRows, samples, scope, outputs, steps, guarantees,
      playing, paused: !playing,
      playAria: playing ? '暂停视频样片' : '播放视频样片',
      // 播放态在占位角标上显示进度示例
      sampleLabel: playing ? '00:12 / 01:30' : '视频样片占位',
      togglePlay: () => this.setState((s) => ({ playing: !s.playing }))
    };
  }
}
</script>
</body>
</html>
