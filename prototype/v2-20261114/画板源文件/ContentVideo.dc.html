      <a href="ExpSim.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border-radius: 14px; color: #191919; text-decoration: none;">
        <img src="/_blob/822c9edc2d0d857c67055194c02161d3" alt="机器人避障模拟场地" style="flex-shrink: 0; width: 60px; height: 60px; border-radius: 10px; object-fit: cover; display: block; background: #f2f3f5; font-size: 11px; line-height: 15px;">
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
          <span style="display: flex; align-items: center; gap: 6px; min-width: 0;">
            <span style="flex-shrink: 0; padding: 0 5px; border-radius: 6px; background: #e8f7ef; color: #11804a; font-size: 12px; line-height: 18px; white-space: nowrap;">体验</span>

          </span>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <button type="button" onClick="{{toggleFav}}" aria-pressed="{{fav}}" style="flex-shrink: 0; width: 46px; height: 46px; margin: 0; padding: 0; border: 0; background: none; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; line-height: 15px; color: {{favColor}}; white-space: nowrap; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="{{favFill}}" stroke="{{favColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.6-9-9.1C1.7 7.7 3.8 5 6.7 5c2 0 3.6 1 5.3 3 1.7-2 3.3-3 5.3-3 2.9 0 5 2.7 3.7 5.9-2 4.5-9 9.1-9 9.1z"></path></svg>{{favLabel}}</button>

    <div role="dialog" aria-modal="true" aria-label="分享内容" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 18px; font-weight: 700; line-height: 25px;">分享内容</span>

      </div>
      <div style="display: flex; align-items: flex-start; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #f7f8fa; font-size: 13px; line-height: 18px; color: #555a62;">

        <sc-if value="{{canCopy}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{copyLink}}" style="flex: 1 1 0; height: 44px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #ff6a00; font: inherit; font-size: 15px; font-weight: 500; color: #fff; white-space: nowrap; cursor: pointer;">复制链接</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":786}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // playing：视频是否在播放（原型只切换按钮，进度停在定稿的 00:46）；fav：是否已收藏；share、copied：分享面板是否打开、这次打开后是否已复制
    this.state = { playing: false, fav: false, share: false, copied: false };
  }
  renderVals() {
    const { playing, fav, share, copied } = this.state;
    return {
      shareOpen: share,
      canCopy: !copied,
      copied,
      openShare: () => this.setState({ share: true }),
      copyLink: () => this.setState({ copied: true }),
      // 关闭时清掉“已复制”，下次打开回到可复制状态
      closeShare: () => this.setState({ share: false, copied: false }),
      playing,
      playLabel: playing ? '暂停' : '播放',
      playPath: playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5l12 7-12 7z',
      togglePlay: () => this.setState((s) => ({ playing: !s.playing })),
      fav,
      favLabel: fav ? '已收藏' : '收藏',
      favColor: fav ? '#ff6a00' : '#555a62',
      favFill: fav ? '#ff6a00' : 'none',
      toggleFav: () => this.setState((s) => ({ fav: !s.fav }))
    };
  }
}
</script>
