<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>协议与规则</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 674px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px 16px 8px 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px; white-space: nowrap;">协议与规则</h1>
    <button type="button" aria-haspopup="dialog" onClick="{{openSheet}}" style="flex-shrink: 0; height: 44px; margin: 0 0 0 auto; padding: 0; border: 0; background: none; font: inherit; display: flex; align-items: center; cursor: pointer;"><span style="height: 32px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #ebedf0; background: #fff; font-size: 13px; line-height: 30px; color: #555a62; white-space: nowrap;">全部协议</span></button>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 14px 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px;">{{doc.title}}</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 0; border-radius: 10px; background: #f7f8fa;">
        <sc-for list="{{doc.meta}}" as="k" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
            <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">{{k.k}}</span>
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap;">{{k.v}}</span>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{doc.hasNotice}}" hint-placeholder-val="{{true}}">
        <a href="NoticeDetail.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; margin: -6px 0 -8px; color: #191919; text-decoration: none;">
          <span style="flex-shrink: 0; font-size: 12px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: #fff3e8; color: #d94f00; white-space: nowrap;">有更新</span>
          <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; white-space: nowrap;">查看本次更新摘要</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-if>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; padding: 16px 14px; background: #fff; border-radius: 14px;">
      <sc-for list="{{doc.sections}}" as="s" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h3 style="margin: 0; font-size: 15px; font-weight: 700; line-height: 22px;">{{s.t}}</h3>
          <span style="font-size: 14px; line-height: 22px; color: #8a8f97;">[协议正文待确认]</span>
        </div>
      </sc-for>
    </div>

    <a href="Chat.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: #fff; text-decoration: none; color: #191919;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M4 14v-2a8 8 0 1 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2"></path></svg>
      <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; white-space: nowrap;">对内容有疑问，联系平台客服</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeSheet}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="全部协议" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 8px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <span style="font-size: 18px; font-weight: 700; line-height: 25px;">全部协议</span>
      <div style="display: flex; flex-direction: column;">
        <sc-for list="{{docList}}" as="d" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; margin: 0; padding: 0; border: 0; border-top: 1px solid #f0f1f3; background: none; font: inherit; text-align: left; cursor: pointer;">
            <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; font-weight: {{d.w}}; color: {{d.c}}; white-space: nowrap;">{{d.title}}</span>
            <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #8a8f97; white-space: nowrap;">{{d.ver}}</span>
            <sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"enum","options":["隐私政策","用户协议","儿童个人信息保护规则","平台交易协议","报名须知与照片使用说明"],"default":"隐私政策"},"$preview":{"width":390,"height":674}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // pick：在“全部协议”里选的文档（空 = 用 Tweaks 的 frame）；sheet：“全部协议”面板是否打开
    this.state = { pick: '', sheet: false };
  }
  renderVals() {
    const { pick, sheet } = this.state;
    const frame = this.props.frame ?? '隐私政策';

    // 通用正文模板：标题、版本、更新与生效日期、正文。章节标题和版本日期都是占位，正文等专项确认后替换
    // 默认隐私政策：登录、设置、通知详情、权限管理都会进来；隐私政策 v1.1 的日期与 NoticeDetail 一致
    const base = { ver: 'v1.0', updated: '2026-10-20', effective: '2026-11-01', back: 'Settings.dc.html', notice: false };
    const docs = [
      { ...base, title: '隐私政策', ver: 'v1.1', updated: '2026-11-01', effective: '2026-11-08', notice: true,
        sections: ['一、我们收集的信息', '二、信息的使用与共享', '三、信息的存储与保护', '四、你的权利', '五、政策更新与联系方式'] },
      { ...base, title: '用户协议',
        sections: ['一、协议范围与主体', '二、账号注册与使用', '三、平台服务内容', '四、用户行为规范', '五、协议变更与联系方式'] },
      { ...base, title: '儿童个人信息保护规则',
        sections: ['一、适用范围与监护人同意', '二、收集的儿童信息', '三、儿童信息的使用与保护', '四、监护人的权利', '五、规则更新与联系方式'] },
      { ...base, title: '平台交易协议', back: 'Checkout.dc.html',
        sections: ['一、交易主体与收款方', '二、下单、付款与收货', '三、退款与售后', '四、服务订单与验收', '五、协商与平台协助'] },
      { ...base, title: '报名须知与照片使用说明', back: 'Signup.dc.html',
        sections: ['一、报名与参与条件', '二、退改规则', '三、现场安全', '四、照片与视频的使用', '五、未成年人参与'] }
    ];
    const current = docs.find((d) => d.title === (pick || frame)) || docs[0];

    return {
      backHref: current.back,
      doc: {
        title: current.title,
        hasNotice: current.notice,
        meta: [{ k: '版本', v: current.ver }, { k: '更新日期', v: current.updated }, { k: '生效日期', v: current.effective }],
        sections: current.sections.map((t) => ({ t }))
      },
      docList: docs.map((d) => {
        const on = d.title === current.title;
        return {
          title: d.title, ver: d.ver, on, w: on ? 500 : 400, c: on ? '#d94f00' : '#191919',
          pick: () => this.setState({ pick: d.title, sheet: false })
        };
      }),
      sheetOpen: sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>
