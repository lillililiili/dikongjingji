<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>搜索前置页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
input::placeholder{color:#8a8f97;opacity:1}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-bottom: 1px solid #f0f1f3;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 4px 16px 0 4px;">
      <a href="HomeFull.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; height: 40px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff;">
        <label style="flex-grow: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666b73" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input type="text" aria-label="搜索" value="{{q}}" onChange="{{setQ}}" placeholder="搜索设备、活动或服务" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0; font: inherit; font-size: 15px; color: #191919; background: transparent;">
        </label>
        <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{clearQ}}" aria-label="清除" style="flex-shrink: 0; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#c4c8ce"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2"></path></svg></button>
        </sc-if>
        <a href="MallSearch.dc.html" style="flex-shrink: 0; height: 44px; display: flex; align-items: center; text-decoration: none;"><span style="height: 32px; padding: 0 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center; white-space: nowrap;">搜索</span></a>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 8px;">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="6">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="position: relative; width: 100%; height: 42px; margin: 0; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: {{s.fs}}; font-weight: {{s.w}}; color: {{s.c}}; white-space: nowrap;">{{s.label}}<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 4px; width: 16px; height: 3px; margin-left: -8px; border-radius: 3px; background: #ff6a00;"></span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px;">
    <span style="flex-shrink: 0; font-size: 12px; line-height: 17px; color: #666b73; white-space: nowrap;">东营 · 结果按本城可用范围显示</span>

    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap;">最近搜索</span>
          <sc-if value="{{hasRecent}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{clearRecent}}" style="flex-shrink: 0; height: 44px; margin: 0; padding: 0 0 0 18px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #666b73; cursor: pointer; display: flex; align-items: center; white-space: nowrap;">清空</button>
          </sc-if>
        </div>
        <sc-if value="{{hasRecent}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
              <a href="MallSearch.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #f2f3f5; color: #191919; font-size: 14px; text-decoration: none; display: flex; align-items: center; white-space: nowrap;">{{r.label}}</a>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noRecent}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; line-height: 18px; color: #666b73;">还没有搜索记录</span>
        </sc-if>
      </div>

      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px 14px;">
        <div style="display: flex; align-items: center; height: 44px; font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap;">按类目找</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 0;">
          <sc-for list="{{categories}}" as="c" hint-placeholder-count="8">
            <a href="{{c.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #191919;">
              <span style="width: 46px; height: 46px; border-radius: 14px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
              </span>
              <span style="font-size: 13px; line-height: 18px; white-space: nowrap;">{{c.label}}</span>
            </a>
          </sc-for>
        </div>
      </div>

      <span style="flex-shrink: 0; font-size: 12px; line-height: 17px; color: #666b73; white-space: nowrap;">最近搜索只保存在本机，可随时清空</span>
    </sc-if>

    <sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px;">
        <a href="MallSearch.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 48px; text-decoration: none; color: #191919;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">搜索“{{typed}}”</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <sc-if value="{{hasFix}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{applyFix}}" style="width: 100%; min-height: 48px; margin: 0; padding: 0; border: 0; border-top: 1px solid #f0f1f3; background: transparent; font: inherit; font-size: 14px; line-height: 20px; color: #555a62; text-align: left; cursor: pointer; white-space: nowrap;">你是不是要搜：<span style="color: #d94f00; font-weight: 500;">{{fixTo}}</span></button>
        </sc-if>
        <sc-for list="{{hits}}" as="h" hint-placeholder-count="3">
          <a href="{{h.href}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-top: 1px solid #f0f1f3; text-decoration: none; color: #191919;">
            <span style="flex-shrink: 0; padding: 0 6px; border-radius: 6px; background: {{h.bg}}; color: {{h.fg}}; font-size: 12px; line-height: 18px; white-space: nowrap;">{{h.type}}</span>
            <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{h.pre}}<span style="color: #ff6a00;">{{h.hit}}</span>{{h.post}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // q 是输入框文字，scope 是范围 Tab，cleared 表示最近搜索已被清空
    this.state = { q: '', scope: '综合', cleared: false };
  }
  renderVals() {
    const { q, scope, cleared } = this.state;
    const scopes = ['综合', '商品', '服务', '活动', '内容', '场馆'].map((label) => {
      const on = label === scope;
      return {
        label, on, pressed: on ? 'true' : 'false',
        c: on ? '#191919' : '#666b73', fs: on ? '16px' : '15px', w: on ? 700 : 400,
        pick: () => this.setState({ scope: label })
      };
    });

    // 只输入空格时清除按钮要出现，但页面内容仍按无输入显示
    const typed = q.trim();
    const typing = typed !== '';
    const key = typed.replace(/\s+/g, '');

    // 联想直达详情。标签配色沿用各业务已有的色调
    const tones = {
      '商品': { bg: '#fff3e8', fg: '#d94f00' },
      '服务': { bg: '#eaf2fd', fg: '#1d63c4' },
      '活动': { bg: '#f1edff', fg: '#6a4fe0' },
      '内容': { bg: '#f2f3f5', fg: '#555a62' },
      '场馆': { bg: '#e8f7ef', fg: '#11804a' }
    };
    const suggestions = [
      { type: '商品', name: '编程机器人探索套装', href: 'PdFull.dc.html' },
      { type: '商品', name: '桌面六轴机械臂 教学版', href: 'PdFull.dc.html' },
      { type: '服务', name: '园区安防巡检', href: 'InspDetailPark.dc.html' },
      { type: '服务', name: '无人机航测与三维建模', href: 'SvcSurvey.dc.html' },
      { type: '活动', name: '青少年无人机编程挑战赛', href: 'ActDetail.dc.html' },
      { type: '内容', name: '3 分钟看懂编程机器人', href: 'ContentVideo.dc.html' },
      { type: '场馆', name: '东营低空与机器人体验馆', href: 'VenueDetail.dc.html' }
    ];
    // 包含匹配时忽略空格，输入“3分钟”也能命中“3 分钟看懂编程机器人”；再把命中位置换回原文，用于高亮
    const cut = (name) => {
      const at = name.replace(/ /g, '').indexOf(key);
      if (at < 0) return null;
      const chars = [];
      for (let i = 0; i < name.length; i += 1) if (name[i] !== ' ') chars.push(i);
      const from = chars[at];
      const to = chars[at + key.length - 1] + 1;
      return { pre: name.slice(0, from), hit: name.slice(from, to), post: name.slice(to) };
    };
    const hits = (typing ? suggestions : [])
      .filter((s) => scope === '综合' || s.type === scope)
      .flatMap((s) => {
        const parts = cut(s.name);
        return parts ? [{ ...s, ...tones[s.type], ...parts }] : [];
      });

    // 纠错只认这两个词，点击后替换输入框文字；纠错提示不受范围 Tab 影响
    const fix = [['巡简', '巡检'], ['机器够', '机器狗']].find(([wrong]) => wrong === key);

    const recent = ['测绘', '测绘无人机', '航测', '三维建模'].map((label) => ({ label }));

    // 运营配置的固定入口，图标沿用首页金刚区
    const o = { bg: '#fff3e8', fg: '#ff6a00' }, g = { bg: '#e8f7ef', fg: '#19b866' }, b = { bg: '#eaf2fd', fg: '#2f80ed' };
    const categories = [
      ['专业服务', 'HomeSvc.dc.html', o, 'M9 3.5h6a1 1 0 0 1 1 1V6a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1zM16 5h2a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-13A1.5 1.5 0 0 1 6 5h2M8.5 13.5l2.5 2.5 4.5-5'],
      ['活动', 'HomeAct.dc.html', b, 'M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3'],
      ['体验', 'ExpCenter.dc.html', g, 'M5 5h14v15H5zM5 9h14M9 3v4M15 3v4M9 14l2 2 4-4'],
      ['无人机', 'MallDrone.dc.html', o, 'M10 10h4v4h-4zM10 10L7.3 7.3M14 10l2.7-2.7M14 14l2.7 2.7M10 14l-2.7 2.7M3 5.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M16 5.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M16 18.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M3 18.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0'],
      ['机器人', 'Mall2.dc.html', b, 'M6 8h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM12 8V5.5M10.8 4a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0M9 12.5v1M15 12.5v1M9.5 16h5M2 12v3M22 12v3'],
      ['配件', 'MallParts.dc.html', o, 'M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z'],
      ['租赁', 'MallRental.dc.html', b, 'M4 8h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM9 8V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V8M3 13h18M10.5 13v2h3v-2'],
      ['课程', 'MallCourse.dc.html', g, 'M2.5 9.5L12 5l9.5 4.5L12 14zM6.5 11.5V16c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.5M21.5 9.5v5']
    ].map(([label, href, tone, d]) => ({ label, href, bg: tone.bg, fg: tone.fg, d }));

    return {
      q, typed, typing, idle: !typing, hasQ: q !== '', scopes, hits, categories, recent,
      hasRecent: !cleared, noRecent: cleared,
      hasFix: !!fix, fixTo: fix ? fix[1] : '',
      setQ: (e) => { if (e && e.target) this.setState({ q: String(e.target.value || '') }); },
      clearQ: () => this.setState({ q: '' }),
      clearRecent: () => this.setState({ cleared: true }),
      applyFix: () => { if (fix) this.setState({ q: fix[1] }); }
    };
  }
}
</script>
</body>
</html>
