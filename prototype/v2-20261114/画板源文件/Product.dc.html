<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>商品详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 220px; flex-shrink: 0; background: #eef0f3; position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3"></path></svg>
      <span style="font-size: 12px; color: #8a8f97;">商品主图（待授权素材）· 1/5</span>
      <a href="Mall.dc.html" aria-label="返回" style="position: absolute; left: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <button aria-label="分享" style="position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 9l5-5 5 5M5 14v6h14v-6"></path></svg></button>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 24px; font-weight: 700; color: #e85400;">¥2,680</span>
        <span style="font-size: 13px; color: #666b73;">起 · 3 家商家报价</span>
      </div>
      <div style="font-size: 18px; font-weight: 700;">教育编程无人机套装</div>
      <div style="font-size: 13px; color: #555a62;">图形化编程 · 室内光流定位 · 含 8 课时教案</div>
    </div>

    <div style="margin: 0 12px; background: #fff3e8; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 15px; font-weight: 700;">先体验，再决定</div>
        <div style="font-size: 12px; color: #555a62;">模拟起降 · 航线编程 · 避障闯关</div>
        <div style="display: flex; gap: 6px;">
          <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff; color: #555a62; border: 1px solid #ffd2b0;">虚拟仿真</span>
          <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff; color: #555a62; border: 1px solid #ffd2b0;">线下实物可预约</span>
        </div>
      </div>
      <a href="Experience.dc.html" style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none;">开始体验</a>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700;">选择经营商家</h2>
        <span style="font-size: 12px; color: #666b73;">同型号，不同供给</span>
      </div>
      <sc-for list="{{sellers}}" as="s" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1.5px solid {{s.bd}}; background: {{s.bg}};">
          <input type="radio" name="seller" checked="{{s.on}}" style="accent-color: #ff6a00; width: 18px; height: 18px; margin: 0;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 500;">{{s.name}}</span>
            <span style="font-size: 12px; color: #666b73;">{{s.meta}}</span>
          </div>
          <span style="font-size: 16px; font-weight: 700; color: #e85400;">{{s.price}}</span>
        </label>
      </sc-for>
    </div>

    <div style="margin: 0 12px; background: #fff; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12px;">
      <div style="grid-column: 1 / -1; font-size: 14px; font-weight: 700;">交易主体</div>
      <div><span style="color: #666b73;">销售 / 收款</span>　东营翼飞科技</div>
      <div><span style="color: #666b73;">开票</span>　东营翼飞科技</div>
      <div><span style="color: #666b73;">履约</span>　本地发货 3 天内</div>
      <div><span style="color: #666b73;">售后</span>　厂家保修 12 个月</div>
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #fff; border-top: 1px solid #ebedf0;">
    <button style="width: 48px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 11px; color: #555a62;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0M4 13v4h3v-5H4M20 13v4h-3v-5h3"></path></svg>客服</button>
    <button style="width: 48px; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 11px; color: #555a62;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>收藏</button>
    <button style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff; color: #d94f00; font: inherit; font-size: 15px; font-weight: 500;">预约线下体验</button>
    <button style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; background: #ff6a00; color: #fff; font: inherit; font-size: 15px; font-weight: 500;">立即购买</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sellers = [
      { name: '东营翼飞科技（授权代理）', meta: '现货 · 3 天交付 · 本地售后', price: '¥2,680', on: true },
      { name: '厂家旗舰（总部共享资源）', meta: '交期 7 天 · 厂家直保', price: '¥2,799', on: false },
      { name: '黄河口教育装备', meta: '含 2 次上门培训', price: '¥2,960', on: false }
    ].map((s) => ({ ...s, bd: s.on ? '#ff6a00' : '#ebedf0', bg: s.on ? '#fffaf5' : '#fff' }));
    return { sellers };
  }
}
</script>
</body>
</html>
