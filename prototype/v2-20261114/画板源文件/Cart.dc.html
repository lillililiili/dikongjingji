<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>购物车</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; padding: 6px 4px 0 16px; background: #fff;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 44px;">购物车<span style="font-size: 15px; font-weight: 500;">({{count}})</span></h1>
    <a href="CartStates.dc.html" style="margin-left: auto; display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; color: #191919; text-decoration: none;">管理</a>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 0;">
    <div style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 6px; padding: 8px 12px; border-radius: 10px; background: #eaf2fd; font-size: 12px; line-height: 17px; color: #1d63c4;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1.5px;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>
      <span>每次只能结算一个商家；不同商家请分别下单付款。</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 12px 12px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 44px;">
        <label style="flex-shrink: 0; position: relative; display: flex; margin: -12px; padding: 12px;">
          <input type="radio" name="cart-merchant" aria-label="{{g.aria}}" checked="{{g.on}}" onChange="{{g.pick}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;">
          <sc-if value="{{g.on}}" hint-placeholder-val="{{true}}">
            <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          </sc-if>
          <sc-if value="{{g.off}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c4c8ce; background: #fff;"></span>
          </sc-if>
          <sc-if value="{{g.na}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #ebedf0; background: #f2f3f5;"></span>
          </sc-if>
        </label>
        <a href="Merchant.dc.html" style="display: flex; align-items: center; gap: 5px; min-width: 0; min-height: 44px; text-decoration: none; color: #191919;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"></path></svg>
          <span style="font-size: 15px; font-weight: 700; white-space: nowrap;">{{g.name}}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2.4" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
        <span style="flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; border: 1px solid #ebedf0; color: #555a62; white-space: nowrap;">{{g.tag1}}</span>
        <span style="flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 1px 5px; border-radius: 4px; background: #e8f7ef; color: #11804a; white-space: nowrap;">{{g.tag2}}</span>
      </div>
      <sc-for list="{{g.items}}" as="p" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-start; gap: 10px; padding-top: 10px;">
          <sc-if value="{{p.selectable}}" hint-placeholder-val="{{true}}">
            <label style="flex-shrink: 0; position: relative; display: flex; margin: 18px -12px -12px; padding: 12px;">
              <input type="checkbox" aria-label="{{p.aria}}" checked="{{p.on}}" onChange="{{p.toggle}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;">
              <sc-if value="{{p.on}}" hint-placeholder-val="{{true}}">
                <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
              </sc-if>
              <sc-if value="{{p.off}}" hint-placeholder-val="{{false}}">
                <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c4c8ce; background: #fff;"></span>
              </sc-if>
            </label>
          </sc-if>
          <sc-if value="{{p.na}}" hint-placeholder-val="{{false}}">
            <span aria-label="当前不可选" style="flex-shrink: 0; width: 20px; height: 20px; margin-top: 30px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #ebedf0; background: #f2f3f5;"></span>
          </sc-if>
          <a href="{{p.href}}" style="flex-shrink: 0;"><img src="{{p.img}}" alt="{{p.name}}" style="width: 80px; height: 80px; border-radius: 10px; object-fit: cover; display: block; background: #f2f3f5;"></a>
          <div style="flex-grow: 1; min-width: 0; min-height: 80px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
            <a href="{{p.href}}" style="font-size: 14px; font-weight: 500; line-height: 20px; color: #191919; text-decoration: none;">{{p.name}}</a>
            <sc-if value="{{p.spec}}" hint-placeholder-val="{{true}}">
              <a href="PdSku.dc.html" aria-label="{{p.specLabel}}" style="display: block; margin: -11px 0; padding: 11px 0; text-decoration: none;"><span style="display: flex; align-items: center; gap: 2px; height: 22px; padding: 0 6px; border-radius: 6px; background: #f2f3f5; font-size: 12px; color: #555a62;">{{p.spec}}<svg width="10" height="10" viewBox="0 0 24 24" fill="#8a8f97" aria-hidden="true"><path d="M6 9l6 6 6-6z"></path></svg></span></a>
            </sc-if>
            <sc-if value="{{p.ship}}" hint-placeholder-val="{{true}}">
              <span style="font-size: 12px; line-height: 17px; color: #11804a;">{{p.ship}}</span>
            </sc-if>
            <sc-if value="{{p.note}}" hint-placeholder-val="{{false}}">
              <span style="display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: #f2f3f5; font-size: 12px; line-height: 17px; color: #666b73; white-space: nowrap;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>与已选商家不同，需分开结算</span>
            </sc-if>
            <div style="align-self: stretch; margin-top: auto; display: flex; align-items: center;">
              <span style="font-size: 16px; font-weight: 700; color: #e85400;">{{p.price}}</span>
              <span style="margin-left: auto; display: flex; align-items: center; height: 26px; border: 1px solid #ebedf0; border-radius: 6px; font-size: 14px; line-height: 26px;">
                <button type="button" aria-label="{{p.minusLabel}}" aria-disabled="{{p.minusOff}}" onClick="{{p.minus}}" style="position: relative; box-sizing: border-box; width: 44px; height: 44px; margin: -9px; padding: 0; border: 0; background: none; font: inherit; text-align: center; color: {{p.minusC}};">−</button>
                <span style="width: 30px; text-align: center; border-left: 1px solid #ebedf0; border-right: 1px solid #ebedf0; font-size: 13px;">{{p.qty}}</span>
                <button type="button" aria-label="{{p.plusLabel}}" aria-disabled="{{p.plusOff}}" onClick="{{p.plus}}" style="position: relative; box-sizing: border-box; width: 44px; height: 44px; margin: -9px; padding: 0; border: 0; background: none; font: inherit; text-align: center; color: {{p.plusC}};">+</button>
              </span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
    </sc-for>

    <sc-if value="{{showInvalid}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 12px 12px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center; min-height: 44px;">
        <span style="font-size: 15px; font-weight: 500; color: #555a62;">失效商品 (1)</span>
        <button type="button" onClick="{{clearInvalid}}" style="margin-left: auto; min-height: 44px; padding: 0 0 0 12px; border: 0; background: none; font: inherit; font-size: 14px; color: #d94f00;">清空失效</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 1px 4px; border-radius: 6px; background: #c4c8ce; color: #fff;">失效</span>
        <span style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; background: #f2f3f5; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c4c8ce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"></path></svg></span>
        <span style="min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 14px; line-height: 20px; color: #a3a8b0;">扩展传感器包</span>
          <span style="font-size: 12px; line-height: 17px; color: #a3a8b0;">商家已下架</span>
        </span>
      </div>
    </div>
    </sc-if>

    <div style="flex-shrink: 0; padding: 0 8px; font-size: 12px; line-height: 19px; color: #8a8f97; text-align: center;">询价商品、服务和活动不进购物车，分别在商品详情、专业服务和活动里办理。</div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 16px; background: #fff; border-top: 1px solid #ebedf0;">
    <label style="position: relative; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; color: #555a62; white-space: nowrap;"><input type="checkbox" checked="{{allOn}}" onChange="{{toggleAll}}" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; opacity: 0;"><sc-if value="{{allOn}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if><sc-if value="{{allOff}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c4c8ce; background: #fff;"></span></sc-if>全选本商家</label>
    <span style="margin-left: auto; display: flex; align-items: baseline; gap: 4px; font-size: 13px; white-space: nowrap;">合计<span style="font-size: 18px; font-weight: 700; color: #e85400;">{{total}}</span></span>
    <sc-if value="{{canCheckout}}" hint-placeholder-val="{{true}}">
      <a href="{{checkoutHref}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; white-space: nowrap;">{{checkout}}</a>
    </sc-if>
    <sc-if value="{{noCheckout}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="{{true}}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #c4c8ce; font: inherit; color: #fff; font-size: 15px; font-weight: 500; white-space: nowrap;">{{checkout}}</button>
    </sc-if>
  </div>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; background: #fff; border-top: 1px solid #ebedf0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.c}}; font-size: 12px; font-weight: {{t.w}};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 4px; left: 50%; margin-left: 5px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #ff5200; color: #fff; font-size: 11px; line-height: 16px; text-align: center;">{{t.badge}}</span>
        </sc-if>
        <sc-if value="{{t.dot}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 7px; left: 50%; margin-left: 9px; width: 8px; height: 8px; border-radius: 50%; background: #ff5200;"></span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // merchant：本次结算的商家（一次只能结算一个商家）；checked：已勾选的商品；qty：各商品数量；invalidCleared：是否已清空失效
    this.state = { merchant: 'robot', checked: { kit: true, field: true }, qty: { kit: 1, field: 1, drone: 1 }, invalidCleared: false };
  }
  renderVals() {
    const { merchant, checked, qty, invalidCleared } = this.state;
    const ACTIVE = 3; // 0 首页 1 发现 2 消息 3 购物车 4 我的
    const tabs = [
      ['首页', 'HomeFull.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', '', false],
      ['发现', 'Discover.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z', '', true],
      ['消息', 'Messages.dc.html', 'M4 5h16v11H9l-5 4zM8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01', '3', false],
      ['购物车', 'Cart.dc.html', 'M3 4h2l2 11h11l2-8H6M9 20a1 1 0 1 0 0-.1M17 20a1 1 0 1 0 0-.1', '3', false],
      ['我的', 'Mine.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6', '', false]
    ].map((t, i) => ({ label: t[0], href: t[1], d: t[2], badge: t[3], dot: t[4] && i !== ACTIVE, c: i === ACTIVE ? '#ff6a00' : '#8a8f97', w: i === ACTIVE ? 500 : 400 }));

    // 两个商家像单选：选中一个商家 = 勾选它的全部商品并取消另一个商家；选中商家内可逐件取消勾选。失效商品不计数。
    const shops = [
      { id: 'robot', name: '示例机器人商家', tag1: '厂家直营', tag2: '东营现货', items: [
        { id: 'kit', name: '编程机器人探索套装', spec: '标准套装', ship: '48 小时内发货 · 可到店自提', unit: 1299, img: '/_blob/5d32505e8b9a494f8436e31c3008ef99', href: 'PdFull.dc.html' },
        { id: 'field', name: '避障训练场地套件', spec: '', ship: '', unit: 460, img: '/_blob/822c9edc2d0d857c67055194c02161d3', href: 'PdField.dc.html' }
      ] },
      { id: 'store', name: '示例科创器材店', tag1: '本地商家', tag2: '到店自提', items: [
        { id: 'drone', name: '便携航拍无人机', spec: '', ship: '', unit: 1999, img: '/_blob/277bff54e5d7d5be019694787d4e648d', href: 'PdDroneMini.dc.html' }
      ] }
    ];
    const MAX_QTY = 99;
    const yuan = (n) => '¥' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const checkAll = (shop, on) => shop.items.reduce((acc, it) => ({ ...acc, [it.id]: on }), {});
    const changeQty = (id, step) => this.setState((s) => ({ qty: { ...s.qty, [id]: Math.min(MAX_QTY, Math.max(1, (s.qty[id] || 1) + step)) } }));

    let sum = 0;
    let picked = 0;
    const groups = shops.map((shop) => {
      const active = shop.id === merchant;
      const allOn = active && shop.items.every((it) => checked[it.id]);
      const items = shop.items.map((it) => {
        const q = qty[it.id] || 1;
        const on = active && !!checked[it.id];
        if (on) { sum += it.unit * q; picked += 1; }
        return {
          id: it.id, name: it.name, spec: it.spec, specLabel: '修改规格：' + it.spec, ship: it.ship, img: it.img, href: it.href, price: yuan(it.unit), qty: q,
          selectable: active, on, off: active && !on, na: !active, note: !active, aria: '勾选' + it.name,
          toggle: () => this.setState((s) => ({ checked: { ...s.checked, [it.id]: !s.checked[it.id] } })),
          minus: () => changeQty(it.id, -1), plus: () => changeQty(it.id, 1),
          minusOff: q <= 1, plusOff: q >= MAX_QTY,
          minusC: q <= 1 ? '#c4c8ce' : '#555a62', plusC: q >= MAX_QTY ? '#c4c8ce' : '#555a62',
          minusLabel: '减少' + it.name + '数量', plusLabel: '增加' + it.name + '数量'
        };
      });
      return {
        id: shop.id, name: shop.name, tag1: shop.tag1, tag2: shop.tag2, items,
        on: allOn, off: active && !allOn, na: !active, aria: '结算' + shop.name + '的商品',
        pick: () => this.setState({ merchant: shop.id, checked: checkAll(shop, true) })
      };
    });
    const current = groups.find((g) => g.id === merchant);
    const items = current ? current.items : []; // 本次结算商家的商品
    const allOn = !!current && current.on; // 底部“全选本商家”
    const toggleAll = () => this.setState((s) => {
      const shop = shops.find((x) => x.id === s.merchant);
      return shop ? { checked: checkAll(shop, !shop.items.every((it) => s.checked[it.id])) } : {};
    });

    const count = 3; // 有效商品件数 = 底栏“购物车”角标（不随数量变化）
    const total = yuan(sum); // 只算已勾选商品：单价 × 数量
    const checkout = picked > 0 ? '结算(' + picked + ')' : '结算';
    // 同商家两件走 CheckoutStates（默认帧多件商品），只选一件走 Checkout
    const checkoutHref = picked >= 2 ? 'CheckoutStates.dc.html' : 'Checkout.dc.html';
    return {
      tabs, groups, items, count, total, checkout, checkoutHref, canCheckout: picked > 0, noCheckout: picked === 0,
      allOn, allOff: !allOn, toggleAll, showInvalid: !invalidCleared, clearInvalid: () => this.setState({ invalidCleared: true })
    };
  }
}
</script>
</body>
</html>
