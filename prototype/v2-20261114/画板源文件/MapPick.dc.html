<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地图选点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
input::placeholder{color:#8a8f97;opacity:1}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="{{backHref}}" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">{{title}}</h1>
  </div>

  <div style="flex-shrink: 0; padding: 0 16px 10px; background: #fff;">
    <div style="display: flex; align-items: center; height: 40px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 999px; background: #f2f3f5;">
      <label style="flex-grow: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666b73" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="text" aria-label="搜索地点" value="{{q}}" onChange="{{setQ}}" placeholder="搜索小区、楼宇或街道" style="flex-grow: 1; min-width: 0; border: 0; outline: none; padding: 0; font: inherit; font-size: 14px; color: #191919; background: transparent;">
      </label>
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{clearQ}}" aria-label="清除" style="flex-shrink: 0; width: 44px; height: 40px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#c4c8ce"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2"></path></svg></button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{denied}}" hint-placeholder-val="{{false}}">
    <div role="status" style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #fff3e8; border-top: 1px solid #ffd8b8; border-bottom: 1px solid #ffd8b8;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>
      <span style="flex-grow: 1; min-width: 0; font-size: 13px; line-height: 18px; color: #d94f00;">未开启定位，可手动搜索</span>
      <a href="SetPerm.dc.html" style="flex-shrink: 0; height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ff6a00; background: #fff; color: #d94f00; font-size: 13px; line-height: 18px; text-decoration: none; display: flex; align-items: center; white-space: nowrap;">去开启</a>
    </div>
  </sc-if>

  <div role="img" aria-label="{{mapAria}}" style="position: relative; flex-shrink: 0; height: 240px; background-color: #eef0f3; background-image: linear-gradient(#e1e4e8 1px, transparent 1px), linear-gradient(90deg, #e1e4e8 1px, transparent 1px); background-size: 32px 32px; overflow: hidden;">
    <span aria-hidden="true" style="position: absolute; left: 28px; top: 30px; width: 118px; height: 64px; border-radius: 8px; background: #e3e7eb;"></span>
    <span aria-hidden="true" style="position: absolute; left: 236px; top: 150px; width: 126px; height: 58px; border-radius: 8px; background: #e3e7eb;"></span>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 118px; height: 8px; background: #fff;"></span>
    <span aria-hidden="true" style="position: absolute; left: 196px; top: 0; bottom: 0; width: 8px; background: #fff;"></span>
    <sc-if value="{{located}}" hint-placeholder-val="{{true}}">
      <span aria-hidden="true" style="position: absolute; left: 150px; top: 84px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 3px solid #fff; background: #2f80ed; box-shadow: 0 0 0 6px rgba(47,128,237,0.18);"></span>
    </sc-if>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <span style="padding: 4px 8px; border-radius: 6px; background: #191919; color: #fff; font-size: 12px; line-height: 16px; white-space: nowrap;">{{pinLabel}}</span>
      <svg width="30" height="38" viewBox="0 0 24 30" fill="none" aria-hidden="true"><path d="M12 29s-9-9.5-9-17a9 9 0 0 1 18 0c0 7.5-9 17-9 17z" fill="#ff6a00" stroke="#fff" stroke-width="1.5"></path><circle cx="12" cy="12" r="3.6" fill="#fff"></circle></svg>
    </div>
    <sc-if value="{{located}}" hint-placeholder-val="{{true}}">
      <button type="button" aria-label="回到我的位置" onClick="{{relocate}}" style="position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="1.5" fill="#191919"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg></button>
    </sc-if>
    <span style="position: absolute; left: 12px; bottom: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,0.88); font-size: 11px; line-height: 16px; color: #8a8f97; white-space: nowrap;">示意地图 · 正式产品经地图适配器接入</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px; background: #fff; border-radius: 14px;">
      <sc-if value="{{hasPick}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 64px;">
          <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #fff3e8; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5z"></path></svg></span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{pick.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: #555a62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{pick.addr}}</span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{noPick}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 64px;">
          <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #f2f3f5; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8f97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5z"></path></svg></span>
          <span style="min-width: 0; font-size: 14px; line-height: 20px; color: #8a8f97;">在地图上拖动选点，或搜索地址</span>
        </div>
      </sc-if>
      <sc-if value="{{tip}}" hint-placeholder-val="{{false}}">
        <span style="padding: 0 0 10px; font-size: 12px; line-height: 17px; color: #8a8f97;">{{tip}}</span>
      </sc-if>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px; background: #fff; border-radius: 14px;">
      <div style="display: flex; align-items: center; height: 40px; font-size: 13px; line-height: 18px; color: #666b73; white-space: nowrap;">{{listTitle}}</div>
      <sc-for list="{{pois}}" as="p" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{p.aria}}" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; margin: 0; padding: 0; border: 0; border-top: 1px solid #f0f1f3; background: none; font: inherit; color: #191919; text-align: left; cursor: pointer;">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 14px; font-weight: {{p.w}}; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.sub}}</span>
          </span>
          <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}">
            <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          </sc-if>
          <sc-if value="{{p.off}}" hint-placeholder-val="{{true}}">
            <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c4c8ce; background: #fff;"></span>
          </sc-if>
        </button>
      </sc-for>
      <sc-if value="{{noHits}}" hint-placeholder-val="{{false}}">
        <span style="padding: 2px 0 14px; font-size: 13px; line-height: 18px; color: #8a8f97;">没有找到“{{typed}}”相关的地点，换个关键词试试</span>
      </sc-if>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <sc-if value="{{hasPick}}" hint-placeholder-val="{{true}}">
      <a href="{{confirmHref}}" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">确认地址</a>
    </sc-if>
    <sc-if value="{{noPick}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled="{{true}}" style="width: 100%; height: 46px; margin: 0; border: 0; border-radius: 999px; background: #c4c8ce; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: not-allowed;">确认地址</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"enum","options":["需求地点","巡检地点","定位被拒"],"default":"需求地点"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // q：搜索框文字；picked：选中的地点 id（null 表示还没动过，用当前帧的默认值）
    this.state = { q: '', picked: null };
  }
  renderVals() {
    const { q, picked } = this.state;

    // 三帧共用一块地图选点：需求发布和巡检预约的“地图选点”都进这里，确认后各回各的表单；
    // 定位被拒这一帧没有“我的位置”，地图停在上次位置，只能搜索或拖图钉选点（定位开关在 SetPerm）
    const FRAMES = {
      需求地点: { back: 'Demand.dc.html', title: '选择服务地点', located: true, defaultPick: 'p1', tip: '' },
      巡检地点: { back: 'InspBooking.dc.html', title: '选择巡检地点', located: true, defaultPick: 'p1', tip: '选中的位置作为巡检起点，线路长度在预约页填写' },
      定位被拒: { back: 'Demand.dc.html', title: '选择服务地点', located: false, defaultPick: '', tip: '' }
    };
    const f = FRAMES[this.props.frame ?? '需求地点'] || FRAMES['需求地点'];

    // 地点数据沿用已有画板：示例路 88 号（王女士地址）、东营港务物流（企业收货点）；距离只在定位开启时显示
    const POIS = [
      { id: 'p1', name: '示例路 88 号', addr: '山东省东营市东营区示例路 88 号（示例）', dist: '120 米' },
      { id: 'p2', name: '示例产业园 3 号门', addr: '山东省东营市东营区示例路 96 号（示例）', dist: '350 米' },
      { id: 'p3', name: '东营港务物流园区', addr: '山东省东营市东营港经济开发区示例港路 6 号（示例）', dist: '24 公里' }
    ];
    const cur = picked === null ? f.defaultPick : picked;
    const pick = POIS.find((p) => p.id === cur) || null;

    const typed = q.trim();
    const hits = typed ? POIS.filter((p) => p.name.includes(typed) || p.addr.includes(typed)) : POIS;
    const pois = hits.map((p) => {
      const on = p.id === cur;
      return {
        name: p.name,
        sub: f.located ? p.dist + ' · ' + p.addr : p.addr,
        on, off: !on, aria: on ? 'true' : 'false', w: on ? 500 : 400,
        // 选中后图钉移到该地点，地址卡显示它
        pick: () => this.setState({ picked: p.id })
      };
    });

    return {
      backHref: f.back,
      confirmHref: f.back,
      title: f.title,
      denied: !f.located,
      located: f.located,
      mapAria: pick ? '地图，图钉在 ' + pick.name : '地图，图钉在屏幕中央',
      pinLabel: pick ? pick.name : '拖动地图选点',
      q, hasQ: q !== '', typed,
      setQ: (e) => { if (e && e.target) this.setState({ q: String(e.target.value || '') }); },
      clearQ: () => this.setState({ q: '' }),
      // 回到我的位置：图钉回到定位点（示例路 88 号），清掉搜索
      relocate: () => this.setState({ picked: 'p1', q: '' }),
      hasPick: !!pick,
      noPick: !pick,
      pick: pick || { name: '', addr: '' },
      tip: f.tip,
      listTitle: typed ? '搜索结果' : (f.located ? '附近地点' : '最近使用的地点'),
      pois,
      noHits: typed !== '' && hits.length === 0
    };
  }
}
</script>
</body>
</html>
