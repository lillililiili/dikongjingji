<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核销异常处理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 900px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="StaffVerify.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap;">核销异常处理</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px;">
      <span style="flex-shrink: 0; font-size: 13px; line-height: 18px; color: #666b73; white-space: nowrap;">异常类型</span>
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex-shrink: 0; height: 36px; margin: 0; padding: 0 12px; box-sizing: border-box; border: 1px solid {{t.bd}}; border-radius: 999px; background: {{t.bg}}; color: {{t.c}}; font: inherit; font-size: 13px; font-weight: {{t.w}}; white-space: nowrap; cursor: pointer;">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 2px; text-align: center;">
      <span style="width: 64px; height: 64px; border-radius: 50%; background: {{heroBg}}; display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{heroStroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{heroPath}}"></path></svg></span>
      <span style="font-size: 19px; line-height: 26px; font-weight: 700; white-space: nowrap;">{{heroTitle}}</span>
      <span style="font-size: 13px; line-height: 18px; color: #666b73; white-space: nowrap;">{{heroSub}}</span>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 2px 14px 12px; border-radius: 14px; background: #fff;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 42px; box-sizing: border-box; border-top: 1px solid {{r.bd}}; font-size: 14px; line-height: 20px;">
          <span style="flex-shrink: 0; width: 64px; color: #666b73; white-space: nowrap;">{{r.k}}</span>
          <span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.v}}</span>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 8px 10px; border-radius: 8px; background: {{factBg}}; color: {{factC}}; font-size: 14px; line-height: 20px; font-weight: 500;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{factC}}" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7.5v5.5M12 16.5h.01"></path></svg>
        <span style="min-width: 0;">{{fact}}</span>
      </div>
    </div>

    <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 4px 14px 14px; border-radius: 14px; background: #fff;">
        <h2 style="margin: 0; display: flex; align-items: center; min-height: 36px; font-size: 15px; line-height: 21px; font-weight: 700;">人工处理</h2>
        <span style="font-size: 13px; line-height: 18px; color: #555a62;">处理方式（必选）</span>
        <div role="radiogroup" aria-label="处理方式" style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
            <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 60px; margin: 0; padding: 8px 12px; box-sizing: border-box; border: 1.5px solid {{o.bd}}; border-radius: 12px; background: {{o.bg}}; font: inherit; color: #191919; text-align: left; cursor: pointer;">
              <span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{o.ring}}; background: {{o.dot}}; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 15px; line-height: 21px; font-weight: 500;">{{o.title}}</span>
                <span style="font-size: 12px; line-height: 17px; color: #8a8f97;">{{o.sub}}</span>
              </span>
            </button>
          </sc-for>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; box-sizing: border-box; border: 1px solid {{idBd}}; border-radius: 10px; background: {{idBg}}; cursor: pointer;">
          <input type="checkbox" checked="{{idOk}}" onChange="{{toggleId}}" style="flex-shrink: 0; width: 20px; height: 20px; margin: 0; accent-color: #ff6a00;">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500;">已人工核验身份</span>
            <span style="font-size: 12px; line-height: 17px; color: #8a8f97;">放行前核对证件姓名与凭证持有人一致</span>
          </span>
        </label>
        <input type="text" value="{{note}}" onChange="{{setNote}}" placeholder="备注（选填），如现场情况说明" aria-label="备注" style="height: 44px; box-sizing: border-box; margin: 0; padding: 0 12px; border: 1px solid #ebedf0; border-radius: 10px; background: #f7f8fa; font: inherit; font-size: 14px; color: #191919;">
      </div>
    </sc-if>

    <sc-if value="{{showDupNotice}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid #f6c4c6; background: #fdecec;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM5.7 5.7l12.6 12.6"></path></svg>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 700; color: #e5484d;">重复核销一律拦截，不允许放行</span>
          <span style="font-size: 12px; line-height: 17px; color: #555a62;">无需选择原因，记录后返回继续核销</span>
        </span>
      </div>
    </sc-if>

    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex-shrink: 0; display: flex; flex-direction: column; padding: 12px 14px 0; border-radius: 14px; background: #fff;">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 28px;">
          <span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #19b866; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="flex-grow: 1; font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap;">已登记</span>
          <span style="flex-shrink: 0; font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">已留痕 · 不能重复提交</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0 10px 30px; font-size: 14px; line-height: 20px; color: #555a62;">
          <span style="white-space: nowrap;">操作人 李员 · 14:06</span>
          <span style="white-space: nowrap;">处理：{{doneAct}}</span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">原因：{{doneReason}}</span>
          <sc-if value="{{doneNote}}" hint-placeholder-val="{{false}}">
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">备注：{{doneNote}}</span>
          </sc-if>
        </div>
        <a href="StaffVerify.dc.html" style="display: flex; align-items: center; min-height: 44px; border-top: 1px solid #f0f1f3; font-size: 14px; font-weight: 500; color: #d94f00; text-decoration: none; white-space: nowrap;">返回核销工作台 ›</a>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{showFooter}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 16px 12px; background: #fff; border-top: 1px solid #ebedf0;">
      <span role="status" style="font-size: 12px; line-height: 17px; color: {{hintC}}; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{hint}}</span>
      <sc-if value="{{isWarn}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 10px;">
          <a href="StaffVerify.dc.html" style="flex: 1 1 0; min-width: 0; height: 46px; box-sizing: border-box; border: 1px solid #c4c8ce; border-radius: 999px; background: #fff; color: #191919; font-size: 15px; text-decoration: none; white-space: nowrap; display: flex; align-items: center; justify-content: center;">返回扫码</a>
          <button type="button" onClick="{{confirm}}" disabled="{{confirmOff}}" style="flex: 1.6 1 0; min-width: 0; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: {{confirmBg}}; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: pointer;">确认处理</button>
        </div>
      </sc-if>
      <sc-if value="{{isDup}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; gap: 10px;">
          <a href="StaffVerify.dc.html" style="flex: 1 1 0; min-width: 0; height: 46px; box-sizing: border-box; border: 1px solid #c4c8ce; border-radius: 999px; background: #fff; color: #191919; font-size: 15px; text-decoration: none; white-space: nowrap; display: flex; align-items: center; justify-content: center;">返回扫码</a>
          <button type="button" onClick="{{recordDup}}" style="flex: 1.6 1 0; min-width: 0; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #ff6a00; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: pointer;">记录拦截</button>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // type 异常类型；choice 所选处理方式；idOk 已人工核验身份；note 备注；done 各类型的登记结果（登记后不能重复提交）
    this.state = { type: 'mismatch', choice: '', idOk: false, note: '', done: {} };
  }
  renderVals() {
    const { type, choice, idOk, note, done } = this.state;
    // 三类异常是三张不同的凭证，持有人都不是王女士（她的 14:00 凭证已在工作台 14:05 核销成功，“我的体验”里也只有这一张到馆预约）
    // 重复核销的凭证 = 工作台“最近核销”里 14:02 已核销的 李** · 1 人；姓名打码，凭证只显示尾号（示意）
    // 处理方式按异常类型给出，选项本身就是留痕的原因，避免出现“拒绝入场 · 原因：改签本场”这种自相矛盾的记录；放行类必须先人工核验身份
    const TYPES = [
      { id: 'mismatch', label: '场次不符', title: '场次不符，需人工核验', sub: '凭证有效，但不属于当前核销场次', holder: '孙** · 1 人', tail: '0815', fact: '凭证为 15:30 场，当前核销 14:00 场', options: [
        { id: 'release', title: '本场有余位，改签并核销', sub: '释放 15:30 名额，记录改签原因', act: '改签并核销（登记放行）', reason: '本场有余位，现场改签', needId: true },
        { id: 'reject', title: '不予核销', sub: '提示按原场次 15:30 参加', act: '不予核销（拒绝入场）', reason: '凭证属于 15:30 场，按原场次参加', needId: false }
      ] },
      { id: 'duplicate', label: '重复核销', title: '重复核销，已拦截', sub: '同一凭证只能核销一次', holder: '李** · 1 人', tail: '3762', fact: '该凭证已于 14:02 核销', options: [] },
      { id: 'expired', label: '凭证已过期', title: '凭证已过期，需人工核验', sub: '凭证场次已过，不能直接核销', holder: '周** · 1 人', tail: '5208', fact: '凭证为 11/02 场，已过期', options: [
        { id: 'release', title: '补发本场凭证并核销', sub: '核验身份后补发，记录补发原因', act: '补发凭证并核销（登记放行）', reason: '凭证已过期，现场补发本场凭证', needId: true },
        { id: 'reject', title: '不予核销', sub: '提示凭证已过期，按退改规则处理', act: '不予核销（拒绝入场）', reason: '凭证已过期（11/02 场）', needId: false }
      ] }
    ];
    const typeOf = (id) => TYPES.find((t) => t.id === id) || TYPES[0];
    const cur = typeOf(type);
    const rec = done[cur.id] || null;
    const isDup = cur.id === 'duplicate';
    const isWarn = !isDup;
    const isDone = !!rec;
    const opt = cur.options.find((o) => o.id === choice) || null;
    const chip = (on) => ({ on, bd: on ? '#ff6a00' : '#dcdfe4', bg: on ? '#fff3e8' : '#fff', c: on ? '#d94f00' : '#191919', w: on ? 500 : 400 });
    const types = TYPES.map((t) => ({ ...chip(t.id === cur.id), label: t.label, pick: () => this.setState({ type: t.id, choice: '', idOk: false, note: '' }) }));
    const options = cur.options.map((o) => {
      const on = !!opt && o.id === opt.id;
      return { on, title: o.title, sub: o.sub, bd: on ? '#ff6a00' : '#ebedf0', bg: on ? '#fffaf5' : '#fff', ring: on ? '#ff6a00' : '#c4c8ce', dot: on ? '#ff6a00' : '#fff', pick: () => this.setState({ choice: o.id }) };
    });
    const rows = [['持有人', cur.holder], ['凭证尾号', cur.tail], ['当前场次', '14:00 机器人避障闯关']]
      .map((r, i) => ({ k: r[0], v: r[1], bd: i === 0 ? 'transparent' : '#f0f1f3' }));
    const ready = !!opt && (!opt.needId || idOk);
    // 同一类型登记过就不再生成新记录（幂等）
    const confirm = () => this.setState((s) => {
      const t = typeOf(s.type);
      const o = t.options.find((x) => x.id === s.choice);
      if (!o || s.done[t.id] || (o.needId && !s.idOk)) return null;
      return { done: { ...s.done, [t.id]: { act: o.act, reason: o.reason, note: String(s.note || '').trim() } } };
    });
    // 重复核销一律拦截：没有放行入口，只记录拦截结果
    const recordDup = () => this.setState((s) => {
      if (s.type !== 'duplicate' || s.done.duplicate) return null;
      return { done: { ...s.done, duplicate: { act: '拦截，不予入场', reason: '重复核销（该凭证已于 14:02 核销）', note: '' } } };
    });
    let hint = '提交后记录操作人、时间与处理方式，不能重复提交';
    if (isDup) hint = '记录拦截结果后返回核销工作台';
    else if (!opt) hint = '请选择处理方式';
    else if (opt.needId && !idOk) hint = '放行前需先勾选“已人工核验身份”';
    return {
      types,
      heroBg: isDup ? '#fdecec' : '#fff3e8',
      heroStroke: isDup ? '#e5484d' : '#ff6a00',
      heroPath: isDup ? 'M7 7l10 10M17 7L7 17' : 'M10.3 4.6L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0zM12 9.5v4.5M12 17.5h.01',
      heroTitle: cur.title,
      heroSub: cur.sub,
      rows,
      fact: cur.fact,
      factBg: isDup ? '#fdecec' : '#fff3e8',
      factC: isDup ? '#e5484d' : '#d94f00',
      showForm: isWarn && !isDone,
      options,
      idOk,
      idBd: idOk ? '#ff6a00' : '#ebedf0',
      idBg: idOk ? '#fffaf5' : '#fff',
      toggleId: () => this.setState((s) => ({ idOk: !s.idOk })),
      note,
      setNote: (e) => this.setState({ note: e && e.target ? String(e.target.value || '') : '' }),
      showDupNotice: isDup && !isDone,
      isDone,
      doneAct: rec ? rec.act : '',
      doneReason: rec ? rec.reason : '',
      doneNote: rec ? rec.note : '',
      showFooter: !isDone,
      hint,
      hintC: ready || isDup ? '#8a8f97' : '#d94f00',
      isWarn,
      isDup,
      confirmOff: !ready,
      confirmBg: ready ? '#ff6a00' : '#c4c8ce',
      confirm,
      recordDup
    };
  }
}
</script>
</body>
</html>
