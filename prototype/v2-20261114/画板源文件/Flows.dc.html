<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>业务闭环与页面流</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 1600px; height: 1040px; box-sizing: border-box; padding: 56px 64px; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 36px; font-weight: 700;">四条业务链路 → 页面流</h1>
    <p style="margin: 0; font-size: 17px; color: #555a62;">每条链路标注对应的 UI 图编号（A–I）；订单分三类管理，支付、退款、核销各自保留状态；本期不建结算状态，对账导出在后台。</p>
  </div>

  <sc-for list="{{flows}}" as="f" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 12px; background: #fff; border: 1px solid #ebedf0; border-radius: 16px; padding: 20px 24px;">
      <div style="display: flex; align-items: baseline; gap: 14px;">
        <div style="font-size: 20px; font-weight: 700;">{{f.name}}</div>
        <div style="font-size: 14px; color: #666b73;">{{f.note}}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <sc-for list="{{f.steps}}" as="s" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; min-width: 120px; border-radius: 10px; background: {{s.bg}}; border: 1px solid {{s.bd}};">
              <div style="font-size: 15px; font-weight: 500;">{{s.t}}</div>
              <div style="font-size: 12px; color: #666b73;">{{s.p}}</div>
            </div>
            <sc-if value="{{s.arrow}}" hint-placeholder-val="{{true}}">
              <svg width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="#c4c8ce" stroke-width="2" aria-hidden="true"><path d="M1 7h18M14 2l5 5-5 5"></path></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
    <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 16px 20px; font-size: 14px; line-height: 1.7;"><b>实物商品</b>　待付款 → 待发货 → 已发货 → 已收货 → 已完成</div>
    <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 16px 20px; font-size: 14px; line-height: 1.7;"><b>服务及合同</b>　待报价 → 待确认 → 待履约 → 履约中 → 待验收 → 已完成（付款节点单列，由统一交易模块处理；沿用巡检状态机与幂等约束）</div>
    <div style="background: #fff; border: 1px solid #ebedf0; border-radius: 12px; padding: 16px 20px; font-size: 14px; line-height: 1.7;"><b>活动报名</b>　待付款 → 报名成功 → 待参加 → 已签到 → 已完成</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (arr) => arr.map((s, i) => ({
      t: s[0], p: s[1],
      bg: s[2] ? '#fff3e8' : '#f7f8fa',
      bd: s[2] ? '#ffd2b0' : '#ebedf0',
      arrow: i < arr.length - 1
    }));
    return {
      flows: [
        { name: '设备与标准服务', note: '先体验，再决定是否购买', steps: mk([
          ['首页频道 / 搜索', 'A1 · B1 · B3', 0], ['商品详情', 'PD1 · 选择经营商家', 1], ['线上体验', 'EX2–EX3 · 仿真/演示', 1], ['收藏·对比·预约线下', '用户自主决定', 0], ['下单支付', '按经营主体拆单', 0], ['发货 / 核销', '物流或场馆', 0], ['收货·售后·对账', 'H 我的；对账在后台（对账导出）', 0]
        ]) },
        { name: '非标准需求', note: '企业采购与商业服务；巡检 M04–M07 为本流程样板', steps: mk([
          ['提交需求', '首页频道 · 专业服务', 0], ['定向服务商响应', '授权城市内', 0], ['报价比选', 'G', 1], ['确认范围与合同', '版本化方案', 0], ['按节点付款', '统一交易模块 · 主用渠道回执', 0], ['履约', '进度可追溯', 0], ['成果验收', '受控交付文件', 0]
        ]) },
        { name: '赛事与教育活动', note: '账户 ≠ 参与人，家长可代报多名孩子', steps: mk([
          ['发现内容 / 首页活动频道', '发现 · 推广归因', 0], ['活动详情', '场次·名额·退改', 0], ['报名与支付', 'F · 选参与人', 1], ['通知与签到', '二维码核销', 0], ['活动交付', '成绩/结业记录', 0], ['评价与推荐', '关联器材课程', 0]
        ]) },
        { name: '城市复制', note: '同一系统配置开城，不另写单城系统', steps: mk([
          ['合作确认', '场馆·分工', 0], ['开通城市空间', '品牌·角色', 0], ['加载授权资源', '共享 + 本地', 0], ['配置商品与场馆', '经营产品包', 0], ['首单 / 首场验证', '真实业务', 0], ['运营复盘', 'I 城市看板', 1]
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
