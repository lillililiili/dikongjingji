<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 12px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <button style="display: flex; align-items: center; gap: 2px; border: 0; background: none; padding: 0; min-height: 44px; font: inherit; font-size: 20px; font-weight: 700; color: #191919;">东营<svg width="16" height="16" viewBox="0 0 24 24" fill="#191919" aria-hidden="true"><path d="M6 9l6 6 6-6z"></path></svg></button>
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #191919; background: #fff;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666b73" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>

        <div style="font-size: 12px; color: #d94f00; font-weight: 500;">东营低空体验季</div>
        <div style="font-size: 21px; font-weight: 700; line-height: 1.3;">先体验，再决定</div>

      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; background: #fff; border-radius: 14px; padding: 14px 6px;">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="8">
        <a href="{{e.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #191919;">
          <div style="width: 44px; height: 44px; border-radius: 14px; background: {{e.bg}}; display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{e.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.d}}"></path></svg>
          </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">

        <h2 style="margin: 0; font-size: 17px; font-weight: 700;">近期活动</h2>
        <a href="Discover.dc.html" style="font-size: 13px; color: #666b73; text-decoration: none;">全部活动 ›</a>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="Signup.dc.html" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 12px; padding: 12px; text-decoration: none; color: #191919;">
          <span style="align-self: flex-start; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #fff3e8; color: #d94f00;">赛事</span>
          <span style="font-size: 15px; font-weight: 500; line-height: 1.35;">青少年无人机编程挑战赛</span>
          <span style="font-size: 12px; color: #666b73;">11月15日 · 东营体验馆</span>
          <span style="font-size: 12px; color: #19b866;">余 12 个名额</span>

        <a href="Signup.dc.html" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 12px; padding: 12px; text-decoration: none; color: #191919;">
          <span style="align-self: flex-start; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #e8f7ef; color: #11804a;">研学</span>
          <span style="font-size: 15px; font-weight: 500; line-height: 1.35;">机器人周末研学营</span>
          <span style="font-size: 12px; color: #666b73;">每周六 · 2 场次</span>
          <span style="font-size: 12px; color: #19b866;">可候补</span>
        </a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700;">附近体验馆</h2>
      <div style="display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 12px; padding: 12px;">
        <img src="/_blob/e42bb39cca5b4f528e6577da8445bced" alt="体验馆外景" style="width: 76px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <div style="font-size: 15px; font-weight: 500;">东营低空与机器人体验馆</div>
          <div style="font-size: 12px; color: #666b73;">09:30–18:00 · 模拟飞行 · 机器人编程</div>
          <div style="font-size: 12px; color: #666b73;">距你 2.3km</div>
        </div>
        <button style="flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #ff6a00; background: #fff; color: #d94f00; font: inherit; font-size: 13px;">预约</button>
      </div>
    </div>
  </div>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; background: #fff; border-top: 1px solid #ebedf0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.c}}; font-size: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
