<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页·体验频道</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 0 10px; background: linear-gradient(180deg, #fff3e8 0%, #fff8f2 70%, #f7f8fa 100%);">
    <div style="position: relative; display: flex; align-items: center; gap: 2px; padding-left: 14px; overflow: hidden;">
      <a href="CitySheet.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; min-height: 40px; margin-right: 6px; font-size: 16px; font-weight: 700; color: #191919; text-decoration: none;">{{city}}<svg width="14" height="14" viewBox="0 0 24 24" fill="#191919" aria-hidden="true"><path d="M6 9l6 6 6-6z"></path></svg></a>
      <span style="flex-shrink: 0; width: 1px; height: 16px; margin-right: 2px; background: #e8d5c4;"></span>
      <sc-for list="{{channels}}" as="ch" hint-placeholder-count="8">
        <a href="{{ch.href}}" style="flex-shrink: 0; position: relative; display: flex; align-items: center; min-height: 40px; padding: 0 9px; color: {{ch.c}}; font-size: {{ch.fs}}; font-weight: {{ch.w}}; text-decoration: none; white-space: nowrap;">{{ch.label}}<sc-if value="{{ch.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 3px; width: 16px; height: 3px; margin-left: -8px; border-radius: 3px; background: #ff6a00;"></span></sc-if></a>
      </sc-for>
      <span style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, rgba(255,243,232,0), #fff3e8);"></span>
    </div>
    <div style="padding: 0 16px;">
      <div style="display: flex; align-items: center; height: 40px; padding: 0 4px 0 0; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff;">
        <a href="Scan.dc.html" aria-label="扫一扫" style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 44px; margin: -2px 0; padding: 0 8px 0 12px; text-decoration: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>
          <span style="width: 1px; height: 16px; background: #ebedf0;"></span>
        </a>
        <a href="SearchPre.dc.html" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; text-decoration: none;">
          <span style="flex-grow: 1; min-width: 0; font-size: 14px; color: #8a8f97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{placeholder}}</span>
          <span style="flex-shrink: 0; height: 32px; padding: 0 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center;">搜索</span>
        </a>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 0;">
    <div style="flex-shrink: 0; display: flex; gap: 8px;">
      <button type="button" onClick="{{online.pick}}" aria-pressed="{{online.on}}" style="flex: 1 1 0; height: 40px; margin: 0; padding: 0; box-sizing: border-box; border-radius: 10px; border: 1px solid {{online.bd}}; background: {{online.bg}}; color: {{online.fg}}; font: inherit; font-size: 15px; font-weight: {{online.w}}; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer;">线上体验 · 不出门</button>
      <button type="button" onClick="{{offline.pick}}" aria-pressed="{{offline.on}}" style="flex: 1 1 0; height: 40px; margin: 0; padding: 0; box-sizing: border-box; border-radius: 10px; border: 1px solid {{offline.bd}}; background: {{offline.bg}}; color: {{offline.fg}}; font: inherit; font-size: 15px; font-weight: {{offline.w}}; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer;">线下体验 · 到场馆</button>
    </div>

    <sc-if value="{{isOnline}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; gap: 6px;">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex-shrink: 0; position: relative; height: 30px; margin: 0; padding: 0 9px; box-sizing: border-box; border: 0; border-radius: 999px; font: inherit; font-size: 13px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; white-space: nowrap; cursor: pointer;">{{t.l}}<span aria-hidden="true" style="position: absolute; left: -3px; right: -3px; top: -5px; bottom: -5px;"></span></button>
      </sc-for>
    </div>
    </sc-if>

    <div style="flex-shrink: 0; display: flex; align-items: center; height: 20px;">
      <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">体验结束不会自动下单</span>
      <a href="ExpRecords.dc.html" style="margin-left: auto; font-size: 13px; line-height: 18px; color: #d94f00; text-decoration: none; white-space: nowrap;">我的体验记录 ›</a>
    </div>

    <sc-if value="{{isOnline}}" hint-placeholder-val="{{true}}">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{items}}" as="e" hint-placeholder-count="3">
        <a href="{{e.href}}" style="display: flex; flex-direction: column; background: #fff; border-radius: 14px; overflow: hidden; text-decoration: none; color: #191919;">
          <div style="height: 74px; position: relative;">
            <img src="{{e.img}}" alt="{{e.t}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{e.pos}}; display: block;">
            <span style="position: absolute; left: 10px; top: 10px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #fff; color: {{e.lc}}; font-weight: 500;">{{e.label}}</span>
          </div>
          <div style="padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 15px; line-height: 20px; font-weight: 700;">{{e.t}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #666b73;">{{e.meta}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #555a62;">关联：{{e.rel}}</span>
          </div>
        </a>
      </sc-for>
      <sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; justify-content: center; height: 120px; background: #fff; border-radius: 14px; font-size: 14px; line-height: 20px; color: #8a8f97; white-space: nowrap;">暂无该类体验</div>
      </sc-if>
    </div>

    <a href="VenueDetail.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; background: #fff; border-radius: 12px; text-decoration: none; color: #191919;">
      <img src="/_blob/e42bb39cca5b4f528e6577da8445bced" alt="东营低空与机器人体验馆" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex-shrink: 0; display: block;">
      <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="font-weight: 500;">东营低空与机器人体验馆</span><span style="color: #11804a;"> · 今日 3 场可约</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
    </sc-if>

    <sc-if value="{{isOffline}}" hint-placeholder-val="{{false}}">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{venues}}" as="v" hint-placeholder-count="2">
        <a href="VenueDetail.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 10px; background: #fff; border-radius: 12px; text-decoration: none; color: #191919;">
          <img src="{{v.img}}" alt="{{v.name}}" style="width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; display: block;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{v.name}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #666b73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{v.hours}}<sc-if value="{{v.avail}}" hint-placeholder-val="{{true}}"><span style="color: #11804a;">{{v.availText}}</span></sc-if></span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>
    </sc-if>
  </div>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; background: #fff; border-top: 1px solid #ebedf0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.c}}; font-size: 12px; font-weight: {{t.w}};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 4px; left: 50%; margin-left: 5px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #ff5200; color: #fff; font-size: 11px; line-height: 16px; text-align: center;">{{t.badge}}</span>
        </sc-if>
        <sc-if value="{{t.dot}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 7px; left: 50%; margin-left: 9px; width: 8px; height: 8px; border-radius: 50%; background: #ff5200;"></span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { mode: 'online', type: '全部' };
  }
  renderVals() {
    const { mode, type } = this.state;
    const ACTIVE_CHANNEL = '体验';
    const city = '东营';
    const placeholder = '搜索体验项目或场馆';
    const channels = [
      ['推荐', 'HomeFull.dc.html'], ['专业服务', 'HomeSvc.dc.html'], ['活动', 'HomeAct.dc.html'], ['体验', 'ExpCenter.dc.html'],
      ['商城', 'MallHome.dc.html']
    ].map(([label, href]) => {
      const on = label === ACTIVE_CHANNEL;
      return { label, href, on, c: on ? '#ff6a00' : '#191919', fs: on ? '18px' : '15px', w: on ? 700 : 400 };
    });

    const ACTIVE = 0; // 0 首页 1 发现 2 消息 3 购物车 4 我的
    const tabs = [
      ['首页', 'HomeFull.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', '', false],
      ['发现', 'Discover.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z', '', true],
      ['消息', 'Messages.dc.html', 'M4 5h16v11H9l-5 4zM8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01', '3', false],
      ['购物车', 'Cart.dc.html', 'M3 4h2l2 11h11l2-8H6M9 20a1 1 0 1 0 0-.1M17 20a1 1 0 1 0 0-.1', '3', false],
      ['我的', 'Mine.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6', '', false]
    ].map((t, i) => ({ label: t[0], href: t[1], d: t[2], badge: t[3], dot: t[4] && i !== ACTIVE, c: i === ACTIVE ? '#ff6a00' : '#8a8f97', w: i === ACTIVE ? 500 : 400 }));

    // 线上体验 / 线下体验切换，选中为浅橙底
    const isOnline = mode === 'online';
    const modeStyle = (on, id) => ({
      on, bd: on ? '#ffd8b8' : '#ebedf0', bg: on ? '#fff3e8' : '#fff', fg: on ? '#d94f00' : '#555a62', w: on ? 700 : 400,
      pick: () => this.setState({ mode: id })
    });
    const online = modeStyle(isOnline, 'online');
    const offline = modeStyle(!isOnline, 'offline');

    // 线上：按体验形式筛选卡片；没有该类卡片时显示“暂无该类体验”
    const types = ['全部', '虚拟仿真', '录播演示', '软件试用', '课程试听'].map((l) => {
      const on = l === type;
      return { l, on, bg: on ? '#191919' : '#fff', fg: on ? '#fff' : '#191919', pick: () => this.setState({ type: l }) };
    });
    const allItems = [
      { type: '虚拟仿真', label: '虚拟仿真 · 不连接真实设备', lc: '#11804a', t: '机器人避障模拟', meta: '约 3 分钟 · 免登录可试 · 手机即可', rel: '编程机器人探索套装', img: '/_blob/192fc8acf4d61dc58d9c5109a1cad0da', pos: 'center 45%', href: 'ExpSim.dc.html' },
      { type: '虚拟仿真', label: '虚拟仿真 · 不连接真实设备', lc: '#11804a', t: '无人机起降与悬停', meta: '约 4 分钟 · 免登录可试', rel: '教育编程无人机套装', img: '/_blob/b41e3fb34601d5b9b3c9e40e84d2a489', pos: 'center 25%', href: 'ExpSim.dc.html' },
      { type: '录播演示', label: '录播演示 · 厂家录制', lc: '#1d63c4', t: '3 分钟看懂编程机器人', meta: '视频 3:12 · 示例机器人商家', rel: '编程机器人探索套装', img: '/_blob/d7f749aa0af5b1d1784040d2a816e2f0', pos: 'center 40%', href: 'ContentVideo.dc.html' },
      { type: '软件试用', label: '软件试用 · 隔离环境', lc: '#1d63c4', t: '图形化编程软件试用', meta: '单次 25 分钟 · 登录后可试 · 手机即可', rel: '编程机器人探索套装', img: '/_blob/85dbe79468bbacd46343cf281dfb4e4b', pos: 'center 40%', href: 'SoftwareTrial.dc.html' },
      { type: '课程试听', label: '课程试听 · 线上录播', lc: '#11804a', t: '无人机飞行原理（试听）', meta: '试听 2 课 · 手机即可', rel: '教育编程无人机套装', img: '/_blob/b41e3fb34601d5b9b3c9e40e84d2a489', pos: 'center 60%', href: 'ContentVideo.dc.html' }
    ];
    // “全部”在这张 844 高的画板上只放得下前 3 张，软件试用和试听卡在正式页面里向下滑动可见；点“软件试用”“课程试听”能直接筛到
    const items = type === '全部' ? allItems.slice(0, 3) : allItems.filter((e) => e.type === type);
    const noItems = items.length === 0;

    // 线下：到馆体验场馆，点击进入场馆详情与场次预约
    const venues = [
      { name: '东营低空与机器人体验馆', hours: '09:30–18:00', avail: '今日 3 场可约', availText: ' · 今日 3 场可约', img: '/_blob/e42bb39cca5b4f528e6577da8445bced' },
      { name: '黄河口户外飞行营地', hours: '周六开放', avail: '', availText: '', img: '/_blob/248020917b29731ae2eb5c415d406dd0' }
    ];

    return { city, placeholder, channels, tabs, online, offline, isOnline, isOffline: !isOnline, types, items, noItems, venues };
  }
}
</script>
</body>
</html>
