<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核销工作台</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 900px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap;">核销工作台</h1>
    <a href="Mine.dc.html" style="margin-left: auto; min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; color: #555a62; text-decoration: none; white-space: nowrap;">退出工作模式</a>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;">
      <span style="height: 26px; padding: 0 10px; border-radius: 6px; background: #e8f7ef; color: #11804a; font-size: 13px; line-height: 26px; white-space: nowrap;">核销员 李员 · 示例低空与机器人体验馆</span>
      <span style="font-size: 12px; line-height: 17px; color: #8a8f97;">仅能核销本场馆场次，服务端校验场馆与场次归属</span>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 2px 14px 12px; border-radius: 14px; background: #fff;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px;">
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap;">今日场次</h2>
        <span style="font-size: 13px; line-height: 18px; color: #8a8f97; white-space: nowrap;">11/03 周二</span>
      </div>
      <sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
        <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px 0;">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="width: 100%; margin: 0; padding: 8px 12px; box-sizing: border-box; border: 1.5px solid #ff6a00; border-radius: 12px; background: #fffaf5; font: inherit; color: #191919; text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer;">
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 15px; line-height: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.name}}</span>
                <span style="font-size: 13px; line-height: 18px; color: #555a62; white-space: nowrap;">{{s.sub}}</span>
              </span>
              <span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                <span style="height: 28px; line-height: 28px; white-space: nowrap;"><span style="font-size: 24px; font-weight: 700; color: {{s.numC}};">{{s.done}}</span> <span style="font-size: 15px; color: #8a8f97;">/ {{s.total}}</span></span>
                <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap;">{{s.unit}}</span>
              </span>
            </button>
            <div style="height: 6px; border-radius: 3px; background: #f0f1f3; overflow: hidden;"><div style="width: {{s.pct}}; height: 6px; border-radius: 3px; background: {{s.barC}};"></div></div>
          </div>
        </sc-if>
        <sc-if value="{{s.off}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="width: 100%; min-height: 40px; margin: 0; padding: 0 2px; box-sizing: border-box; border: 0; background: transparent; font: inherit; color: #191919; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.time}} {{s.name}}</span>
            <span style="flex-shrink: 0; height: 22px; padding: 0 6px; border-radius: 6px; background: {{s.tagBg}}; color: {{s.tagC}}; font-size: 12px; line-height: 22px; white-space: nowrap;">{{s.status}}</span>
            <span style="flex-shrink: 0; min-width: 44px; font-size: 14px; line-height: 20px; color: #555a62; text-align: right; white-space: nowrap;">{{s.done}} / {{s.total}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px;">
      <button type="button" onClick="{{scan}}" style="width: 120px; height: 120px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: linear-gradient(160deg, #ff9a3c 0%, #ff6a00 70%); box-shadow: 0 10px 24px rgba(255,106,0,0.28); color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>
        <span style="font-size: 17px; line-height: 24px; font-weight: 700; white-space: nowrap;">扫码核销</span>
        <span style="font-size: 12px; line-height: 17px; white-space: nowrap;">14:00 场</span>
      </button>
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
        <button type="button" onClick="{{toggleManual}}" aria-expanded="{{showManual}}" style="min-height: 44px; margin: 0; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #555a62; display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 10.5h.01M10.5 10.5h.01M14 10.5h.01M17.5 10.5h.01M8 14h8"></path></svg>{{manualLabel}}</button>
        <span style="width: 1px; height: 14px; background: #dcdfe4;"></span>
        <a href="StaffException.dc.html" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #555a62; text-decoration: none; white-space: nowrap;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.6L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0zM12 9.5v4.5M12 17.5h.01"></path></svg>异常登记</a>
      </div>
    </div>

    <sc-if value="{{showManual}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; background: #fff;">
        <input type="text" value="{{code}}" onChange="{{setCode}}" placeholder="输入凭证号" aria-label="凭证号" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; margin: 0; padding: 0 12px; border: 1px solid #ebedf0; border-radius: 8px; background: #f7f8fa; font: inherit; font-size: 14px; color: #191919;">
        <button type="button" onClick="{{submitCode}}" disabled="{{codeEmpty}}" style="flex-shrink: 0; height: 44px; margin: 0; padding: 0 18px; border: 0; border-radius: 8px; background: {{codeBg}}; color: #fff; font: inherit; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer;">核销</button>
      </div>
    </sc-if>

    <sc-if value="{{showOk}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #c9eed9; background: #fff;">
        <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #e8f7ef; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#19b866" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="font-size: 16px; line-height: 22px; font-weight: 700; color: #11804a; white-space: nowrap;">核销成功</span>
            <span style="font-size: 13px; line-height: 18px; color: #8a8f97; white-space: nowrap;">14:05</span>
          </div>
          <span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">王女士 · 机器人避障闯关 14:00 场</span>
          <span style="font-size: 13px; line-height: 18px; color: #555a62; white-space: nowrap;">1 人 · 已支付 ¥39</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showErr}}" hint-placeholder-val="{{false}}">
      <div role="status" style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #f6c4c6; background: #fff;">
        <span style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #fdecec; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span style="font-size: 16px; line-height: 22px; font-weight: 700; color: #e5484d; white-space: nowrap;">核销失败</span>
            <a href="StaffException.dc.html" style="min-height: 44px; margin: -6px 0; padding-left: 8px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #d94f00; text-decoration: none; white-space: nowrap;">去异常处理 ›</a>
          </div>
          <span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">场次不符：凭证为 15:30 机器人闯关场</span>
        </div>
      </div>
    </sc-if>

    <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px;">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 24px; font-weight: 700; white-space: nowrap;"><span style="width: 4px; height: 16px; border-radius: 2px; background: #ff6a00;"></span>最近核销</h2>
      <a href="StaffRecords.dc.html" style="display: flex; align-items: center; min-height: 44px; margin: -4px 0; padding: 0 0 0 8px; font-size: 13px; color: #666b73; white-space: nowrap; text-decoration: none;">全部记录 ›</a>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px; border-radius: 14px; background: #fff;">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box; border-top: 1px solid {{r.bd}};">
          <span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #19b866; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; line-height: 21px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #8a8f97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.sub}}</span>
          </span>
          <span style="flex-shrink: 0; height: 24px; padding: 0 8px; border-radius: 6px; background: #e8f7ef; color: #11804a; font-size: 12px; line-height: 24px; white-space: nowrap;">已核销</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // sel 选中查看的场次；scans 扫码次数（第 1 次核销成功，第 2 次起是场次不符）；manual 手动输入行是否展开；code 输入的凭证号
    this.state = { sel: 's1400', scans: 0, manual: false, code: '' };
  }
  renderVals() {
    const { sel, scans, manual, code } = this.state;
    // 扫码只核销进行中的 14:00 场；场馆与场次归属由服务端校验，这里只演示结果
    const done1400 = scans >= 1 ? 4 : 3;
    const tone = {
      ended: { status: '已结束', tagBg: '#f2f3f5', tagC: '#8a8f97', numC: '#11804a', barC: '#19b866' },
      live: { status: '进行中', tagBg: '#fff3e8', tagC: '#d94f00', numC: '#ff6a00', barC: '#ff6a00' },
      soon: { status: '未开始', tagBg: '#eaf2fd', tagC: '#1d63c4', numC: '#555a62', barC: '#2f80ed' }
    };
    const sessions = [
      { id: 's1000', time: '10:00', name: '模拟飞行', kind: 'ended', done: 6, total: 6, unit: '到场 / 应到' },
      { id: 's1400', time: '14:00', name: '机器人避障闯关', kind: 'live', done: done1400, total: 8, unit: '已核销 / 应到' },
      { id: 's1530', time: '15:30', name: '机器人闯关', kind: 'soon', done: 0, total: 2, unit: '已核销 / 应到' }
    ].map((s) => {
      const t = tone[s.kind];
      const on = s.id === sel;
      return {
        ...s,
        ...t,
        on,
        off: !on,
        sub: s.time + ' 场 · ' + t.status,
        pct: Math.round((s.done / s.total) * 1000) / 10 + '%',
        pick: () => this.setState({ sel: s.id })
      };
    });
    // 最近核销：初始两条合计 3 人，与 14:00 场“已核销 3”一致；核销成功后王女士排在最前（合计 4 人）
    const earlier = [
      { title: '李** · 1 人', sub: '14:02 · 机器人避障闯关 14:00 场' },
      { title: '赵** · 2 人', sub: '14:01 · 机器人避障闯关 14:00 场' }
    ];
    const list = scans >= 1 ? [{ title: '王女士 · 1 人', sub: '14:05 · 机器人避障闯关 14:00 场' }].concat(earlier) : earlier;
    const recent = list.map((r, i) => ({ ...r, bd: i === 0 ? 'transparent' : '#f0f1f3' }));
    const doScan = () => this.setState((s) => ({ scans: s.scans + 1, sel: 's1400', manual: false, code: '' }));
    const codeEmpty = !String(code).trim();
    return {
      sessions,
      recent,
      scan: doScan,
      toggleManual: () => this.setState((s) => ({ manual: !s.manual, code: '' })),
      manualLabel: manual ? '收起手动输入' : '手动输入凭证号',
      showManual: manual,
      code,
      setCode: (e) => this.setState({ code: e && e.target ? String(e.target.value || '') : '' }),
      codeEmpty,
      codeBg: codeEmpty ? '#c4c8ce' : '#ff6a00',
      // 手动输入的“核销”与扫码走同一套服务端校验
      submitCode: () => { if (String(this.state.code).trim()) doScan(); },
      // 结果卡与手动输入行共用一个位置：展开输入时暂不显示上一次结果
      showOk: !manual && scans === 1,
      showErr: !manual && scans >= 2
    };
  }
}
</script>
</body>
</html>
