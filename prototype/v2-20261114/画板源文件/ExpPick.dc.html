<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择体验形式</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <img src="/_blob/85dbe79468bbacd46343cf281dfb4e4b" alt="" style="width: 100%; height: 300px; object-fit: cover; display: block;">
  <a href="PdFull.dc.html" aria-label="关闭" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45);"></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 600px; background: #fff; border-radius: 20px 20px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; padding: 14px 16px 4px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700;">选择体验方式</h2>
        <span style="font-size: 12px; color: #666b73;">编程机器人探索套装 · 体验结束不会自动下单</span>
      </div>
      <a href="PdFull.dc.html" aria-label="关闭" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="flex-grow: 1; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{ways}}" as="w" hint-placeholder-count="3">
        <a href="{{w.href}}" style="display: flex; gap: 12px; padding: 14px; border-radius: 12px; border: 1.5px solid {{w.bd}}; text-decoration: none; color: #191919;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: {{w.ibg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{w.ifg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.d}}"></path></svg>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 16px; font-weight: 700;">{{w.t}}</span>
              <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: {{w.ibg}}; color: {{w.ifg}};">{{w.kind}}</span>
            </div>
            <span style="font-size: 13px; color: #555a62; line-height: 1.5;">{{w.desc}}</span>
            <span style="font-size: 12px; color: #666b73;">{{w.meta}}</span>
          </div>
          <span style="align-self: center; font-size: 14px; font-weight: 700; color: {{w.pc}};">{{w.price}}</span>
        </a>
      </sc-for>
      <div style="padding: 12px; border-radius: 10px; background: #f7f8fa; font-size: 12px; color: #555a62; line-height: 1.7;">
        三种方式在页面和记录中分别标注，不混称“真机体验”。<br>到馆体验按场馆标价单独付费，与商品订单分开。
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ways = [
      { t: '虚拟仿真', kind: '不连接真实设备', desc: '在手机上完成避障小任务，了解编程方式', meta: '约 3 分钟 · 免登录可试', price: '免费', pc: '#11804a', href: 'ExpSim.dc.html', bd: '#ff6a00', ibg: '#e8f7ef', ifg: '#11804a', d: 'M4 5h16v11H4zM8 20h8M12 16v4M10 8.5l4 2.5-4 2.5z' },
      { t: '录播演示', kind: '厂家录制视频', desc: '真机实拍的功能演示，可拖动查看', meta: '3:12 · 示例机器人商家', price: '免费', pc: '#11804a', href: 'ContentVideo.dc.html', bd: '#ebedf0', ibg: '#eaf2fd', ifg: '#1d63c4', d: 'M5 5h14v14H5zM10 9l5 3-5 3z' },
      { t: '到馆体验', kind: '真机 · 工作人员陪同', desc: '示例体验馆 · 机器人避障闯关', meta: '今天 14:00 余 5 · 3.2km', price: '¥39', pc: '#e85400', href: 'VenueDetail.dc.html', bd: '#ebedf0', ibg: '#fff3e8', ifg: '#d94f00', d: 'M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5' }
    ];
    return { ways };
  }
}
</script>
</body>
</html>
