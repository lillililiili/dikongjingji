<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>仿真任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="ExpPick.dc.html" aria-label="退出体验" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap;">{{title}}</h1>
    <span style="margin-left: auto; margin-right: 8px; font-size: 15px; font-weight: 700;">01:48</span>
  </div>
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; background: #fff;">
    <span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f7ef; color: #11804a;">虚拟仿真 · 不连接真实设备</span>
    <span style="margin-left: auto; font-size: 12px; color: #555a62; white-space: nowrap;">{{level}}</span>
  </div>

  <div style="position: relative; height: 330px; flex-shrink: 0;">
    <img src="{{img}}" alt="{{imgAlt}}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    <span style="position: absolute; left: 12px; top: 12px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.9);">模拟场景</span>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px;">
      <span style="flex: 1 1 0; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.92); font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{stat1}}</span>
      <span style="flex: 1 1 0; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.92); font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{stat2}}</span>
    </div>
  </div>

  <div style="flex-grow: 1; background: #fff; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;">
    <div style="display: flex; align-items: baseline;">
      <span style="font-size: 15px; font-weight: 700;">拼出你的程序</span>
      <span style="margin-left: 8px; font-size: 12px; color: #666b73;">点积木加入，点程序里的积木删除</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 92px; padding: 10px; border-radius: 10px; background: #f7f8fa; align-content: flex-start;">
      <sc-for list="{{prog}}" as="b" hint-placeholder-count="4">
        <button type="button" onClick="{{b.remove}}" aria-label="删除积木 {{b.t}}" style="margin: -4px; padding: 4px; border: 0; background: transparent; font: inherit; display: flex; cursor: pointer;"><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: {{b.bg}}; color: #fff; font-size: 13px; font-weight: 500; display: flex; align-items: center;">{{b.t}}</span></button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{palette}}" as="b" hint-placeholder-count="4">
        <button type="button" onClick="{{b.add}}" disabled="{{b.dis}}" aria-label="加入积木 {{b.t}}" style="box-sizing: content-box; margin: 0; padding: 0; height: 40px; border-radius: 8px; border: 1.5px solid {{b.bg}}; background: #fff; color: {{b.fg}}; font: inherit; font-size: 13px; opacity: {{b.op}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">{{b.t}}</button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; gap: 10px; padding-bottom: 14px;">
      <button type="button" onClick="{{reset}}" style="box-sizing: content-box; margin: 0; padding: 0; width: 110px; height: 46px; border-radius: 999px; border: 1px solid #c4c8ce; background: #fff; color: #191919; font: inherit; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;">重置</button>
      <a href="ExpResult.dc.html" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">运行程序</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"enum","options":["机器人避障模拟","无人机起降与悬停"],"default":"机器人避障模拟"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // D7 的两个仿真模板（机器人避障、无人机起降）共用这一个容器，只换任务配置，用 Tweaks 的 frame 切
    // from：程序被改动时所在的帧；prog：该帧下拼出的程序。换帧后回到新帧的默认程序
    this.state = { from: '', prog: null };
  }
  renderVals() {
    const frame = this.props.frame ?? '机器人避障模拟';
    const c = { move: '#ff6a00', turn: '#2f80ed', sense: '#19b866', throttle: '#ff6a00', takeoff: '#2f80ed', hover: '#19b866', land: '#2f80ed' };
    const tasks = {
      机器人避障模拟: {
        title: '机器人避障模拟', level: '关卡 2 / 3', img: '/_blob/192fc8acf4d61dc58d9c5109a1cad0da', imgAlt: '仿真场景',
        stat1: '已绕过 2 个障碍', stat2: '碰撞 0 次',
        prog: [{ k: 'move', t: '前进 2 格' }, { k: 'sense', t: '如果 前方有障碍' }, { k: 'turn', t: '右转 90°' }, { k: 'move', t: '前进 1 格' }],
        palette: [{ k: 'move', t: '前进', fg: '#d94f00' }, { k: 'turn', t: '左转', fg: '#1d63c4' }, { k: 'turn', t: '右转', fg: '#1d63c4' }, { k: 'sense', t: '如果…', fg: '#11804a' }]
      },
      无人机起降与悬停: {
        title: '无人机起降与悬停', level: '关卡 1 / 3', img: '/_blob/b41e3fb34601d5b9b3c9e40e84d2a489', imgAlt: '无人机仿真场景',
        stat1: '高度 1.2 m · 目标 1.5 m', stat2: '偏移 0.3 m',
        prog: [{ k: 'takeoff', t: '起飞' }, { k: 'throttle', t: '油门 +10%' }, { k: 'hover', t: '悬停 3 秒' }, { k: 'land', t: '降落' }],
        palette: [{ k: 'throttle', t: '油门', fg: '#d94f00' }, { k: 'takeoff', t: '起飞', fg: '#1d63c4' }, { k: 'hover', t: '悬停', fg: '#11804a' }, { k: 'land', t: '降落', fg: '#1d63c4' }]
      }
    };
    const task = tasks[frame] || tasks['机器人避障模拟'];
    const progList = this.state.from === frame && this.state.prog ? this.state.prog : task.prog;
    // 程序区最多 12 块：再多会把底部“重置 / 运行程序”挤出画板，满了以后积木栏变灰不可点
    const MAX_BLOCKS = 12;
    const full = progList.length >= MAX_BLOCKS;
    const prog = progList.map((b, i) => ({
      t: b.t,
      bg: c[b.k],
      remove: () => this.setState({ from: frame, prog: progList.filter((_, j) => j !== i) })
    }));
    const palette = task.palette.map((b) => ({
      t: b.t,
      bg: c[b.k],
      fg: b.fg,
      dis: full,
      op: full ? 0.4 : 1,
      add: () => { if (!full) this.setState({ from: frame, prog: progList.concat({ k: b.k, t: b.t }) }); }
    }));
    return {
      title: task.title, level: task.level, img: task.img, imgAlt: task.imgAlt, stat1: task.stat1, stat2: task.stat2,
      prog, palette,
      reset: () => this.setState({ from: frame, prog: [] })
    };
  }
}
</script>
</body>
</html>
