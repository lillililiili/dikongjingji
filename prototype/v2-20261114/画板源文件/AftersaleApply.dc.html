<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>申请售后</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 870px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="OrderGoods.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">申请售后</h1>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px; background: #fff; border-radius: 14px;">
      <img src="/_blob/5d32505e8b9a494f8436e31c3008ef99" alt="编程机器人探索套装" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px; font-weight: 700; line-height: 21px;">编程机器人探索套装</span>
        <span style="font-size: 13px; line-height: 18px; color: #666b73;">标准套装（1 台 + 数字课程）× 1</span>
        <span style="font-size: 13px; line-height: 18px; color: #666b73;">实付 ¥1,299 · 11/03 已发货</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">选择售后类型</h2>
      <div role="radiogroup" aria-label="售后类型" style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{types}}" as="x" hint-placeholder-count="2">
          <label style="position: relative; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1.5px solid {{x.bd}}; background: {{x.bg}}; cursor: {{x.cur}};">
            <input type="radio" name="aftersale-apply-type" checked="{{x.on}}" disabled="{{x.dis}}" onChange="{{x.pick}}" style="position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;">
            <sc-if value="{{x.on}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #ff6a00; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
            </sc-if>
            <sc-if value="{{x.off}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #c4c8ce; background: #fff;"></span>
            </sc-if>
            <sc-if value="{{x.na}}" hint-placeholder-val="{{true}}">
              <span style="flex-shrink: 0; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #ebedf0; background: #f2f3f5;"></span>
            </sc-if>
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 700; line-height: 21px; color: {{x.tc}};">{{x.t}}</span>
              <span style="font-size: 12px; line-height: 17px; color: {{x.sc}};">{{x.sub}}</span>
            </span>
          </label>
        </sc-for>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; padding: 0 14px; background: #fff; border-radius: 14px;">
      <button type="button" aria-haspopup="dialog" onClick="{{openPicker}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0; border: 0; border-bottom: 1px solid #f0f1f3; background: none; font: inherit; text-align: left; cursor: pointer;">
        <span style="flex-shrink: 0; width: 60px; font-size: 14px; line-height: 20px; color: #666b73;">申请原因</span>
        <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; color: #191919; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{reasonLabel}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px;">
        <span style="flex-shrink: 0; width: 60px; font-size: 14px; line-height: 20px; color: #666b73;">申请金额</span>
        <span style="font-size: 17px; font-weight: 700; line-height: 24px; color: #e85400;">¥1,299</span>
        <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #8a8f97;">不超过实付金额</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #fff; border-radius: 14px;">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px;">补充描述和凭证</h2>
      <textarea aria-label="问题描述" placeholder="补充描述商品情况，便于商家处理" style="display: block; width: 100%; height: 76px; box-sizing: border-box; margin: 0; padding: 10px 12px; border: 1px solid #ebedf0; border-radius: 10px; background: #f7f8fa; font: inherit; font-size: 14px; line-height: 20px; color: #191919; resize: none;"></textarea>
      <div style="display: flex; gap: 10px;">
        <span style="width: 72px; height: 72px; box-sizing: border-box; border-radius: 10px; border: 1px dashed #c4c8ce; background: #fafafb; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; line-height: 15px; color: #8a8f97;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7z"></path></svg>商品照片</span>
        <span style="width: 72px; height: 72px; box-sizing: border-box; border-radius: 10px; border: 1px dashed #c4c8ce; background: #fafafb; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; line-height: 15px; color: #8a8f97;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7z"></path></svg>包装照片</span>
        <span style="width: 72px; height: 72px; box-sizing: border-box; border-radius: 10px; border: 1px dashed #c4c8ce; background: #fafafb; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; line-height: 15px; color: #8a8f97;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>其他凭证</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #fff3e8; font-size: 13px; line-height: 18px; color: #555a62;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 7.5h.01"></path></svg>
      <span>由 示例机器人商家 处理，平台协助沟通</span>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #ebedf0;">
    <a href="AftersaleDetail.dc.html" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">提交申请</a>
  </div>

  <sc-if value="{{pickerOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closePicker}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-label="选择申请原因" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: #fff; border-radius: 20px 20px 0 0; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center;">
        <span style="font-size: 17px; font-weight: 700; line-height: 24px;">选择申请原因</span>
        <button type="button" onClick="{{closePicker}}" aria-label="关闭" style="margin-left: auto; margin-right: -10px; width: 44px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555a62" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <div role="radiogroup" aria-label="申请原因" style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
          <label style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1.5px solid {{r.bd}}; background: {{r.bg}}; cursor: pointer;">
            <input type="radio" name="aftersale-apply-reason" checked="{{r.on}}" onChange="{{r.pick}}" style="position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;">
            <span style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 21px; color: {{r.tc}}; font-weight: {{r.tw}};">{{r.label}}</span>
            <sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </sc-if>
          </label>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":870}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // type：售后类型（订单已发货，只能选退货退款）；reason：申请原因；picker：原因选择面板是否打开
    this.state = { type: 'return', reason: 'noreason', picker: false };
  }
  renderVals() {
    const { type, reason, picker } = this.state;

    // 已发货订单不能“仅退款（未发货）”；本商品不提供换货，所以不列出
    const types = [
      { id: 'refund', t: '仅退款（未发货）', sub: '订单已发货，不可选', dis: true },
      { id: 'return', t: '退货退款', sub: '寄回商品，商家确认收货后退款', dis: false }
    ].map((x) => {
      const on = !x.dis && x.id === type;
      return {
        t: x.t, sub: x.sub, on, dis: x.dis,
        off: !x.dis && !on, na: x.dis,
        bd: on ? '#ff6a00' : '#ebedf0',
        bg: on ? '#fffaf5' : (x.dis ? '#f7f8fa' : '#fff'),
        tc: x.dis ? '#a3a8b0' : '#191919',
        sc: x.dis ? '#a3a8b0' : '#666b73',
        cur: x.dis ? 'not-allowed' : 'pointer',
        pick: () => { if (!x.dis) this.setState({ type: x.id }); }
      };
    });

    const reasonList = [
      { id: 'noreason', label: '不想要了（未拆封，7 天无理由）' },
      { id: 'mismatch', label: '商品与描述不符' },
      { id: 'damaged', label: '商品有损坏' }
    ];
    const current = reasonList.find((r) => r.id === reason) || reasonList[0];
    // 选中一个原因后写回“申请原因”一行并关闭面板
    const reasons = reasonList.map((r) => {
      const on = r.id === current.id;
      return {
        label: r.label, on,
        bd: on ? '#ff6a00' : '#ebedf0',
        bg: on ? '#fffaf5' : '#fff',
        tc: on ? '#d94f00' : '#191919',
        tw: on ? 500 : 400,
        pick: () => this.setState({ reason: r.id, picker: false })
      };
    });

    return {
      types, reasons,
      reasonLabel: current.label,
      pickerOpen: picker,
      openPicker: () => this.setState({ picker: true }),
      closePicker: () => this.setState({ picker: false })
    };
  }
}
</script>
</body>
</html>
