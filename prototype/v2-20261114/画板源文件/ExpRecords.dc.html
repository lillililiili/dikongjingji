<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>体验记录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">我的体验</h1>
  </div>
  <div style="flex-shrink: 0; display: flex; gap: 22px; padding: 0 16px; background: #fff; border-bottom: 1px solid #f0f1f3;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="margin: 0; padding: 10px 0; border: 0; border-bottom: 3px solid {{t.bd}}; background: transparent; color: {{t.c}}; font: inherit; font-size: 15px; font-weight: {{t.w}}; display: flex; align-items: flex-start; cursor: pointer;">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <sc-if value="{{showVenue}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 8px; background: #fff; border-radius: 12px; padding: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #fff3e8; color: #d94f00;">到馆 · 真机</span>
        <span style="font-size: 12px; color: #11804a;">待到馆</span>
        <span style="margin-left: auto; font-size: 12px; color: #666b73;">今天 14:00</span>
      </div>
      <span style="font-size: 15px; font-weight: 500;">机器人避障闯关 · 1 人</span>
      <span style="font-size: 12px; color: #666b73;">示例低空与机器人体验馆 · ¥39 已支付</span>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <a href="VenueCode.dc.html" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #c4c8ce; font-size: 13px; color: #191919; text-decoration: none; display: flex; align-items: center;">改期 / 取消</a>
        <a href="VenueCode.dc.html" style="min-height: 32px; padding: 0 12px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 13px; text-decoration: none; display: flex; align-items: center;">出示核销码</a>
      </div>
    </div>
    </sc-if>

    <sc-for list="{{recs}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 12px;">
        <img src="{{r.img}}" alt="{{r.t}}" style="width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 11px; padding: 1px 6px; border-radius: 6px; background: {{r.lbg}}; color: {{r.lfg}};">{{r.label}}</span>
            <span style="margin-left: auto; font-size: 12px; color: #666b73;">{{r.when}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 500;">{{r.t}}</span>
          <span style="font-size: 12px; color: #555a62;">{{r.res}}</span>
          <div style="display: flex; gap: 14px; margin-top: 2px; font-size: 13px;">
            <sc-if value="{{r.result}}" hint-placeholder-val="{{true}}">
              <a href="{{r.result}}" style="text-decoration: none;">查看结果</a>
            </sc-if>
            <a href="{{r.again}}" style="text-decoration: none;">{{r.act}}</a>
            <a href="PdFull.dc.html" style="text-decoration: none; color: #555a62;">看关联商品</a>
          </div>
        </div>
      </div>
    </sc-for>
    <div style="font-size: 12px; color: #8a8f97; text-align: center; line-height: 1.6;">未登录时的体验结果只保存在本机，登录后可归档到账户</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const { tab } = this.state;
    const tabs = [['all', '全部'], ['online', '线上体验'], ['venue', '到馆预约']].map(([id, label]) => {
      const on = id === tab;
      return { label, on, c: on ? '#191919' : '#666b73', w: on ? 700 : 400, bd: on ? '#ff6a00' : 'transparent', pick: () => this.setState({ tab: id }) };
    });
    const sim = { label: '虚拟仿真', lbg: '#e8f7ef', lfg: '#11804a', act: '再试一次' };
    // 结果页的样例是机器人避障模拟的挑战完成，只有这一条有“查看结果”；录播演示没有结果
    const recs = [
      { ...sim, t: '机器人避障模拟', when: '11/02', res: '挑战完成 · 用时 2′36″ · 碰撞 1 次', img: '/_blob/822c9edc2d0d857c67055194c02161d3', again: 'ExpSim.dc.html', result: 'ExpResult.dc.html' },
      { ...sim, t: '无人机起降与悬停', when: '10/30', res: '未完成 · 停在第 2 关', img: '/_blob/b41e3fb34601d5b9b3c9e40e84d2a489', again: 'ExpSim.dc.html', result: '' },
      { label: '录播演示', lbg: '#eaf2fd', lfg: '#1d63c4', t: '3 分钟看懂编程机器人', when: '10/28', res: '已看完', img: '/_blob/d7f749aa0af5b1d1784040d2a816e2f0', again: 'ContentVideo.dc.html', act: '再看一次', result: '' }
    ];
    // 到馆预约 = 顶部那张到馆卡片；线上体验 = 虚拟仿真与录播演示记录
    return { tabs, showVenue: tab !== 'online', recs: tab === 'venue' ? [] : recs };
  }
}
</script>
</body>
</html>
