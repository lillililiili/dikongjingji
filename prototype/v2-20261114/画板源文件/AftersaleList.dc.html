<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>退款/售后</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#d94f00}a:hover{color:#a63c00}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 780px; display: flex; flex-direction: column; background: #f7f8fa; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #191919; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 8px;">
      <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700;">退款/售后</h1>
    </div>
    <div role="tablist" aria-label="售后状态" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 8px;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="position: relative; height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 16px; line-height: 22px; font-weight: {{t.w}}; color: {{t.c}}; white-space: nowrap; cursor: pointer;">{{t.label}}<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 3px; width: 20px; height: 3px; margin-left: -10px; border-radius: 3px; background: #ff6a00;"></span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px;">
    <sc-for list="{{shown}}" as="i" hint-placeholder-count="3">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: #fff;">
        <a href="{{i.href}}" style="display: flex; flex-direction: column; gap: 12px; color: #191919; text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-shrink: 0; padding: 0 6px; border-radius: 6px; background: {{i.kindBg}}; color: {{i.kindFg}}; font-size: 12px; line-height: 20px; white-space: nowrap;">{{i.kind}}</span>
            <span style="min-width: 0; font-size: 14px; line-height: 21px; color: #555a62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{i.shop}}</span>
            <span style="flex-shrink: 0; margin-left: auto; font-size: 14px; font-weight: 500; line-height: 21px; color: {{i.sc}}; white-space: nowrap;">{{i.status}}</span>
          </span>
          <span style="display: flex; gap: 12px;">
            <sc-if value="{{i.img}}" hint-placeholder-val="{{true}}">
              <img src="{{i.img}}" alt="{{i.title}}" style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; display: block; background: #f2f3f5; font-size: 11px;">
            </sc-if>
            <sc-if value="{{i.noImg}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; background: #f2f3f5; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a3a8b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"></path></svg></span>
            </sc-if>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="display: flex; align-items: flex-start; gap: 8px;">
                <span style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 700; line-height: 21px;">{{i.title}}<sc-if value="{{i.tail}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; white-space: nowrap;">{{i.tail}}</span></sc-if></span>
                <span style="flex-shrink: 0; font-size: 15px; font-weight: 700; line-height: 21px;">{{i.amount}}</span>
              </span>
              <span style="font-size: 13px; line-height: 18px; color: #8a8f97;">{{i.meta}}</span>
              <span style="font-size: 13px; line-height: 18px; color: {{i.lc}};">{{i.line}}</span>
            </span>
          </span>
        </a>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <sc-for list="{{i.btns}}" as="b" hint-placeholder-count="2">
            <a href="{{b.href}}" style="height: 36px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid {{b.bd}}; background: {{b.bg}}; color: {{b.fg}}; font-size: 14px; font-weight: {{b.w}}; line-height: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{b.t}}</a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 10px; background: #e8f7ef;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#19b866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10c-4-1.6-7-5.4-7-10V6zM8.5 12l2.5 2.5 4.5-5"></path></svg>
      <span style="flex-grow: 1; min-width: 0; font-size: 12px; line-height: 17px; color: #11804a;">售后由售后责任方处理；协商不成时，平台客服协助沟通，不裁决。</span>
      <a href="Chat.dc.html" style="flex-shrink: 0; min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: #11804a; text-decoration: none; white-space: nowrap;">联系客服 ›</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // tab：售后状态（doing 售后中 / done 已完成 / closed 已关闭）
    this.state = { tab: 'doing' };
  }
  renderVals() {
    const { tab } = this.state;
    const FLOW = 'AftersaleFlow.dc.html';

    // 商品售后都进 AftersaleFlow；报名退改有自己的进度页。按提交时间倒序
    const all = [
      { tab: 'doing', kind: '退货退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥1,299', img: '/_blob/5d32505e8b9a494f8436e31c3008ef99',
        meta: '标准套装（1 台 + 数字课程）× 1', status: '待寄回', line: '商家已同意，请在 [协议约定时间] 内寄回', href: FLOW, urgent: true,
        btns: [['查看进度', FLOW], ['填写运单', FLOW, true]] },
      { tab: 'doing', kind: '报名退改', shop: '东营低空与机器人体验馆', title: '青少年无人机编程挑战赛', tail: '（东营站）', amount: '¥240', img: '/_blob/b41e3fb34601d5b9b3c9e40e84d2a489',
        meta: '11/15 上午场 09:00 · 2 人', status: '待主办方确认', line: '确认时限 [协议约定时间]', href: 'EnrollRefundDetail.dc.html',
        btns: [['查看进度', 'EnrollRefundDetail.dc.html']] },
      { tab: 'doing', kind: '退货退款', shop: '示例科创器材店', title: '便携航拍无人机', amount: '¥1,999', img: '/_blob/277bff54e5d7d5be019694787d4e648d',
        meta: '× 1', status: '退款中', line: '商家已确认收货，¥1,999 正在原路退回', href: FLOW,
        btns: [['查看进度', FLOW]] },
      { tab: 'done', kind: '退货退款', shop: '示例机器人商家', title: '避障训练场地套件', amount: '¥460', img: '/_blob/822c9edc2d0d857c67055194c02161d3',
        meta: '× 1', status: '已退款', line: '11/01 09:30 已原路退回', href: FLOW,
        btns: [['查看详情', FLOW], ['查看订单', 'OrderGoods.dc.html']] },
      { tab: 'done', kind: '仅退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥7,380', img: '/_blob/5d32505e8b9a494f8436e31c3008ef99',
        meta: '教室套装（6 台 + 教师端）× 1', status: '已退款', line: '10/28 16:10 已原路退回', href: FLOW,
        btns: [['查看详情', FLOW], ['查看订单', 'OrderGoods.dc.html']] },
      { tab: 'closed', kind: '退货退款', shop: '示例机器人商家', title: '桌面六轴机械臂 教学版', amount: '¥9,800', img: '',
        meta: '× 1', status: '商家未同意', line: '凭证不足，可补充后重新申请', href: FLOW,
        btns: [['查看详情', FLOW], ['重新申请', 'AftersaleApply.dc.html']] },
      { tab: 'closed', kind: '退货退款', shop: '示例机器人商家', title: '编程机器人探索套装', amount: '¥1,299', img: '/_blob/5d32505e8b9a494f8436e31c3008ef99',
        meta: '标准套装（1 台 + 数字课程）× 1', status: '已撤销', line: '你已撤销这次申请', href: FLOW,
        btns: [['查看详情', FLOW], ['重新申请', 'AftersaleApply.dc.html']] }
    ];

    const kinds = {
      退货退款: { kindBg: '#fff3e8', kindFg: '#d94f00' },
      仅退款: { kindBg: '#eaf2fd', kindFg: '#1d63c4' },
      报名退改: { kindBg: '#f1edff', kindFg: '#6a4fe0' }
    };
    const statusColor = { 待寄回: '#d94f00', 待主办方确认: '#d94f00', 退款中: '#1d63c4', 已退款: '#11804a', 商家未同意: '#e5484d', 已撤销: '#8a8f97' };

    const shown = all.filter((x) => x.tab === tab).map((x) => ({
      ...kinds[x.kind],
      kind: x.kind, shop: x.shop, title: x.title, tail: x.tail || '', amount: x.amount, img: x.img, noImg: !x.img, meta: x.meta,
      status: x.status, line: x.line, href: x.href,
      sc: statusColor[x.status],
      lc: x.urgent ? '#d94f00' : '#555a62',
      btns: x.btns.map(([t, href, primary]) => ({
        t, href,
        bd: primary ? '#ff6a00' : '#c4c8ce', bg: primary ? '#ff6a00' : '#fff', fg: primary ? '#fff' : '#191919', w: primary ? 500 : 400
      }))
    }));

    const tabs = [['doing', '售后中'], ['done', '已完成'], ['closed', '已关闭']].map(([id, name]) => {
      const on = id === tab;
      return {
        on, label: name + ' ' + all.filter((x) => x.tab === id).length,
        c: on ? '#191919' : '#666b73', w: on ? 700 : 400,
        pick: () => this.setState({ tab: id })
      };
    });

    return { tabs, shown };
  }
}
</script>
</body>
</html>
