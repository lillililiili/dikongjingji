<style>

</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}

.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>

    <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">

        <img src="_blob/e42bb39cca5b4f528e6577da8445bced.webp" alt="一台机器狗如何完成园区夜间巡逻" style="width: 100%; height: 132px; object-fit: cover; display: block; background: #eef2f8; font-size: 11px;">
        <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 500; line-height: 21px;">一台机器狗如何完成园区夜间巡逻</span>
          <span style="font-size: 12px; line-height: 17px; color: #627187;">园区安防 · 图文案例</span>
        </div>
      </a>
      <a href="ContentArticle.dc.html" style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden; text-decoration: none; color: #202c42;">
        <img src="_blob/b6a30fa51bcba7d4ced06ace8b4d74ed.png" alt="无人机巡检周界案例" style="width: 100%; height: 132px; object-fit: cover; display: block; background: #eef2f8; font-size: 11px;">
        <span style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 15px; font-weight: 500; line-height: 21px;">无人机巡检周界：一次巡完要看什么</span>

  <sc-if value="{{showQual}}" hint-placeholder-val="{{false}}">

      <div style="flex-shrink: 0; background: #fff; border-radius: 12px; padding: 4px 14px;">
        <sc-for list="{{quals}}" as="r" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid {{r.line}}; font-size: 14px; line-height: 20px;">
            <span style="flex-shrink: 0; width: 104px; color: #627187; white-space: nowrap;">{{r.k}}</span>
            <span style="flex-grow: 1; min-width: 0; color: {{r.c}};">{{r.v}}</span>
          </div>
        </sc-for>
      </div>
      <span style="flex-shrink: 0; font-size: 12px; line-height: 19px; color: #627187;">资质由平台审核，到期前需重新提交。飞行审批与空中调度由服务商按规定办理，本平台不承担。</span>
    </div>

  <sc-if value="{{showCities}}" hint-placeholder-val="{{false}}">
    <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">

            </div>

</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // tab：scope 服务范围 / cases 案例 / qual 资质 / cities 可服务城市；hint：未绘制目标的提示
    // 版式沿用商家主页 Merchant
    this.state = { tab: 'scope', hint: '' };
  }
  renderVals() {
    const { tab, hint } = this.state;
    const tabs = [['scope', '服务范围'], ['cases', '案例'], ['qual', '资质'], ['cities', '可服务城市']].map(([id, label]) => {
      const on = id === tab;
      return { on, label, bb: on ? '#ff6a00' : 'transparent', w: on ? 700 : 400, c: on ? '#202c42' : '#627187', pick: () => this.setState({ tab: id, hint: '' }) };
    });
    // 周期巡检、设备检测都是按项目报价，原型里接园区安防巡检详情这份样例（正式产品按 serviceId 打开各自详情）；两个案例都接图文案例样例
    const moreServices = [
      { name: '周期巡检', sub: '按月或按季固定巡检，一次签约', img: '_blob/b6a30fa51bcba7d4ced06ace8b4d74ed.png' },
      { name: '设备检测', sub: '安防与电力设备的现场检测', img: '_blob/d26647dbfc9226eacaf364aaff076d9d.webp' }
    ];
    const deliver = ['巡检报告', '隐患清单', '影像存档', '隐患跟踪'];
    const quals = [
      { k: '经营主体', v: '示例鹰眼智能科技有限公司', c: '#202c42' },
      { k: '营业执照', v: '已审核', c: '#11804a' },
      { k: '无人机运营资质', v: '已审核', c: '#11804a' },
      { k: '飞手资质', v: '已审核', c: '#11804a' },
      { k: '服务保险', v: '至 2027-03-31', c: '#202c42' },
      { k: '东营授权', v: '至 2027-10-31', c: '#202c42' }
    ].map((r, i, all) => ({ ...r, line: i === all.length - 1 ? 'transparent' : '#f0f1f3' }));
    const cities = [
      { name: '东营', sub: '本地团队，全市可服务', state: '可服务', bg: '#e2f6ed', fg: '#11804a' },
      { name: '滨州', sub: '跨城履约，按项目确认', state: '可服务', bg: '#e2f6ed', fg: '#11804a' },
      { name: '济南', sub: '暂未开始接单', state: '筹备中', bg: '#eef2f8', fg: '#536178' }
    ].map((c, i, all) => ({ ...c, line: i === all.length - 1 ? 'transparent' : '#f0f1f3' }));
    return {
      tabs, moreServices, deliver, quals, cities,
      showScope: tab === 'scope', showCases: tab === 'cases', showQual: tab === 'qual', showCities: tab === 'cities',
      hasHint: hint !== '', hint,
      closeHint: () => this.setState({ hint: '' })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
