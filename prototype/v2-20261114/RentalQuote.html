class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03 商家报价（这一帧还没确认）；OrderRental、Contract 里的 10/30 那单是上一次租赁（OrderRental 的“租赁合同 已确认 10/30 16:20”、租金“已支付 10/30”）；已过期态在 Tweaks 的 quoteState 切换
    // agree：是否勾选“我已核对…”；sheet：关闭询价确认面板是否打开；closed：询价是否已关闭（确认合同之前才能关闭）
    this.state = { agree: false, sheet: false, closed: false };
  }
  renderVals() {
    const { agree, sheet, closed } = this.state;
    // 过期由服务端判定：有效期过后不能确认，只能重新询价
    const expired = (this.props.quoteState ?? '待确认') === '已过期' && !closed;
    const open = !expired && !closed;
    // 报价按 PdRental 的参考价 ¥380/天 起执行；配件和市内送达取回包含在租金里（设计假设）
    const quoteItems = [
      { name: '租金', qty: '5 天 × ¥380 × 1 台', amount: '¥1,900', c: '#202c42' },
      { name: '随机配件', qty: '按随箱清单', amount: '含', c: '#627187' },
      { name: '送达与取回', qty: '东营市内（示例）', amount: '含', c: '#627187' }
    ];
    // 租期、交接和归还安排与 OrderRental 一致
    const schedule = [
      { k: '租期', v: '11/08–11/12 · 共 5 天' },
      { k: '数量', v: '1 台 · 设备编号交接时确定' },
      { k: '交接', v: '商家送达 · 11/08 上午 · 东营港务物流 收货点' },
      { k: '归还', v: '商家上门取回 · 11/12 18:00 前' },
      { k: '档期', v: '商家已确认这 5 天可以出租' }
    ];
    // 押金规则未定：按 [协议约定时间] 内确认处理，当前不在线收取；超期和赔付按合同，没有发生就不计费
    const terms = [
      { k: '押金', v: '待定 · 押金规则 [协议约定时间] 内确认，当前不在线收取' },
      { k: '超期', v: '超过 11/12 18:00 后按天计费，费率以合同为准' },
      { k: '损坏处理', v: '归还时核对交接记录，人为损坏按合同赔付；非人为故障由商家维修或更换' },
      { k: '取消', v: '确认合同前可以直接关闭询价；确认后取消按合同约定处理' }
    ];
    return {
      quoteItems, schedule, terms,
      chip: closed ? '已关闭' : (expired ? '已过期' : '待确认'),
      chipBg: closed || expired ? '#eef2f8' : '#fff0e3',
      chipFg: closed || expired ? '#536178' : '#ba470b',
      showValid: open || expired,
      payState: closed ? '询价已关闭，无需支付' : (expired ? '报价已过期，无需支付' : '合同确认后一次付清（设计假设）'),
      payStateColor: open ? '#ba470b' : '#738096',
      payAmountColor: open ? '#202c42' : '#738096',
      agree,
      notAgree: !agree,
      pending: open,
      expired,
      closed,
      // 只有勾选后才能确认；确认合同的动作本身发生在服务端，这里只放行到收银台
      canConfirm: open && agree,
      confirmLocked: open && !agree,
      canClose: open || expired,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      sheetOpen: sheet,
      openClose: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      // 关闭只发生在确认之前；关闭后不能再确认
      confirmClose: () => this.setState({ sheet: false, closed: true, agree: false })
    };
  }
}
