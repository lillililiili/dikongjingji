<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EX3 仿真任务进行中</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>
<div class="side">状态：<select data-prop="frame"><option selected>机器人避障模拟</option><option>无人机起降与悬停</option></select></div>
<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="ExpCenter.dc.html" aria-label="退出体验" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap;">{{title}}</h1>
    <span style="margin-left: auto; margin-right: 8px; font-size: 15px; font-weight: 700;">01:48</span>
  </div>
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; background: #fff;">
    <span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e2f6ed; color: #11804a;">虚拟仿真 · 不连接真实设备</span>
    <span style="margin-left: auto; font-size: 12px; color: #536178; white-space: nowrap;">{{level}}</span>
  </div>

  <div style="position: relative; height: 330px; flex-shrink: 0;">
    <img src="{{img}}" alt="{{imgAlt}}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    <span style="position: absolute; left: 12px; top: 12px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.9);">模拟场景</span>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px;">
      <span style="flex: 1 1 0; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.92); font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{stat1}}</span>
      <span style="flex: 1 1 0; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.92); font-size: 12px; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{stat2}}</span>
    </div>
  </div>

  <div style="flex-grow: 1; background: #fff; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;">
    <div style="display: flex; align-items: baseline;">
      <span style="font-size: 15px; font-weight: 700;">拼出你的程序</span>
      <span style="margin-left: 8px; font-size: 12px; color: #627187;">点积木加入，点程序里的积木删除</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 92px; padding: 10px; border-radius: 10px; background: #f5f7fc; align-content: flex-start;">
      <sc-for list="{{prog}}" as="b" hint-placeholder-count="4">
        <button type="button" onClick="{{b.remove}}" aria-label="删除积木 {{b.t}}" style="margin: -4px; padding: 4px; border: 0; background: transparent; font: inherit; display: flex; cursor: pointer;"><span style="height: 34px; padding: 0 12px; border-radius: 8px; background: {{b.bg}}; color: #fff; font-size: 13px; font-weight: 500; display: flex; align-items: center;">{{b.t}}</span></button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{palette}}" as="b" hint-placeholder-count="4">
        <button type="button" onClick="{{b.add}}" disabled="{{b.dis}}" aria-label="加入积木 {{b.t}}" style="box-sizing: content-box; margin: 0; padding: 0; height: 40px; border-radius: 8px; border: 1.5px solid {{b.bg}}; background: #fff; color: {{b.fg}}; font: inherit; font-size: 13px; opacity: {{b.op}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">{{b.t}}</button>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; gap: 10px; padding-bottom: 14px;">
      <button type="button" onClick="{{reset}}" style="box-sizing: content-box; margin: 0; padding: 0; width: 110px; height: 46px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; color: #202c42; font: inherit; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;">重置</button>
      <a href="{{resultHref}}" style="flex-grow: 1; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">运行程序</a>
    </div>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // D7 的两个仿真模板（机器人避障、无人机起降）共用这一个容器，只换任务配置，用 Tweaks 的 frame 切
    // from：程序被改动时所在的帧；prog：该帧下拼出的程序。换帧后回到新帧的默认程序
    this.state = { from: '', prog: null };
  }
  renderVals() {
    const frame = this.props.frame ?? '机器人避障模拟';
    const c = { move: '#ff6a00', turn: '#2f80ed', sense: '#159a70', throttle: '#ff6a00', takeoff: '#2f80ed', hover: '#159a70', land: '#2f80ed' };
    const tasks = {
      机器人避障模拟: {
        title: '机器人避障模拟', level: '关卡 2 / 3', img: '_blob/192fc8acf4d61dc58d9c5109a1cad0da.jpg', imgAlt: '仿真场景',
        stat1: '已绕过 2 个障碍', stat2: '碰撞 0 次',
        prog: [{ k: 'move', t: '前进 2 格' }, { k: 'sense', t: '如果 前方有障碍' }, { k: 'turn', t: '右转 90°' }, { k: 'move', t: '前进 1 格' }],
        palette: [{ k: 'move', t: '前进', fg: '#ba470b' }, { k: 'turn', t: '左转', fg: '#1d63c4' }, { k: 'turn', t: '右转', fg: '#1d63c4' }, { k: 'sense', t: '如果…', fg: '#11804a' }]
      },
      无人机起降与悬停: {
        title: '无人机起降与悬停', level: '关卡 1 / 3', img: '_blob/b41e3fb34601d5b9b3c9e40e84d2a489.jpg', imgAlt: '无人机仿真场景',
        stat1: '高度 1.2 m · 目标 1.5 m', stat2: '偏移 0.3 m',
        prog: [{ k: 'takeoff', t: '起飞' }, { k: 'throttle', t: '油门 +10%' }, { k: 'hover', t: '悬停 3 秒' }, { k: 'land', t: '降落' }],
        palette: [{ k: 'throttle', t: '油门', fg: '#ba470b' }, { k: 'takeoff', t: '起飞', fg: '#1d63c4' }, { k: 'hover', t: '悬停', fg: '#11804a' }, { k: 'land', t: '降落', fg: '#1d63c4' }]
      }
    };
    const task = tasks[frame] || tasks['机器人避障模拟'];
    const progList = this.state.from === frame && this.state.prog ? this.state.prog : task.prog;
    // 程序区最多 12 块：再多会把底部“重置 / 运行程序”挤出画板，满了以后积木栏变灰不可点
    const MAX_BLOCKS = 12;
    const full = progList.length >= MAX_BLOCKS;
    const prog = progList.map((b, i) => ({
      t: b.t,
      bg: c[b.k],
      remove: () => this.setState({ from: frame, prog: progList.filter((_, j) => j !== i) })
    }));
    const palette = task.palette.map((b) => ({
      t: b.t,
      bg: c[b.k],
      fg: b.fg,
      dis: full,
      op: full ? 0.4 : 1,
      add: () => { if (!full) this.setState({ from: frame, prog: progList.concat({ k: b.k, t: b.t }) }); }
    }));
    return {
      resultHref: 'ExpResult.dc.html?experience=' + (frame === '无人机起降与悬停' ? 'drone-hover' : 'robot-obstacle'), title: task.title, level: task.level, img: task.img, imgAlt: task.imgAlt, stat1: task.stat1, stat2: task.stat2,
      prog, palette,
      reset: () => this.setState({ from: frame, prog: [] })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{frame: PrototypeData.getExperience()?.title || '机器人避障模拟'},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
