</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // who：正在出示谁的签到码（一人一码，领队逐个出示）；txnCopied：是否点过渠道交易号的“复制”
    this.state = { who: 'a', txnCopied: false };
  }
  renderVals() {
    const { who, txnCopied } = this.state;
    // 时间线：待参加 = 11/03 领队付清后；活动当天 = 11/15 08:45，签到进行中，用 Tweaks 的 frame 切
    const onDay = (this.props.frame ?? '待参加') === '活动当天';

    // 名单与 TeamSignup 一致：导入 6 人，王小禾（已单独报名）和王小满（未满 8 岁）不计入，成团 4 人；凭证号接在王小禾、王小川两张单人码之后
    const base = [
      { id: 'a', name: '李明轩', age: 12, code: 'ACT-2611-0928-11', seed: 311, inAt: '08:41' },
      { id: 'b', name: '张雨桐', age: 10, code: 'ACT-2611-0928-12', seed: 142, inAt: '08:43' },
      { id: 'c', name: '赵子涵', age: 13, code: 'ACT-2611-0928-13', seed: 57, inAt: '' },
      { id: 'd', name: '陈可欣', age: 11, code: 'ACT-2611-0928-14', seed: 219, inAt: '' }
    ];
    const signedOf = (p) => onDay && p.inAt !== '';

    // 二维码占位：按序号生成固定图样，不是真码；三个定位角 + 伪随机点阵，换人时图样跟着变（同 EnrollTicket）
    const qrOf = (seed) => {
      const N = 25;
      let s = seed;
      const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
      const corner = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
      let d = '';
      for (let y = 0; y < N; y += 1) {
        for (let x = 0; x < N; x += 1) {
          const on = rnd() > 0.5;
          if (on && !corner(x, y)) d += `M${x} ${y}h1v1h-1z`;
        }
      }
      [[0, 0], [N - 7, 0], [0, N - 7]].forEach(([x, y]) => {
        d += `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}h5v5h-5zM${x + 2} ${y + 2}h3v3h-3z`;
      });
      return d;
    };

    const members = base.map((p) => {
      const on = p.id === who;
      const signed = signedOf(p);
      return {
        name: p.name, age: `${p.age} 岁`, av: p.name.slice(0, 1), code: p.code,
        avBg: signed ? '#e2f6ed' : '#fff0e3', avFg: signed ? '#11804a' : '#ba470b',
        state: signed ? `已签到 ${p.inAt}` : '待签到',
        stateC: signed ? '#11804a' : '#ba470b',
        on,
        bd: on ? '#ff6a00' : '#c9d3e1', bg: on ? '#fff0e3' : '#fff', fg: on ? '#ba470b' : '#202c42',
        showLabel: on ? '出示中' : '出示码',
        showAria: `出示 ${p.name} 的签到码`,
        refundAria: `为 ${p.name} 申请退改`,
        // 按人退改：免费取消窗口内每个队员都能单独退；活动当天已过窗口，只能转让或联系主办方
        canRefund: !onDay,
        pick: () => this.setState({ who: p.id })
      };
    });
    const cur = base.find((p) => p.id === who) || base[0];
    const curSigned = signedOf(cur);
    const signedCount = base.filter(signedOf).length;
    const CHECK = 'M5 12l5 5 9-10';
    const CLOCK = 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2';

    return {
      statusIcon: onDay ? CLOCK : CHECK,
      statusTitle: onDay ? `签到中 · ${signedCount}/4 已签到` : '报名成功 · 待参加',
      statusSub: onDay ? '11/15 08:30 起签到，09:00 开始 · 领队逐个出示队员的码' : '活动前一天将发送提醒 · 领队到场协助签到',
      signSummary: onDay ? `${signedCount}/4 已签到` : '4 人 · 一人一码',
      members,
      curName: cur.name,
      curCode: cur.code,
      qr: qrOf(cur.seed),
      qrOp: curSigned ? 0.18 : 1,
      curStamp: curSigned ? '已核销' : '',
      curHint: curSigned ? `已于 11/15 ${cur.inAt} 核销，不能重复使用` : '到场出示此码签到 · 开始后 30 分钟停止入场（示例）',
      curHintC: curSigned ? '#536178' : '#738096',
      txnLabel: txnCopied ? '已复制' : '复制',
      txnColor: txnCopied ? '#11804a' : '#ba470b',
      copyTxn: () => this.setState({ txnCopied: true }),
      // 免费取消截止 = 活动开始（11/15 09:00）前 48 小时；活动当天已过窗口
      ruleLine: onDay ? '已过免费取消时间（11/13 09:00）' : '11/13 09:00 前可免费取消（整单或按人）',
      ruleBg: onDay ? '#eef2f8' : '#e2f6ed',
      ruleC: onDay ? '#536178' : '#11804a',
      ruleIcon: onDay ? '#738096' : '#159a70',
      rules: [
        { t: '按人退改只退该队员的报名费 ¥120，其余队员的码不受影响' },
        { t: '之后不退报名费，可转让同场次名额' },
        { t: '活动延期或取消全额退款' }
      ],
      barNote: onDay ? '已过免费取消时间，可转让同场次名额' : '11/13 09:00 前可免费取消（整单或按人）',
      barNoteC: onDay ? '#738096' : '#11804a',
      barHref: onDay ? 'Chat.dc.html' : 'EnrollRefund.dc.html',
      barLabel: onDay ? '联系主办方' : '申请退改'
    };
  }
