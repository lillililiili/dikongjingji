</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // tab：业务类型（all 全部 / goods 商品 / service 服务 / enroll 报名）；chip：状态筛选（'' 表示不限，再点一次已选状态即取消；refund 退款/售后 只列售后单）
    // received：商品订单 A 已确认收货；cancelled：商品订单 B 已取消
    this.state = { tab: 'all', chip: '', received: false, cancelled: false };
  }
  renderVals() {
    const { tab, chip, received, cancelled } = this.state;
    const tabs = [['all', '全部'], ['goods', '商品'], ['service', '服务'], ['enroll', '报名']].map(([id, label]) => {
      const on = id === tab;
      return { id, label, on, c: on ? '#202c42' : '#627187', w: on ? 700 : 400, pick: () => this.setState({ tab: id }) };
    });
    const chips = [['pay', '待付款'], ['ship', '待发货/履约'], ['attend', '待参加'], ['accept', '待验收'], ['refund', '退款/售后']].map(([id, label]) => {
      const on = id === chip;
      return {
        id, label, on,
        bg: on ? '#fff0e3' : '#eef2f8', bd: on ? '#ffd8b8' : '#eef2f8', fg: on ? '#ba470b' : '#202c42', w: on ? 500 : 400,
        pick: () => this.setState((s) => ({ chip: s.chip === id ? '' : id }))
      };
    });
    // 每张卡片的业务类型与当前状态：已发货（运输中）归入“待发货/履约”；已收货、已取消不属于任何状态筛选，只在“全部 / 商品”里出现
    const cards = {
      b: { biz: 'goods', status: cancelled ? '' : 'pay' },
      a: { biz: 'goods', status: '' },  // 已发货属于“待收货”，不在五个快捷状态里，只在 全部 / 商品 显示
      enroll: { biz: 'enroll', status: 'attend' },
      svc: { biz: 'service', status: 'accept' },
      // 租赁属“服务及合同”；使用中不在快捷状态里，只在 全部 / 服务 显示，Mine 的“待发货/履约”角标仍是 0
      rental: { biz: 'service', status: '' },
      // 待方案和待确认不属于五个快捷状态，只在 全部 / 服务 显示；方案是否过期要进 M05 才知道
      booked: { biz: 'service', status: '' },
      expired: { biz: 'service', status: '' }
    };
    const shown = (c) => (tab === 'all' || c.biz === tab) && (!chip || c.status === chip);
    const showB = shown(cards.b);
    const showA = shown(cards.a);
    const showEnroll = shown(cards.enroll);
    const showSvc = shown(cards.svc);
    const showRental = shown(cards.rental);
    const showBooked = shown(cards.booked);
    const showExpired = shown(cards.expired);
    // 售后卡（商品退货退款）只在“退款/售后”筛选下出现，不进“全部”的默认列表；业务类型选“商品”时也显示
    const showAfter = chip === 'refund' && (tab === 'all' || tab === 'goods');
    return {
      tabs, chips,
      showB, showA, showEnroll, showSvc, showRental, showBooked, showExpired, showAfter,
      showEmpty: !(showB || showA || showEnroll || showSvc || showRental || showBooked || showExpired || showAfter),
      bStatus: cancelled ? '已取消' : '待付款',
      bStatusC: cancelled ? '#738096' : '#ba470b',
      bPending: !cancelled,
      bCancelled: cancelled,
      cancelB: () => this.setState({ cancelled: true }),
      aStatus: received ? '已收货' : '已发货',
      aStatusC: received ? '#11804a' : '#ba470b',
      aCanConfirm: !received,
      confirmA: () => this.setState({ received: true })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
