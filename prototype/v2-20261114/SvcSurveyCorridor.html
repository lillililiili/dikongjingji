class Component extends DCLogic {
  constructor(...args) {

    this.state = { hint: '' };

  renderVals() {
    const { hint } = this.state;
    const capabilities = ['正射影像', '三维模型', '断面成果'];
    // 价格与取消：原价格下的“按测区面积、精度和成果报价”拆进计价方式和影响价格两行；确认方案后的取消细则没定
    const priceRows = [
      ['计价方式', '按走廊长度计价，起步价含外业测绘和断面成果'],
      ['影响价格', '走廊长度、带宽、断面间距'],
      ['取消说明', '方案确认前取消不收费，确认后按方案约定']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    const scope = [
      ['带状测绘', 'M2 20l7-12 4 6 3-4 6 10z'],
      ['管线走向', 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9'],
      ['断面成果', 'M12 4l9 5-9 5-9-5zM3 14l9 5 9-5'],
      ['走廊三维模型', 'M6 17a2 2 0 1 0 0 4a2 2 0 0 0 0-4zM18 3a2 2 0 1 0 0 4a2 2 0 0 0 0-4zM8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7']
    ].map(([label, d]) => ({ label, d }));
    // 精度指标没有定，详情页只说明约定方式，具体数值写在方案里
    const rows = [
      ['精度指标', '平面、高程精度按项目要求约定'],
      ['地面分辨率', '按成果用途约定'],
      ['检核方式', '检查点比对，结果写入成果报告']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    const outputs = [
      { label: '正射影像', sub: '带坐标的高清影像图，可量距和量面积', d: 'M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2zM9 4v14M15 6v14' },
      { label: '三维模型', sub: '实景三维模型，可在线查看和量测', d: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9' }
    ];
    const steps = [
      ['提交需求', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4'],
      ['报价比选', 'M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4'],
      ['外业采集', 'M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3'],
      ['内业处理', 'M12 4l9 5-9 5-9-5zM3 14l9 5 9-5'],
      ['成果验收', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d], i, arr) => ({ label, d, arrow: i < arr.length - 1 }));
    const guarantees = [
      ['资质审核', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['合规作业', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 10.5h6M9 14h6'],
      ['数据保密', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 11.5h5V15h-5zM10.5 11.5V10a1.5 1.5 0 0 1 3 0v1.5']
    ].map(([label, d]) => ({ label, d }));
    return {
      capabilities, priceRows, scope, rows, outputs, steps, guarantees,
      hint,
      hintText: hint,
      closeHint: () => this.setState({ hint: '' })
    };
  }
}
