    super(...args);
    this.state = { qty: 1, days: 5, startAt: 9, handover: 'deliver', place: 'org', who: 'org', contact: '王女士', phone: '138****2026', note: '', sheet: '' };
  }
  renderVals() {
    const { qty, days, startAt, handover, place, who, contact, phone, note, sheet } = this.state;
    // startAt = 相对 11/01（周日）的天数，到期日算法只服务这块画板的示例日期
    const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const dateOf = (n) => ({ md: n < 30 ? '11/' + String(n + 1).padStart(2, '0') : '12/' + String(n - 29).padStart(2, '0'), wk: weekNames[n % 7] });
    const start = dateOf(startAt);
    const end = dateOf(startAt + days - 1);
    const chipOf = (on) => ({ bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fffaf5' : '#fff', c: on ? '#ba470b' : '#202c42', w: on ? 500 : 400 });
    const dayOptions = [3, 5, 7, 30].map((d) => {
      const on = d === days;
      return { label: d + ' 天', on, ...chipOf(on), pick: () => this.setState({ days: d }) };
    });
    const dateOptions = [4, 5, 6, 7, 8, 9, 10, 11].map((n) => {
      const on = n === startAt;
      return { ...dateOf(n), on, ...chipOf(on), pick: () => this.setState({ startAt: n, sheet: '' }) };
    });
    // 参考金额只按 ¥380/天 起算，带“起”，真金额在商家报价和合同里
    const estimate = '¥' + (380 * days * qty).toLocaleString('en-US');
    const handoverOptions = [['deliver', '商家送达'], ['pickup', '到店自提']].map(([id, label]) => {
      const on = id === handover;
      return { label, on, bg: on ? '#fff' : 'transparent', c: on ? '#ba470b' : '#536178', w: on ? 500 : 400, pick: () => this.setState({ handover: id }) };
    });
    const handoverNote = handover === 'deliver'
      ? '商家送到使用地点，现场核对设备和配件后交接'
      : '到示例机器人商家东营仓取机，现场核对后交接';
    const placeRows = [
      { id: 'org', name: '东营港务物流 收货点', addr: '山东省东营市东营港经济开发区 示例港路 6 号（示例）' },
      { id: 'home', name: '示例路 88 号', addr: '山东省东营市东营区 示例路 88 号（示例）' }
    ];
    const places = placeRows.map((p) => {
      const on = p.id === place;
      return { ...p, on, bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fffaf5' : '#fff', pick: () => this.setState({ place: p.id, sheet: '' }) };
    });
    const placeName = (placeRows.find((p) => p.id === place) || placeRows[0]).name;
    const identities = [['org', '企业', '东营港务物流'], ['me', '个人', '王女士']].map(([id, t, s]) => {
      const on = id === who;
      return { t, s, on, off: !on, bd: on ? '#ff6a00' : '#e5ebf3', bg: on ? '#fffaf5' : '#fff', pick: () => this.setState({ who: id }) };
    });
    const closeSheet = () => this.setState({ sheet: '' });
    const decOff = qty <= 1;
    return {
      qty, days, decOff, decColor: decOff ? '#c9d3e1' : '#202c42', decCursor: decOff ? 'not-allowed' : 'pointer',
      dec: () => this.setState((st) => ({ qty: Math.max(1, st.qty - 1) })),
      inc: () => this.setState((st) => ({ qty: Math.min(9, st.qty + 1) })),
      startText: start.md + ' ' + start.wk, endText: end.md + ' ' + end.wk,
      dayOptions, dateOptions, estimate, handoverOptions, handoverNote, places, placeName, identities,
      contact, phone, note,
      setContact: (e) => this.setState({ contact: e && e.target ? e.target.value : '' }),
      setPhone: (e) => this.setState({ phone: e && e.target ? e.target.value : '' }),
      setNote: (e) => this.setState({ note: e && e.target ? e.target.value : '' }),
      dateOpen: sheet === 'date', placeOpen: sheet === 'place',
      openDate: () => this.setState({ sheet: 'date' }),
      openPlace: () => this.setState({ sheet: 'place' }),
      closeSheet
    };
  }
}
