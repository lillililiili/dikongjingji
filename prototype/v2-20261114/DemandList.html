<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>需求与报价列表</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 1300px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="Mine.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">需求与报价</h1>
    <a href="Demand.dc.html" style="flex-shrink: 0; height: 44px; margin: 0 8px 0 auto; display: flex; align-items: center; text-decoration: none;"><span style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #ff6a00; background: #fff; font-size: 13px; line-height: 18px; color: #ba470b; display: flex; align-items: center; white-space: nowrap;">发布需求</span></a>
  </div>

  <div role="tablist" aria-label="单据类型" style="flex-shrink: 0; display: flex; gap: 22px; padding: 0 16px; background: #fff; border-bottom: 1px solid #f0f1f3;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="margin: 0; min-height: 44px; padding: 10px 0; border: 0; border-bottom: 3px solid {{t.bb}}; background: none; font: inherit; font-size: 15px; font-weight: {{t.w}}; line-height: 21px; color: {{t.c}}; white-space: nowrap; cursor: pointer;">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <sc-if value="{{showFilter}}" hint-placeholder-val="{{true}}">
      <div role="group" aria-label="按状态筛选" style="flex-shrink: 0; display: flex; gap: 6px;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="margin: -6px 0; padding: 6px 0; border: 0; background: none; font: inherit; cursor: pointer;"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; line-height: 18px; white-space: nowrap;">{{f.label}}</span></button>
        </sc-for>
      </div>
    </sc-if>

    <sc-for list="{{shown}}" as="i" hint-placeholder-count="5">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: #fff;">
        <a href="{{i.href}}" style="display: flex; flex-direction: column; gap: 10px; color: #202c42; text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-shrink: 0; padding: 0 6px; border-radius: 6px; background: {{i.kindBg}}; color: {{i.kindFg}}; font-size: 12px; line-height: 20px; white-space: nowrap;">{{i.kind}}</span>
            <span style="min-width: 0; font-size: 13px; line-height: 18px; color: #738096; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">企业 · 东营港务物流</span>
            <span style="flex-shrink: 0; margin-left: auto; font-size: 14px; font-weight: 500; line-height: 21px; color: {{i.sc}}; white-space: nowrap;">{{i.status}}</span>
          </span>
          <span style="display: flex; gap: 12px;">
            <sc-if value="{{i.img}}" hint-placeholder-val="{{true}}">
              <img src="{{i.img}}" alt="{{i.title}}" style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; display: block; background: #eef2f8; font-size: 11px;">
            </sc-if>
            <sc-if value="{{i.noImg}}" hint-placeholder-val="{{false}}">
              <span style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; background: #eef2f8; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"></path></svg></span>
            </sc-if>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 15px; font-weight: 700; line-height: 21px;">{{i.title}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #738096;">{{i.meta}}</span>
              <span style="font-size: 13px; line-height: 18px; color: {{i.lc}};">{{i.line}}</span>
            </span>
          </span>
        </a>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <sc-if value="{{i.canCancel}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{i.askCancel}}" style="height: 36px; box-sizing: border-box; margin: 0; padding: 0 16px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 14px; line-height: 20px; color: #202c42; white-space: nowrap; cursor: pointer;">取消需求</button>
          </sc-if>
          <sc-if value="{{i.canDelete}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{i.askDelete}}" style="height: 36px; box-sizing: border-box; margin: 0; padding: 0 16px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 14px; line-height: 20px; color: #202c42; white-space: nowrap; cursor: pointer;">删除</button>
          </sc-if>
          <sc-if value="{{i.more}}" hint-placeholder-val="{{false}}">
            <a href="{{i.moreHref}}" style="height: 36px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; color: #202c42; font-size: 14px; line-height: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{i.more}}</a>
          </sc-if>
          <a href="{{i.href}}" style="height: 36px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 1px solid {{i.ctaBd}}; background: {{i.ctaBg}}; color: {{i.ctaFg}}; font-size: 14px; font-weight: {{i.ctaW}}; line-height: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">{{i.cta}}</a>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 72px 0;">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #eef2f8; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"></path></svg></span>
        <span style="font-size: 14px; line-height: 20px; color: #627187; white-space: nowrap;">{{emptyText}}</span>
        <a href="Demand.dc.html" style="height: 44px; padding: 0 24px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 15px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">发布需求</a>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{confirmOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{closeConfirm}}" aria-label="关闭" style="position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; background: rgba(0,0,0,0.45); cursor: pointer;"></button>
    <div role="dialog" aria-modal="true" aria-label="{{confirmTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; border-radius: 20px 20px 0 0; background: #fff;">
      <span style="font-size: 18px; font-weight: 700; line-height: 25px;">{{confirmTitle}}</span>
      <span style="font-size: 14px; line-height: 20px; color: #536178;">{{confirmText}}</span>
      <div style="display: flex; gap: 10px;">
        <button type="button" onClick="{{closeConfirm}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; font: inherit; font-size: 15px; color: #202c42; cursor: pointer;">{{confirmKeep}}</button>
        <button type="button" onClick="{{confirmDo}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; background: #ff6a00; font: inherit; font-size: 15px; font-weight: 500; color: #fff; cursor: pointer;">{{confirmGo}}</button>
      </div>
    </div>
  </sc-if>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03。“我的”写“1 份已选定”，这里已选定的就是物流园区季度安防巡检那一份
    // tab：单据类型（all / demand / inquiry / draft）；status：状态筛选，空串 = 全部；
    // cancelled：是否已取消待报价的需求；draftGone：草稿是否已删除；ask：确认面板（cancel / delete，空串关闭）
    this.state = { tab: 'all', status: '', cancelled: false, draftGone: false, ask: '' };
  }
  renderVals() {
    const { tab, status, cancelled, draftGone, ask } = this.state;

    // 按时间倒序。href 是卡片和主按钮的去向：有报价的进比选，其余回到需求或询价表单
    const all = [
      { id: 'park', type: 'demand', title: '园区综合巡检需求', meta: '东营经济技术开发区 · 约 1.2 平方公里', img: '_blob/b6a30fa51bcba7d4ced06ace8b4d74ed.png',
        status: cancelled ? '已关闭' : '待报价', line: cancelled ? '你已取消这份需求' : '平台匹配中 · 报价截止 11/05 18:00', href: 'Demand.dc.html', cta: cancelled ? '重新发布' : '查看需求', canCancel: !cancelled },
      { id: 'drone', type: 'inquiry', title: '行业测绘无人机（定制配置）', meta: '测绘版 · RTK · 五镜头倾斜相机 · 2 台', img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg',
        status: '报价中', line: '已收到 2 份报价 · 截止 11/05 18:00', href: 'QuoteGoods.dc.html', cta: '比选报价', primary: true },
      { id: 'rent', type: 'inquiry', title: '巡检机器狗 租赁询价', meta: '设备租赁 · 东营市', img: '_blob/a016bad56a0e687061b30b2a4fd96ff6.jpg',
        status: '报价中', line: '已收到 1 份报价 · 截止 11/06 18:00', href: 'RentalQuote.dc.html', cta: '查看报价' },
      { id: 'yard', type: 'draft', title: '堆场周界巡检需求', meta: '巡检 · 已填 3 项，还差地点和时间', img: '',
        status: '未提交', line: '11/02 保存', href: 'Demand.dc.html', cta: '继续填写', primary: true, canDelete: true },
      { id: 'logistics', type: 'demand', title: '物流园区季度安防巡检', meta: '约 42 万㎡ · 每月 2 次 · 需夜间巡查', img: '_blob/e42bb39cca5b4f528e6577da8445bced.webp',
        status: '已选定', line: '已选定 鹰眼智能巡检 · 方案 v2 · ¥18,600', href: 'Quote.dc.html', cta: '查看报价', more: '查看订单', moreHref: 'OrderService.dc.html' },
      { id: 'dock', type: 'demand', title: '码头堆场航拍记录', meta: '航拍 · 东营港区', img: '_blob/248020917b29731ae2eb5c415d406dd0.webp',
        status: '已关闭', line: '报价期内没有服务商报价', href: 'Demand.dc.html', cta: '重新发布' }
    ].filter((x) => !(x.id === 'yard' && draftGone));

    const kinds = {
      demand: { kind: '需求单', kindBg: '#e6f0ff', kindFg: '#1d63c4' },
      inquiry: { kind: '询价单', kindBg: '#fff0e3', kindFg: '#ba470b' },
      draft: { kind: '草稿', kindBg: '#eef2f8', kindFg: '#536178' }
    };
    const statusColor = { 待报价: '#ba470b', 报价中: '#1d63c4', 已选定: '#11804a', 已关闭: '#738096', 未提交: '#627187' };
    const lineColor = { 待报价: '#536178', 报价中: '#ba470b', 已选定: '#11804a', 已关闭: '#738096', 未提交: '#738096' };

    const list = all.filter((x) => (tab === 'all' || x.type === tab) && (tab === 'draft' || !status || x.status === status));
    const shown = list.map((x) => ({
      ...kinds[x.type],
      title: x.title, meta: x.meta, img: x.img, noImg: !x.img, status: x.status, line: x.line, href: x.href, cta: x.cta,
      sc: statusColor[x.status], lc: lineColor[x.status],
      more: x.more || '', moreHref: x.moreHref || x.href,
      canCancel: !!x.canCancel, canDelete: !!x.canDelete,
      ctaBd: x.primary ? '#ff6a00' : '#c9d3e1', ctaBg: x.primary ? '#ff6a00' : '#fff', ctaFg: x.primary ? '#fff' : '#202c42', ctaW: x.primary ? 500 : 400,
      askCancel: () => this.setState({ ask: 'cancel' }),
      askDelete: () => this.setState({ ask: 'delete' })
    }));

    const count = (id) => (id === 'all' ? all.length : all.filter((x) => x.type === id).length);
    const tabs = [['all', '全部'], ['demand', '需求单'], ['inquiry', '询价单'], ['draft', '草稿']].map(([id, name]) => {
      const on = id === tab;
      return {
        on, label: name + ' ' + count(id), bb: on ? '#ff6a00' : 'transparent', w: on ? 700 : 400, c: on ? '#202c42' : '#627187',
        pick: () => this.setState({ tab: id, status: '' })
      };
    });
    const filters = [['', '全部'], ['待报价', '待报价'], ['报价中', '报价中'], ['已选定', '已选定'], ['已关闭', '已关闭']].map(([id, label]) => {
      const on = id === status;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#202c42' : '#fff', fg: on ? '#fff' : '#202c42', pick: () => this.setState({ status: id }) };
    });

    const confirm = {
      cancel: { title: '确认取消这份需求？', text: '取消后服务商不再报价，已收到的报价也会失效。', keep: '暂不取消', go: '确认取消' },
      delete: { title: '确认删除这份草稿？', text: '删除后不能恢复，需要时请重新填写。', keep: '暂不删除', go: '确认删除' }
    }[ask] || { title: '', text: '', keep: '', go: '' };

    return {
      tabs, filters, shown,
      showFilter: tab !== 'draft',
      isEmpty: shown.length === 0,
      emptyText: tab === 'draft' ? '还没有草稿' : '没有符合条件的记录',
      confirmOpen: ask !== '',
      confirmTitle: confirm.title, confirmText: confirm.text, confirmKeep: confirm.keep, confirmGo: confirm.go,
      closeConfirm: () => this.setState({ ask: '' }),
      confirmDo: () => this.setState((s) => (s.ask === 'cancel' ? { ask: '', cancelled: true } : (s.ask === 'delete' ? { ask: '', draftGone: true } : { ask: '' })))
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
