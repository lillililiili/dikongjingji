</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：今天 11/03，方案 v1 的报价有效期已于 11/02 18:00 结束，不能确认和支付，只能申请更新方案或取消
    // cancelSheet：取消确认面板是否打开
    // cancelled：订单是否已取消（取消后不再显示申请更新入口）
    this.state = { cancelSheet: false, cancelled: false };
  }
  renderVals() {
    const { cancelSheet, cancelled } = this.state;
    // 方案 v1 报价明细：合计 ¥3,000（包干项不显示数量）
    const quoteItems = [
      { name: '光伏组件巡检', qty: '1 次 × ¥2,600', amount: '¥2,600' },
      { name: '报告与运维建议', qty: '', amount: '¥400' }
    ];
    const terms = [
      { t: '巡检后 48 小时内交付报告与组件问题清单' },
      { t: '影像存档保存 90 天' },
      { t: '交付文件通过受控链接下载' }
    ];
    // 方案过期后两个付款节点都不能支付，首付也不会进入待支付；订单取消后两个节点都不再收款
    const payNodes = cancelled ? [
      { name: '首付 30%', amount: '¥900', state: '订单已取消，无需支付', sc: '#738096', ac: '#738096' },
      { name: '验收后付款 70%', amount: '¥2,100', state: '订单已取消，无需支付', sc: '#738096', ac: '#738096' }
    ] : [
      { name: '首付 30%', amount: '¥900', state: '方案过期后不可支付', sc: '#738096', ac: '#202c42' },
      { name: '验收后付款 70%', amount: '¥2,100', state: '方案过期后不可支付', sc: '#738096', ac: '#202c42' }
    ];
    return {
      quoteItems, terms, payNodes,
      planChip: cancelled ? '已取消' : '已过期',
      planChipBg: '#eef2f8',
      planChipFg: '#536178',
      // 有效期、过期块和取消入口在取消后都隐藏，已取消帧与待确认方案取消后一致
      showValid: !cancelled,
      canCancel: !cancelled,
      expired: !cancelled,
      cancelled,
      cancelSheetOpen: cancelSheet && !cancelled,
      openCancel: () => this.setState({ cancelSheet: true }),
      closeCancel: () => this.setState({ cancelSheet: false }),
      // 重复确认取消不改变任何状态
      confirmCancel: () => this.setState((s) => (s.cancelled ? {} : { cancelled: true, cancelSheet: false }))
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
