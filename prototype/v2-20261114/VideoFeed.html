    const isLiked = !!liked[cur.id];
    const isFaved = !!faved[cur.id];
    const curFollowed = isFollowed(cur);
    const base = [
      { initial: '王', bg: '#ff6a00', name: '王女士', text: '看完就想带孩子去试试，周末还有场次吗？', when: '2 小时前', likes: 36 },
      { initial: cur.author.slice(0, 1), bg: '#11804a', name: cur.author, author: true, text: '有的，点视频下方的入口可以直接看详情', when: '1 小时前', likes: 58 },
      { initial: '李', bg: '#1d63c4', name: '李**', text: '画面比我想象的清楚多了', when: '45 分钟前', likes: 12 },
      { initial: '张', bg: '#6a4fe0', name: '张工', text: '企业用的话怎么报价？', when: '20 分钟前', likes: 4 }
    ];
    const mine = (posted[cur.id] || []).map((t) => ({ initial: '我', bg: '#ff6a00', name: '我', text: t, when: '刚刚', likes: 0 }));
    const comments = mine.concat(base).slice(0, 5);
    const canSend = draft.trim() !== '';
    return {
      cur: { ...cur, initial: cur.author.slice(0, 1), authorAria: cur.author + '主页', sharesText: fmt(cur.shares) },
      feeds, hasVideo, noVideo: !hasVideo,
      backToRec: () => this.setState({ feed: '推荐', idx: 0 }),
      pos: safeIdx + 1, total: list.length,
      progress: hasVideo ? Math.round(((safeIdx + 1) / list.length) * 100) + '%' : '0%',
      playing, paused: !playing, playAria: playing ? '暂停' : '播放',
      togglePlay: () => this.setState((s) => ({ playing: !s.playing })),
      noPrev: safeIdx === 0, noNext: safeIdx >= list.length - 1,
      prevOp: safeIdx === 0 ? 0.35 : 1, nextOp: safeIdx >= list.length - 1 ? 0.35 : 1,
      prev: () => this.setState((s) => ({ idx: Math.max(0, Math.min(s.idx, list.length - 1) - 1), playing: true, commentsOpen: false })),
      next: () => this.setState((s) => ({ idx: Math.min(list.length - 1, s.idx + 1), playing: true, commentsOpen: false })),
      liked: isLiked, likeFill: isLiked ? '#ff2d55' : 'rgba(255,255,255,0.95)', likeCount: fmt(cur.likes + (isLiked ? 1 : 0)),
      toggleLike: () => this.setState((s) => ({ liked: { ...s.liked, [cur.id]: !s.liked[cur.id] } })),
      faved: isFaved, favFill: isFaved ? '#ffc53d' : 'rgba(255,255,255,0.95)', favCount: fmt(cur.favs + (isFaved ? 1 : 0)),
      toggleFav: () => this.setState((s) => ({ faved: { ...s.faved, [cur.id]: !s.faved[cur.id] } })),
      followed: curFollowed, followMark: curFollowed ? '✓' : '+', followBg: curFollowed ? '#159a70' : '#ff2d55', followAria: (curFollowed ? '已关注 ' : '关注 ') + cur.author,
      toggleFollow: () => this.setState((s) => ({ followed: { ...s.followed, [cur.author]: !curFollowed } })),
      commentCount: fmt(cur.comments + mine.length),
      commentsOpen, comments, draft, cantSend: !canSend, sendBg: canSend ? '#ff6a00' : '#c9d3e1',
      openComments: () => this.setState({ commentsOpen: true }),
      closeComments: () => this.setState({ commentsOpen: false }),
      setDraft: (e) => { if (e && e.target) this.setState({ draft: String(e.target.value || '') }); },
      send: () => this.setState((s) => (s.draft.trim() === '' ? {} : { posted: { ...s.posted, [cur.id]: [s.draft.trim()].concat(s.posted[cur.id] || []) }, draft: '' }))
    };
  }
}
