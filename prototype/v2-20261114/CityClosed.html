<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A3 首页 · 城市未开通</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 6px 0 10px; background: linear-gradient(180deg, #fff0e3 0%, #fff8f2 70%, #f5f7fc 100%);">
    <div style="position: relative; display: flex; align-items: center; gap: 2px; padding-left: 14px; overflow: hidden;">
      <a href="CitySheet.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; min-height: 40px; margin-right: 6px; font-size: 16px; font-weight: 700; color: #202c42; text-decoration: none;">{{city}}<svg width="14" height="14" viewBox="0 0 24 24" fill="#202c42" aria-hidden="true"><path d="M6 9l6 6 6-6z"></path></svg></a>
      <span style="flex-shrink: 0; width: 1px; height: 16px; margin-right: 2px; background: #e8d5c4;"></span>
      <sc-for list="{{channels}}" as="ch" hint-placeholder-count="8">
        <a href="{{ch.href}}" style="flex-shrink: 0; position: relative; display: flex; align-items: center; min-height: 40px; padding: 0 9px; color: {{ch.c}}; font-size: {{ch.fs}}; font-weight: {{ch.w}}; text-decoration: none; white-space: nowrap;">{{ch.label}}<sc-if value="{{ch.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 3px; width: 16px; height: 3px; margin-left: -8px; border-radius: 3px; background: #ff6a00;"></span></sc-if></a>
      </sc-for>
      <span style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, rgba(255,243,232,0), #fff0e3);"></span>
    </div>
    <div style="padding: 0 16px;">
      <div style="display: flex; align-items: center; height: 40px; padding: 0 4px 0 0; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff;">
        <a href="Scan.dc.html" aria-label="扫一扫" style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 44px; margin: -2px 0; padding: 0 8px 0 12px; text-decoration: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>
          <span style="width: 1px; height: 16px; background: #e5ebf3;"></span>
        </a>
        <a href="SearchPre.dc.html" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; text-decoration: none;">
          <span style="flex-grow: 1; min-width: 0; font-size: 14px; color: #738096; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{placeholder}}</span>
          <span style="flex-shrink: 0; height: 32px; padding: 0 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center;">搜索</span>
        </a>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 2px 16px 16px;">
    <div style="background: #fff; border-radius: 16px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: #fff0e3; display: flex; align-items: center; justify-content: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M6 20V9l6-4 6 4v11M10 20v-5h4v5"></path></svg>
      </div>
      <div style="font-size: 18px; line-height: 25px; font-weight: 700;">潍坊城市站筹备中</div>
      <div style="font-size: 13px; color: #627187; line-height: 1.6;">本地活动、场馆和本地现货暂未上线。<br>全国发货商品和线上体验可以正常使用。</div>
      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <a href="HomeFull.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center;">切换到东营</a>
        <button type="button" onClick="{{toggleNotify}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{notifyBd}}; background: #fff; font: inherit; font-size: 14px; color: {{notifyC}}; white-space: nowrap; cursor: pointer;">{{notifyLabel}}</button>
      </div>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 17px; line-height: 24px; font-weight: 700;">全国可用</h2>
    <sc-for list="{{nation}}" as="n" hint-placeholder-count="3">
      <a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 14px; text-decoration: none; color: #202c42;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: {{n.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 500;">{{n.t}}</span>
          <span style="font-size: 12px; line-height: 17px; color: #627187;">{{n.s}}</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 60px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.c}}; font-size: 12px; font-weight: {{t.w}};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.c}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
        <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 4px; left: 50%; margin-left: 5px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #ff5200; color: #fff; font-size: 11px; line-height: 16px; text-align: center;">{{t.badge}}</span>
        </sc-if>
        <sc-if value="{{t.dot}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; top: 7px; left: 50%; margin-left: 9px; width: 8px; height: 8px; border-radius: 50%; background: #ff5200;"></span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // notify：是否已订阅本城开通通知；再点一次取消
    this.state = { notify: false };
  }
  renderVals() {
    const { notify } = this.state;
    const notifyLabel = notify ? '已订阅开通通知' : '开通后通知我';
    const notifyBd = notify ? '#159a70' : '#c9d3e1';
    const notifyC = notify ? '#11804a' : '#202c42';
    const toggleNotify = () => this.setState((s) => ({ notify: !s.notify }));

    // 城市未开通：频道只保留全国可用的 推荐、体验、商城
    const ACTIVE_CHANNEL = '推荐';
    const city = '潍坊';
    const placeholder = '搜索全国发货商品与线上体验';
    const channels = [
      ['推荐', 'HomeFull.dc.html'], ['体验', 'ExpCenter.dc.html'],
      ['商城', 'MallHome.dc.html']
    ].map(([label, href]) => {
      const on = label === ACTIVE_CHANNEL;
      return { label, href, on, c: on ? '#ff6a00' : '#202c42', fs: on ? '18px' : '15px', w: on ? 700 : 400 };
    });

    const ACTIVE = 0; // 0 首页 1 发现 2 消息 3 购物车 4 我的
    const tabs = [
      ['首页', 'HomeFull.dc.html', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', '', false],
      ['发现', 'Discover.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z', '', true],
      ['消息', 'Messages.dc.html', 'M4 5h16v11H9l-5 4zM8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01', '3', false],
      ['购物车', 'Cart.dc.html', 'M3 4h2l2 11h11l2-8H6M9 20a1 1 0 1 0 0-.1M17 20a1 1 0 1 0 0-.1', '3', false],
      ['我的', 'Mine.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6', '', false]
    ].map((t, i) => ({ label: t[0], href: t[1], d: t[2], badge: t[3], dot: t[4] && i !== ACTIVE, c: i === ACTIVE ? '#ff6a00' : '#738096', w: i === ACTIVE ? 500 : 400 }));

    const nation = [
      { t: '线上体验', s: '虚拟仿真、录播演示，无需到场', href: 'ExpCenter.dc.html', bg: '#e2f6ed', fg: '#159a70', d: 'M4 5h16v11H4zM8 20h8M12 16v4M10 8.5l4 2.5-4 2.5z' },
      { t: '全国发货商品', s: '厂家或授权经销商直发', href: 'MallHome.dc.html', bg: '#fff0e3', fg: '#ff6a00', d: 'M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a1.5 1.5 0 1 0 0-.1M17 19a1.5 1.5 0 1 0 0-.1' },
      { t: '线上课程', s: '理论课与编程课，可跨城学习', href: 'MallCourse.dc.html', bg: '#e6f0ff', fg: '#2f80ed', d: 'M4 6l8-3 8 3-8 3zM7 8v5c0 1.5 2.5 3 5 3s5-1.5 5-3V8' }
    ];

    return { city, placeholder, channels, tabs, nation, notifyLabel, notifyBd, notifyC, toggleNotify };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
