<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>询价报价比选与转订单</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 902px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="DemandList.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 25px;">报价比选</h1>
    <span style="margin-left: auto; margin-right: 8px; font-size: 12px; line-height: 17px; padding: 3px 8px; border-radius: 6px; background: #fff0e3; color: #ba470b; white-space: nowrap;">企业 · 东营港务物流</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #fff; border-radius: 14px;">
      <div style="display: flex; gap: 12px;">
        <img src="_blob/277bff54e5d7d5be019694787d4e648d.jpg" alt="行业测绘无人机" style="flex-shrink: 0; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; display: block; background: #eef2f8; font-size: 11px;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap;">行业测绘无人机（定制配置）</span>
          <span style="font-size: 13px; line-height: 18px; color: #536178;">测绘版 · RTK · 五镜头倾斜相机 · 2 台</span>
          <span style="font-size: 13px; line-height: 18px; color: #536178;">交付东营市 · 期望 12 月 15 日前</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; background: #f5f7fc; font-size: 13px; line-height: 18px; color: #536178;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff6a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg>
        <span style="flex-grow: 1; min-width: 0;">已收到 <b style="font-weight: 700; color: #e85400;">2</b> 份报价，截止 11/05 18:00</span>
        <span style="flex-shrink: 0; font-size: 12px; line-height: 18px; padding: 1px 6px; border-radius: 6px; background: #e6f0ff; color: #1d63c4; white-space: nowrap;">报价中</span>
      </div>
    </div>

    <div role="group" aria-label="排序" style="flex-shrink: 0; display: flex; gap: 8px;">
      <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="margin: -6px 0; padding: 6px 0; border: 0; background: none; font: inherit; cursor: pointer;"><span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; line-height: 18px; white-space: nowrap;">{{s.label}}</span></button>
      </sc-for>
    </div>

    <sc-for list="{{quotes}}" as="q" hint-placeholder-count="2">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid {{q.bd}}; background: {{q.bg}};">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 700; line-height: 21px; white-space: nowrap;">{{q.name}}</span>
          <span style="flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: #e2f6ed; color: #11804a; white-space: nowrap;">资质已审核</span>
          <span style="flex-shrink: 0; margin-left: auto; font-size: 12px; line-height: 17px; padding: 1px 6px; border-radius: 6px; background: {{q.badgeBg}}; color: {{q.badgeFg}}; white-space: nowrap;">{{q.badge}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 18px; color: #536178;">
          <span>型号：{{q.model}}</span>
          <span>{{q.seller}} · 第 1 版报价</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 0; border-radius: 10px; background: #f9fafb;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
            <span style="font-size: 17px; font-weight: 700; line-height: 24px; color: #e85400; white-space: nowrap;">{{q.unit}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">单价 / 台</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
            <span style="font-size: 17px; font-weight: 700; line-height: 24px; white-space: nowrap;">{{q.lead}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">交期</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
            <span style="font-size: 17px; font-weight: 700; line-height: 24px; white-space: nowrap;">{{q.valid}}</span>
            <span style="font-size: 12px; line-height: 17px; color: #738096; white-space: nowrap;">报价有效期至</span>
          </div>
        </div>
        <span style="font-size: 13px; line-height: 19px; color: #536178;">含：{{q.incl}}</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; line-height: 18px; color: #536178; white-space: nowrap;">合计（2 台）<b style="font-size: 16px; font-weight: 700; color: #e85400;">{{q.total}}</b></span>
          <a href="Chat.dc.html" style="flex-shrink: 0; margin-left: auto; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #c9d3e1; background: #fff; color: #202c42; font-size: 13px; line-height: 18px; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">咨询</a>
          <button type="button" aria-pressed="{{q.chosen}}" onClick="{{q.choose}}" style="flex-shrink: 0; min-height: 36px; min-width: 93px; margin: 0; padding: 0 14px; border-radius: 999px; border: 0; background: {{q.btnBg}}; color: {{q.btnFg}}; font: inherit; font-size: 13px; font-weight: 500; line-height: 18px; white-space: nowrap; cursor: pointer;">{{q.btnText}}</button>
        </div>
      </div>
    </sc-for>

    <div style="flex-shrink: 0; font-size: 12px; line-height: 19px; color: #627187;">选定后转为订单，按所选报价下单付款，销售方和开票方为所选商家。报价过期后需重新询价。</div>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <sc-if value="{{hasChosen}}" hint-placeholder-val="{{false}}">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">已选 {{chosenName}}</span>
        <span style="font-size: 20px; font-weight: 700; line-height: 28px; color: #e85400; white-space: nowrap;">{{chosenTotal}}</span>
      </div>
      <a href="{{checkoutHref}}" style="flex-shrink: 0; width: 160px; height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center; white-space: nowrap;">转为订单</a>
    </sc-if>
    <sc-if value="{{noChosen}}" hint-placeholder-val="{{true}}">
      <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; color: #627187; white-space: nowrap;">请选择一份报价</span>
      <button type="button" disabled="{{true}}" style="flex-shrink: 0; width: 160px; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #c9d3e1; color: #fff; font: inherit; font-size: 16px; font-weight: 500; white-space: nowrap; cursor: not-allowed;">转为订单</button>
    </sc-if>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 时间线：11/03。这是询价单（PdInquiry 发给 2 家商家）的报价回流，比选和转订单都在这里
    // sort：all 综合 / price 总价 / lead 交期；chosen：已选报价 id，空串 = 未选
    this.state = { sort: 'all', chosen: PrototypeData.param('quote') || '' };
  }
  renderVals() {
    const { sort, chosen } = this.state;
    const base = Object.values(PrototypeData.quotes);
    // 综合 = 原顺序；总价从低到高；交期从早到晚，相同时保持综合顺序
    const order = base.map((q, i) => ({ q, i }));
    if (sort === 'price') order.sort((a, b) => a.q.amount - b.q.amount || a.i - b.i);
    if (sort === 'lead') order.sort((a, b) => a.q.leadDay - b.q.leadDay || a.i - b.i);
    const quotes = order.map(({ q }) => {
      const on = q.id === chosen;
      return {
        ...q, chosen: on,
        bd: on ? '#ff6a00' : '#fff', bg: on ? '#fffdfb' : '#fff',
        btnBg: on ? '#ff6a00' : '#fff0e3', btnFg: on ? '#fff' : '#ba470b',
        btnText: on ? '已选择' : '选择此报价',
        choose: () => this.setState({ chosen: q.id })
      };
    });
    const sorts = [['all', '综合'], ['price', '总价'], ['lead', '交期']].map(([id, label]) => {
      const on = id === sort;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#202c42' : '#fff', fg: on ? '#fff' : '#202c42', pick: () => this.setState({ sort: id }) };
    });
    const cur = base.find((q) => q.id === chosen);
    return {
      checkoutHref: cur ? 'QuoteConfirm.dc.html?quote=' + cur.id + '&version=' + cur.version : 'QuoteGoods.dc.html',
      quotes, sorts,
      hasChosen: !!cur, noChosen: !cur,
      chosenName: cur ? cur.name : '',
      chosenTotal: cur ? cur.total : ''
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
