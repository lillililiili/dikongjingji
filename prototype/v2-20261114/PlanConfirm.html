    const quoteItems = [
      { name: '无人机巡检', qty: '6 次 × ¥1,800', amount: '¥10,800', isNew: false },
      { name: '机器狗夜巡', qty: '6 次 × ¥1,100', amount: '¥6,600', isNew: true },
      { name: '报告与隐患跟踪', qty: '', amount: '¥1,200', isNew: false }
    ];
    // 周期 11/02–01/18，共 6 次；此刻（11/01）还没有开始履约，日期只做计划展示
    const visits = ['11/02', '11/16', '12/01', '12/15', '01/04', '01/18'].map((date, i) => ({ date, aria: '第 ' + (i + 1) + ' 次 ' + date }));
    const terms = [
      { t: '每次巡检后 48 小时内交付报告与隐患清单' },
      { t: '影像存档保存 90 天' },
      { t: '交付文件通过受控链接下载' }
    ];
    // 付款节点由统一交易模块单列：确认方案后首付进入待支付；按次结算在每次验收后支付
    const payNodes = [
      { name: '首付 30%', amount: '¥5,580', state: cancelled ? '订单已取消，无需支付' : (confirmed ? '待支付' : '确认方案后支付'), sc: confirmed ? '#ba470b' : '#738096', ac: cancelled ? '#738096' : (confirmed ? '#e85400' : '#202c42') },
      { name: '按次结算 70%', amount: '¥13,020', state: cancelled ? '订单已取消，无需支付' : '每次验收后支付 ¥2,170，共 6 次', sc: '#738096', ac: cancelled ? '#738096' : '#202c42' }
    ];
    return {
      quoteItems, visits, terms, payNodes,
      planChip: confirmed ? '已确认' : (cancelled ? '已取消' : (expired ? '已过期' : '待确认')),
      planChipBg: confirmed ? '#e2f6ed' : (cancelled || expired ? '#eef2f8' : '#fff0e3'),
      planChipFg: confirmed ? '#11804a' : (cancelled || expired ? '#536178' : '#ba470b'),
      v1Open,
      v1Label: v1Open ? '收起 v1' : '查看 v1',
      v1Chevron: v1Open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      toggleV1: () => this.setState((s) => ({ v1Open: !s.v1Open })),
      agree,
      notAgree: !agree,
      pending: open,
      confirmed,
      expired,
      cancelled,
      canConfirm: open && agree,
      confirmLocked: open && !agree,
      showValid: open || expired,
      canCancel: open || expired,
      toggleAgree: () => this.setState((s) => ({ agree: !s.agree })),
      // 只有勾选后才能确认；已确认后再次调用不改变任何状态（不会重复确认）
      confirm: () => this.setState((s) => (s.agree && !s.confirmed ? { confirmed: true } : {})),
      cancelSheetOpen: cancelSheet,
      openCancel: () => this.setState({ cancelSheet: true }),
      closeCancel: () => this.setState({ cancelSheet: false }),
      // 取消只发生在确认之前；取消后不能再确认
      confirmCancel: () => this.setState({ cancelSheet: false, cancelled: true, agree: false })
    };
  }
}
