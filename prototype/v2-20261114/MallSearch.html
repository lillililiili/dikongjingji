<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B3 全局搜索结果</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-bottom: 1px solid #f0f1f3;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 4px 16px 0 4px;">
      <a href="SearchPre.dc.html" aria-label="返回" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <a href="SearchPre.dc.html" aria-label="修改搜索词" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 999px; border: 1.5px solid #ff6a00; background: #fff; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#627187" stroke-width="2" style="flex-shrink: 0;" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="flex-grow: 1; min-width: 0; font-size: 15px; color: #202c42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">测绘</span>
        <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#c9d3e1"></circle><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2"></path></svg>
        <span style="flex-shrink: 0; height: 32px; padding: 0 16px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 14px; font-weight: 500; display: flex; align-items: center;">搜索</span>
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 8px;">
      <sc-for list="{{scopes}}" as="s" hint-placeholder-count="6">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="position: relative; width: 100%; height: 42px; margin: 0; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: {{s.fs}}; font-weight: {{s.w}}; color: {{s.c}}; white-space: nowrap;">{{s.label}}<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: 4px; width: 16px; height: 3px; margin-left: -8px; border-radius: 3px; background: #ff6a00;"></span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px;">
    <sc-if value="{{showGoods}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px;">
        <div style="display: flex; align-items: center; height: 36px; font-size: 15px; line-height: 21px; font-weight: 700;">商品 · 2</div>
        <sc-for list="{{goods}}" as="p" hint-placeholder-count="2">
          <a href="{{p.href}}" style="display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid #f0f1f3; text-decoration: none; color: #202c42;">
            <div style="position: relative; flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #eef0f3; display: flex; align-items: center; justify-content: center;">
              <sc-if value="{{p.img}}" hint-placeholder-val="{{true}}">
                <img src="{{p.img}}" alt="{{p.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
              </sc-if>
              <sc-if value="{{p.ph}}" hint-placeholder-val="{{false}}">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="商品图（待授权素材）"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7z"></path></svg>
              </sc-if>
            </div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.pre}}<span style="color: #ff6a00;">{{p.hit}}</span>{{p.post}}</span>
              <span style="font-size: 12px; line-height: 18px; color: #627187; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.sub}}</span>
              <div style="display: flex; align-items: baseline; gap: 6px; height: 22px; white-space: nowrap;">
                <span style="font-size: 16px; line-height: 22px; font-weight: 700; color: #e85400;">{{p.price}}</span>
                <span style="margin-left: auto; font-size: 12px; line-height: 17px; color: #536178;">{{p.sellers}}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showSvc}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px;">
        <div style="display: flex; align-items: center; height: 36px;">
          <span style="font-size: 15px; line-height: 21px; font-weight: 700;">服务 · 2</span>
          <sc-if value="{{all}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{showAllSvc}}" style="margin: -4px 0 -4px auto; height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap; cursor: pointer;">查看全部 ›</button>
          </sc-if>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #f0f1f3;">
          <a href="SvcSurvey.dc.html" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #202c42;">
            <img src="_blob/b6a30fa51bcba7d4ced06ace8b4d74ed.png" alt="无人机航测作业" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; object-fit: cover; display: block;">
            <div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">无人机航测与三维建模</span>
              <span style="font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">按项目报价 · 4 家服务商可接单</span>
            </div>
          </a>
          <a href="Demand.dc.html" style="flex-shrink: 0; height: 44px; display: flex; align-items: center; text-decoration: none;"><span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #fff0e3; color: #ba470b; font-size: 13px; line-height: 18px; font-weight: 500; display: flex; align-items: center; white-space: nowrap;">提需求</span></a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showAct}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px;">
        <div style="display: flex; align-items: center; height: 36px; font-size: 15px; line-height: 21px; font-weight: 700;">活动 · 1</div>
        <a href="ActDetail.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f0f1f3; text-decoration: none; color: #202c42;">
          <img src="_blob/248020917b29731ae2eb5c415d406dd0.webp" alt="户外飞行训练场地" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; object-fit: cover; display: block;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 6px; height: 20px;">
              <span style="flex-shrink: 0; font-size: 11px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: #eee7ff; color: #6a4fe0;">培训</span>
              <span style="min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">无人机<span style="color: #ff6a00;">测绘</span>员技能培训</span>
            </div>
            <span style="font-size: 16px; line-height: 22px; font-weight: 700; color: #e85400;">询价</span>
          </div>
        </a>
      </div>
    </sc-if>

    <sc-if value="{{showContent}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 0 12px;">
        <div style="display: flex; align-items: center; height: 36px; font-size: 15px; line-height: 21px; font-weight: 700;">内容 · 1</div>
        <a href="ContentArticle.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f0f1f3; text-decoration: none; color: #202c42;">
          <img src="_blob/e42bb39cca5b4f528e6577da8445bced.webp" alt="园区航测现场" style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; object-fit: cover; display: block;">
          <span style="flex-grow: 1; min-width: 0; font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><span style="color: #1d63c4; font-weight: 400;">案例</span> · 无人机航测如何三天出图</span>
        </a>
      </div>
    </sc-if>

    <sc-if value="{{showExample}}" hint-placeholder-val="{{true}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px dashed #c9d3e1;">
        <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #536178;">无结果时（状态示例）</span>
        <span style="font-size: 14px; line-height: 20px;">没有找到“激光雷达模块”</span>
        <span style="font-size: 12px; line-height: 17px; color: #627187;">换个关键词试试，或者直接把需求发给平台，由商家报价。</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <a href="Demand.dc.html" style="height: 44px; display: flex; align-items: center; text-decoration: none;"><span style="height: 34px; padding: 0 14px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 13px; line-height: 18px; font-weight: 500; display: flex; align-items: center; white-space: nowrap;">发布采购需求</span></a>
          <a href="Chat.dc.html" style="flex-shrink: 0; height: 44px; display: flex; align-items: center; text-decoration: none;"><span style="height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #c9d3e1; color: #202c42; font-size: 13px; line-height: 18px; display: flex; align-items: center; white-space: nowrap;">联系客服</span></a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showVenueEmpty}}" hint-placeholder-val="{{false}}">
      <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 16px; background: #fff; border-radius: 12px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="font-size: 14px; line-height: 20px; color: #536178;">没有找到相关场馆</span>
      </div>
    </sc-if>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // 当前搜索范围，初始为“综合”（与静态稿一致）
    this.state = { scope: '综合' };
  }
  renderVals() {
    const { scope } = this.state;
    // 搜索范围切换：综合显示全部分组；其他范围只显示对应分组；“场馆”下无“测绘”结果，显示空状态
    const scopes = ['综合', '商品', '服务', '活动', '内容', '场馆'].map((label) => {
      const on = label === scope;
      return {
        label, on, pressed: on ? 'true' : 'false',
        c: on ? '#202c42' : '#627187', fs: on ? '16px' : '15px', w: on ? 700 : 400,
        pick: () => this.setState({ scope: label })
      };
    });
    const all = scope === '综合';
    const showGoods = all || scope === '商品';
    const showSvc = all || scope === '服务';
    const showAct = all || scope === '活动';
    const showContent = all || scope === '内容';
    // “无结果时（状态示例）”是设计说明卡，只在综合里保留
    const showExample = all;
    const showVenueEmpty = scope === '场馆';
    // 命中词“测绘”高亮：pre + hit + post；价格不明确写“询价”
    const goods = [
      { pre: '行业', hit: '测绘', post: '无人机', sub: '定制配置 · 含培训 · 厂家直营', price: '询价', sellers: '按项目报价', href: 'PdInquiryFull.dc.html', img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg', alt: '行业测绘无人机' },
      { pre: '', hit: '测绘', post: '相机云台（配件）', sub: '适配主流行业机型', price: '¥6,400', sellers: '2 家在售', href: 'PdFull.dc.html', img: '', alt: '测绘相机云台' }
    ].map((p) => ({ ...p, ph: !p.img }));
    return {
      scopes, goods, showGoods, showSvc, showAct, showContent, showExample, showVenueEmpty, all,
      // 各组“查看全部”到对应范围 Tab（HomeMallSpec 全局搜索一节）
      showAllSvc: () => this.setState({ scope: '服务' })
    };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
