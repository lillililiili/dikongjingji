</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // session：选中的场次（空 = 还没选，主按钮是「选择场次」）；ask：没选场次就点了主按钮
    // fav：是否已收藏；nav：点了活动地点（地图导航未画，只在页内提示）
    this.state = { session: '', ask: false, fav: false, nav: false, navDone: '' };
  }
  renderVals() {
    const { session, ask, fav, nav, navDone } = this.state;
    const frame = this.props.frame ?? '报名中';
    const ended = frame === '活动结束';
    const closed = ended || frame === '报名截止';
    const allFull = frame === '全部已满';
    // 与 HomeAct、Signup 同一份数据；11/22 上午场是为“改到其他场次”补的第三场（设计假设），每场 60 个名额
    const raw = [
      { id: 'am', day: '11/14 周六', time: '上午 10:00', left: 25, signin: '09:40 起签到', end: '11/13 18:00' },
      { id: 'pm', day: '11/14 周六', time: '下午 14:00', left: 40, signin: '13:40 起签到', end: '11/13 18:00' },
      { id: 'next', day: '11/21 周六', time: '上午 10:00', left: 60, signin: '09:40 起签到', end: '11/20 18:00' }
    ].map((s) => ({ ...s, left: allFull ? 0 : s.left }));
    const sessions = raw.map((s) => {
      const on = !closed && s.id === session;
      const full = s.left === 0;
      const dim = closed || full;
      let seat = full ? '已满 · 可候补' : `余 ${s.left}`;
      if (closed) seat = ended ? '已结束' : '已截止';
      return {
        day: s.day, time: s.time, seat, on, dis: closed,
        bd: on ? '#ff6a00' : '#e5ebf3',
        bg: on ? '#fffaf5' : (dim ? '#f5f7fc' : '#fff'),
        tc: on ? '#ba470b' : (dim ? '#738096' : '#202c42'),
        sc: dim && !on ? '#91a0b4' : '#627187',
        qc: on && full ? '#ba470b' : (dim ? '#738096' : '#627187'),
        cur: closed ? 'not-allowed' : 'pointer',
        pick: () => this.setState({ session: s.id, ask: false, nav: false })
      };
    });
    // 主按钮四态：没选场次 → 选择场次；选了有余位的 → 立即报名；选了已满的 → 加入候补；截止或结束 → 置灰
    const cur = raw.find((s) => s.id === session);
    const picked = !closed && Boolean(cur);
    const curFull = picked && cur.left === 0;
    let sessionLine = picked ? `${cur.signin} · 报名截止 ${cur.end}` : '选好场次后显示签到和报名截止时间';
    if (!picked && ask) sessionLine = '请先选择一个场次';
    if (curFull) sessionLine = '本场已满，加入候补后有名额会通知你';
    if (frame === '报名截止') sessionLine = '报名已截止，下次开放请留意赛事研学频道';
    if (ended) sessionLine = '本期活动已结束';
    return {
      seatLine: picked ? `已报名 ${60 - cur.left} / 60` : '每场 60 个名额',
      sessions,
      sessionLine,
      lineColor: !closed && !picked && ask ? '#ba470b' : '#627187',
      showTeam: !closed,
      // 导航：点活动地点弹出选地图面板；选了哪个地图，就在原来提示的位置写一句
      navOpen: nav, navDone: !!navDone, navDoneText: navDone,
      toggleNav: () => this.setState({ nav: true }),
      navClose: () => this.setState({ nav: false }),
      navApps: [['高德地图', 'amap'], ['百度地图', 'baidu'], ['苹果地图', 'apple']].map(([label]) => ({ label, pick: () => this.setState({ nav: false, navDone: '已用' + label + '打开导航' }) })),
      fav,
      favLabel: fav ? '已收藏' : '收藏',
      favColor: fav ? '#ff6a00' : '#536178',
      favFill: fav ? '#ff6a00' : 'none',
      toggleFav: () => this.setState((st) => ({ fav: !st.fav })),
      needPick: !closed && !picked,
      askPick: () => this.setState({ ask: true, nav: false }),
      canSignup: picked && !curFull,
      canWait: curFull,
      closed,
      closedLabel: ended ? '活动已结束' : '报名已截止'
    };
  }
}
