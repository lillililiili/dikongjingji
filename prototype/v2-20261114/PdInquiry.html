<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PD3 询价单</title>
<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f5f7fc; font-family: 'PingFang SC','Noto Sans SC',sans-serif; color: #202c42; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 8px; background: #fff;">
    <a href="PdInquiryFull.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202c42" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700;">填写询价单</h1>
    <span style="margin-left: auto; margin-right: 8px; font-size: 12px; color: #627187;">APP-MALL-06</span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px;">
    <div style="display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 12px;">
      <img src="_blob/277bff54e5d7d5be019694787d4e648d.jpg" alt="行业测绘无人机" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px;">
        <span style="font-size: 15px; font-weight: 500; line-height: 21px;">行业测绘无人机</span>
        <span style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap;"><span style="font-size: 15px; font-weight: 700; line-height: 21px; color: #e85400;">询价</span><span style="font-size: 12px; line-height: 17px; color: #e85400;">按配置与数量报价</span></span>
        <span style="font-size: 12px; line-height: 17px; color: #627187;">3 家可报价 · 东营可售</span>
      </div>
    </div>

    <div style="background: #fff; border-radius: 12px; padding: 4px 14px;">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #f0f1f3;">
          <span style="width: 76px; font-size: 14px; color: #536178; flex-shrink: 0;">{{f.k}}<span style="color: #d64f67;">{{f.req}}</span></span>
          <span style="font-size: 14px; flex-grow: 1; color: {{f.c}};">{{f.v}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#91a0b4" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </div>
      </sc-for>
      <div style="padding: 10px 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; color: #536178;">补充说明</span>
        <div style="min-height: 36px; border-radius: 8px; background: #f5f7fc; padding: 8px 10px; font-size: 13px; color: #536178; line-height: 1.5;">需要正射影像与三维建模，含 2 名飞手培训。</div>
      </div>
    </div>

    <div style="background: #fff; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline;">
        <span style="font-size: 15px; font-weight: 500;">发给哪些商家</span>
        <span style="margin-left: auto; font-size: 12px; color: #627187;">已选 {{pickedCount}} / 3</span>
      </div>
      <sc-for list="{{sellers}}" as="s" hint-placeholder-count="3">
        <label style="display: flex; align-items: center; gap: 10px; min-height: 36px; margin: -4px 0; padding: 4px 0; cursor: pointer;">
          <input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" style="accent-color: #ff6a00; width: 18px; height: 18px; margin: 0;">
          <span style="font-size: 14px;">{{s.n}}</span>
          <span style="font-size: 12px; color: #627187; margin-left: auto;">{{s.m}}</span>
        </label>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #627187; line-height: 1.6;">提交后商家在 2 个工作日内报价，报价会通过“消息”通知你，并在“我的 → 需求与报价”中比选。提交询价不产生费用。</div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">
    <a href="DemandList.dc.html" style="height: 46px; border-radius: 999px; background: #ff6a00; color: #fff; font-size: 16px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center;">提交询价</a>
  </div>
</div>
</template><script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { picked: { maker: true, agent: true, survey: false } };
  }
  renderVals() {
    const { picked } = this.state;
    const fields = [
      { k: '配置', req: '*', v: '测绘版 · RTK · 五镜头倾斜相机', c: '#202c42' },
      { k: '数量', req: '*', v: '2 台', c: '#202c42' },
      { k: '交付城市', req: '*', v: '东营市', c: '#202c42' },
      { k: '期望交期', req: '', v: '12 月 15 日前', c: '#202c42' },
      { k: '询价身份', req: '*', v: '企业 · 东营港务物流（可开专票）', c: '#202c42' }
    ];
    const sellers = [
      { id: 'maker', n: '示例无人机厂家', m: '厂家直营 · 东营可售' },
      { id: 'agent', n: '示例行业装备代理', m: '授权经销 · 含培训' },
      { id: 'survey', n: '示例测绘服务商', m: '本地服务商' }
    ].map((s) => ({
      ...s,
      on: !!picked[s.id],
      toggle: () => this.setState((st) => ({ picked: { ...st.picked, [s.id]: !st.picked[s.id] } }))
    }));
    const pickedCount = sellers.filter((s) => s.on).length;
    return { fields, sellers, pickedCount };
  }
}

window.mountBoard(document.getElementById('tpl').innerHTML,Component,{},document.getElementById('root'));
(function(){var root=document.getElementById('root');var first=root.firstElementChild;if(first&&/background:\s*#000/.test(first.getAttribute('style')||''))document.getElementById('phone').classList.add('dark');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min((w-40)/418,(h-40)/872,1);if(!(s>0.2))s=0.2;document.querySelector('.stage').style.setProperty('--s',String(s))}fit();window.addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,400)})();</script></body></html>
