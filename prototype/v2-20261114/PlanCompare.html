class Component extends DCLogic {
  constructor(...args) {

    // tab：页内点过的标签（compare / eagle / yrd / anxun），空串时听 Tweaks 的 frame；pick：对比表里选中的方案；hint：未绘制目标的提示

        ],
        how: '无人机巡检 + 机器狗夜巡', period: '3 个月 · 共 6 次 · 11/02 首次进场',
        terms: [{ t: '每次巡检后 48 小时内交付报告与隐患清单' }, { t: '影像存档保存 90 天' }].concat(fixed),
        first: '¥5,580', rest: '¥13,020'
      },
      yrd: {
        name: '黄河口飞服', ver: 1, updated: '10/30 报价', price: '¥15,200', delta: '',
        items: [
          { name: '无人机巡检', qty: '6 次 × ¥2,200', amount: '¥13,200' },
          { name: '报告与影像存档', qty: '', amount: '¥2,000' }
        ],
        how: '无人机巡检，不含夜间巡查', period: '3 个月 · 共 6 次 · 11/05 首次进场',
        terms: [{ t: '每次巡检后 72 小时内交付报告' }, { t: '影像存档保存 30 天' }].concat(fixed),
        first: '¥4,560', rest: '¥10,640'
      },
      anxun: {
        name: '东营安巡科技', ver: 1, updated: '10/30 报价', price: '¥21,000', delta: '',
        items: [
          { name: '机器狗巡检', qty: '6 次 × ¥2,400', amount: '¥14,400' },

          { name: '隐患闭环跟踪', qty: '', amount: '¥1,800' }
        ],
        how: '机器狗巡检 + 人工复核', period: '3 个月 · 共 6 次 · 11/09 首次进场',
        terms: [{ t: '每次巡检后 48 小时内交付报告' }, { t: '隐患闭环跟踪到整改完成' }].concat(fixed),
        first: '¥6,300', rest: '¥14,700'
      }
    };
    const ids = ['eagle', 'yrd', 'anxun'];
    const isCompare = view === 'compare';
    // 详情页的目标 = 正在看的那家；对比页的目标 = 表头选中的那家
    const target = isCompare ? pick : view;
    const cur = plans[target];
    const plan = {
      ...cur,
      pays: [
        { name: '首付 30%', amount: cur.first, state: '确认方案后支付' },

      const on = id === view;

      return { name: plans[id].name, on, off: !on, bg: on ? '#fff0e3' : '#fff', pick: () => this.setState({ pick: id, hint: '' }) };
    });

    // 对比项：除总价外都按定稿 13 的“工期、资质”和方案内容列出；付款节点三家一致，不单列（平台统一规则）
    const table = [
      ['总价', ['¥18,600', '¥15,200', '¥21,000'], 'price'],
      ['方案版本', ['v2', 'v1', 'v1']],
      ['资质', ['已审核', '已审核', '已审核']],
      ['服务团队', ['东营本地', '东营本地', '东营本地']],
      ['巡检方式', ['无人机 + 机器狗', '无人机', '机器狗 + 人工复核']],
      ['工期', ['3 个月 · 6 次', '3 个月 · 6 次', '3 个月 · 6 次']],
      ['首次进场', ['11/02', '11/05', '11/09']],
      ['夜间巡查', ['机器狗夜巡', '不含', '机器狗巡查']],
      ['报告时效', ['48 小时内', '72 小时内', '48 小时内']],
      ['交付物', ['巡检报告、隐患清单、影像存档', '巡检报告、影像存档', '报告、隐患闭环跟踪']],
      ['影像存档', ['90 天', '30 天', '不含']]
    ];
    const rows = table.map(([label, texts, kind]) => ({
      label,
      cells: texts.map((t, i) => {
        const none = t === '不含';
        return {
          t, bg: ids[i] === pick ? '#fffaf5' : '#fff',
          fs: kind === 'price' ? '15px' : '13px', w: kind === 'price' ? 700 : 400,
          fg: kind === 'price' ? '#e85400' : (none ? '#738096' : '#202c42')
        };
      })
    }));

    return {
      tabs, heads, rows, plan,
      isCompare, isDetail: !isCompare,
      // 三家的「服务商主页」和「确认选择」都接 ProviderPage、PlanConfirm 这两份样例（样例数据是鹰眼的；正式产品按 providerId、planId 打开对应那家）
      ctaText: '确认选择 ' + cur.name,
      hasHint: hint !== '', hint,
      closeHint: () => this.setState({ hint: '' }),
      viewPlan: () => this.setState((s) => ({ tab: s.pick, hint: '' }))
    };
  }
}
