class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // fav：是否已收藏；share、copied：分享面板是否打开、这次打开后是否已复制
    this.state = { fav: false, share: false, copied: false };
  }
  renderVals() {
    const { fav, share, copied } = this.state;
    // 服务方式、交付物与 ProviderPage、Contract 一致；机器狗能力与 PdRental 一致（可见光、热成像、预设路线、续航约 2 小时）
    const facts = [
      { k: '场景', v: '园区改扩建前的地形测绘' },
      { k: '方式', v: '无人机航测 + 实景三维建模' },
      { k: '周期', v: '外业 1 天，内业 2 天' },
      { k: '交付', v: '正射影像、三维模型、成果报告' }
    ];
    const steps = [
      { n: 1, t: '第 1 天 外业采集', d: '布设像控点，按航线分区飞行，当天检查影像重叠度。' },
      { n: 2, t: '第 2 天 内业处理', d: '空三加密、生成正射影像和实景三维模型。' },
      { n: 3, t: '第 3 天 检核交付', d: '用检查点比对精度，写进成果报告后交付。' }
    ];
    const deliver = [
      { t: '正射影像', d: '带坐标，可量距和量面积' },
      { t: '三维模型', d: '可在线查看和量测' },
      { t: '成果报告', d: '精度检核结果和作业说明' }
    ];
    return {
      shareOpen: share,
      canCopy: !copied,
      copied,
      openShare: () => this.setState({ share: true }),
      copyLink: () => this.setState({ copied: true }),
      // 关闭时清掉“已复制”，下次打开回到可复制状态
      closeShare: () => this.setState({ share: false, copied: false }),
      facts, steps, deliver,
      fav,
      favLabel: fav ? '已收藏' : '收藏',
      favColor: fav ? '#ff6a00' : '#536178',
      favFill: fav ? '#ff6a00' : 'none',
      toggleFav: () => this.setState((s) => ({ fav: !s.fav }))
    };
  }
}
