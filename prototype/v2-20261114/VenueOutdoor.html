class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    // proj 项目；day 日期；slot 已选场次（空 = 还没选）；hint 导航、电话的页内提示
    // 时间线：今天 = 11/03 周二上午，10:00 场已结束。定稿默认选中今天 14:00
    this.state = { proj: 'robot', day: 'today', slot: '14:00', hint: '', sheet: '' };
  }
  renderVals() {
    const { proj, day, slot, hint, sheet } = this.state;
    // limit：项目自己的限制，写在项目卡里（示例规则，待场馆确认）；年龄沿用 meta 里已有的写法
    const projectList = [
      { id: 'robot', name: '真机试飞（教练陪同）', meta: '30 分钟 · 10 岁以上 · 每场 6 人', limit: '教练一对一带飞，需穿运动鞋' },
      { id: 'drone', name: '航拍体验', meta: '20 分钟 · 12 岁以上 · 每场 6 人', limit: '由飞手操作，体验者负责取景' },
      { id: 'code', name: '营地自然课堂', meta: '45 分钟 · 6 岁以上 · 每场 15 人', limit: '户外活动，请自备防晒' }
    ];
    const dayList = [['today', '今天'], ['tomorrow', '明天'], ['sat', '11/07 周六'], ['sun', '11/08 周日']];
    // 余位：数字 = 余 n；0 = 已满；'end' = 已结束。今天的数据与首页“今天去体验”、核销工作台对齐
    const table = {
      robot: {
        today: [['10:00', 'end'], ['14:00', 5], ['15:00', 8], ['15:30', 2], ['17:00', 0]],
        tomorrow: [['10:00', 8], ['14:00', 6], ['15:30', 8], ['17:00', 4]],
        sat: [['10:00', 0], ['11:00', 1], ['14:00', 3], ['15:30', 6], ['17:00', 8]],
        sun: [['10:00', 4], ['11:00', 7], ['14:00', 0], ['15:30', 2], ['17:00', 8]]
      },
      drone: {
        today: [['10:00', 'end'], ['14:00', 6], ['16:00', 4]],
        tomorrow: [['10:00', 8], ['14:00', 8], ['16:00', 5]],
        sat: [['10:00', 0], ['14:00', 2], ['16:00', 6]],
        sun: [['10:00', 3], ['14:00', 8], ['16:00', 8]]
      },
      code: {
        today: [],
        tomorrow: [],
        sat: [['10:30', 6], ['14:30', 3]],
        sun: [['10:30', 0], ['14:30', 7]]
      }
    };
    const projects = projectList.map((p) => {
      const on = p.id === proj;
      return {
        name: p.name, on,
        bd: on ? '#ff6a00' : '#e5ebf3',
        bg: on ? '#fff0e3' : '#fff',
        c: on ? '#ba470b' : '#202c42',
        w: on ? 500 : 400,
        // 换项目后日期不变，已选场次清空
        pick: () => this.setState({ proj: p.id, slot: '' })
      };
    });
    const cur = projectList.find((p) => p.id === proj);
    const days = dayList.map(([id, label]) => {
      const on = id === day;
      return {
        label, on,
        bg: on ? '#ff6a00' : '#eef2f8',
        c: on ? '#fff' : '#202c42',
        w: on ? 500 : 400,
        pick: () => this.setState({ day: id, slot: '' })
      };
    });
    const dayLabel = dayList.find((d) => d[0] === day)[1];
    const rows = table[proj][day];
    const slots = rows.map(([time, left]) => {
      const off = left === 'end' || left === 0;
      const on = time === slot && !off;
      const tight = !off && left <= 2;
      return {
        time, on, off,
        sub: left === 'end' ? '已结束' : (left === 0 ? '已满' : '余 ' + left),
        bd: on ? '#ff6a00' : '#e5ebf3',
        bg: on ? '#fffaf5' : (off ? '#f5f7fc' : '#fff'),
        tc: on ? '#ba470b' : (off ? '#91a0b4' : '#202c42'),
        sc: on || tight ? '#ba470b' : (off ? '#738096' : '#627187'),
        cur: off ? 'not-allowed' : 'pointer',
        pick: off ? () => {} : () => this.setState({ slot: time })
      };
    });
    const devices = [
      { name: '编程机器人探索套装', img: '_blob/5d32505e8b9a494f8436e31c3008ef99.jpg' },
      { name: '便携航拍无人机', img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg' },
      { name: '巡检机器狗', img: '_blob/a016bad56a0e687061b30b2a4fd96ff6.jpg' },
      { name: '无人机配件套装', img: '_blob/44b9df29cd316503b6cad0f764a0798b.jpg' }
    ];
    // 入口、检票、迟到规则是示例规则（待场馆确认），在页面上标“示例”
    const info = [
      ['营地设施', '飞行场 · 休息区 · 充电点'],
      ['可承接活动', '研学、培训、团建'],
      ['到场须知', '请提前 15 分钟到营地，出示核销码入场'],
      ['入口', '东门入场，西门离场', true],
      ['检票', '开场前 15 分钟开始检票', true],
      ['迟到规则', '开场 10 分钟后停止入场', true],
      ['运营主体', '黄河口户外飞行营地']
    ].map(([k, v, eg]) => ({ k, v, eg: Boolean(eg) }));
    const picked = Boolean(slot);
    const flip = (text) => () => this.setState((s) => ({ hint: s.hint === text ? '' : text }));
    return {
      projects, cur, days, slots, devices, info, hint,
      hasSlots: rows.length > 0,
      noSlots: rows.length === 0,
      hasOff: slots.some((s) => s.off),
      emptyTitle: dayLabel + '没有这个项目的场次',
      canBook: picked,
      cantBook: !picked,
      barLine: picked ? dayLabel + ' ' + slot + ' · 1 人' : '请选择场次',
      closeHint: () => this.setState({ hint: '' }),
      navOpen: sheet === 'nav', callOpen: sheet === 'call',
      navTap: () => this.setState({ sheet: 'nav', hint: '' }),
      callTap: () => this.setState({ sheet: 'call', hint: '' }),
      sheetClose: () => this.setState({ sheet: '' }),
      navApps: [['高德地图', 'amap'], ['百度地图', 'baidu'], ['苹果地图', 'apple']].map(([label]) => ({ label, pick: () => this.setState({ sheet: '', hint: '已用' + label + '打开导航' }) })),
      callRows: [{ label: '拨打 0546-8000 0000', pick: () => this.setState({ sheet: '', hint: '已拨打场馆电话 0546-8000 0000' }) }]
    };
  }
}
