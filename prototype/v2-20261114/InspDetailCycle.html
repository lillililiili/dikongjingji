class Component extends DCLogic {
  renderVals() {
    const capabilities = ['无人机', '机器狗', '巡检报告'];
    // 设计假设：按项目报价的服务不走立即预约，走需求发布，报价比选后进方案确认
    const scope = [
      ['周界巡查', 'M5 9l2-3 2 3v11H5zM15 9l2-3 2 3v11h-4zM2 12h20M2 16h20'],
      ['夜间巡逻', 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'],
      ['重点区域巡查', 'M12 21c4.6-4.7 7-8.1 7-11a7 7 0 0 0-14 0c0 2.9 2.4 6.3 7 11zM12 12.5a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5z'],
      ['隐患排查', 'M12 4l9 16H3zM12 10v4M12 17h.01']
    ].map(([label, d]) => ({ label, d }));
    // 价格与取消：原“按项目报价怎么定”卡并入这里，不再单独成卡；确认方案后的取消细则没定，只写“按方案约定”
    const priceRows = [
      ['计价方式', '按项目报价，真实金额在方案里确认'],
      ['影响价格', '园区面积、巡检频次、设备组合'],
      ['取消说明', '方案确认前取消不收费，确认后按方案约定']
    ].map(([k, v], i) => ({ k, v, line: i === 0 ? '#fff' : '#f0f1f3' }));
    const steps = [
      ['发布需求', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4'],
      ['报价比选', 'M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4'],
      ['方案确认', 'M9 4h6v3H9zM7 5H5v16h14V5h-2M9 14l2 2 4-4'],
      ['现场巡检', 'M12 10v4M8 12h8M5 6a2 2 0 1 0 0 .1M19 6a2 2 0 1 0 0 .1M5 18a2 2 0 1 0 0 .1M19 18a2 2 0 1 0 0 .1M7 8l3 3M17 8l-3 3M7 16l3-3M17 16l-3-3'],
      ['报告验收', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5']
    ].map(([label, d], i, arr) => ({ label, d, arrow: i < arr.length - 1 }));
    // 和交付与验收页的三类文件一致
    const deliverables = [
      ['巡检报告', 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6'],
      ['隐患清单', 'M4 5h16v14H4zM4 10h16M4 15h16M10 5v14'],
      ['影像存档', 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9.5h.01']
    ].map(([label, d]) => ({ label, d }));
    const guarantees = [
      ['专业飞手', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5'],
      ['合规作业', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 10.5h6M9 14h6'],
      ['数据保密', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9.5 11.5h5V15h-5zM10.5 11.5V10a1.5 1.5 0 0 1 3 0v1.5']
    ].map(([label, d]) => ({ label, d }));
    return { capabilities, priceRows, scope, steps, deliverables, guarantees };
  }
}
