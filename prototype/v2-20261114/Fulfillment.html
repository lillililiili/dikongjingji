class Component extends DCLogic {
  renderVals() {
    // 本页对客户只读：进度、排期与状态都由服务商按实际作业在服务端更新，客户端不提供改状态的按钮
    // 进度条共 6 格，已完成 1 次
    const TOTAL = 6;
    const DONE = 1;
    const segments = Array.from({ length: TOTAL }, (_, i) => ({ bg: i < DONE ? '#ff6a00' : '#e5ebf3' }));

    // 第 1 次在模板里单独展开（含作业时间与交付入口）；这里是第 2–6 次：下一次已排期，其余待排期
    const rest = [
      ['第 2 次 · 11/16', '已排期 · 19:00', true],
      ['第 3 次 · 12/01', '待排期', false],
      ['第 4 次 · 12/15', '待排期', false],
      ['第 5 次 · 01/04', '待排期', false],
      ['第 6 次 · 01/18', '待排期', false]
    ];
    const visits = rest.map(([title, status, next], i) => ({
      title, status, next,
      bd: next ? '#ff6a00' : '#c9d3e1',
      tc: next ? '#202c42' : '#536178',
      tw: next ? 500 : 400,
      sc: next ? '#1d63c4' : '#738096',
      // 节点之间的连线：最后一次不画
      line: i === rest.length - 1 ? 'transparent' : '#e5ebf3'
    }));

    return { segments, visits };
  }
}
