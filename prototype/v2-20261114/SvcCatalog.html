<style>
body{margin:0}
a{color:#ba470b}a:hover{color:#a63c00}
input::placeholder{color:#738096;opacity:1}
</style>
<style>html,body{height:100%;overflow:hidden}body{margin:0;background:#1c1c1e;font-family:-apple-system,'PingFang SC',sans-serif}
.side{position:fixed;right:16px;bottom:14px;font-size:13px;color:#9a9a9a;z-index:20}.side select{margin-left:8px;font-size:13px}
.stage{position:fixed;left:50%;top:50%;width:390px;height:844px;transform:translate(-50%,-50%) scale(var(--s,1))}
.phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 12px #111,0 0 0 14px #3a3a3c,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#f5f7fc}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:9;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:15px;font-weight:600;color:#202c42;pointer-events:none}
.phone.dark .status{background:rgba(0,0,0,.25);color:#fff}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#111;border-radius:0 0 22px 22px;z-index:10}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;scrollbar-width:none;padding-top:44px;box-sizing:border-box;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}
.phone.dark .screen{padding-top:0}
.screen>div{overflow:visible!important}.screen>div>nav{position:sticky;bottom:0;z-index:5;padding-bottom:18px;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#202c42;z-index:11;opacity:.85}.phone.dark .home{background:#fff}
img{color:#999;font-size:11px}
</style><link rel="stylesheet" href="light-theme.css"><script src="light-theme.js"></script><link rel="stylesheet" href="prototype-v2.css"><script src="prototype-data.js"></script><script defer src="prototype-v2.js"></script></head><body>

<div class="stage"><div class="phone" id="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen" id="root"></div><div class="home"></div></div></div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px 16px 16px;">

      <div style="position: relative; flex-shrink: 0;">
        <sc-if value="{{c.isLink}}" hint-placeholder-val="{{true}}">
          <a href="{{c.href}}" style="display: flex; height: {{c.cardH}}; border-radius: 14px; background: #fff; overflow: hidden; color: #202c42; text-decoration: none;">
            <div style="position: relative; flex-shrink: 0; width: 118px; height: {{c.cardH}}; display: flex; align-items: center; justify-content: center; background: {{c.imgBg}};">
              <img src="{{c.img}}" alt="{{c.alt}}" style="width: {{c.imgW}}; height: {{c.imgH}}; object-fit: {{c.imgFit}}; display: block;">
              <span style="position: absolute; left: 0; top: 0; padding: 1px 8px; border-radius: 0 0 8px 0; background: {{c.catBg}}; color: #fff; font-size: 11px; line-height: 17px; font-weight: 500; white-space: nowrap;">{{c.cat}}</span>
            </div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 10px;">
              <span style="font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>

                  <span style="flex-shrink: 0; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 6px; border: 1px solid #159a70; color: #11804a; font-size: 11px; line-height: 18px; white-space: nowrap;">{{t}}</span>
                </sc-for>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: {{c.priceH}}; margin-top: 6px;">

                  <div style="display: flex; align-items: baseline; gap: 2px; height: 20px; white-space: nowrap;">
                    <span style="font-size: {{c.priceFs}}; line-height: 20px; font-weight: 700; color: #e85400;">{{c.price}}</span>
                    <span style="font-size: 12px; line-height: 17px; color: #738096;">{{c.unit}}</span>

              <span style="position: absolute; left: 0; top: 0; padding: 1px 8px; border-radius: 0 0 8px 0; background: {{c.catBg}}; color: #fff; font-size: 11px; line-height: 17px; font-weight: 500; white-space: nowrap;">{{c.cat}}</span>

              <span style="font-size: 16px; line-height: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.title}}</span>
              <span style="margin-top: 2px; font-size: 12px; line-height: 17px; color: #627187; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.desc}}</span>

                </sc-for>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: {{c.priceH}}; margin-top: 6px;">
                <div style="min-width: 0; display: flex; flex-direction: column;">
                  <div style="display: flex; align-items: baseline; gap: 2px; height: 20px; white-space: nowrap;">
                    <span style="font-size: {{c.priceFs}}; line-height: 20px; font-weight: 700; color: #e85400;">{{c.price}}</span>
                    <span style="font-size: 12px; line-height: 17px; color: #738096;">{{c.unit}}</span>
                  </div>
                  <span style="font-size: 12px; line-height: 16px; color: #738096; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.note}}</span>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px 24px; background: #fff; border-top: 1px solid #e5ebf3;">

      { id: 'maint', type: '设备维护', title: '无人机与机器人维护', cat: '综合', desc: '检测保养 · 故障维修 · 配件更换', tags: ['上门', '送修', '维修记录'], price: '¥299', unit: '/次起', note: '含检测保养，维修另报价', sortPrice: 299, modes: ['上门', '送修'], km: 1.8, jinan: true, img: '_blob/44b9df29cd316503b6cad0f764a0798b.jpg', alt: '无人机配件', icon: false, href: 'SvcMaint.dc.html' },
      { id: 'calib', type: '设备维护', title: '无人机校准与固件升级', cat: '无人机', desc: '传感器校准 · 固件升级 · 试飞检查', tags: ['送修', '校准记录'], price: '¥199', unit: '/次起', note: '含校准和固件升级', sortPrice: 199, modes: ['送修'], km: 1.8, jinan: true, img: '_blob/277bff54e5d7d5be019694787d4e648d.jpg', alt: '便携无人机', icon: false, href: 'SvcMaintCalib.dc.html' },

      { id: 'tech', type: '技术支持', title: '设备与作业技术支持', cat: '综合', desc: '设备调试 · 作业指导 · 现场保障', tags: ['远程', '驻场'], price: '按项目报价', unit: '', note: '方案确认后定价', sortPrice: null, modes: ['远程', '驻场'], km: 1.8, jinan: true, img: '_blob/822c9edc2d0d857c67055194c02161d3.jpg', alt: '设备调试现场', icon: false, href: 'SvcTech.dc.html' },

      { id: 'eventsup', type: '技术支持', title: '活动现场技术保障', cat: '活动', desc: '设备联调 · 赛场值守 · 应急处理', tags: ['驻场'], price: '按项目报价', unit: '', note: '方案确认后定价', sortPrice: null, modes: ['驻场'], km: 3.6, jinan: false, img: '_blob/7dea67aa257759d5c4cffcda675bc107.jpg', alt: '青少年机器人活动现场', icon: false, href: 'SvcTechEvent.dc.html' },
      { id: 'software', type: '技术支持', title: '软件配置与数据处理', cat: '软件', desc: '软件配置 · 成果处理 · 使用培训', tags: ['远程'], price: '¥500', unit: '/次起', note: '含远程配置和使用指导', sortPrice: 500, modes: ['远程'], km: 4.2, jinan: true, img: '_blob/192fc8acf4d61dc58d9c5109a1cad0da.jpg', alt: '仿真软件界面', icon: false, href: 'SvcTechSoftware.dc.html' }
    ];
    const catBg = { 航拍: '#1d63c4', 测绘: '#11804a', 设备维护: '#ba470b', 技术支持: '#6a4fe0' };
    // 筛选的第一组跟着类型变：航拍、测绘看成果，设备维护、技术支持看服务方式
    const modeGroups = {
      航拍: ['成果类型', ['视频素材', '照片']],
      测绘: ['成果类型', ['正射影像', '三维模型']],
      设备维护: ['服务方式', ['上门', '送修']],
      技术支持: ['支持方式', ['远程', '驻场']]
    };

    // 先按类型、城市，再按关键词、筛选；城市一项都没有时走“未开通”，不走“没有找到”
    const ofType = services.filter((s) => s.type === type);
    const inCity = ofType.filter((s) => (city === '东营') || (city === '济南' && s.jinan));
    const words = keyword.trim().toLowerCase();
    const matched = inCity.filter((s) => {

    const priceRank = (s, dir) => (s.sortPrice === null ? 1e9 : s.sortPrice * dir);
    const sorters = {
      comp: () => 0,
      dist: (a, b) => a.km - b.km,
      priceAsc: (a, b) => priceRank(a, 1) - priceRank(b, 1),

    const cards = sorted.map((s) => ({

      // 每类只画了第一项的详情，其余卡片点了只提示

      catBg: catBg[s.type],

    const types = ['航拍', '测绘', '设备维护', '技术支持'].map((label) => {

    const optsOf = (key, labels) => labels.map((label) => {

      searchHint: '搜索' + type + '服务、场景或关键词',

      modeOpts: optsOf('mode', ['不限', ...modeGroups[type][1]]),

      cityAria: '切换城市，当前' + city,
      noMore: sorted.length > 0,

      showClosed: inCity.length === 0,
      closedText: city + '暂未开通' + type + '服务',

      setKeyword: (e) => { if (e && e.target) go({ keyword: String(e.target.value || '').slice(0, 50) }); },
      clearKeyword: () => go({ keyword: '' }),
      openFilter: () => go({ sheet: 'filter', draft: filter }),
      openCity: () => go({ sheet: 'city' }),
      closeSheet: () => this.setState({ sheet: '' }),
      applyFilter: () => go({ filter: draft, sheet: '' }),
      resetFilter: () => go({ filter: noFilter, draft: noFilter, sheet: '' }),
      allowLoc: () => go({ locAllowed: true, locDenied: false, sort: 'dist', sheet: '' }),
      // 拒绝后回退综合排序，不保留之前的价格排序，说明文字才成立
      denyLoc: () => go({ locDenied: true, sort: 'comp', sheet: '' }),
      clearAll: () => go({ keyword: '', filter: noFilter, draft: noFilter })
    };
